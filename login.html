<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — DFL Staff Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0;
    --navy:#0f2044; --navy2:#1a3260;
    --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8;
    --accent:#2563eb; --accent-bg:#eff6ff;
    --red:#dc2626; --red-bg:#fef2f2;
    --shadow-md:0 4px 6px -1px rgba(0,0,0,0.07);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .login-box {
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:40px 36px;
    width:100%; max-width:380px;
    box-shadow:var(--shadow-md);
    text-align:center;
  }
  .login-logo { height:34px; margin-bottom:24px; }
  .login-title { font-size:19px; font-weight:700; margin-bottom:6px; }
  .login-sub { font-size:13px; color:var(--text-muted); margin-bottom:28px; line-height:1.5; }

  .login-message {
    font-size:13px; padding:10px 14px; border-radius:8px;
    margin-bottom:20px; text-align:left; line-height:1.5;
    display:none;
  }
  .login-message.show { display:block; }
  .login-message.error { background:var(--red-bg); color:var(--red); }
  .login-message.info { background:var(--accent-bg); color:var(--accent); }

  .btn-ms {
    width:100%; padding:12px 16px;
    background:var(--navy); color:#fff;
    border:none; border-radius:8px;
    font-size:14px; font-weight:600; font-family:'Inter',sans-serif;
    cursor:pointer; transition:background 0.15s;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-ms:hover { background:var(--navy2); }
  .btn-ms:disabled { opacity:0.6; cursor:not-allowed; }
  .btn-ms svg { flex-shrink:0; }

  .login-footer {
    margin-top:24px; font-size:11px; color:var(--text-muted);
  }

  /* --- divider between the Microsoft and phone sign-in paths --- */
  .or-divider {
    display:flex; align-items:center; gap:12px;
    margin:22px 0; color:var(--text-muted); font-size:11px;
    text-transform:uppercase; letter-spacing:0.5px; font-weight:600;
  }
  .or-divider::before, .or-divider::after {
    content:''; flex:1; height:1px; background:var(--border);
  }

  .field { text-align:left; margin-bottom:14px; }
  .field label {
    display:block; font-size:12px; font-weight:600;
    color:var(--text-muted); margin-bottom:6px;
  }
  .field input {
    width:100%; padding:12px 14px;
    border:1px solid var(--border); border-radius:8px;
    /* 16px minimum: iOS Safari zooms the whole page when focusing an
       input smaller than this, which is jarring on a phone. */
    font-size:16px; font-family:'Inter',sans-serif; color:var(--text);
    background:var(--surface);
  }
  .field input:focus { outline:none; border-color:var(--accent); }
  .field-hint { font-size:11px; color:var(--text-muted); margin-top:5px; }

  .btn-phone {
    width:100%; padding:12px 16px;
    background:var(--accent); color:#fff;
    border:none; border-radius:8px;
    font-size:14px; font-weight:600; font-family:'Inter',sans-serif;
    cursor:pointer; transition:background 0.15s;
  }
  .btn-phone:hover { background:#1d4ed8; }
  .btn-phone:disabled { opacity:0.6; cursor:not-allowed; }

  .toggle-line {
    margin-top:14px; font-size:12px; color:var(--text-muted);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .toggle-line button {
    background:none; border:none; padding:0;
    color:var(--accent); font-size:12px; font-weight:600;
    font-family:'Inter',sans-serif; cursor:pointer; text-decoration:underline;
  }
  .toggle-line button:disabled {
    color:var(--text-dim); cursor:default; text-decoration:none;
  }

  /* --- OTP code step --- */
  .sent-to {
    font-size:13px; color:var(--text-muted);
    margin-bottom:18px; line-height:1.5;
  }
  .sent-to strong { color:var(--text); font-variant-numeric:tabular-nums; }
  .code-input {
    text-align:center;
    /* Wide tracking so six digits read as six separate characters. */
    letter-spacing:0.4em; text-indent:0.4em;
    font-size:24px !important; font-weight:700;
    font-variant-numeric:tabular-nums;
    padding:14px !important;
  }

  .spin {
    width:22px; height:22px; border:2px solid var(--border);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin 0.7s linear infinite; margin:0 auto;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (max-width: 640px) {
    .login-box { padding:32px 24px; }
  }
</style>
</head>
<body>

<div class="login-box" id="loginBox">

  <img class="login-logo"
       src="https://hzagwndglwhcepsirafi.supabase.co/storage/v1/object/public/Assets/DFL%20Logo%20Blue_Black.png"
       alt="DFL">

  <div id="checkingState">
    <div class="login-title">Checking session…</div>
    <div class="spin" style="margin-top:16px;"></div>
  </div>

  <div id="signedOutState" style="display:none;">
    <div class="login-title">DFL Staff Portal</div>
    <div class="login-sub">Sign in with your DFL Microsoft account, or with your phone number.</div>

    <div class="login-message" id="loginMessage"></div>

    <button class="btn-ms" id="msSignInBtn" onclick="signInWithMicrosoft()">
      <svg width="18" height="18" viewBox="0 0 21 21" fill="none">
        <rect x="1" y="1" width="9" height="9" fill="#F25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7FBA00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00A4EF"/>
        <rect x="11" y="11" width="9" height="9" fill="#FFB900"/>
      </svg>
      Sign in with Microsoft
    </button>

    <div class="or-divider">or</div>

    <!-- Phone path for field staff without a DFL email account.
         One flow for everyone: entering a code both signs existing staff in
         and creates an account for anyone new (who then lands on /pending.html
         until an admin approves them). There's no separate sign-up, and no
         password — which also means there's no password to forget or reset,
         and staff with no email address have no way to self-serve a reset. -->

    <!-- STEP 1 — phone number -->
    <div id="phoneStep">
      <div class="field">
        <label for="phoneInput">Phone number</label>
        <input type="tel" id="phoneInput" placeholder="876 555 1234"
               autocomplete="tel" inputmode="tel">
        <div class="field-hint">We'll text you a 6-digit code</div>
      </div>

      <button class="btn-phone" id="sendCodeBtn" onclick="sendCode()">
        Send code
      </button>
    </div>

    <!-- STEP 2 — the code -->
    <div id="codeStep" style="display:none;">
      <div class="sent-to">
        Code sent to <strong id="sentToNumber"></strong>
      </div>

      <div class="field">
        <label for="codeInput">6-digit code</label>
        <!-- autocomplete="one-time-code" lets iOS and Android offer the code
             straight from the SMS, so nobody has to memorise it. -->
        <input type="text" id="codeInput" class="code-input" placeholder="······"
               autocomplete="one-time-code" inputmode="numeric"
               maxlength="6" pattern="[0-9]*">
      </div>

      <button class="btn-phone" id="verifyBtn" onclick="verifyCode()">
        Verify &amp; sign in
      </button>

      <div class="toggle-line">
        <button type="button" id="resendBtn" onclick="sendCode(true)">Resend code</button>
        <span style="color:var(--border)">|</span>
        <button type="button" onclick="backToPhone()">Use a different number</button>
      </div>
    </div>

    <div class="login-footer">DFL Importers — Staff Portal</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script>
  // Where each role lands after signing in. Reps and merchandisers go
  // straight to their own app; admins and managers get the hub, which has
  // cards into both apps plus the management tools.
  //
  // `warehouse` has no app of its own yet, so it falls back to the rep app.
  const ROLE_LANDING = {
    rep:           '/index.html',
    merchandiser:  '/merch.html',
    team_leader:   '/merch.html',
    manager:       '/hub.html',
    admin:         '/hub.html',
    warehouse:     '/index.html',
    pending:       '/pending.html'
  };

  // Fallback if a role somehow isn't in the table above.
  const DEFAULT_LANDING = '/index.html';

  const params = new URLSearchParams(window.location.search);
  // An explicit ?redirect= (set by auth-guard when it bounces someone off a
  // page they wanted) wins over role-based landing.
  const explicitRedirect = params.get('redirect');
  const reason = params.get('reason');

  const checkingState = document.getElementById('checkingState');
  const signedOutState = document.getElementById('signedOutState');
  const loginMessage = document.getElementById('loginMessage');
  const msSignInBtn = document.getElementById('msSignInBtn');
  const phoneInput = document.getElementById('phoneInput');
  const phoneStep = document.getElementById('phoneStep');
  const codeStep = document.getElementById('codeStep');
  const codeInput = document.getElementById('codeInput');
  const sendCodeBtn = document.getElementById('sendCodeBtn');
  const verifyBtn = document.getElementById('verifyBtn');
  const resendBtn = document.getElementById('resendBtn');
  const sentToNumber = document.getElementById('sentToNumber');

  // The normalised (+1876…) number we sent a code to. verifyOtp must be given
  // exactly the same string that signInWithOtp was given, or it won't match.
  let pendingPhone = null;
  let resendTimer = null;

  function showMessage(text, kind) {
    loginMessage.textContent = text;
    loginMessage.className = 'login-message ' + kind + ' show';
  }

  // Show a message explaining why the person landed back here, if any.
  function showReasonMessage() {
    if (reason === 'not-provisioned') {
      showMessage("Your account isn't set up for portal access yet. Please contact an admin.", 'error');
    } else if (reason === 'inactive') {
      showMessage('Your account has been deactivated. Please contact an admin.', 'error');
    }
  }

  function showSignedOut() {
    checkingState.style.display = 'none';
    signedOutState.style.display = 'block';
  }

  // After we have a confirmed session, look up the profile and send them
  // to the right app for their role.
  // Same "no profile = not provisioned" rule as auth-guard.js.
  async function handleSignedIn(user) {
    const { data: profile, error } = await sb
      .from('profiles')
      .select('id, role, active')
      .eq('id', user.id)
      .single();

    if (error || !profile) {
      await sb.auth.signOut();
      showSignedOut();
      showMessage("Your account isn't set up for portal access yet. Please contact an admin.", 'error');
      return;
    }

    // Pending users are deliberately active = false and must NOT be signed
    // out — they need their session to set their name on the holding page.
    // So this check has to come before the active check below.
    if (profile.role === 'pending') {
      window.location.href = ROLE_LANDING.pending;
      return;
    }

    if (profile.active === false) {
      await sb.auth.signOut();
      showSignedOut();
      showMessage('Your account has been deactivated. Please contact an admin.', 'error');
      return;
    }

    window.location.href =
      explicitRedirect || ROLE_LANDING[profile.role] || DEFAULT_LANDING;
  }

  // ------------------------------------------------------------
  // Phone -> SMS one-time code -> in
  // ------------------------------------------------------------
  // signInWithOtp both signs in existing staff AND creates an account for a
  // number we've never seen (shouldCreateUser defaults to true). That's why
  // there's no separate sign-up: a new number gets a user, the
  // on_auth_user_created trigger gives them a `pending` profile, and
  // handleSignedIn() below sends them to /pending.html to await approval.

  // Mirror of the normalize_jm_phone() SQL function. Both sides must agree
  // or the trigger's roster lookup silently misses. Jamaica is +1876/+1658;
  // returns null when the number can't be resolved without guessing.
  function normalizePhone(raw) {
    const digits = (raw || '').replace(/\D/g, '');
    if (digits.length === 11 && digits.startsWith('1')) return '+' + digits;
    if (digits.length === 10) return '+1' + digits;
    return null;
  }

  // +18765551234 -> 876 555 1234, so people can check it against their handset
  function prettyPhone(e164) {
    const d = (e164 || '').replace(/\D/g, '');
    const local = d.length === 11 && d[0] === '1' ? d.slice(1) : d;
    return local.length === 10
      ? local.slice(0, 3) + ' ' + local.slice(3, 6) + ' ' + local.slice(6)
      : e164;
  }

  async function sendCode(isResend) {
    const phone = normalizePhone(phoneInput.value);

    if (!phone) {
      showMessage('Enter a valid Jamaican phone number, e.g. 876 555 1234.', 'error');
      return;
    }

    const btn = isResend ? resendBtn : sendCodeBtn;
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = isResend ? 'Sending…' : 'Sending code…';
    loginMessage.className = 'login-message';

    const { error } = await sb.auth.signInWithOtp({ phone });

    if (error) {
      btn.disabled = false;
      btn.textContent = originalLabel;

      // Supabase rate-limits how often a number can be texted.
      if (/security purposes|rate limit|too many/i.test(error.message)) {
        showMessage('Please wait a moment before requesting another code.', 'error');
      } else if (/sms|provider|twilio|messagebird|vonage/i.test(error.message)) {
        // Most likely no SMS provider configured for this number.
        showMessage('Text messages are not set up for that number yet. Please contact an admin.', 'error');
        console.error('SMS send failed — check the Supabase phone provider:', error.message);
      } else {
        showMessage(error.message || 'Could not send the code. Please try again.', 'error');
      }
      return;
    }

    pendingPhone = phone;
    sentToNumber.textContent = prettyPhone(phone);
    phoneStep.style.display = 'none';
    codeStep.style.display = 'block';
    btn.textContent = originalLabel;

    if (isResend) showMessage('A new code is on its way.', 'info');

    // Reset the verify button too: if a previous attempt was still in flight
    // when they changed number or asked for a new code, it would otherwise
    // stay disabled and reading "Checking…".
    verifyBtn.disabled = false;
    verifyBtn.textContent = 'Verify & sign in';

    codeInput.value = '';
    codeInput.focus();
    startResendCooldown();
  }

  // Supabase won't text the same number again immediately, so don't offer a
  // button that's guaranteed to fail.
  function startResendCooldown() {
    let left = 60;
    clearInterval(resendTimer);
    resendBtn.disabled = true;
    resendBtn.textContent = 'Resend code (' + left + 's)';

    resendTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) {
        clearInterval(resendTimer);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend code';
      } else {
        resendBtn.textContent = 'Resend code (' + left + 's)';
      }
    }, 1000);
  }

  function backToPhone() {
    clearInterval(resendTimer);
    pendingPhone = null;
    codeStep.style.display = 'none';
    phoneStep.style.display = 'block';
    sendCodeBtn.disabled = false;
    sendCodeBtn.textContent = 'Send code';
    loginMessage.className = 'login-message';
    phoneInput.focus();
  }

  async function verifyCode() {
    const token = (codeInput.value || '').replace(/\D/g, '');

    if (!pendingPhone) { backToPhone(); return; }

    if (token.length !== 6) {
      showMessage('Enter the 6-digit code from the text message.', 'error');
      return;
    }

    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Checking…';

    const { data, error } = await sb.auth.verifyOtp({
      phone: pendingPhone,
      token: token,
      type: 'sms'
    });

    if (error) {
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'Verify & sign in';

      if (/expired/i.test(error.message)) {
        showMessage('That code has expired. Tap "Resend code" for a new one.', 'error');
      } else if (/invalid|incorrect|token/i.test(error.message)) {
        showMessage('That code is not right. Check the message and try again.', 'error');
      } else {
        showMessage(error.message || 'Could not verify the code. Please try again.', 'error');
      }
      codeInput.select();
      return;
    }

    // Verifying is what confirms the number, so a brand-new user is created
    // and signed in in one step. The trigger has already made their profile.
    if (data && data.session) {
      clearInterval(resendTimer);
      await handleSignedIn(data.session.user);
      return;
    }

    verifyBtn.disabled = false;
    verifyBtn.textContent = 'Verify & sign in';
    showMessage('Something went wrong signing you in. Please try again.', 'error');
  }

  // Submit on Enter, and auto-submit once six digits are in (including when
  // the phone autofills the code from the SMS).
  phoneInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); sendCode(); }
  });

  codeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); verifyCode(); }
  });

  codeInput.addEventListener('input', () => {
    const digits = codeInput.value.replace(/\D/g, '').slice(0, 6);
    if (codeInput.value !== digits) codeInput.value = digits;
    if (digits.length === 6 && !verifyBtn.disabled) verifyCode();
  });

  async function signInWithMicrosoft() {
    msSignInBtn.disabled = true;
    msSignInBtn.textContent = 'Redirecting…';

    const { error } = await sb.auth.signInWithOAuth({
      provider: 'azure',
      options: {
        scopes: 'openid profile email',
        redirectTo: 'https://dflhq.com/login.html'
      }
    });

    if (error) {
      msSignInBtn.disabled = false;
      msSignInBtn.textContent = 'Sign in with Microsoft';
      showMessage('Something went wrong starting sign-in. Please try again.', 'error');
    }
    // On success, the browser navigates away to Microsoft — nothing
    // else to do here. It comes back to this same page afterward.
  }

  // ------------------------------------------------------------
  // On page load: figure out if we already have a session.
  // This covers two cases with one check:
  //   1. Fresh visit, not logged in -> show the sign-in button
  //   2. Just landed back here after Microsoft redirected us —
  //      supabase-js auto-detects the auth tokens in the URL and
  //      creates a session before this code even runs.
  // ------------------------------------------------------------
  async function init() {
    const { data } = await sb.auth.getSession();

    if (data && data.session) {
      await handleSignedIn(data.session.user);
    } else {
      showSignedOut();
      showReasonMessage();
    }
  }

  // Also listen for the SIGNED_IN event directly — belt-and-suspenders
  // in case the OAuth redirect resolves slightly after our initial
  // getSession() check above.
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      handleSignedIn(session.user);
    }
  });

  init();
</script>

</body>
</html>
