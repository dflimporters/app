<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#0f2044">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — DFL Staff Portal</title>

<!-- This folder previously had NO auth at all — it was an unguarded
     placeholder. It's now a real entry point (User Approvals), so it gets the
     standard guard. -->
<style>body { visibility: hidden; }</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0; --navy:#0f2044; --navy2:#1a3260; --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8; --accent:#2563eb; --shadow-md:0 4px 6px -1px rgba(0,0,0,0.07); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

  /* Navigation is rendered and styled entirely by /shared/side-nav.js. */

  .coming-soon {
    display: flex;
    align-items: center;
    justify-content: center;
    /* Was calc(100vh - 56px) to allow for the old sticky top bar. The rail is
       a fixed left column and takes no vertical space, so on desktop this is
       just 100vh. Below 768px side-nav.js adds 52px of body padding-top for
       its top bar, so subtract that there or the page gains a scrollbar. */
    min-height: 100vh;
  }
  @media (max-width:767px) {
    .coming-soon { min-height: calc(100vh - 52px); }
  }
  .coming-soon-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 40px;
    text-align: center;
    max-width: 400px;
    width: 100%;
    box-shadow: var(--shadow-md);
  }
  .coming-soon-icon { font-size: 40px; margin-bottom: 16px; }
  .coming-soon-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .coming-soon-sub { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

</style>
</head>
<body>

<!-- Navigation comes from /shared/side-nav.js, loaded below. The old bar here
     linked to /dispatch-portal.html, /dashboards.html, /forms.html and
     /assets.html — all four still live in _staging/ and 404. They're now
     rendered once, as disabled "Soon" items, in side-nav.js. -->

<div class="coming-soon">
  <div class="coming-soon-box">
    <div class="coming-soon-icon">🔐</div>
    <div class="coming-soon-title">Admin Panel</div>
    <div class="coming-soon-sub" style="margin-bottom:20px">
      Being built out. User approvals are live; broader user management and
      access control still to come.
    </div>
    <a href="/admin/approvals.html" style="display:inline-flex;align-items:center;gap:8px;
       background:var(--accent);color:#fff;text-decoration:none;font-size:13px;
       font-weight:600;padding:11px 20px;border-radius:8px">
      👤 User Approvals
      <span id="pendingPill" style="display:none;background:rgba(255,255,255,0.25);
            font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px"></span>
    </a>
  </div>
</div>

<script>
  window.DFL_PAGE_TITLE = 'Admin';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<script src="/shared/side-nav.js"></script>
<script>
  // Show how many people are waiting, so an admin doesn't have to open the
  // page to find out. Fails silently — it's a nicety, not load-bearing.
  document.addEventListener('dfl-auth-ready', async () => {
    try {
      const { data, error } = await sb.rpc('list_pending_signups');
      if (error || !data || !data.length) return;
      const pill = document.getElementById('pendingPill');
      pill.textContent = data.length;
      pill.style.display = '';
    } catch (e) { /* nicety only */ }
  });
</script>
</body>
</html>
