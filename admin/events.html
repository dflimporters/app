<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#0f2044">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events & Training — DFL Staff Portal</title>

<style>body { visibility: hidden; }</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0;
    --navy:#0f2044; --navy2:#1a3260;
    --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8;
    --accent:#2563eb; --accent-bg:#eff6ff;
    --green:#16a34a; --green-bg:#f0fdf4; --green-border:#bbf7d0;
    --red:#dc2626; --red-bg:#fef2f2; --red-border:#fecaca;
    --gold:#fbbf24; --gold-bg:#fffbeb; --gold-border:#fde68a;
    --shadow:0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

  .page { max-width:900px; margin:0 auto; padding:32px; }
  .page-head { margin-bottom:24px; }
  .page-title { font-size:22px; font-weight:700; letter-spacing:-0.3px; }
  .page-sub { font-size:13px; color:var(--text-muted); margin-top:5px; line-height:1.6; }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px; box-shadow:var(--shadow); margin-bottom:20px; }
  .card h2 { font-size:15px; font-weight:700; margin-bottom:14px; }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:11px; font-weight:600; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em; }
  .field input, .field textarea, .field select {
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px;
    font-size:15px; font-family:'Inter',sans-serif; color:var(--text); background:var(--surface);
  }
  .field textarea { resize:vertical; min-height:80px; }
  .field input:focus, .field textarea:focus, .field select:focus { outline:none; border-color:var(--accent); }
  .field .hint { font-size:11px; color:var(--text-dim); margin-top:4px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  .invitee-groups { border:1px solid var(--border); border-radius:8px; padding:10px; max-height:280px; overflow-y:auto; background:var(--bg); }
  .invitee-group-label { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; margin:10px 0 4px; }
  .invitee-group-label:first-child { margin-top:0; }
  .invitee-row { display:flex; align-items:center; gap:8px; padding:5px 4px; font-size:13.5px; }
  .invitee-row input { width:auto; }
  .invitee-toolbar { display:flex; gap:8px; margin-bottom:8px; }
  .invitee-toolbar button {
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:5px 10px; font-size:11.5px; font-weight:600; cursor:pointer; color:var(--text-muted);
  }

  .btn-primary {
    background:var(--accent); color:#fff; border:none; border-radius:7px;
    padding:11px 20px; font-size:13.5px; font-weight:600;
    font-family:'Inter',sans-serif; cursor:pointer;
  }
  .btn-primary:hover { background:#1d4ed8; }
  .btn-primary:disabled { opacity:0.5; cursor:default; }

  .msg { font-size:13px; padding:11px 14px; border-radius:8px; margin-bottom:16px; line-height:1.5; display:none; }
  .msg.show { display:block; }
  .msg.error { background:var(--red-bg); color:var(--red); }
  .msg.success { background:var(--green-bg); color:var(--green); border:1px solid var(--green-border); }

  .ev-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow); margin-bottom:12px; }
  .ev-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .ev-title { font-size:14.5px; font-weight:700; }
  .ev-meta { font-size:12px; color:var(--text-muted); margin-top:3px; }
  .ev-topics { font-size:12px; color:var(--text-muted); margin-top:8px; line-height:1.6; }
  .ev-topics li { margin-left:16px; }
  .btn-del {
    background:none; color:var(--red); border:1px solid var(--red-border);
    border-radius:7px; padding:6px 11px; font-size:11.5px; font-weight:600;
    font-family:'Inter',sans-serif; cursor:pointer; flex-shrink:0;
  }
  .btn-del:hover { background:var(--red-bg); }
  .attend-summary { display:flex; gap:14px; margin-top:12px; font-size:12px; }
  .attend-pill { padding:4px 10px; border-radius:999px; font-weight:600; }
  .attend-pill.signed { background:var(--green-bg); color:var(--green); }
  .attend-pill.pending { background:var(--gold-bg); color:#92400e; }
  .attend-list { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .attend-chip { font-size:11.5px; padding:4px 9px; border-radius:6px; background:var(--bg); border:1px solid var(--border); }
  .attend-chip.signed { background:var(--green-bg); border-color:var(--green-border); color:var(--green); }
  .attend-chip.absent { background:var(--red-bg); border-color:var(--red-border); color:var(--red); }

  .empty { background:var(--surface); border:1px dashed var(--border); border-radius:10px; padding:32px 20px; text-align:center; color:var(--text-muted); font-size:13px; }
  .spin { width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; margin:24px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (max-width:640px) {
    .page { padding:20px 16px 40px; }
    .row2, .row3 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="page-head">
    <div class="page-title">Events & Training</div>
    <div class="page-sub">Create training sessions and team meetings, assign who's invited, and see who has signed in as attending.</div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="card">
    <h2>New event</h2>
    <div class="row2">
      <div class="field"><label>Title</label><input type="text" id="f-title" placeholder="e.g. St Elizabeth Team Meeting"></div>
      <div class="field"><label>Location</label><input type="text" id="f-location" placeholder="e.g. Grego's"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Date</label><input type="date" id="f-date"></div>
      <div class="field"><label>Time</label><input type="text" id="f-time" placeholder="e.g. 12:30 PM"></div>
    </div>
    <div class="field"><label>Description</label><textarea id="f-desc" placeholder="Optional summary"></textarea></div>
    <div class="field">
      <label>Topics covered (one per line)</label>
      <textarea id="f-topics" placeholder="Best merch practices&#10;Mission, vision and core values&#10;..."></textarea>
    </div>
    <div class="field">
      <label>Invited staff</label>
      <div class="invitee-toolbar">
        <button type="button" onclick="toggleAllInvitees(true)">Select all</button>
        <button type="button" onclick="toggleAllInvitees(false)">Clear</button>
      </div>
      <div class="invitee-groups" id="invitee-groups"><div class="spin"></div></div>
      <div class="hint" id="invitee-count">0 selected</div>
    </div>
    <button class="btn-primary" id="create-btn" onclick="createEvent()">Create event</button>
  </div>

  <h2 style="font-size:15px;margin-bottom:12px">Existing events</h2>
  <div id="events-list"><div class="spin"></div></div>

</div>

<script>
  window.DFL_PAGE_TITLE = 'Events & Training';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<script src="/shared/user-menu.js"></script>
<script src="/shared/side-nav.js"></script>
<script>
  const el = (id) => document.getElementById(id);
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  // The form is long (title through the 47-name invitee checklist), so by the
  // time someone reaches the "Create event" button at the bottom, the #msg
  // box up near the top is off-screen — a validation error or "Not
  // authorised" would render but look exactly like nothing happened. Scroll
  // it into view every time so it's never silently missed.
  function showMsg(text, kind) {
    const m = el('msg');
    m.textContent = text;
    m.className = 'msg show ' + kind;
    m.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function clearMsg() { el('msg').className = 'msg'; }

  const INVITEE_ROLES = ['merchandiser','relief_merchandiser','tl_merch','team_leader','rep'];
  const ROLE_LABEL = { merchandiser:'Brand Ambassadors', relief_merchandiser:'Relief Brand Ambassadors', tl_merch:'Team Leader + Brand Ambassador', team_leader:'Team leaders', rep:'Sales reps' };
  let ALL_STAFF = [];

  async function loadInvitees() {
    const { data, error } = await sb.from('reps')
      .select('id,name,role,area')
      .eq('active', true)
      .in('role', INVITEE_ROLES)
      .order('name');
    if (error) { el('invitee-groups').innerHTML = '<div class="hint">Could not load staff list.</div>'; return; }
    ALL_STAFF = data || [];
    const byRole = {};
    ALL_STAFF.forEach(r => { (byRole[r.role] = byRole[r.role] || []).push(r); });
    let html = '';
    INVITEE_ROLES.forEach(role => {
      const list = byRole[role]; if (!list || !list.length) return;
      html += '<div class="invitee-group-label">' + ROLE_LABEL[role] + ' (' + list.length + ')</div>';
      list.forEach(r => {
        html += '<label class="invitee-row"><input type="checkbox" class="invitee-cb" value="' + r.id + '" onchange="updateInviteeCount()">' +
          escapeHtml(r.name) + (r.area ? ' <span style="color:var(--text-dim)">— ' + escapeHtml(r.area) + '</span>' : '') + '</label>';
      });
    });
    el('invitee-groups').innerHTML = html || '<div class="hint">No active staff found.</div>';
  }
  function toggleAllInvitees(on) {
    document.querySelectorAll('.invitee-cb').forEach(cb => cb.checked = on);
    updateInviteeCount();
  }
  function updateInviteeCount() {
    const n = document.querySelectorAll('.invitee-cb:checked').length;
    el('invitee-count').textContent = n + ' selected';
  }

  async function createEvent() {
    clearMsg();
    const title = el('f-title').value.trim();
    const date = el('f-date').value;
    if (!title || !date) { showMsg('Title and date are required.', 'error'); return; }
    const topics = el('f-topics').value.split('\n').map(s => s.trim()).filter(Boolean);
    const invitees = [...document.querySelectorAll('.invitee-cb:checked')].map(cb => cb.value);

    const btn = el('create-btn');
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      const { error } = await sb.rpc('admin_create_event', {
        p_title: title,
        p_description: el('f-desc').value.trim() || null,
        p_topics: topics,
        p_event_date: date,
        p_event_time: el('f-time').value.trim() || null,
        p_location: el('f-location').value.trim() || null,
        p_invitee_rep_ids: invitees
      });
      if (error) throw error;
      showMsg('Event created.', 'success');
      ['f-title','f-location','f-time','f-desc','f-topics'].forEach(id => el(id).value = '');
      el('f-date').value = '';
      toggleAllInvitees(false);
      loadEvents();
    } catch (e) {
      showMsg('Could not create event: ' + (e.message || e), 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Create event';
    }
  }

  async function loadEvents() {
    const wrap = el('events-list');
    try {
      const { data, error } = await sb.from('events')
        .select('*, event_invitees(*), event_attendance(*)')
        .order('event_date', { ascending: false });
      if (error) throw error;
      if (!data || !data.length) { wrap.innerHTML = '<div class="empty">No events yet.</div>'; return; }
      wrap.innerHTML = data.map(ev => {
        const invitees = ev.event_invitees || [];
        const attendance = ev.event_attendance || [];
        const signedIds = new Set(attendance.map(a => a.rep_id));
        const signedCount = attendance.length;
        const chips = invitees.map(inv => {
          const signed = signedIds.has(inv.rep_id);
          const cls = signed ? 'signed' : (inv.absence_note ? 'absent' : '');
          const label = signed ? '✓ ' + escapeHtml(inv.rep_name) : escapeHtml(inv.rep_name) + (inv.absence_note ? ' — ' + escapeHtml(inv.absence_note) : ' — not yet signed');
          return '<span class="attend-chip ' + cls + '">' + label + '</span>';
        }).join('');
        const topicsHtml = (ev.topics && ev.topics.length)
          ? '<ul class="ev-topics">' + ev.topics.map(t => '<li>' + escapeHtml(t) + '</li>').join('') + '</ul>' : '';
        return '<div class="ev-card">' +
          '<div class="ev-top">' +
            '<div><div class="ev-title">' + escapeHtml(ev.title) + '</div>' +
            '<div class="ev-meta">' + escapeHtml(ev.event_date) + (ev.event_time ? ' · ' + escapeHtml(ev.event_time) : '') + (ev.location ? ' · ' + escapeHtml(ev.location) : '') + '</div></div>' +
            '<button class="btn-del" onclick="deleteEvent(\'' + ev.id + '\')">Delete</button>' +
          '</div>' +
          (ev.description ? '<div class="ev-meta" style="margin-top:6px">' + escapeHtml(ev.description) + '</div>' : '') +
          topicsHtml +
          '<div class="attend-summary">' +
            '<span class="attend-pill signed">' + signedCount + ' signed in</span>' +
            '<span class="attend-pill pending">' + Math.max(invitees.length - signedCount, 0) + ' not yet</span>' +
          '</div>' +
          '<div class="attend-list">' + chips + '</div>' +
        '</div>';
      }).join('');
    } catch (e) {
      wrap.innerHTML = '<div class="empty">Could not load events.</div>';
    }
  }

  async function deleteEvent(id) {
    if (!confirm('Delete this event? This also removes its invitee list and any signed attendance.')) return;
    try {
      const { error } = await sb.rpc('admin_delete_event', { p_event_id: id });
      if (error) throw error;
      loadEvents();
    } catch (e) {
      showMsg('Could not delete: ' + (e.message || e), 'error');
    }
  }

  document.addEventListener('dfl-auth-ready', () => { loadInvitees(); loadEvents(); });
</script>

</body>
</html>
