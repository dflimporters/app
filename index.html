<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1B3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Numbers">
<title>DFL · My Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Keep the page hidden until the auth guard confirms who's logged
   in — this must be plain inline CSS so there's no flash of the
   app before we've checked. auth-guard.js reveals it. */
body { visibility: hidden; }
</style>
<style>
:root{
  --blue:#326BD3; --navy:#0D1B3E; --navy2:#16264d;
  --ink:#0D1B3E; --mut:#6b7794; --line:#e6eaf2; --bg:#f4f6fb;
  --good:#1f9d64; --warn:#e0a012; --bad:#d64545; --card:#fff;
  --shadow:0 1px 3px rgba(13,27,62,.08),0 4px 16px rgba(13,27,62,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
h1,h2,h3,.mont{font-family:'Montserrat',sans-serif}
.hidden{display:none!important}

/* ---- app ---- */
header{background:linear-gradient(160deg,#1b356e,var(--navy));color:#fff;
  padding:calc(env(safe-area-inset-top) + 18px) 20px 40px;position:sticky;top:0;z-index:5}
.hrow{display:flex;justify-content:space-between;align-items:flex-start}
.hi{font-size:12px;color:#9fb2dc;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.hname{font-family:'Montserrat';font-weight:800;font-size:22px;margin-top:2px;line-height:1.1}
.logout{background:rgba(255,255,255,.1);border:none;color:#cdd8f0;font-size:12px;font-weight:600;
  padding:8px 12px;border-radius:10px;font-family:'Open Sans'}
.wrap{padding:0 14px 40px;max-width:640px;margin:0 auto}

/* tabs */
.tabview{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
#tab-plan{padding-bottom:0}
.planhdr{padding:calc(env(safe-area-inset-top) + 14px) 20px 14px}
#planframe{width:100%;border:0;display:block;
  height:calc(100vh - 60px - 56px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  height:calc(100dvh - 60px - 56px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.homebtn{background:rgba(255,255,255,.12);border:none;color:#fff;width:38px;height:38px;
  border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;transition:background .12s}
.homebtn:active{background:rgba(255,255,255,.24)}
.viewasbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:25;
  display:none;align-items:center;justify-content:center;gap:10px;
  background:#0D1B3E;color:#fff;font-size:13px;font-weight:600;padding:10px 16px}
.viewasbar b{font-weight:800}
.viewasbar button{background:#326BD3;border:none;color:#fff;font-weight:700;font-size:12px;
  padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'Open Sans'}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(13,27,62,.06)}
.tabbtn{flex:1;border:none;background:none;padding:9px 0 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--mut);font-family:'Open Sans';font-weight:700;font-size:11px;cursor:pointer}
.tabbtn.on{color:var(--blue)}
.tabbtn svg{display:block}

.hero{background:var(--card);border-radius:18px;padding:38px 20px 20px;box-shadow:var(--shadow);margin-top:-22px;position:relative}
.hero .lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.big{font-family:'Montserrat';font-weight:800;font-size:34px;letter-spacing:-.5px;margin:3px 0 2px}
.herotop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pctwrap{text-align:right;flex-shrink:0;padding-top:2px}
.pctbig{font-family:'Montserrat';font-weight:800;font-size:38px;line-height:1;letter-spacing:-1px;color:var(--blue)}
.pctbig span{font-size:19px;font-weight:700;margin-left:1px}
.pctbig.good{color:var(--good)} .pctbig.bad{color:var(--bad)} .pctbig.warn{color:#d9920a}
.pctlbl{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:5px;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.pcttgt{font-size:11px;color:var(--mut);font-weight:600;margin-top:4px;text-align:right}
.pcttgt b{color:var(--ink);font-weight:800;font-family:'Montserrat'}
.sub{font-size:13px;color:var(--mut)}
.sub b{color:var(--ink)}
.bar{height:12px;border-radius:8px;background:#eef1f8;overflow:hidden;margin:16px 0 8px;position:relative}
.bar>span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),#5b8ef0);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar>span.bad{background:linear-gradient(90deg,#c9302c,#e05c57)}
.bar>span.good{background:linear-gradient(90deg,#178a55,#25b06e)}
.bar>span.warn{background:linear-gradient(90deg,#d9920a,#f0b13d)}
.barmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy);opacity:.35}
.pacerow{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:600}
.pacerow b{color:var(--ink);font-weight:800;font-family:'Montserrat'}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}
.chip.good{background:#e5f5ec;color:var(--good)} .chip.warn{background:#fdf3dc;color:#a5760a}
.chip.bad{background:#fbe6e6;color:var(--bad)}

.ordtot{display:flex;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px}
.ordtot>div{flex:1;padding:16px 16px}
.ordtot .ovr{border-left:1px solid var(--line);text-align:right}
.ordtot .ov{font-family:'Montserrat';font-weight:800;font-size:26px;color:var(--navy);line-height:1}
.ordtot .ovval{font-family:'Montserrat';font-weight:800;font-size:20px;color:var(--blue);line-height:1}
.ordtot .ok{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:6px}
.ordgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ordgrid .cred{grid-column:1 / -1}
.obox{background:var(--card);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);
  border-left:4px solid var(--line);position:relative}
.obox .oct{font-family:'Montserrat';font-weight:800;font-size:24px;line-height:1}
.obox .olbl{font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.obox .oval{font-size:13px;font-weight:700;color:var(--ink);margin-top:6px}
.obox.tap{cursor:pointer;transition:transform .08s,box-shadow .12s}
.obox.tap:active{transform:scale(.98);box-shadow:0 1px 2px rgba(13,27,62,.12)}
.obox.open{border-left-color:var(--blue)}
.obox.ship{border-left-color:#7b5cd6}
.obox.hold{border-left-color:var(--warn)}
.obox.back{border-left-color:var(--bad)}
.obox.cred{border-left-color:#0d9488;display:flex;align-items:center;justify-content:space-between}
.obox.cred .olbl{margin-top:0}
.obox.cred .oval{margin-top:0;color:var(--bad);font-family:'Montserrat';font-weight:800;font-size:17px}

.secthdr{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
.secthdr h2{font-size:15px;font-weight:800;margin:0}
.secthdr .cnt{font-size:12px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px;margin:0 2px 12px;background:#e9edf6;padding:4px;border-radius:12px}
.tab{flex:1;border:none;background:transparent;padding:9px;border-radius:9px;font-family:'Open Sans';
  font-weight:700;font-size:12.5px;color:var(--mut);cursor:pointer}
.tab.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(13,27,62,.12)}

.cust{background:var(--card);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);margin-bottom:9px}
.cust.tap{cursor:pointer;transition:transform .08s,box-shadow .12s}
.cust.tap:active{transform:scale(.99);box-shadow:0 1px 2px rgba(13,27,62,.1)}
.cnt.link,.link{color:var(--blue);font-weight:700;cursor:pointer}
.search{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;font-family:'Open Sans';font-size:14px;color:var(--ink);outline:none;margin:14px 0 12px;box-shadow:var(--shadow)}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(50,107,211,.1)}

/* detail view */
.detailhead{padding:4px 2px 14px}
.backbtn{background:none;border:none;color:var(--blue);font-family:'Open Sans';font-weight:700;font-size:14px;padding:6px 0;cursor:pointer;margin-bottom:6px}
.detailnav{display:flex;gap:16px;align-items:center}
.homelink{color:var(--mut)}
.dname{font-family:'Montserrat';font-weight:800;font-size:22px;line-height:1.15;color:var(--navy)}
.dtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dtag{font-size:11px;font-weight:700;background:var(--blue-light,#e8f0fb);color:var(--blue);padding:4px 10px;border-radius:20px}
.dtag.od{background:#fdf3dc;color:#a5760a}
.dcard{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.dlbl{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
.dlbl.amber{color:#a5760a}.dlbl.green{color:var(--good)}.dlbl.red{color:var(--bad)}
.ptoggle{display:inline-flex;background:#eef1f8;border-radius:8px;padding:3px}
.pbtn{border:none;background:none;font-family:'Montserrat';font-weight:700;font-size:10px;letter-spacing:.5px;
  color:var(--mut);padding:4px 10px;border-radius:6px;cursor:pointer}
.pbtn.on{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(13,27,62,.12)}
.prohint{color:var(--mut);font-weight:400;font-size:11px}
.timing{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;align-items:center}
.timing>div{padding:2px 6px 4px;position:relative}
.timing>div+div::before{content:"";position:absolute;left:0;top:8%;bottom:8%;width:1px;background:var(--line)}
.timing>div.due{background:#fdf8ec;border-radius:10px;padding-top:8px;padding-bottom:8px;margin:-4px 0}
.timing>div.due::before{display:none}
.timing .tk{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.timing .tv{font-family:'Montserrat';font-weight:800;font-size:15px;color:var(--ink)}
.timing .ts{font-size:10px;color:var(--mut);margin-top:3px}
.ctable{width:100%;border-collapse:collapse;font-size:12.5px}
.ctable th{text-align:right;font-family:'Montserrat';font-size:10px;font-weight:800;color:var(--navy);padding:6px 8px;border-bottom:1px solid var(--line)}
.ctable th:first-child{text-align:left}
.ctable td{padding:6px 8px;color:var(--text2,#3a4e72);border-top:1px solid #f1f5f9}
.ctable td.num{text-align:right}
.ctable td:first-child{font-weight:600;color:var(--ink)}
.ctable td.pctcell{font-family:'Montserrat';font-weight:800;border-radius:4px}
.listrow{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid #f1f5f9}
.listrow:last-child{border-bottom:none}
.listrow .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.reddot{background:var(--bad)}.amberdot{background:var(--warn)}
.lr1{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3}
.lr2{font-size:11px;color:var(--mut);margin-top:1px}
.crow1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cname{font-weight:700;font-size:14px;line-height:1.25}
.cid{font-size:11px;color:var(--mut);margin-top:1px}
.cgap{text-align:right;flex-shrink:0}
.cgap .g{font-family:'Montserrat';font-weight:800;font-size:15px;color:var(--bad)}
.cgap .g.met{color:var(--good)}
.cgap .gl{font-size:10px;color:var(--mut);font-weight:600;text-transform:uppercase}
.cbar{height:6px;border-radius:6px;background:#eef1f8;margin:11px 0 9px;overflow:hidden}
.cbar>span{display:block;height:100%;border-radius:6px;background:var(--blue)}
.cbar>span.met{background:var(--good)}
.cmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);font-weight:600}
.cmeta b{color:var(--ink)}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}
.foot{text-align:center;color:var(--mut);font-size:11px;margin-top:22px;line-height:1.6}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--blue);
  border-radius:50%;animation:sp .7s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- APP -->
<div id="app">
  <div id="tab-home" class="tabview">
    <header>
      <div class="hrow">
        <div>
          <div class="hi" id="hgreet">Welcome back</div>
          <div class="hname" id="hname">—</div>
        </div>
        <button class="logout" onclick="logout()">Sign out</button>
      </div>
    </header>
    <div class="wrap" id="content"><div class="spin"></div></div>
  </div>

  <div id="tab-plan" class="tabview hidden">
    <header class="planhdr">
      <div class="hrow">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="homebtn" onclick="switchTab('home')" aria-label="Home">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
          <div><div class="hname" style="font-size:18px">Weekly Plan</div></div>
        </div>
      </div>
    </header>
    <iframe id="planframe" title="Weekly Plan"></iframe>
  </div>

  <div id="tab-custs" class="tabview hidden">
    <header>
      <div class="hrow">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="homebtn" onclick="switchTab('home')" aria-label="Home">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
          <div>
            <div class="hi">My Accounts</div>
            <div class="hname" id="custhdr">Customers</div>
          </div>
        </div>
      </div>
    </header>
    <div class="wrap" id="custcontent"><div class="spin"></div></div>
  </div>

  <div id="tab-admin" class="tabview hidden">
    <header>
      <div class="hrow">
        <div>
          <div class="hi">Team Overview</div>
          <div class="hname" id="adminhdr">Admin</div>
        </div>
        <button class="logout" onclick="logout()">Sign out</button>
      </div>
    </header>
    <div class="wrap" id="admincontent"><div class="spin"></div></div>
  </div>

  <nav class="tabbar">
    <button class="tabbtn on" id="nav-home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>My Numbers</span>
    </button>
    <button class="tabbtn" id="nav-custs" onclick="goCusts()">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 20c0-3.3 3.6-5 8-5s8 1.7 8 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Customers</span>
    </button>
    <button class="tabbtn" id="nav-plan" onclick="switchTab('plan')">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 3v3M17 3v3M4 8h16M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 12h4M8 16h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Weekly Plan</span>
    </button>
    <button class="tabbtn" id="nav-admin" onclick="goAdmin()" style="display:none">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3l7 3v5c0 4.4-3 8-7 10-4-2-7-5.6-7-10V6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Admin</span>
    </button>
  </nav>
</div>

<script>window.PAGE_ALLOWED_ROLES = ['admin', 'manager', 'rep']; // everyone allowed on this page for now</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/auth-guard.js"></script>
<script>
const SB_URL="https://hzagwndglwhcepsirafi.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6YWd3bmRnbHdoY2Vwc2lyYWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTA1OTcsImV4cCI6MjA5MTY4NjU5N30.ZtU8gCK4TqDMRyES0sOm8iWDOHjkWPwHQEjepvu7PP4";
const H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY};
const J=n=>"$"+Math.round(n).toLocaleString("en-JM");
const Jk=n=>{const a=Math.abs(n);if(a>=1e6)return "$"+(n/1e6).toFixed(1)+"M";if(a>=1e3)return "$"+(n/1e3).toFixed(0)+"K";return "$"+Math.round(n)};

/* ---------- Auth wiring ---------- */
// auth-guard.js has already checked the session and the profiles
// row by the time this event fires, and put the result on
// window.DFL_PROFILE. This is our single entry point into the app —
// it replaces the old PIN-based enterApp().
document.addEventListener('dfl-auth-ready', (e) => {
  initApp(e.detail.profile);
});

async function initApp(profile){
  const h=new Date().getHours();
  document.getElementById("hgreet").textContent=h<12?"Good morning":h<17?"Good afternoon":"Good evening";
  document.getElementById("hname").textContent=profile.full_name||"—";

  // Portal-level role (admin/manager) drives the in-app Admin/Team tab —
  // one source of truth, instead of a separate role field on `reps`.
  const isAdmin = profile.role==="admin" || profile.role==="manager";
  document.getElementById("nav-admin").style.display=isAdmin?"":"none";

  // `profiles` doesn't carry the canonical `name`/`area` that the cache
  // tables are keyed on — look those up from `reps` via salesperson_id.
  if(profile.salesperson_id){
    try{
      const r=await fetch(`${SB_URL}/rest/v1/reps?salesperson_id=eq.${encodeURIComponent(profile.salesperson_id)}&select=name,area`,{headers:H});
      const rows=await r.json();
      const repRow=Array.isArray(rows)&&rows[0]?rows[0]:null;
      if(repRow){
        REP={name:repRow.name, salesperson_id:profile.salesperson_id, area:repRow.area};
        document.getElementById("hname").textContent=repRow.name;
        loadData(REP);
        return;
      }
    }catch(e){ /* falls through to the no-numbers state below */ }
  }

  // Admin/manager with no personal sales numbers (e.g. Joel's own
  // account) — show a friendly empty state on Home rather than erroring.
  REP=null;
  document.getElementById("content").innerHTML=`
    <div class="empty" style="padding:60px 20px">
      No personal sales numbers to show for your account.${isAdmin?'<br>Use the <b>Admin</b> tab below to view team performance.':''}
    </div>`;
}

// Note: logout() itself is no longer defined here — it comes from
// auth-guard.js (signs out of Supabase, then redirects to login.html).

/* ---------- App ---------- */
let REP=null, planLoaded=false;
function switchTab(t){
  ["home","custs","plan","admin"].forEach(k=>{
    const nav=document.getElementById("nav-"+k), view=document.getElementById("tab-"+k);
    if(nav) nav.classList.toggle("on", k===t);
    if(view) view.classList.toggle("hidden", k!==t);
  });
  if(t==="plan" && !planLoaded){
    const who = VIEWAS || REP;

function drawAdmin(){
  const c=document.getElementById("admincontent");
  const rows=[...ADMINROWS];
  const sd=sellingDays(); const expPace = sd.total>0? sd.done/sd.total*100 : 0;
  // team totals
  const tgt=rows.reduce((a,x)=>a+x.target,0), act=rows.reduce((a,x)=>a+x.actual,0);
  const tpct=tgt>0?act/tgt*100:0;
  const tcls=tpct>=expPace-2?"good":tpct>=expPace-10?"warn":"bad";
  const gap=tgt-act, perDay=(gap>0&&sd.left>0)?gap/sd.left:0;
  const behind=rows.filter(x=>x.pct<expPace-10).length;
  // sort
  if(ADMINSORT==="pct") rows.sort((a,b)=>b.pct-a.pct);
  else if(ADMINSORT==="gap") rows.sort((a,b)=>(b.target-b.actual)-(a.target-a.actual));
  else if(ADMINSORT==="sales") rows.sort((a,b)=>b.actual-a.actual);
  else if(ADMINSORT==="name") rows.sort((a,b)=>a.name.localeCompare(b.name));

      </div>
      <div class="bar"><span class="${tcls}" style="width:${Math.max(0,Math.min(tpct,100))}%"></span><i class="barmark" style="left:${Math.min(expPace,100)}%"></i></div>
      <div class="pacerow"><span><b>${rows.length}</b> reps · <b style="color:${behind?'var(--bad)':'var(--good)'}">${behind}</b> behind pace</span><span>${gap>0&&sd.left>0?"<b>"+Jk(perDay)+"</b>/day team":""}</span></div>
    </div>

    <div class="secthdr"><h2>Rep leaderboard</h2><span class="cnt">tap a rep to view their app</span></div>
    <div class="tabs">
      <button class="tab ${ADMINSORT==='pct'?'on':''}" onclick="setAdminSort('pct')">Attainment</button>
      <button class="tab ${ADMINSORT==='gap'?'on':''}" onclick="setAdminSort('gap')">Biggest gap</button>
      <button class="tab ${ADMINSORT==='sales'?'on':''}" onclick="setAdminSort('sales')">Top sales</button>
    </div>
    ${rows.map((r,i)=>{

      const rcolor=rcls==="good"?"var(--good)":rcls==="warn"?"#d9920a":"var(--bad)";
      const p=Math.max(0,Math.min(r.pct,100));
      return `<div class="cust tap" onclick="viewAsRep('${encodeURIComponent(r.name)}','${r.sp_id}')">

        </div>
        <div class="cbar"><span class="${rcls}" style="width:${p}%"></span></div>
        <div class="cmeta"><span><b>${Jk(r.actual)}</b> / ${Jk(r.target)}</span><span>${r.pace||''} ›</span></div>
      </div>`;

function paceFillClass(s,pct,elapsed){
  const st=(s&&s.pace_status||"").toLowerCase();
  if(st.includes("behind")||st==="watch") return "bad";
  if(st.includes("ahead")||st==="on-pace") return "good";
  // no status: fall back to pace math
  return (elapsed>0 && pct < elapsed-5) ? "bad" : "good";
}
function paceChip(s){
  if(!s) return "";
  const st=(s.pace_status||"").toLowerCase();
  const cls=st.includes("ahead")||st==="on-pace"?"good":st.includes("watch")?"warn":st.includes("behind")?"bad":"warn";
  const label=s.pace_status?s.pace_status.replace(/-/g," "):"—";
  return `<span class="chip ${cls}">${label.charAt(0).toUpperCase()+label.slice(1)}</span>`;
}

      fetch(`${SB_URL}/rest/v1/budget_2026?customer_id=eq.${cid}&month_number=eq.${mnum}&select=item_class,budget`,{headers:H}).then(r=>r.json()),
      KEYSKUS?Promise.resolve(KEYSKUS):fetch(`${SB_URL}/rest/v1/key_skus?select=inventory_id,description,posting_class&limit=300`,{headers:H}).then(r=>r.json())

function renderCustDetail(cid, cache, budget, mbudget){
  CURCUST={cid, cache, budget, mbudget};
  const c=document.getElementById("custcontent");
  const today=new Date();
  const name=cache?cache.customer_name:cid;
  document.getElementById("custhdr").textContent="Account";

  const lastOrder=cache?cache.last_order_date:null;
  const avgFreq=cache?(cache.avg_freq_days||30):30;
  const lastDate=lastOrder?new Date(lastOrder):null;
  const daysSince=lastDate?Math.round((today-lastDate)/86400000):null;
  const nextDue=lastDate?new Date(lastDate.getTime()+avgFreq*86400000):null;
  const daysToNext=nextDue?Math.round((nextDue-today)/86400000):null;
  const overdue=daysToNext!==null&&daysToNext<0;
  const dueSoon=daysToNext!==null&&daysToNext>=0&&daysToNext<=3;
  const dueTxt=nextDue?fmtDate(nextDue):"—";
  const dueSub=overdue?Math.abs(daysToNext)+"d overdue":daysToNext!==null?"in "+daysToNext+"d":"";

  const isY = PERIOD==="YTD";
  const bmap = isY ? budget : (mbudget||{});   // YTD: annual budget; MTD: real current-month budget
  const periodTotal = cache?Number(isY?cache.ytd_total:cache.mtd_total||0):0;
  const totBudget=Object.values(bmap).reduce((s,v)=>s+v,0);
  const pct=totBudget>0?Math.round(periodTotal/totBudget*100):0;
  // expected pace: MTD = selling days elapsed this month; YTD = fraction of year elapsed
  const expPace = isY ? yearElapsed() : (sellingDays().total>0 ? sellingDays().done/sellingDays().total*100 : 0);
  const pcls = pct >= expPace-2 ? "good" : pct >= expPace-10 ? "warn" : "bad";  // on/above pace = green
  const byCat=cache?((isY?cache.ytd_by_category:cache.mtd_by_category)||{}):{};

  const catRows=Object.entries(bmap).filter(([k])=>!EXCL.includes(k)&&bmap[k]>0)
    .map(([cat,bud])=>{const a=Number(byCat[cat]||0);return{cat,bud,actual:a,pct:bud>0?Math.round(a/bud*100):0};})
    .sort((a,b)=>b.bud-a.bud);

  // category gaps from cat_last_purchase
  const catLast=cache?(cache.cat_last_purchase||{}):{};
  const catGaps=Object.entries(catLast).filter(([k])=>!EXCL.includes(k))
    .map(([cat,d])=>({cat,d,ds:Math.round((today-new Date(d))/86400000)}))
    .sort((a,b)=>b.ds-a.ds).slice(0,8);

  const itemHist=cache?(cache.item_history||{}):{};
  const replenish=Object.entries(itemHist).filter(([,v])=>v.item_class&&!EXCL.includes(v.item_class)&&Math.round((today-new Date(v.last_date))/86400000)>avgFreq*1.5)
    .sort((a,b)=>new Date(a[1].last_date)-new Date(b[1].last_date)).slice(0,8);

  const keyLast=cache?(cache.key_item_last||{}):{};
  const keyOpp=(KEYSKUS||[]).map(sku=>{const lp=keyLast[sku.inventory_id]||null;const ds=lp?Math.round((today-new Date(lp))/86400000):null;return{sku,lp,ds,never:!lp};})
    .filter(r=>r.never||r.ds>60).sort((a,b)=>(b.ds||99999)-(a.ds||99999)).slice(0,10);

  const catColor=p=>p>=60?"var(--good)":p>=40?"#a5760a":"var(--bad)";
  const catBg=p=>p>=60?"#f0fdf4":p>=40?"#fffbeb":"#fff5f5";

  c.innerHTML=`
    <div class="detailhead">
      <div class="detailnav">
        <button class="backbtn" onclick="switchToCustList()">‹ Accounts</button>
        <button class="backbtn homelink" onclick="switchTab('home')">⌂ Home</button>
      </div>
      <div class="dname">${esc(name)}</div>
      <div class="dtags">${cache&&cache.segment?`<span class="dtag">${esc(cache.segment)}</span>`:""}${cache&&cache.area?`<span class="dtag">${esc(cache.area)}</span>`:""}${overdue?`<span class="dtag od">⚠ Overdue ${Math.abs(daysToNext)}d</span>`:""}</div>
    </div>

    <div class="dcard">
      <div class="dlbl">Purchase timing</div>
      <div class="timing">
        <div><div class="tk">Last order</div><div class="tv">${lastOrder?fmtDate(lastOrder):"Never"}</div><div class="ts">${daysSince!==null?daysSince+"d ago":""}</div></div>
        <div><div class="tk">Avg frequency</div><div class="tv">${avgFreq}d</div><div class="ts">between orders</div></div>
        <div class="${(overdue||dueSoon)?'due':''}"><div class="tk">Next due</div><div class="tv" style="color:${overdue?'var(--bad)':dueSoon?'#a5760a':'var(--ink)'}">${dueTxt}</div><div class="ts" style="color:${overdue?'var(--bad)':dueSoon?'#a5760a':'var(--mut)'}">${dueSub}</div></div>
      </div>
    </div>

    <div class="dcard">
      <div class="dlbl" style="display:flex;justify-content:space-between;align-items:center">
        <span>2026 Budget vs Actual</span>
        <span class="ptoggle">
          <button class="pbtn ${isY?'on':''}" onclick="setPeriod('YTD')">YTD</button>
          <button class="pbtn ${!isY?'on':''}" onclick="setPeriod('MTD')">MTD</button>
        </span>
      </div>
      <div class="herotop">
        <div>
          <div class="big" style="font-size:26px">${J(periodTotal)}</div>
          <div class="sub">Target: <b>${J(totBudget)}</b>${isY?'':' <span class="prohint">· full month</span>'}</div>
        </div>
        <div class="pctwrap">
          <div class="pctbig ${pcls}" style="font-size:30px">${pct}<span>%</span></div>
          <div class="pctlbl">Achieved</div>
          <div class="pcttgt">Should be at <b>${Math.round(expPace)}%</b></div>
        </div>
      </div>
      <div class="bar"><span class="${pcls}" style="width:${Math.max(0,Math.min(pct,100))}%"></span><i class="barmark" style="left:${Math.min(expPace,100)}%"></i></div>
    </div>

    <div class="dcard">
      <div class="dlbl">Budget by category · ${isY?'YTD':'MTD'}</div>
      ${catRows.length?`<table class="ctable"><thead><tr><th>Category</th><th>Budget</th><th>Actual</th><th>%</th></tr></thead><tbody>
        ${catRows.map(r=>`<tr><td>${r.cat}</td><td class="num">${Jk(r.bud)}</td><td class="num">${Jk(r.actual)}</td><td class="num pctcell" style="color:${catColor(r.pct)};background:${catBg(r.pct)}">${r.pct}%</td></tr>`).join("")}
      </tbody></table>`:`<div class="empty" style="padding:16px">No category budget set.</div>`}
    </div>

    <div class="dcard">
      <div class="dlbl amber">Category gaps · longest since purchase</div>
      ${catGaps.length?catGaps.map(g=>`<div class="listrow"><span class="dot amberdot"></span><div><div class="lr1">${g.cat}</div><div class="lr2">Last: ${fmtDate(g.d)} (${g.ds}d ago)</div></div></div>`).join(""):`<div class="empty" style="padding:12px">No category gaps.</div>`}
    </div>

    <div class="dcard">
      <div class="dlbl green">Replenishment due</div>
      ${replenish.length?replenish.map(([,it])=>{const ds=Math.round((today-new Date(it.last_date))/86400000);const nm=it.description.length>46?it.description.slice(0,43)+"…":it.description;return `<div class="listrow"><span class="dot reddot"></span><div><div class="lr1">${esc(nm)}</div><div class="lr2">${it.item_class} · Last: ${fmtDate(it.last_date)} (${ds}d ago)</div></div></div>`;}).join(""):`<div class="empty" style="padding:12px">Nothing overdue for replenishment.</div>`}
    </div>

    <div class="dcard">
      <div class="dlbl red">Key SKU opportunities</div>
      ${keyOpp.length?keyOpp.map(r=>{const nm=r.sku.description.length>46?r.sku.description.slice(0,43)+"…":r.sku.description;const lt=r.never?"NEVER PURCHASED":"Last: "+fmtDate(r.lp)+" ("+r.ds+"d ago)";return `<div class="listrow"><span class="dot reddot"></span><div><div class="lr1">${esc(nm)}</div><div class="lr2">${r.sku.posting_class||""} · ${lt}</div></div></div>`;}).join(""):`<div class="empty" style="padding:12px">All key SKUs purchased recently.</div>`}
    </div>

    <div class="foot">Figures in JMD · directional for GP.<br>Account data updated ${cache&&cache.refreshed_at?fmtDate(cache.refreshed_at):"daily"}</div>`;
}
function monthElapsed(){const n=new Date();const d=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();return n.getDate()/d*100;}
function yearElapsed(){const n=new Date();const s=new Date(n.getFullYear(),0,1);const e=new Date(n.getFullYear()+1,0,1);return (n-s)/(e-s)*100;}
function sellingDays(){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth(), today=n.getDate();
  const last=new Date(y,m+1,0).getDate();
  let total=0, done=0;
  for(let d=1; d<=last; d++){
    const wd=new Date(y,m,d).getDay();     // 0=Sun,6=Sat
    if(wd!==0 && wd!==6){ total++; if(d<=today) done++; }
  }
  return {total, done, left: total-done};
}
function lastRefresh(){const r=CUST[0]&&CUST[0].refreshed_at;if(!r)return"just now";const d=new Date(r);return d.toLocaleString("en-JM",{hour:"numeric",minute:"2-digit",day:"numeric",month:"short"});}
function fmtDate(s){const d=new Date(s);return d.toLocaleDateString("en-JM",{day:"numeric",month:"short"});}
function esc(s){return(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

</script>
</body>
</html>
