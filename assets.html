<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#0f2044">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assets — DFL Staff Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0; --navy:#0f2044; --navy2:#1a3260; --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8; --accent:#2563eb; --accent-bg:#eff6ff; --shadow:0 1px 3px rgba(0,0,0,0.07); --shadow-md:0 4px 6px -1px rgba(0,0,0,0.07); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

  /* ── NAV ── */
  nav {
    background: var(--navy);
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .nav-left { display:flex; align-items:center; gap:14px; }
  .nav-logo { height:26px; }
  .nav-divider { width:1px; height:22px; background:rgba(255,255,255,0.2); }
  .nav-title { font-size:14px; font-weight:600; color:#fff; letter-spacing:-0.1px; }
  .nav-links { display:flex; gap:4px; }
  .nav-links a {
    color: rgba(255,255,255,0.65);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .nav-links a:hover { color:#fff; background:rgba(255,255,255,0.1); }
  .nav-links a.active { color:#fff; background:rgba(255,255,255,0.15); }
  .nav-links a.mgmt { color:#fbbf24; }
  .nav-links a.mgmt:hover { color:#fef3c7; background:rgba(251,191,36,0.15); }
  .nav-links a.mgmt.active { color:#fef3c7; background:rgba(251,191,36,0.15); }
  .nav-hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    flex-shrink: 0;
  }
  .nav-hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: rgba(255,255,255,0.8);
    border-radius: 2px;
    transition: transform 0.25s, opacity 0.25s;
  }
  .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-hamburger.open span:nth-child(2) { opacity: 0; }
  .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .nav-mobile-menu {
    display: none;
    position: fixed;
    top: 56px;
    left: 0; right: 0;
    background: rgba(10,20,50,0.98);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 0.75rem 1.25rem 1.25rem;
    z-index: 99;
    flex-direction: column;
    gap: 2px;
  }
  .nav-mobile-menu.open { display: flex; }
  .nav-mobile-menu a {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 8px;
    transition: color 0.15s, background 0.15s;
  }
  .nav-mobile-menu a:hover { color:#fff; background:rgba(255,255,255,0.07); }
  .nav-mobile-menu a.active { color:#fff; background:rgba(255,255,255,0.1); }
  .nav-mobile-menu a.mgmt { color:#fbbf24; }
  .nav-mobile-menu a.mgmt:hover { background:rgba(251,191,36,0.12); }
  .mob-divider { height:1px; background:rgba(255,255,255,0.08); margin:4px 0; }

  /* ── PAGE HEADER ── */
  .page-header { background:var(--navy2); padding:32px 32px 36px; }
  .page-header-inner { max-width:1060px; margin:0 auto; }
  .breadcrumb { font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:8px; }
  .breadcrumb a { color:rgba(255,255,255,0.45); text-decoration:none; }
  .page-header h1 { font-size:24px; font-weight:700; color:#fff; letter-spacing:-0.3px; }

  /* ── CONTENT ── */
  .content { max-width:1060px; margin:0 auto; padding:32px; }
  .section-label { font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:14px; }
  .assets-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }

  /* ── ASSET CARDS ── */
  .asset-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px; box-shadow:var(--shadow); text-align:center; transition:all 0.18s; }
  .asset-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:#bfdbfe; }
  .asset-preview { width:100%; height:100px; background:var(--bg); border-radius:6px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; overflow:hidden; }
  .asset-preview img { max-width:80%; max-height:80%; object-fit:contain; }
  .asset-name { font-size:13px; font-weight:500; margin-bottom:4px; }
  .asset-type { font-size:11px; color:var(--text-dim); margin-bottom:12px; }
  .asset-dl { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; color:var(--accent); text-decoration:none; padding:6px 14px; border:1px solid #bfdbfe; border-radius:6px; transition:all 0.15s; }
  .asset-dl:hover { background:var(--accent-bg); }

  /* ── STATES ── */
  .loading-state { color:var(--text-dim); font-size:13px; padding:40px 0; }
  .empty-state { text-align:center; padding:60px 20px; color:var(--text-dim); font-size:13px; }
  .error-state { text-align:center; padding:60px 20px; color:#ef4444; font-size:13px; }

  footer { text-align:center; padding:20px; font-size:11px; color:var(--text-dim); border-top:1px solid var(--border); margin-top:40px; }

  @media (max-width: 640px) {
    nav { padding: 0 16px; }
    .nav-links { display: none; }
    .nav-hamburger { display: flex; }
    .nav-title { font-size: 13px; }
    .page-header { padding: 24px 16px 28px; }
    .content { padding: 24px 16px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <img class="nav-logo" src="https://hzagwndglwhcepsirafi.supabase.co/storage/v1/object/public/Assets/DFL%20Logo%20Blue_White.png" alt="DFL">
    <div class="nav-divider"></div>
    <span class="nav-title">Staff Portal</span>
  </div>
  <div class="nav-links">
    <a href="/admin/" class="mgmt">Admin</a>
    <a href="/management/" class="mgmt">Management</a>
    <a href="/dispatch-portal.html" class="mgmt">Dispatch</a>
    <a href="/index.html">Home</a>
    <a href="/specials.html">Specials</a>
    <a href="/dashboards.html">Dashboards</a>
    <a href="/forms.html">Forms</a>
    <a href="/assets.html" class="active">Assets</a>
  </div>
  <button class="nav-hamburger" id="hamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="nav-mobile-menu" id="mobileMenu">
  <a href="/admin/" class="mgmt">Admin</a>
  <a href="/management/" class="mgmt">Management</a>
  <a href="/dispatch-portal.html" class="mgmt">Dispatch</a>
  <div class="mob-divider"></div>
  <a href="/index.html">Home</a>
  <a href="/specials.html">Specials</a>
  <a href="/dashboards.html">Dashboards</a>
  <a href="/forms.html">Forms</a>
  <a href="/assets.html" class="active">Assets</a>
</div>

<div class="page-header">
  <div class="page-header-inner">
    <div class="breadcrumb"><a href="/index.html">Home</a> / Assets</div>
    <h1>Assets</h1>
  </div>
</div>

<div class="content">
  <div class="section-label">Brand Assets</div>
  <div class="assets-grid" id="assetsGrid">
    <div class="loading-state">Loading assets…</div>
  </div>
</div>

<footer>© 2026 DFL Importers · Internal use only</footer>

<script>
  // ── Hamburger menu ──
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
  });
  mobileMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
    });
  });

  // ── Dynamic asset loader ──
  const SUPABASE_URL = 'https://hzagwndglwhcepsirafi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h';
  const BUCKET = 'Assets';
  const FOLDER = 'brand';

  // Files containing these strings get a dark navy preview background (for white logos)
  const DARK_BG_KEYWORDS = ['_White', '_white', '-white', '-White', ' white'];

  async function loadAssets() {
    const grid = document.getElementById('assetsGrid');

    try {
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ prefix: FOLDER + '/', limit: 100 })
      });

      const files = await res.json();

      // Filter out folder placeholders (no id) and hidden/system files
      const assets = files.filter(f => f.id && !f.name.startsWith('.'));

      if (!assets.length) {
        grid.innerHTML = '<div class="empty-state">No assets found in the brand folder.</div>';
        return;
      }

      grid.innerHTML = assets.map(file => {
        const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${FOLDER}/${encodeURIComponent(file.name)}`;
        const needsDarkBg = DARK_BG_KEYWORDS.some(kw => file.name.includes(kw));
        const previewBg = needsDarkBg ? 'background:#0f2044;' : '';

        // Friendly display name: strip file extension, replace underscores/hyphens with spaces
        const displayName = file.name.replace(/\.[^.]+$/, '').replace(/[_-]/g, ' ');

        // File type label from extension
        const ext = (file.name.match(/\.([^.]+)$/) || ['', 'File'])[1].toUpperCase();

        return `
          <div class="asset-card">
            <div class="asset-preview" style="${previewBg}">
              <img src="${publicUrl}" alt="${displayName}" loading="lazy">
            </div>
            <div class="asset-name">${displayName}</div>
            <div class="asset-type">${ext}</div>
            <a class="asset-dl" href="${publicUrl}" download="${file.name}">⬇ Download</a>
          </div>`;
      }).join('');

    } catch (err) {
      grid.innerHTML = '<div class="error-state">Failed to load assets. Please try refreshing.</div>';
      console.error('Asset load error:', err);
    }
  }

  loadAssets();
</script>
</body>
</html>
