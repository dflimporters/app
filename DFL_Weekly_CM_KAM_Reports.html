<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFL Weekly Reporting — CMs & KAMs</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B3E; --navy-mid:#16255a; --blue:#326BD3; --gold:#F5A623;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-alt:#F9FAFC;
  --border:#E4E9F2; --border-soft:#EEF1F8;
  --text:#1A2340; --text-mid:#4A5578; --text-soft:#8A95B0;
  --green:#1A8F4C; --green-bg:#F0FDF4;
  --red:#D63B3B; --red-bg:#FEF2F2;
  --amber:#C47A1A; --amber-bg:#FFFBEB;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Open Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
.topbar{background:var(--navy);padding:16px 0;}
.topbar-inner{max-width:920px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-sizing:border-box;}
.topbar-left{display:flex;align-items:center;gap:22px;}
.logo-mark{height:38px;width:auto;flex-shrink:0;}
.topbar-titles h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px;color:#fff;}
.topbar-titles p{font-size:11px;color:rgba(255,255,255,0.5);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.pill-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#fff;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;cursor:pointer;transition:background 0.15s;}
.pill-btn:hover{background:rgba(255,255,255,0.16);}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px;}
.wrap-wide{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;}
.card.accent-plan{border-left:4px solid var(--amber);}
.card.accent-update{border-left:4px solid var(--blue);}
.card.accent-recap{border-left:4px solid var(--green);}
.role-group{margin-bottom:22px;}
.role-group-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.role-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.role-dot.cm{background:var(--blue);}
.role-dot.kam{background:var(--gold);}
.role-select.cm{border-left:3px solid var(--blue);}
.role-select.kam{border-left:3px solid var(--gold);}
.card h2{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:800;color:var(--navy);margin-bottom:4px;}
.card .sub{font-size:12px;color:var(--text-soft);margin-bottom:16px;}

.field{margin-bottom:14px;}
.field label{display:block;font-family:'Montserrat',sans-serif;font-size:11.5px;font-weight:700;color:var(--text-mid);margin-bottom:5px;}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 11px;font-family:'Open Sans',sans-serif;font-size:13.5px;color:var(--text);background:var(--surface);outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);}
.field textarea{min-height:70px;resize:vertical;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}

.btn{font-family:'Montserrat',sans-serif;font-weight:700;font-size:12.5px;border:none;border-radius:7px;padding:10px 18px;cursor:pointer;transition:opacity 0.15s;}
.btn:hover{opacity:0.88;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-ghost{background:var(--surface-alt);color:var(--text-mid);border:1px solid var(--border);}
.btn-danger-ghost{background:var(--red-bg);color:var(--red);border:1px solid #f6cdd0;}
.btn-sm{padding:6px 12px;font-size:11.5px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.landing-list{display:flex;flex-direction:column;gap:8px;}
.role-select{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'Montserrat',sans-serif;font-size:13.5px;font-weight:600;color:var(--text);background:var(--surface-alt);cursor:pointer;margin-bottom:6px;}
.role-select:hover{border-color:var(--blue);}
.role-select:focus{outline:none;border-color:var(--blue);}
.person-btn{display:flex;align-items:center;justify-content:space-between;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:13px 16px;cursor:pointer;transition:border-color 0.15s,background 0.15s;}
.person-btn:hover{border-color:var(--blue);background:#fff;}
.person-name{font-family:'Montserrat',sans-serif;font-weight:700;font-size:13.5px;color:var(--text);}
.person-role{font-size:11.5px;color:var(--text-soft);margin-top:2px;}
.chev{color:var(--text-soft);font-size:16px;}

.section-divider{display:flex;align-items:center;gap:10px;margin:22px 0 10px;}
.section-divider span{font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0.6px;color:var(--text-soft);white-space:nowrap;}
.section-divider .line{flex:1;height:1px;background:var(--border);}

.status-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.status-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:700;font-family:'Montserrat',sans-serif;color:var(--text-mid);cursor:pointer;}
.status-chip.active{border-color:var(--blue);color:var(--blue);background:#EEF4FF;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-done{background:var(--green);} .dot-missing{background:var(--red);} .dot-future{background:var(--text-soft);opacity:0.4;}

.period-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.period-bar select{border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:600;color:var(--text);background:#fff;}
.week-badge{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;padding:5px 11px;border-radius:20px;letter-spacing:0.3px;}
.badge-plan{background:var(--amber-bg);color:var(--amber);}
.badge-update{background:#EEF4FF;color:var(--blue);}
.badge-recap{background:var(--green-bg);color:var(--green);}

.init-row{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--surface-alt);position:relative;}
.init-row .rm{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--text-soft);cursor:pointer;font-size:14px;}
.init-row .rm:hover{color:var(--red);}

.upd-card{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;background:var(--surface-alt);}
.upd-card .upd-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:var(--navy);margin-bottom:8px;}
.upd-card .upd-meta{font-size:11px;color:var(--text-soft);margin-bottom:8px;}

.readonly-view{border:1px solid var(--border);border-radius:8px;padding:16px 18px;background:var(--surface-alt);}
.readonly-view h4{font-family:'Montserrat',sans-serif;font-size:11.5px;font-weight:700;color:var(--text-mid);text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 6px;}
.readonly-view h4:first-child{margin-top:0;}
.readonly-view p{font-size:13px;color:var(--text);white-space:pre-wrap;}
.rv-init{border-bottom:1px solid var(--border-soft);padding:8px 0;}
.rv-init:last-child{border-bottom:none;}
.rv-tag{display:inline-block;font-size:10.5px;font-weight:700;font-family:'Montserrat',sans-serif;padding:2px 8px;border-radius:12px;margin-right:6px;}
.tag-ontrack{background:var(--green-bg);color:var(--green);}
.tag-atrisk{background:var(--amber-bg);color:var(--amber);}
.tag-done{background:#EEF4FF;color:var(--blue);}
.tag-dropped{background:var(--red-bg);color:var(--red);}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
@media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-box{background:var(--navy);border-radius:8px;padding:12px 14px;}
.stat-box .lbl{font-size:10px;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:0.5px;font-family:'Montserrat',sans-serif;font-weight:700;}
.stat-box .val{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;color:#fff;margin-top:3px;}

.mgr-table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
.mgr-table th{background:var(--surface-alt);font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-mid);padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);}
.mgr-table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);}
.mgr-table tr:last-child td{border-bottom:none;}
.cellstat{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:800;cursor:pointer;}
.cs-done{background:var(--green-bg);color:var(--green);}
.cs-missing{background:var(--red-bg);color:var(--red);}
.cs-future{background:var(--surface-alt);color:var(--text-soft);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;padding:12px 22px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.25);z-index:999;opacity:0;transition:opacity 0.25s;pointer-events:none;}
.toast.show{opacity:1;}
.hint{font-size:11.5px;color:var(--text-soft);margin-top:4px;}
.link-btn{background:none;border:none;color:var(--blue);font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;cursor:pointer;padding:0;}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:-2px;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.note-box{background:var(--amber-bg);border:1px solid #f5deac;color:var(--amber);border-radius:7px;padding:9px 12px;font-size:12px;margin-bottom:12px;}
</style>
</head>

/* ============== SUPABASE CLIENT ============== */
const SUPABASE_URL = 'https://hzagwndglwhcepsirafi.supabase.co';

async function sbSelect(table, filters, select){
  const params = new URLSearchParams();
  if(select) params.set('select', select);
  Object.keys(filters).forEach(k=>params.set(k, 'eq.'+filters[k]));
  const resp = await fetch(SUPABASE_URL+'/rest/v1/'+table+'?'+params.toString(), {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer '+SUPABASE_ANON_KEY }
  });
  if(!resp.ok) throw new Error('Supabase error '+resp.status+': '+(await resp.text()));
  return resp.json();
}
async function sbUpsert(table, record, onConflictCols){
  const resp = await fetch(SUPABASE_URL+'/rest/v1/'+table+'?on_conflict='+onConflictCols, {
    method:'POST',
    headers:{
      apikey: SUPABASE_ANON_KEY, Authorization:'Bearer '+SUPABASE_ANON_KEY,
      'Content-Type':'application/json',
      'Prefer':'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify(record)
  });
  if(!resp.ok) throw new Error('Supabase error '+resp.status+': '+(await resp.text()));
}
async function sbRpc(fnName, params){
  const resp = await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fnName, {
    method:'POST',
    headers:{ apikey: SUPABASE_ANON_KEY, Authorization:'Bearer '+SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(params)
  });
  if(!resp.ok) throw new Error('Supabase error '+resp.status+': '+(await resp.text()));
  return resp.json();
}

/* ============== STATE ============== */
let state = { screen:'landing', personId:null, year:null, month:null, fIdx:0, editMode:false };
const now = new Date();

function getFridays(y,m){
  const res=[]; const days=new Date(y,m,0).getDate();
  for(let d=1; d<=days; d++){ const dt=new Date(y,m-1,d); if(dt.getDay()===5) res.push(dt); }
  return res;
}
function fmtDate(dt){ return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function isoDate(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function classify(idx,total){
  if(idx===0) return {type:'plan', label:'Week 1 — Planning'};
  if(idx===total-1) return {type:'recap', label:'Month-End Recap'};
  return {type:'update', weekNum: idx+1, label:'Week '+(idx+1)+' — Progress Update'};
}
function defaultPeriod(){
  let y=now.getFullYear(), m=now.getMonth()+1;
  const fridays = getFridays(y,m);
  const past = fridays.filter(f=>f<=now);
  let chosenIdx = past.length ? fridays.indexOf(past[past.length-1]) : 0;
  return {year:y, month:m, fIdx:chosenIdx};
}
function fmtJ(n){
  n = Number(n)||0;
  return 'J$'+n.toLocaleString('en-US',{maximumFractionDigits:0});
}
function monthName(m){ return ['','January','February','March','April','May','June','July','August','September','October','November','December'][m]; }

/* ============== STORAGE (Supabase table) ============== */
function blankRecord(){ return {plan:null, updates:[], recap:null, drafts:{plan:null, updates:{}, recap:null}}; }
async function loadRecord(personId,y,m){
  try{
    const rows = await sbSelect('cmkam_weekly_reports', {person_id:personId, year:y, month:m}, 'data');
    if(rows && rows.length && rows[0].data){
      const d = rows[0].data;
      return { plan: d.plan||null, updates: d.updates||[], recap: d.recap||null, drafts: d.drafts || {plan:null, updates:{}, recap:null} };
    }
  }catch(e){
    console.error('loadRecord failed:', e);
  }
  return blankRecord();
}
async function saveRecord(personId,y,m,rec){
  await sbUpsert('cmkam_weekly_reports', {person_id:personId, year:y, month:m, data:rec, updated_at:new Date().toISOString()}, 'person_id,year,month');
}

/* ============== AUTOSAVE (drafts) ==============
   Continuously saves whatever is in the form to a `drafts` bucket that is
   completely separate from the real submitted plan/update/recap — so Manager
   View / EA Command Centre only ever show a checkpoint as "done" once the
   person actually clicks Save, never from an in-progress draft. */
let currentRec = null;
let autosaveTimer = null;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosaveGatherAndPersist, 1200);
}
function autosaveIndicatorEl(){ return document.getElementById('autosaveIndicator'); }
function showAutosaveState(msg){
  const el = autosaveIndicatorEl();
  if(el) el.textContent = msg;
}
async function autosaveGatherAndPersist(){
  if(state.screen!=='person' || !currentRec) return;
  const person = PEOPLE.find(p=>p.id===state.personId);
  if(!person) return;
  const fridays = getFridays(state.year, state.month);
  const cls = classify(state.fIdx, fridays.length);
  currentRec.drafts = currentRec.drafts || {plan:null, updates:{}, recap:null};
  try{
    if(cls.type==='plan'){
      const el = document.getElementById('f_declines');
      if(!el) return;
      currentRec.drafts.plan = {
        initiatives: planInitiatives.slice(),
        declines: el.value,
        opportunities: document.getElementById('f_opps').value,
        challenges: document.getElementById('f_challenges').value,
        productDev: document.getElementById('f_pd').value,
        savedAt: new Date().toISOString()
      };
    } else if(cls.type==='update'){
      const el = document.getElementById('u_wins');
      if(!el) return;
      currentRec.drafts.updates[cls.weekNum] = {
        statuses: updStatuses.slice(),
        wins: el.value,
        unplanned: document.getElementById('u_unplanned').value,
        general: document.getElementById('u_general').value,
        savedAt: new Date().toISOString()
      };
    } else {
      const el = document.getElementById('r_improve');
      if(!el) return;
      currentRec.drafts.recap = {
        review: recapReview.slice(),
        actuals: recapActuals,
        improve: el.value,
        blockers: document.getElementById('r_blockers').value,
        commentary: document.getElementById('r_commentary').value,
        savedAt: new Date().toISOString()
      };
    }
    showAutosaveState('Saving draft…');
    await saveRecord(person.id, state.year, state.month, currentRec);
    showAutosaveState('Draft saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    console.error('Autosave failed:', e);
    showAutosaveState('Draft not saved — check connection');
  }
}
/* Delegated listeners: attached once, work regardless of how many times

document.addEventListener('input', (e)=>{

function showToast(msg, isError){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  t.style.background = isError ? 'var(--red)' : 'var(--navy)';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'),isError?4000:2200);
}

  if(state.screen==='landing') app.innerHTML = renderLanding();
  else if(state.screen==='person') renderPersonScreen();

/* ============== LANDING ============== */
function renderLanding(){
  const cms = PEOPLE.filter(p=>p.role.startsWith('Category'));
  const kams = PEOPLE.filter(p=>p.role.startsWith('Key'));
  function labelFor(p){
    const idx = p.role.indexOf('—');
    return idx>-1 ? p.name+' ('+p.role.slice(idx+1).trim()+')' : p.name;
  }
  function dropdownFor(list, selectId, roleClass){
    const opts = list.map(p=>'<option value="'+p.id+'">'+labelFor(p)+'</option>').join('');

function selectPerson(id){

/* ============== PERSON SCREEN ============== */
async function renderPersonScreen(){
  const app=document.getElementById('app');
  const person = PEOPLE.find(p=>p.id===state.personId);
  const fridays = getFridays(state.year,state.month);
  const cls = classify(state.fIdx, fridays.length);
  const rec = await loadRecord(person.id, state.year, state.month);
  currentRec = rec;

  // status strip
  const chips = fridays.map((f,i)=>{
    const c = classify(i,fridays.length);
    let done=false;
    if(c.type==='plan') done = !!rec.plan;
    else if(c.type==='recap') done = !!rec.recap;
    else done = rec.updates.some(u=>u.weekNum===c.weekNum);
    const isPast = f <= now;
    const dotClass = done?'dot-done':(isPast?'dot-missing':'dot-future');
    const active = i===state.fIdx ? 'active':'';
    return '<div class="status-chip '+active+'" onclick="jumpFriday('+i+')"><span class="dot '+dotClass+'"></span>'+c.label.split(' — ')[0]+' · '+fmtDate(f)+'</div>';
  }).join('');

  const yearSel = buildYearMonthSelect();
  const badgeClass = cls.type==='plan'?'badge-plan':(cls.type==='recap'?'badge-recap':'badge-update');

  app.innerHTML =
    '<div class="wrap">'
    + '<div class="period-bar">'
    + yearSel
    + '<span class="week-badge '+badgeClass+'">'+cls.label+'</span>'
    + '</div>'
    + '<div class="status-strip">'+chips+'</div>'
    + '<div id="personCard"></div>'
    + '</div>';

  wireYearMonthSelect(async ()=>{ state.fIdx=0; await renderPersonScreen(); });

  const cardEl = document.getElementById('personCard');
  if(cls.type==='plan') cardEl.innerHTML = renderPlanCard(person, rec, state.editMode);
  else if(cls.type==='update') cardEl.innerHTML = renderUpdateCard(person, rec, cls.weekNum, fridays[state.fIdx], state.editMode);
  else cardEl.innerHTML = renderRecapCard(person, rec, state.editMode);

  wireCardEvents(person, rec, cls, fridays[state.fIdx]);
}
function jumpFriday(i){ state.fIdx=i; state.editMode=false; renderPersonScreen(); }
function buildYearMonthSelect(){
  let opts='';
  for(let m=1;m<=12;m++){ opts += '<option value="'+m+'" '+(m===state.month?'selected':'')+'>'+monthName(m)+'</option>'; }
  return '<select id="monthSel">'+opts+'</select><select id="yearSel"><option value="2026" selected>2026</option></select>';
}
function wireYearMonthSelect(cb){
  const ms=document.getElementById('monthSel'), ys=document.getElementById('yearSel');
  if(ms) ms.onchange = async ()=>{ state.month=parseInt(ms.value); await cb(); };
  if(ys) ys.onchange = async ()=>{ state.year=parseInt(ys.value); await cb(); };
}

let updStatuses = [];
function renderUpdateCard(person, rec, weekNum, fridayDate, editMode){
  const existing = rec.updates.find(u=>u.weekNum===weekNum);

  const draft = rec.drafts && rec.drafts.updates && rec.drafts.updates[weekNum];

      return {initiativeId:it.id, name:it.name, status: prior?prior.status:'On track', note: prior?prior.note:''};
    });
  }
  const src = useDraft ? draft : existing;
  const noPlanNote = planItems.length===0 && !useDraft ? '<div class="note-box">No Week 1 plan found for this month — submit that first if you can, or just fill in general updates below.</div>' : '';

/* ---- RECAP CARD ---- */
let recapReview = [];
let recapActuals = {rows:[], source:null, fetchedAt:null};
function blankActualsRows(person){
  return (person.catOptions||['Total']).map(label=>({label, revenue:null, gp:null, budget:null}));
}
function renderRecapCard(person, rec, editMode){
  if(rec.recap && !editMode) return readonlyRecap(person, rec.recap);
  const draft = rec.drafts && rec.drafts.recap;
  const useDraft = draft && (!rec.recap || new Date(draft.savedAt) > new Date(rec.recap.submittedAt));
  const planItems = rec.plan ? rec.plan.initiatives : [];
  if(useDraft){
    recapReview = JSON.parse(JSON.stringify(draft.review||[]));
  } else {
    recapReview = planItems.map(it=>{
      // pull latest status from updates
      let latest=null;
      (rec.updates||[]).slice().sort((a,b)=>a.weekNum-b.weekNum).forEach(u=>{
        const s=u.statuses.find(x=>x.initiativeId===it.id); if(s) latest=s;
      });
      const prior = rec.recap ? rec.recap.review.find(r=>r.initiativeId===it.id) : null;
      return {initiativeId:it.id, name:it.name, finalStatus: prior?prior.finalStatus:(latest?latest.status:'On track'), note: prior?prior.note:(latest?latest.note:'')};
    });
  }
  const src = useDraft ? draft : rec.recap;
  recapActuals = (useDraft && draft.actuals && draft.actuals.rows && draft.actuals.rows.length)
    ? JSON.parse(JSON.stringify(draft.actuals))
    : (rec.recap && rec.recap.actuals && rec.recap.actuals.rows && rec.recap.actuals.rows.length)
      ? JSON.parse(JSON.stringify(rec.recap.actuals))
      : {rows: blankActualsRows(person), source:null, fetchedAt:null};
  const canAuto = !!person.rpc;
  const multi = (person.catOptions||[]).length > 1;
  return '<div class="card accent-recap">'
    + '<h2>Month-End Recap — '+person.name+' · '+monthName(state.month)+' '+state.year+'</h2>'
    + '<div class="sub">How the month went against what was planned.</div>'
    + (useDraft ? '<div class="note-box">Restored your unsaved draft from '+new Date(draft.savedAt).toLocaleString()+'.</div>' : '')
    + '<div id="recapRows"></div>'
    + '<div class="section-divider"><span>NUMBERS</span><div class="line"></div></div>'
    + (person.approx ? '<div class="note-box">Portfolio definition for this role is still being finalized — treat auto-pulled figures as approximate until confirmed.</div>' : '')
    + (multi ? '<div class="hint" style="margin-bottom:10px;">You manage more than one category, so each gets its own line below — fill in or fetch per category rather than one blended number.</div>' : '')
    + (canAuto ? '<div class="btn-row" style="margin-bottom:12px;"><button class="btn btn-gold" id="fetchBtn" onclick="fetchActuals()">Fetch actuals from Supabase</button></div>' : '<div class="note-box">Auto-pull isn\'t configured yet for this portfolio — enter actuals manually below.</div>')
    + '<div id="actualsBox"></div>'
    + '<div class="section-divider"><span>REFLECTION</span><div class="line"></div></div>'
    + '<div class="field"><label>What needs to improve next month</label><textarea id="r_improve">'+esc(src?.improve)+'</textarea></div>'
    + '<div class="field"><label>Major blockages</label><textarea id="r_blockers">'+esc(src?.blockers)+'</textarea></div>'
    + '<div class="field"><label>Overall commentary</label><textarea id="r_commentary">'+esc(src?.commentary)+'</textarea></div>'
    + '<div class="btn-row" style="align-items:center;"><button class="btn btn-primary" onclick="saveRecap()">Save recap</button><span class="hint" id="autosaveIndicator"></span></div>'
    + '</div>';
}
function renderRecapRows(){
  const el = document.getElementById('recapRows');
  if(!el) return;
  if(recapReview.length===0){ el.innerHTML='<p class="hint">No initiatives were planned this month.</p>'; return; }
  el.innerHTML = recapReview.map(s=>
    '<div class="upd-card">'

    + '<div class="grid2">'
    + '<div class="field"><label>Final status</label><select onchange="updRecapRow(\''+s.initiativeId+'\',\'finalStatus\',this.value)">'+['On track','At risk','Done','Dropped'].map(o=>'<option '+(s.finalStatus===o?'selected':'')+'>'+o+'</option>').join('')+'</select></div>'
    + '<div class="field"><label>Note</label><input type="text" value="'+esc(s.note)+'" oninput="updRecapRow(\''+s.initiativeId+'\',\'note\',this.value)"></div>'
    + '</div></div>'
  ).join('');

function updRecapRow(id,field,val){ const s=recapReview.find(x=>x.initiativeId===id); if(s) s[field]=val; }
function computeActualsTotals(rows){
  const revenue = rows.reduce((sum,r)=>sum+(Number(r.revenue)||0),0);
  const gp = rows.reduce((sum,r)=>sum+(Number(r.gp)||0),0);
  const budget = rows.reduce((sum,r)=>sum+(Number(r.budget)||0),0);
  const gpPct = revenue ? ((gp/revenue)*100).toFixed(1) : null;
  const ach = budget ? Math.round((revenue/budget)*100) : null;
  return {revenue, gp, budget, gpPct, ach};
}
function renderActualsBox(){
  const el = document.getElementById('actualsBox');
  if(!el) return;
  const rows = recapActuals.rows;
  const multi = rows.length > 1;
  let html = '<table class="mgr-table" style="margin-bottom:8px;"><thead><tr><th>'+(multi?'Category':'Portfolio')+'</th><th>Revenue (J$)</th><th>GP (J$)</th><th>Budget (J$)</th></tr></thead><tbody>';
  rows.forEach((r,idx)=>{
    html += '<tr><td>'+esc(r.label)+'</td>'
      + '<td><input type="number" style="max-width:150px;" value="'+(r.revenue??'')+'" oninput="updActualsRow('+idx+',\'revenue\',this.value)"></td>'
      + '<td><input type="number" style="max-width:150px;" value="'+(r.gp??'')+'" oninput="updActualsRow('+idx+',\'gp\',this.value)"></td>'
      + '<td><input type="number" style="max-width:150px;" value="'+(r.budget??'')+'" oninput="updActualsRow('+idx+',\'budget\',this.value)"></td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="hint" id="actualsSummary"></div>';
  if(recapActuals.source==='auto') html += '<div class="hint">Auto-pulled from Supabase '+(recapActuals.fetchedAt?new Date(recapActuals.fetchedAt).toLocaleString():'')+'. You can still adjust figures above if needed.</div>';
  el.innerHTML = html;
  updateActualsSummary();
}
function updActualsRow(idx,field,val){ recapActuals.rows[idx][field]=val; updateActualsSummary(); }
function updateActualsSummary(){
  const s = document.getElementById('actualsSummary');
  if(!s) return;
  const t = computeActualsTotals(recapActuals.rows);
  const parts = [];
  if(recapActuals.rows.length>1) parts.push('Total: '+fmtJ(t.revenue)+' revenue');
  parts.push('GP%: '+(t.gpPct!=null?t.gpPct+'%':'—'));
  parts.push('Ach. vs budget: '+(t.ach!=null?t.ach+'%':'—'));
  s.textContent = parts.join(' · ');
}
async function fetchActuals(){
  const person = PEOPLE.find(p=>p.id===state.personId);
  const btn = document.getElementById('fetchBtn');
  btn.innerHTML = '<span class="spinner"></span>Fetching…'; btn.disabled=true;
  try{
    const {name, params} = person.rpc;
    const data = await sbRpc(name, params(state.year, state.month));
    const arr = Array.isArray(data) ? data : [data];
    recapActuals = {
      rows: arr.map(row=>({label: row.label || 'Total', revenue: Math.round(Number(row.actual_revenue)||0), gp: Math.round(Number(row.actual_gp)||0), budget: Math.round(Number(row.budget)||0)})),
      source:'auto', fetchedAt:new Date().toISOString()
    };
    renderActualsBox();
    showToast('Actuals fetched');
  }catch(e){
    showToast('Could not fetch: '+e.message, true);
  }
  btn.innerHTML='Re-fetch actuals from Supabase'; btn.disabled=false;
}
async function saveRecap(){
  const person = PEOPLE.find(p=>p.id===state.personId);
  const rec = await loadRecord(person.id, state.year, state.month);
  rec.recap = {
    submittedAt: new Date().toISOString(),
    review: recapReview,
    actuals: recapActuals,
    improve: document.getElementById('r_improve').value,
    blockers: document.getElementById('r_blockers').value,
    commentary: document.getElementById('r_commentary').value
  };
  rec.drafts = rec.drafts || {plan:null, updates:{}, recap:null};
  rec.drafts.recap = null;
  try{
    await saveRecord(person.id, state.year, state.month, rec);
    showToast('Recap saved');
    state.editMode=false;
    renderPersonScreen();
  }catch(e){
    showToast(e.message, true);
  }
}
function readonlyRecap(person, recap){
  const rows = (recap.review||[]).map(s=>{
    const tagClass = s.finalStatus==='On track'?'tag-ontrack':(s.finalStatus==='At risk'?'tag-atrisk':(s.finalStatus==='Done'?'tag-done':'tag-dropped'));
    return '<div class="rv-init"><span class="rv-tag '+tagClass+'">'+esc(s.finalStatus)+'</span><strong>'+esc(s.name)+'</strong>'+(s.note?'<p>'+esc(s.note)+'</p>':'')+'</div>';
  }).join('') || '<p class="hint">No initiatives tracked.</p>';
  const actualRows = (recap.actuals && recap.actuals.rows) ? recap.actuals.rows : [];
  const t = computeActualsTotals(actualRows);
  const breakdown = actualRows.length>1 ? (
    '<table class="mgr-table" style="margin:8px 0 14px;"><thead><tr><th>Category</th><th>Revenue</th><th>GP</th><th>Budget</th><th>Ach%</th></tr></thead><tbody>'
    + actualRows.map(r=>{
        const rAch = r.budget ? Math.round((r.revenue/r.budget)*100) : null;
        return '<tr><td>'+esc(r.label)+'</td><td>'+fmtJ(r.revenue)+'</td><td>'+fmtJ(r.gp)+'</td><td>'+fmtJ(r.budget)+'</td><td>'+(rAch!=null?rAch+'%':'—')+'</td></tr>';
      }).join('')
    + '</tbody></table>'
  ) : '';
  return '<div class="card accent-recap">'
    + '<h2>Month-End Recap — '+person.name+' · '+monthName(state.month)+' '+state.year+'</h2>'
    + '<div class="sub">Submitted '+new Date(recap.submittedAt).toLocaleString()+'</div>'
    + '<div class="stat-grid">'
    + '<div class="stat-box"><div class="lbl">Revenue</div><div class="val">'+fmtJ(t.revenue)+'</div></div>'
    + '<div class="stat-box"><div class="lbl">GP</div><div class="val">'+fmtJ(t.gp)+'</div></div>'
    + '<div class="stat-box"><div class="lbl">GP%</div><div class="val">'+(t.gpPct!=null?t.gpPct+'%':'—')+'</div></div>'
    + '<div class="stat-box"><div class="lbl">Ach. vs Budget</div><div class="val">'+(t.ach!=null?t.ach+'%':'—')+'</div></div>'
    + '</div>'
    + breakdown
    + '<div class="readonly-view">'
    + '<h4>Initiative review</h4>'+rows
    + '<h4>What needs to improve</h4><p>'+esc(recap.improve)+'</p>'
    + '<h4>Major blockages</h4><p>'+esc(recap.blockers)+'</p>'
    + '<h4>Overall commentary</h4><p>'+esc(recap.commentary)+'</p>'
    + '</div>'
    + '<div class="btn-row"><button class="btn btn-ghost" onclick="enableEdit()">Edit recap</button><button class="btn btn-gold" onclick="generateRecapSlide()">Download Slide (HTML)</button><button class="btn btn-danger-ghost" onclick="deleteRecap()">Delete recap</button></div>'
    + '</div>';
}
async function deleteRecap(){
  if(!confirm('Delete this recap? This cannot be undone.')) return;
  const person = PEOPLE.find(p=>p.id===state.personId);
  const rec = await loadRecord(person.id, state.year, state.month);
  rec.recap = null;
  rec.drafts = rec.drafts || {plan:null, updates:{}, recap:null};
  rec.drafts.recap = null;
  try{
    await saveRecord(person.id, state.year, state.month, rec);
    showToast('Recap deleted');
    state.editMode=false;
    renderPersonScreen();
  }catch(e){
    showToast(e.message, true);
  }
}

function wireCardEvents(person, rec, cls, fridayDate){
  if(cls.type==='plan'){ renderInitRows(); document.getElementById('catOpts') || (function(){ const d=document.createElement('datalist'); d.id='catOpts'; d.innerHTML=(person.catOptions||[]).map(c=>'<option value="'+c+'">').join(''); document.body.appendChild(d); })(); }
  else if(cls.type==='update'){ renderUpdRows(); }
  else { renderRecapRows(); renderActualsBox(); }
}

const SLIDE_NAVY='#0D1B3E', SLIDE_BLUE='#326BD3', SLIDE_GOLD='#F5A623', SLIDE_GREEN='#1A8F4C',
      SLIDE_RED='#D63B3B', SLIDE_AMBER='#C47A1A', SLIDE_TEXT='#2A3350', SLIDE_GREY='#8A95B0', SLIDE_LIGHT='#F5F7FA', SLIDE_BORDER='#E4E9F2';

function slideDoc(badgeText, badgeColor, title, subtitle, bodyHtml){
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+title+'</title><style>'
    + '*{box-sizing:border-box;margin:0;padding:0;}'
    + 'html,body{background:#e9edf3;}'
    + 'body{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding:40px 20px;font-family:Arial,Helvetica,sans-serif;}'
    + '.slide{width:1280px;min-height:680px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 34px rgba(13,27,62,0.22);}'
    + '.slide-header{background:'+SLIDE_NAVY+';min-height:104px;display:flex;align-items:center;padding:20px 34px;gap:22px;flex-wrap:wrap;}'
    + '.slide-logo{height:56px;display:block;}'
    + '.slide-badge{font-weight:800;font-size:13px;color:'+SLIDE_NAVY+';background:'+badgeColor+';padding:9px 18px;border-radius:20px;letter-spacing:0.3px;white-space:nowrap;}'
    + '.slide-title{font-weight:800;font-size:25px;color:#fff;line-height:1.25;}'
    + '.slide-subtitle{font-size:14px;color:#B9C2DA;margin-top:3px;}'
    + '.slide-body{padding:26px 34px 32px;}'
    + 'h3.slide-section{font-size:13px;font-weight:800;color:'+SLIDE_NAVY+';margin:0 0 10px;letter-spacing:0.4px;}'
    + '.info-cards{display:flex;gap:16px;align-items:stretch;}'
    + '.info-cards-2x2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}'
    + '.info-card{flex:1;background:'+SLIDE_LIGHT+';border-left:5px solid #ccc;padding:14px 16px;border-radius:12px;}'
    + '.info-card .lbl{font-size:10.5px;font-weight:800;color:'+SLIDE_GREY+';text-transform:uppercase;letter-spacing:0.4px;margin-bottom:7px;}'
    + '.info-card .txt{font-size:13px;color:'+SLIDE_TEXT+';line-height:1.5;white-space:pre-wrap;}'
    + '.info-card ul.bullets{list-style:none;margin:0;padding:0;}'
    + '.info-card ul.bullets li{font-size:13px;color:'+SLIDE_TEXT+';line-height:1.5;padding-left:16px;position:relative;margin-bottom:5px;}'
    + '.info-card ul.bullets li:last-child{margin-bottom:0;}'
    + '.info-card ul.bullets li:before{content:"\\2022";position:absolute;left:0;color:var(--dot);font-weight:800;}'
    + '.info-card ul.bullets li.no-bullet{padding-left:0;}'
    + '.info-card ul.bullets li.no-bullet:before{content:none;}'
    + '.stat-row{display:flex;gap:16px;margin-bottom:22px;}'
    + '.stat-box{flex:1;border-radius:12px;padding:14px 18px;}'
    + '.stat-box .lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;opacity:0.8;margin-bottom:7px;}'
    + '.stat-box .val{font-size:24px;font-weight:800;}'
    + '.table-wrap{border:1px solid '+SLIDE_BORDER+';border-radius:12px;overflow:hidden;margin-bottom:22px;}'
    + 'table.slide-table{width:100%;border-collapse:collapse;table-layout:fixed;}'
    + 'table.slide-table th{background:'+SLIDE_NAVY+';color:#fff;font-size:12.5px;text-align:left;padding:10px 14px;}'
    + 'table.slide-table td{font-size:14px;color:'+SLIDE_TEXT+';padding:10px 14px;border-top:1px solid '+SLIDE_BORDER+';vertical-align:top;line-height:1.45;word-wrap:break-word;}'
    + 'table.slide-table tr:first-child td{border-top:none;}'
    + '.status-tag{font-weight:800;}'
    + '</style></head><body>'
    + '<div class="slide">'
    + '<div class="slide-header">'
    + '<img class="slide-logo" src="data:image/png;base64,'+DFL_LOGO_B64+'">'
    + '<div class="slide-badge">'+badgeText+'</div>'
    + '<div><div class="slide-title">'+title+'</div><div class="slide-subtitle">'+subtitle+'</div></div>'
    + '</div>'
    + '<div class="slide-body">'+bodyHtml+'</div>'
    + '</div>'
    + '</body></html>';
}
function slideLineToBullets(line){
  const trimmed = line.trim();
  if(!trimmed) return [];
  const startsWithDash = /^-\s*/.test(trimmed);
  const parts = trimmed.split(/\s-(?=\S)/g);
  if(parts.length>=3 || (parts.length===2 && startsWithDash)){
    return parts.map(p=>p.replace(/^-\s*/,'').trim()).filter(Boolean);
  }
  return [trimmed.replace(/^-\s*/,'').trim()];
}
function extractBullets(text){
  if(!text) return [];
  const out = [];
  text.split(/\r?\n/).forEach(function(line){
    slideLineToBullets(line).forEach(function(b){ if(b) out.push(b); });
  });
  return out;
}
const SLIDE_CATEGORY_WORDS = ['GARBAGE BAG','GARBAGEBAG','CLEARPACK','HOUSEHOLD','PROCESSING','BEVERAGES','ECOSTRAW','FOODSUP','PLASTIC','ECOBOX','ECOCUP','ECOBAG','PAPER','FOIL','SALT']
  .sort(function(a,b){ return b.length-a.length; });
function formatBulletHtml(bulletText){
  for(let i=0;i<SLIDE_CATEGORY_WORDS.length;i++){
    const w = SLIDE_CATEGORY_WORDS[i];
    const re = new RegExp('^('+w.replace(/ /g,'\\s+')+')(?=[\\s:.,\\-]|$)','i');
    const m = bulletText.match(re);
    if(m){
      const rest = bulletText.slice(m[0].length);
      return { html:'<strong>'+esc(m[1].toUpperCase())+'</strong>'+esc(rest), isHeading:true };
    }
  }
  return { html:esc(bulletText), isHeading:false };
}
function slideInfoCard(accentColor, label, text){
  const bullets = extractBullets(text);
  const body = bullets.length
    ? '<ul class="bullets">'+bullets.map(function(b){
        const r = formatBulletHtml(b);
        return '<li'+(r.isHeading?' class="no-bullet"':'')+'>'+r.html+'</li>';
      }).join('')+'</ul>'
    : '';
  return '<div class="info-card" style="border-left-color:'+accentColor+';--dot:'+accentColor+'">'
    + '<div class="lbl">'+esc(label)+'</div>'
    + body
    + '</div>';
}
function slideStatBox(bg, fg, label, value){
  return '<div class="stat-box" style="background:'+bg+';color:'+fg+'">'
    + '<div class="lbl">'+esc(label)+'</div>'
    + '<div class="val">'+esc(value)+'</div>'
    + '</div>';
}
function slideTagColor(status){
  return status==='On track'?SLIDE_GREEN:(status==='At risk'?SLIDE_AMBER:(status==='Done'?SLIDE_BLUE:SLIDE_RED));
}
function slideStatusTable(rows){
  if(!rows || !rows.length) return '<div class="table-wrap"><div style="padding:14px;font-size:12.5px;color:'+SLIDE_GREY+';">No initiatives tracked.</div></div>';
  const body = rows.map(r=>
    '<tr><td style="width:13%;"><span class="status-tag" style="color:'+slideTagColor(r.status)+'">'+esc(r.status)+'</span></td>'
    + '<td style="width:30%;font-weight:700;">'+esc(r.name)+'</td>'
    + '<td style="color:'+SLIDE_GREY+'">'+esc(r.note||'')+'</td></tr>'
  ).join('');
  return '<div class="table-wrap"><table class="slide-table"><thead><tr><th>Status</th><th>Initiative</th><th>Note</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function slideInitiativesTable(initiatives){
  const body = (initiatives||[]).map(it=>
    '<tr><td style="width:30%;font-weight:700;">'+esc(it.name)+'</td>'
    + '<td style="width:10%;color:'+SLIDE_GREY+'">'+esc(it.category||'')+'</td>'
    + '<td style="width:10%;color:'+SLIDE_GREY+'">'+esc(it.actionType||'')+'</td>'
    + '<td>'+esc(it.target||'')+'</td></tr>'
  ).join('') || '<tr><td colspan="4" style="color:'+SLIDE_GREY+'">No initiatives listed.</td></tr>';
  return '<div class="table-wrap"><table class="slide-table"><thead><tr><th>Initiative</th><th>Category</th><th>Type</th><th>Target</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function slideCategoryTable(rows){
  const body = rows.map(r=>
    '<tr><td style="width:34%;font-weight:700;">'+esc(r.label)+'</td><td>'+esc(fmtJ(r.revenue))+'</td><td>'+esc(fmtJ(r.gp))+'</td><td>'+esc(fmtJ(r.budget))+'</td></tr>'
  ).join('');
  return '<div class="table-wrap"><table class="slide-table"><thead><tr><th>Category</th><th>Revenue</th><th>GP</th><th>Budget</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function downloadHtmlSlide(filename, htmlContent){
  const blob = new Blob([htmlContent], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function generatePlanSlide(){
  const person = PEOPLE.find(p=>p.id===state.personId);
  const plan = currentRec && currentRec.plan;
  if(!plan) return;
  const cards = slideInfoCard(SLIDE_RED,'Declines & Addressing',plan.declines)
    + slideInfoCard(SLIDE_BLUE,'Opportunities',plan.opportunities)
    + slideInfoCard(SLIDE_AMBER,'Challenges',plan.challenges)
    + slideInfoCard(SLIDE_GREEN,'Product Dev / New',plan.productDev);
  const body = '<div class="info-cards-2x2" style="margin-bottom:22px;">'+cards+'</div>'
    + '<h3 class="slide-section">PLANNED INITIATIVES</h3>'
    + slideInitiativesTable(plan.initiatives);
  const html = slideDoc('WEEK 1 &middot; PLAN', SLIDE_GOLD, esc(person.name)+' &mdash; '+monthName(state.month)+' '+state.year, esc(person.focus), body);
  downloadHtmlSlide('DFL_'+person.name.replace(/\s+/g,'_')+'_Plan_'+monthName(state.month)+state.year+'.html', html);
}
function generateUpdateSlide(weekNum){
  const person = PEOPLE.find(p=>p.id===state.personId);
  const u = currentRec && currentRec.updates.find(x=>x.weekNum===weekNum);
  if(!u) return;
  const cards = slideInfoCard(SLIDE_GREEN,'Wins',u.wins)
    + slideInfoCard(SLIDE_AMBER,'Unplanned / Adjustments',u.unplanned)
    + slideInfoCard(SLIDE_BLUE,'General',u.general);
  const body = '<h3 class="slide-section">INITIATIVE STATUS</h3>'
    + slideStatusTable(u.statuses||[])
    + '<div class="info-cards">'+cards+'</div>';
  const html = slideDoc('WEEK '+weekNum+' &middot; UPDATE', SLIDE_BLUE, esc(person.name)+' &mdash; '+monthName(state.month)+' '+state.year, esc(person.focus), body);
  downloadHtmlSlide('DFL_'+person.name.replace(/\s+/g,'_')+'_Week'+weekNum+'Update_'+monthName(state.month)+state.year+'.html', html);
}
function generateRecapSlide(){
  const person = PEOPLE.find(p=>p.id===state.personId);
  const recap = currentRec && currentRec.recap;
  if(!recap) return;
  const rows = (recap.actuals && recap.actuals.rows) ? recap.actuals.rows : [];
  const revenue = rows.reduce((s,r)=>s+(Number(r.revenue)||0),0);
  const gp = rows.reduce((s,r)=>s+(Number(r.gp)||0),0);
  const budget = rows.reduce((s,r)=>s+(Number(r.budget)||0),0);
  const gpPct = revenue ? ((gp/revenue)*100).toFixed(1)+'%' : '\u2014';
  const ach = budget ? Math.round((revenue/budget)*100) : null;
  const achColor = ach==null ? SLIDE_GREY : (ach>=100?SLIDE_GREEN:(ach>=80?SLIDE_AMBER:SLIDE_RED));
  const stats = slideStatBox(SLIDE_NAVY,'#fff','Revenue', fmtJ(revenue))
    + slideStatBox(SLIDE_NAVY,'#fff','GP', fmtJ(gp))
    + slideStatBox(SLIDE_NAVY,'#fff','GP%', gpPct)
    + slideStatBox(achColor,'#fff','Ach. vs Budget', ach!=null?ach+'%':'\u2014');
  const breakdown = rows.length>1 ? ('<h3 class="slide-section">CATEGORY BREAKDOWN</h3>'+slideCategoryTable(rows)) : '';
  const cards = slideInfoCard(SLIDE_AMBER,'What Needs to Improve',recap.improve)
    + slideInfoCard(SLIDE_RED,'Major Blockages',recap.blockers)
    + slideInfoCard(SLIDE_BLUE,'Commentary',recap.commentary);
  const body = '<div class="stat-row">'+stats+'</div>'
    + breakdown
    + '<h3 class="slide-section">INITIATIVE REVIEW</h3>'
    + slideStatusTable((recap.review||[]).map(r=>({status:r.finalStatus, name:r.name, note:r.note})))
    + '<div class="info-cards">'+cards+'</div>';
  const html = slideDoc('MONTH-END &middot; RECAP', SLIDE_GREEN, esc(person.name)+' &mdash; '+monthName(state.month)+' '+state.year, esc(person.focus), body);
  downloadHtmlSlide('DFL_'+person.name.replace(/\s+/g,'_')+'_Recap_'+monthName(state.month)+state.year+'.html', html);
}

/* ============== INIT ============== */
render();
</script>
</body>
