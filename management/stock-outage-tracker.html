<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFL Stock Outage Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f8;
    --white: #ffffff;
    --navy: #0f2044;
    --accent: #2563eb;
    --green: #16a34a;
    --green-light: #dcfce7;
    --amber: #d97706;
    --amber-light: #fef3c7;
    --red: #dc2626;
    --red-light: #fee2e2;
    --orange: #ea580c;
    --orange-light: #fff7ed;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --radius: 12px;
    --font: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: var(--font); color: var(--text); min-height: 100vh; }

  /* ── HEADER ── */
  .header { background: var(--navy); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; gap: 10px; }
  .header-left { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .dfl-logo { height: 34px; width: auto; object-fit: contain; display: block; }
  .logo-fallback { display: none; flex-direction: column; line-height: 1; }
  .logo-top { font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
  .logo-main { font-size: 17px; font-weight: 800; color: #fff; }
  .logo-main span { color: #38bdf8; }
  .divider-v { width: 1px; height: 26px; background: rgba(255,255,255,0.15); flex-shrink: 0; }
  .page-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); white-space: nowrap; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .period-select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; font-family: var(--font); font-size: 12px; font-weight: 600; padding: 4px 8px; cursor: pointer; outline: none; min-width: 160px; }
  .period-select option { background: #1e293b; color: #fff; }
  .live-wrap { display: flex; align-items: center; gap: 5px; font-size: 10px; color: rgba(255,255,255,0.4); }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

  /* ── CONTENT ── */
  .content { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

  /* ── KPI STRIP ── */
  .kpi-row { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
  .kpi-card { background: var(--white); border-radius: var(--radius); padding: 14px 12px; border: 1px solid var(--border); }
  .kpi-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; margin-bottom: 6px; }
  .kpi-icon.blue { background: #dbeafe; }
  .kpi-icon.red { background: var(--red-light); }
  .kpi-icon.amber { background: var(--amber-light); }
  .kpi-icon.orange { background: var(--orange-light); }
  .kpi-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 3px; }
  .kpi-value { font-size: 20px; font-weight: 800; line-height: 1; }
  .kpi-sub { font-size: 10px; color: var(--muted); margin-top: 3px; }

  /* ── PANEL ── */
  .panel { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
  .panel-head { padding: 11px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-title { font-size: 11px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.06em; }
  .panel-meta { font-size: 10px; color: var(--muted); }

  /* ── SKU TABLE ── */
  .sku-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .sku-table thead th { padding: 8px 10px; text-align: left; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); background: #f8fafc; position: sticky; top: 0; }
  .sku-table thead th.right { text-align: right; }
  .sku-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; cursor: pointer; }
  .sku-table tbody tr:last-child { border-bottom: none; }
  .sku-table tbody tr:hover { background: #f8fafc; }
  .sku-table tbody tr.selected { background: #eff6ff; }
  .sku-table td { padding: 8px 10px; vertical-align: middle; }
  .sku-table td.right { text-align: right; }
  .sku-name { font-weight: 600; font-size: 12px; line-height: 1.3; }
  .sku-class { font-size: 10px; color: var(--muted); margin-top: 1px; }

  /* In/Out ratio bar */
  .ratio-wrap { display: flex; align-items: center; gap: 6px; }
  .ratio-bar { flex: 1; height: 6px; border-radius: 3px; background: #f1f5f9; overflow: hidden; min-width: 60px; }
  .ratio-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
  .ratio-label { font-size: 10px; font-weight: 600; white-space: nowrap; min-width: 32px; text-align: right; }

  .oos-badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .oos-none { background: var(--green-light); color: var(--green); }
  .oos-low { background: var(--amber-light); color: var(--amber); }
  .oos-high { background: var(--red-light); color: var(--red); }
  .oos-full { background: #fce7f3; color: #be185d; }

  .lost-sales { font-weight: 700; font-size: 12px; }
  .lost-zero { color: var(--green); }
  .lost-low { color: var(--amber); }
  .lost-high { color: var(--red); }

  /* ── TIMELINE PANEL ── */
  .timeline-panel { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
  .timeline-empty { padding: 30px; text-align: center; color: var(--muted); font-size: 13px; }
  .timeline-header { padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .timeline-sku-name { font-size: 13px; font-weight: 700; }
  .timeline-sku-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .timeline-body { padding: 14px; }
  .timeline-grid { display: flex; gap: 3px; flex-wrap: wrap; }
  .timeline-day { width: 28px; height: 40px; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: default; position: relative; }
  .timeline-day:hover .timeline-tooltip { display: block; }
  .timeline-day-in { background: var(--green-light); border: 1px solid #86efac; }
  .timeline-day-out { background: var(--red-light); border: 1px solid #fca5a5; }
  .timeline-day-num { font-size: 9px; font-weight: 700; }
  .timeline-day-in .timeline-day-num { color: var(--green); }
  .timeline-day-out .timeline-day-num { color: var(--red); }
  .timeline-day-icon { font-size: 10px; }
  .timeline-tooltip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; font-size: 10px; padding: 4px 8px; border-radius: 5px; white-space: nowrap; z-index: 5; pointer-events: none; }
  .timeline-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 4px solid transparent; border-top-color: var(--navy); }
  .timeline-legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--muted); align-items: center; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  /* ── FILTER BAR ── */
  .filter-bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); background: #f8fafc; flex-wrap: wrap; }
  .filter-btn { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); background: var(--white); color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .search-input { flex: 1; min-width: 120px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); font-size: 11px; font-family: var(--font); outline: none; background: var(--white); }
  .search-input:focus { border-color: var(--accent); }

  /* ── MISC ── */
  .loading { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }
  .err { margin: 16px; padding: 12px; background: var(--red-light); color: var(--red); border-radius: 8px; font-size: 13px; }
  .footer { text-align: center; font-size: 11px; color: var(--muted); padding: 8px 0 18px; }
  .table-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }

  /* ── MONTH LABELS ── */
  .timeline-month-label { width: 100%; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 0 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img class="dfl-logo" src="https://hzagwndglwhcepsirafi.supabase.co/storage/v1/object/public/Assets/DFL%20Logo%20Blue_White.png" alt="DFL Importers"
      onerror="this.style.display='none';document.querySelector('.logo-fallback').style.display='flex';">
    <div class="logo-fallback">
      <span class="logo-top">DFL Importers</span>
      <span class="logo-main">DFL <span>Hub</span></span>
    </div>
    <div class="divider-v"></div>
    <span class="page-label">📦 Stock Outage Tracker</span>
  </div>
  <div class="header-right">
    <select class="period-select" id="period-select" onchange="onPeriodChange(this.value)">
      <option value="">Loading...</option>
    </select>
    <div class="live-wrap"><div class="live-dot"></div>Live data</div>
  </div>
</div>

<div class="content" id="content">
  <div class="loading">Loading stock data...</div>
</div>

<div class="footer" id="footer"></div>

<script>
const SUPA_URL = 'https://hzagwndglwhcepsirafi.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6YWd3bmRnbHdoY2Vwc2lyYWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTA1OTcsImV4cCI6MjA5MTY4NjU5N30.ZtU8gCK4TqDMRyES0sOm8iWDOHjkWPwHQEjepvu7PP4';

const fmt = n => {
  if (n === 0) return '$0';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + Math.round(n).toLocaleString();
};

const fmtFull = n => '$' + Math.round(n).toLocaleString();

async function query(sql) {
  const res = await fetch(`${SUPA_URL}/rest/v1/rpc/execute_sql`, {
    method: 'POST',
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: sql })
  });
  // Use direct table queries instead
  throw new Error('Use direct queries');
}

async function sb(table, params = '') {
  const res = await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`, {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
  });
  if (!res.ok) throw new Error(`Supabase error: ${res.status}`);
  return res.json();
}

async function rpc(fn, params = {}) {
  const res = await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(params)
  });
  if (!res.ok) throw new Error(`RPC ${fn} failed: ${res.status}`);
  return res.json();
}

// ── State ──────────────────────────────────────────────────────────────────
let allSkuData = [];
let filteredData = [];
let selectedSku = null;
let currentFilter = 'all';
let currentPeriod = null;
let availablePeriods = [];
let sortCol = 'est_lost_sales';
let sortDir = 'desc';
let filterClass = '';
let classDropdownOpen = false;

// ── Period Helpers ─────────────────────────────────────────────────────────
function getCurrentPeriod() {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
}

function getPeriodBounds(period) {
  const [y, m] = period.split('-').map(Number);
  const start = new Date(y, m - 1, 1);
  const end = new Date(y, m, 0);
  const startStr = start.toISOString().split('T')[0];
  const endStr = end.toISOString().split('T')[0];
  return { startStr, endStr, daysInMonth: end.getDate() };
}

function getMonthLabel(period) {
  const [y, m] = period.split('-').map(Number);
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return months[m - 1] + ' ' + y;
}

function getMonthShort(period) {
  const [y, m] = period.split('-').map(Number);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[m - 1] + ' ' + y;
}

// ── Load available periods from stock_snapshots ────────────────────────────
async function loadPeriods() {
  const rows = await sb('stock_snapshots', 'select=snapshot_date&order=snapshot_date.desc');
  const periods = [...new Set(rows.map(r => r.snapshot_date.slice(0, 7)))];
  return periods;
}

// ── Load SKU data for period ───────────────────────────────────────────────
async function loadSkuData(period) {
  const { startStr, endStr } = getPeriodBounds(period);

  // Snapshots for the period
  const snapshots = await sb('stock_snapshots',
    `select=inventory_id,description,item_class,snapshot_date,on_hand,is_out_of_stock` +
    `&snapshot_date=gte.${startStr}&snapshot_date=lte.${endStr}&order=inventory_id,snapshot_date`
  );

  if (!snapshots.length) return [];

  // Aggregate per SKU
  const skuMap = {};
  for (const row of snapshots) {
    const id = row.inventory_id;
    if (!skuMap[id]) {
      skuMap[id] = {
        inventory_id: id,
        description: row.description,
        item_class: row.item_class,
        days_tracked: 0,
        days_oos: 0,
        days_in: 0,
        avg_on_hand_sum: 0,
        avg_on_hand_count: 0,
        daily: {}
      };
    }
    const s = skuMap[id];
    s.days_tracked++;
    if (row.is_out_of_stock) {
      s.days_oos++;
      s.daily[row.snapshot_date] = { oos: true, on_hand: 0 };
    } else {
      s.days_in++;
      s.avg_on_hand_sum += parseFloat(row.on_hand);
      s.avg_on_hand_count++;
      s.daily[row.snapshot_date] = { oos: false, on_hand: parseFloat(row.on_hand) };
    }
  }

  // Sales for the period — paginate to avoid default 1000-row limit
  const salesBySkuDay = {};
  let salesOffset = 0;
  const salesPageSize = 1000;
  while (true) {
    const salesRes = await fetch(
      `${SUPA_URL}/rest/v1/invoiced_items?select=inventory_id,ext_amount,invoice_date` +
      `&invoice_date=gte.${startStr}&invoice_date=lte.${endStr}` +
      `&tran_type=neq.CRM&ext_amount=gt.0` +
      `&limit=${salesPageSize}&offset=${salesOffset}`,
      { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Prefer': 'count=exact' } }
    );
    if (!salesRes.ok) throw new Error(`Sales fetch failed: ${salesRes.status}`);
    const rows = await salesRes.json();
    for (const row of rows) {
      const id = row.inventory_id;
      if (!salesBySkuDay[id]) salesBySkuDay[id] = { total: 0, days: new Set() };
      salesBySkuDay[id].total += parseFloat(row.ext_amount);
      salesBySkuDay[id].days.add(row.invoice_date.slice(0, 10));
    }
    if (rows.length < salesPageSize) break;
    salesOffset += salesPageSize;
  }

  // Combine
  const result = Object.values(skuMap).map(s => {
    const sal = salesBySkuDay[s.inventory_id];
    const avgDailySales = sal && sal.days.size > 0 ? sal.total / sal.days.size : 0;
    const estLostSales = avgDailySales * s.days_oos;
    return {
      ...s,
      avg_on_hand: s.avg_on_hand_count > 0 ? Math.round(s.avg_on_hand_sum / s.avg_on_hand_count) : 0,
      avg_daily_sales: avgDailySales,
      total_sales: sal ? sal.total : 0,
      est_lost_sales: estLostSales
    };
  });

  return result.sort((a, b) => b.est_lost_sales - a.est_lost_sales);
}

// ── Render ─────────────────────────────────────────────────────────────────
function oosBadge(days, total) {
  if (days === 0) return '<span class="oos-badge oos-none">✓ In Stock</span>';
  const pct = days / total;
  if (pct === 1) return `<span class="oos-badge oos-full">All ${days}d OOS</span>`;
  if (pct >= 0.5) return `<span class="oos-badge oos-high">${days}d OOS</span>`;
  return `<span class="oos-badge oos-low">${days}d OOS</span>`;
}

function lostSalesClass(val) {
  if (val === 0) return 'lost-zero';
  if (val < 500000) return 'lost-low';
  return 'lost-high';
}

function renderKpis(data, period) {
  const totalSkus = data.length;
  const currentlyOos = data.filter(d => {
    const dates = Object.keys(d.daily).sort();
    const latest = dates[dates.length - 1];
    return latest && d.daily[latest].oos;
  }).length;
  const hadOos = data.filter(d => d.days_oos > 0).length;
  const totalLost = data.reduce((s, d) => s + d.est_lost_sales, 0);
  const totalOosDays = data.reduce((s, d) => s + d.days_oos, 0);

  return `
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-icon blue">📦</div>
        <div class="kpi-label">Key SKUs Tracked</div>
        <div class="kpi-value" style="color:var(--accent)">${totalSkus}</div>
        <div class="kpi-sub">${getMonthLabel(period)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon red">🚫</div>
        <div class="kpi-label">Currently OOS</div>
        <div class="kpi-value" style="color:var(--red)">${currentlyOos}</div>
        <div class="kpi-sub">as of last snapshot</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon amber">⚠️</div>
        <div class="kpi-label">Had Stockout</div>
        <div class="kpi-value" style="color:var(--amber)">${hadOos}</div>
        <div class="kpi-sub">${totalOosDays} total OOS days</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon orange">💸</div>
        <div class="kpi-label">Est. Lost Sales</div>
        <div class="kpi-value" style="color:var(--orange)">${fmt(totalLost)}</div>
        <div class="kpi-sub">based on avg daily sales</div>
      </div>
    </div>`;
}

function applyFilter(data, filter, search) {
  let d = data;
  if (filter === 'oos') d = d.filter(x => x.days_oos > 0);
  else if (filter === 'current') d = d.filter(x => {
    const dates = Object.keys(x.daily).sort();
    const latest = dates[dates.length - 1];
    return latest && x.daily[latest].oos;
  });
  else if (filter === 'ok') d = d.filter(x => x.days_oos === 0);
  if (filterClass) d = d.filter(x => x.item_class === filterClass);
  if (search) {
    const q = search.toLowerCase();
    d = d.filter(x => x.description.toLowerCase().includes(q) || x.item_class.toLowerCase().includes(q) || x.inventory_id.includes(q));
  }
  return sortData(d);
}

function sortData(data) {
  return [...data].sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (typeof av === 'string') av = av.toLowerCase(), bv = bv.toLowerCase();
    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
}

function setSort(col) {
  if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortCol = col; sortDir = col === 'description' || col === 'item_class' ? 'asc' : 'desc'; }
  renderDashboard();
}

function setClassFilter(cls) {
  filterClass = cls;
  classDropdownOpen = false;
  renderDashboard();
}

function toggleClassDropdown(e) {
  e.stopPropagation();
  classDropdownOpen = !classDropdownOpen;
  renderDashboard();
}

document.addEventListener('click', () => {
  if (classDropdownOpen) { classDropdownOpen = false; renderDashboard(); }
});

function sortIcon(col) {
  if (sortCol !== col) return '<span style="opacity:0.25;margin-left:3px">⇅</span>';
  return sortDir === 'asc' ? '<span style="margin-left:3px;color:var(--accent)">↑</span>' : '<span style="margin-left:3px;color:var(--accent)">↓</span>';
}

function renderTable(data) {
  if (!data.length) return '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">No items match filter.</div>';

  // Build unique class list from full dataset for dropdown
  const allClasses = [...new Set(allSkuData.map(d => d.item_class))].filter(Boolean).sort();
  const classDropdown = `
    <div style="position:relative;display:inline-block">
      <span onclick="toggleClassDropdown(event)" style="cursor:pointer;display:flex;align-items:center;gap:3px;user-select:none">
        Item Class${filterClass ? ` <span style="color:var(--accent)">(${filterClass})</span>` : ''}
        <span style="opacity:${filterClass?'1':'0.4'};color:${filterClass?'var(--accent)':'inherit'}">▾</span>
      </span>
      ${classDropdownOpen ? `
        <div onclick="event.stopPropagation()" style="position:absolute;top:calc(100% + 4px);left:0;background:var(--white);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:100;min-width:160px;padding:4px 0;max-height:220px;overflow-y:auto;">
          <div onclick="setClassFilter('')" style="padding:6px 12px;font-size:12px;cursor:pointer;font-weight:${filterClass===''?'700':'400'};color:${filterClass===''?'var(--accent)':'var(--text)'};background:${filterClass===''?'#eff6ff':'transparent'}" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='${filterClass===''?'#eff6ff':'transparent'}'">All Classes</div>
          ${allClasses.map(c => `<div onclick="setClassFilter('${c}')" style="padding:6px 12px;font-size:12px;cursor:pointer;font-weight:${filterClass===c?'700':'400'};color:${filterClass===c?'var(--accent)':'var(--text)'};background:${filterClass===c?'#eff6ff':'transparent'}" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='${filterClass===c?'#eff6ff':'transparent'}'">
            ${c}
          </div>`).join('')}
        </div>` : ''}
    </div>`;

  const rows = data.map(d => {
    const pctIn = d.days_tracked > 0 ? (d.days_in / d.days_tracked) * 100 : 100;
    const barColor = pctIn >= 80 ? 'var(--green)' : pctIn >= 50 ? 'var(--amber)' : 'var(--red)';
    const selected = selectedSku === d.inventory_id ? ' selected' : '';
    return `
      <tr class="sku-row${selected}" data-id="${d.inventory_id}" onclick="selectSku('${d.inventory_id}')">
        <td>
          <div class="sku-name">${d.description}</div>
          <div class="sku-class" style="font-size:10px;color:var(--muted);margin-top:1px">${d.inventory_id}</div>
        </td>
        <td><span style="font-size:11px;font-weight:600;color:var(--text)">${d.item_class || '—'}</span></td>
        <td>${oosBadge(d.days_oos, d.days_tracked)}</td>
        <td>
          <div class="ratio-wrap">
            <div class="ratio-bar"><div class="ratio-fill" style="width:${pctIn.toFixed(0)}%;background:${barColor}"></div></div>
            <div class="ratio-label" style="color:${barColor}">${pctIn.toFixed(0)}%</div>
          </div>
        </td>
        <td class="right" style="font-size:11px;color:var(--muted)">${d.avg_on_hand > 0 ? d.avg_on_hand.toLocaleString() : '—'}</td>
        <td class="right ${lostSalesClass(d.est_lost_sales)}">${d.est_lost_sales > 0 ? fmt(d.est_lost_sales) : '—'}</td>
      </tr>`;
  }).join('');

  return `
    <div class="table-wrap">
      <table class="sku-table">
        <thead>
          <tr>
            <th onclick="setSort('description')" style="cursor:pointer;white-space:nowrap">Item ${sortIcon('description')}</th>
            <th style="cursor:pointer;white-space:nowrap">${classDropdown}</th>
            <th onclick="setSort('days_oos')" style="cursor:pointer;white-space:nowrap">OOS Status ${sortIcon('days_oos')}</th>
            <th onclick="setSort('days_in')" style="cursor:pointer;white-space:nowrap">In-Stock Rate ${sortIcon('days_in')}</th>
            <th class="right" onclick="setSort('avg_on_hand')" style="cursor:pointer;white-space:nowrap">Avg On-Hand ${sortIcon('avg_on_hand')}</th>
            <th class="right" onclick="setSort('est_lost_sales')" style="cursor:pointer;white-space:nowrap">Est. Lost Sales ${sortIcon('est_lost_sales')}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderTimeline(sku) {
  if (!sku) {
    return `<div class="timeline-empty">👆 Click any item above to see its daily stock timeline</div>`;
  }

  const dates = Object.keys(sku.daily).sort();
  if (!dates.length) return `<div class="timeline-empty">No snapshot data available for this item.</div>`;

  // Group by month
  const byMonth = {};
  for (const d of dates) {
    const month = d.slice(0, 7);
    if (!byMonth[month]) byMonth[month] = [];
    byMonth[month].push(d);
  }

  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  let html = '';
  for (const [month, mDates] of Object.entries(byMonth)) {
    const [y, m] = month.split('-').map(Number);
    html += `<div class="timeline-month-label">${months[m-1]} ${y}</div>`;
    html += `<div class="timeline-grid">`;
    for (const date of mDates) {
      const { oos, on_hand } = sku.daily[date];
      const day = new Date(date + 'T12:00:00').getDate();
      const tipText = oos ? `${date}: OUT OF STOCK` : `${date}: On-hand ${on_hand.toLocaleString()}`;
      html += `
        <div class="timeline-day ${oos ? 'timeline-day-out' : 'timeline-day-in'}">
          <span class="timeline-day-num">${day}</span>
          <span class="timeline-day-icon">${oos ? '🔴' : '🟢'}</span>
          <div class="timeline-tooltip">${tipText}</div>
        </div>`;
    }
    html += `</div>`;
  }

  const pctOos = sku.days_tracked > 0 ? ((sku.days_oos / sku.days_tracked) * 100).toFixed(0) : 0;

  return `
    <div class="timeline-header">
      <div class="timeline-sku-name">${sku.description}</div>
      <div class="timeline-sku-meta">
        ${sku.item_class} · ${sku.inventory_id} &nbsp;·&nbsp;
        <span style="color:var(--red);font-weight:600">${sku.days_oos} days OOS</span> of ${sku.days_tracked} tracked
        &nbsp;·&nbsp; ${pctOos}% out of stock rate
        ${sku.est_lost_sales > 0 ? `&nbsp;·&nbsp; Est. lost sales: <strong style="color:var(--orange)">${fmtFull(sku.est_lost_sales)}</strong>` : ''}
      </div>
    </div>
    <div class="timeline-body">
      ${html}
      <div class="timeline-legend">
        <div class="legend-dot" style="background:var(--green-light);border:1px solid #86efac"></div> In Stock
        <div class="legend-dot" style="background:var(--red-light);border:1px solid #fca5a5"></div> Out of Stock
        <span style="font-size:10px;margin-left:4px">· Hover each day for details</span>
      </div>
    </div>`;
}

function renderDashboard() {
  const search = document.getElementById('search-input') ? document.getElementById('search-input').value : '';
  filteredData = applyFilter(allSkuData, currentFilter, search);

  // Update KPIs (always from full data)
  document.getElementById('kpi-section').innerHTML = renderKpis(allSkuData, currentPeriod);

  // Update table
  document.getElementById('table-body').innerHTML = renderTable(filteredData);
  document.getElementById('table-count').textContent = `${filteredData.length} items`;

  // Update timeline
  const skuObj = selectedSku ? allSkuData.find(d => d.inventory_id === selectedSku) : null;
  document.getElementById('timeline-body').innerHTML = renderTimeline(skuObj);
}

function selectSku(id) {
  selectedSku = selectedSku === id ? null : id;
  renderDashboard();
  if (selectedSku) {
    document.getElementById('timeline-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
  renderDashboard();
}

async function onPeriodChange(period) {
  currentPeriod = period;
  selectedSku = null;
  document.getElementById('content').innerHTML = '<div class="loading">Loading stock data...</div>';
  try {
    allSkuData = await loadSkuData(period);
    renderMain();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="err">Error: ${e.message}</div>`;
  }
}

function renderMain() {
  document.getElementById('content').innerHTML = `
    <div id="kpi-section"></div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">🔍 Key Item Stockout Detail</span>
        <span class="panel-meta" id="table-count"></span>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All Items</button>
        <button class="filter-btn" data-filter="oos" onclick="setFilter('oos')">Had Stockout</button>
        <button class="filter-btn" data-filter="current" onclick="setFilter('current')">Currently OOS</button>
        <button class="filter-btn" data-filter="ok" onclick="setFilter('ok')">Always In Stock</button>
        <input class="search-input" id="search-input" type="text" placeholder="Search item..." oninput="renderDashboard()">
      </div>
      <div id="table-body"></div>
    </div>

    <div class="panel timeline-panel" id="timeline-panel">
      <div class="panel-head">
        <span class="panel-title">📅 Daily Stock Timeline</span>
        <span class="panel-meta">Select a row above</span>
      </div>
      <div id="timeline-body"></div>
    </div>
  `;

  renderDashboard();
  document.getElementById('footer').textContent = 'Data as of ' + new Date().toLocaleString() + ' · Snapshots taken nightly at 9:30pm Jamaica time';
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    availablePeriods = await loadPeriods();
    if (!availablePeriods.length) throw new Error('No snapshot data found.');

    const cp = getCurrentPeriod();
    const periods = availablePeriods.includes(cp) ? availablePeriods : [cp, ...availablePeriods];
    const sel = document.getElementById('period-select');
    sel.innerHTML = periods.map(p =>
      `<option value="${p}">${getMonthShort(p)}${p === cp ? ' (Current)' : ''}</option>`
    ).join('');

    currentPeriod = availablePeriods[0]; // most recent
    sel.value = currentPeriod;

    allSkuData = await loadSkuData(currentPeriod);
    renderMain();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="err">Error loading dashboard: ${e.message}</div>`;
    console.error(e);
  }
}

init();
</script>
</body>
</html>
