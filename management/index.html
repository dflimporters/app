<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Management — DFL Staff Portal</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#0f2044">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0;
    --navy:#0f2044; --navy2:#1a3260;
    --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8;
    --accent:#2563eb; --accent-bg:#eff6ff;
    --red:#dc2626; --red-bg:#fef2f2;
    --shadow:0 1px 3px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:0 4px 6px -1px rgba(0,0,0,0.07),0 2px 4px -1px rgba(0,0,0,0.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

    /* ── NAV ──
     Rendered and styled by /shared/side-nav.js. */

  /* LOGIN */
  .login-wrap {
    display:flex; align-items:center; justify-content:center;
    /* Was calc(100vh - 56px) for the old sticky top bar. The rail is a fixed
       left column and consumes no vertical space. Below 768px side-nav.js adds
       52px of body padding-top for its top bar — see the media query below. */
    min-height:100vh;
  }
  .login-box {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:36px 32px;
    width:100%; max-width:360px;
    box-shadow:var(--shadow-md);
  }
  .login-icon { font-size:32px; text-align:center; margin-bottom:16px; }
  .login-title { font-size:18px; font-weight:700; text-align:center; margin-bottom:4px; }
  .login-sub { font-size:13px; color:var(--text-muted); text-align:center; margin-bottom:24px; }
  .login-error {
    background:var(--red-bg); color:var(--red);
    font-size:12px; padding:8px 12px; border-radius:6px;
    margin-bottom:14px; display:none;
  }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:12px; font-weight:500; margin-bottom:6px; color:var(--text-muted); }
  .field input {
    width:100%; padding:10px 12px; border:1px solid var(--border);
    border-radius:7px; font-size:14px; font-family:'Inter',sans-serif;
    outline:none; transition:border 0.15s;
  }
  .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
  .btn-primary {
    width:100%; padding:11px; background:var(--accent); color:#fff;
    border:none; border-radius:7px; font-size:14px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.15s;
  }
  .btn-primary:hover { background:#1d4ed8; }

  /* MAIN PANEL */
  /* Same reasoning as .login-wrap above — the 56px top bar is gone. */
  .main-panel { display:none; flex-direction:column; height:100vh; }

  /* TABS BAR */
  .tabs-bar {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:0 32px; display:flex; gap:0; flex-shrink:0;
  }
  .tab-btn {
    padding:14px 20px; font-size:13px; font-weight:500;
    color:var(--text-muted); border:none; background:none;
    cursor:pointer; border-bottom:2px solid transparent;
    margin-bottom:-1px; transition:all 0.15s;
    font-family:'Inter',sans-serif; white-space:nowrap;
  }
  .tab-btn:hover { color:var(--text); }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

  /* IFRAME PANELS */
  .panels { flex:1; overflow:hidden; }
  .panel { display:none; width:100%; height:100%; }
  .panel.active { display:block; }
  .panel iframe { width:100%; height:100%; border:none; display:block; }

  /* side-nav.js reserves 52px at the top for its mobile bar, so the full-height
     panels have to give that back or the page gains a scrollbar. */
  @media (max-width: 767px) {
    .login-wrap { min-height: calc(100vh - 52px); }
    .main-panel { height: calc(100vh - 52px); }
  }
  @media (max-width: 640px) {
    .tabs-bar { padding: 0 16px; overflow-x: auto; }
    .page-header { padding: 18px 16px 22px; }
  }
</style>
</head>
<body>

<!-- NAV
     Comes from /shared/side-nav.js, loaded at the bottom of this file. The bar
     that used to be here linked to /dispatch-portal.html, /dashboards.html,
     /forms.html and /assets.html — all four are still in _staging/ and 404.
     They're now disabled "Soon" items in side-nav.js, defined once.
     Its "Home" link also pointed at /index.html, which is the rep app, not the
     hub; the rail's logo now routes by role instead. -->

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-icon">📊</div>
    <div class="login-title">Management Area</div>
    <div class="login-sub">Enter the password to access management tools</div>
    <div class="login-error" id="loginError">Incorrect password. Please try again.</div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pwInput" placeholder="Enter password"
             onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn-primary" onclick="doLogin()">Enter</button>
  </div>
</div>

<!-- MAIN PANEL -->
<div class="main-panel" id="mainPanel">

  <div class="tabs-bar">
    <button class="tab-btn active" onclick="showPanel('panel-4', this)">Merchandiser Performance Dashboard</button>
    <button class="tab-btn" onclick="showPanel('panel-5', this)">Merchandiser Incentive Dashboard</button>
    <button class="tab-btn" onclick="showPanel('panel-1', this)">Category Intelligence</button>
    <button class="tab-btn" onclick="showPanel('panel-2', this)">Key Account Dashboard</button>
    <button class="tab-btn" onclick="showPanel('panel-3', this)">Rep Performance Dashboard</button>
    <button class="tab-btn" onclick="showPanel('panel-6', this)">Stock Outage Tracker</button>
    <button class="tab-btn" onclick="showPanel('panel-7', this)">📤 Report Upload</button>
    <button class="tab-btn" onclick="showPanel('panel-8', this)">📋 Report Viewer</button>
    <!-- ADD MORE TABS HERE -->
  </div>

  <div class="panels" id="panels">

    <div class="panel active" id="panel-4">
      <iframe src="/management/merch-dashboard.html" title="Merchandiser Performance Dashboard"></iframe>
    </div>

    <div class="panel" id="panel-5">
      <iframe src="/management/merch-incentive.html" title="Merchandiser Incentive Dashboard"></iframe>
    </div>

    <div class="panel" id="panel-1">
      <iframe src="/management/category-intel.html" title="Category Intelligence"></iframe>
    </div>

    <div class="panel" id="panel-2">
      <iframe src="/management/key-account-management.html" title="Key Account Dashboard"></iframe>
    </div>

    <div class="panel" id="panel-3">
      <iframe src="/management/rep-performance.html" title="Rep Performance Dashboard"></iframe>
    </div>

    <div class="panel" id="panel-6">
      <iframe src="/management/stock-outage-tracker.html" title="Stock Outage Tracker"></iframe>
    </div>


    <div class="panel" id="panel-7">
      <iframe src="/management/report-upload.html" title="Report Upload"></iframe>
    </div>

    <div class="panel" id="panel-8">
      <iframe src="/management/report-viewer.html" title="Report Viewer"></iframe>
    </div>

    <!-- ADD MORE PANELS HERE — copy the block above -->

  </div>

</div>

<script>
  // This page has no Supabase auth guard — it uses the separate MGMT_PASSWORD
  // gate below, so there's no DFL_PROFILE for the rail to read. Tell it which
  // links to draw. This grants nothing: /hub.html, /admin/ etc. each run their
  // own guard and will bounce anyone who isn't really a manager or admin.
  window.DFL_NAV_FALLBACK_ROLE = 'manager';
  window.DFL_PAGE_TITLE = 'Management';
</script>
<script src="/shared/side-nav.js"></script>
<script>
  const MGMT_PASSWORD = 'admin';

  function doLogin() {
    const pw = document.getElementById('pwInput').value;
    if (pw === MGMT_PASSWORD) {
      document.getElementById('loginWrap').style.display = 'none';
      const panel = document.getElementById('mainPanel');
      panel.style.display = 'flex';
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function showPanel(id, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }
</script>

</body>
</html>
