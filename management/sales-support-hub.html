.flat th,.flat td{padding-left:14px;padding-right:14px}
.flat th:first-child,.flat td:first-child{padding-left:24px}
.flat th:last-child,.flat td:last-child{padding-right:24px}
.flat td .who span{overflow:hidden;text-overflow:ellipsis}
/* bars shrink to their column; nothing draws outside its own cell */
.flat td{overflow:hidden}
.dbar,.pace{min-width:0}
.dbar .trk{width:auto;flex:1 1 120px;min-width:36px;max-width:120px}
.pace .pbar,.pace .pbar.wide{width:auto;flex:1 1 140px;min-width:36px;max-width:140px}
.dbar span,.pace span{flex:none;min-width:0}
.flat td .linkish{font-weight:700;color:var(--ink);font-size:13.5px}
.flat td .linkish:hover,.flat td .linkish:focus{color:var(--ink);text-decoration:none}
.gl>li.cpli{display:block;padding:0}
.cprow{display:grid;grid-template-columns:var(--gc);gap:12px;align-items:center;width:100%;min-height:46px;padding:8px 6px;margin:0 -6px;width:calc(100% + 12px);border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:8px}
.cprow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cprow:hover{background:var(--hover,#F3F5FA)}

.cpli.open .cprow .chev{transform:rotate(180deg)}
.gl>li.cpli.open{margin:6px -6px 12px;border:1px solid #CFD9EC;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(26,46,90,.07)}
.cpli.open .cprow,.cpli.open .cprow:hover{margin:0;width:100%;padding:8px 5px;border-radius:0;background:#E4EBF7;border-bottom:1px solid #CFD9EC}
.cpli.open .cprow .nm{font-weight:700}
.cpli.open .cprow .chev{color:var(--ink)}
.cpx{background:#fff;padding:2px 12px 12px}
.gprod>li{min-height:36px;padding:6px 0}
.gprod .nm{font-size:12.5px;font-weight:600}
.gprod .pill{font-size:9.5px;padding:1px 6px;margin-left:4px}
.gprod>li.more{display:block;border-bottom:0;padding:8px 0 4px}
.gprod>li.sub>span:first-child{color:var(--ink3);font-size:12px}
.gprod>li.tot{border-top:1px solid var(--line);border-bottom:0}
.gprod>li.tot>span:first-child{font-family:var(--head);font-weight:700;font-size:12px;color:var(--ink)}
.dt .tpct{font-size:.62em;font-weight:700;opacity:.85;margin-left:4px;color:#fff}
.flat tr.clickrow{cursor:pointer}
.flat tr.clickrow:hover td{background:#F2F6FD}
.flat .who{gap:8px}
.flat .av{width:26px;height:26px;font-size:10px}
.flat .solid{padding:5px 0;min-width:96px;font-size:11.5px}
.pace{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.pace .pbar{margin:0}
.pace .pbar.wide{width:auto;flex:1 1 140px;min-width:36px;max-width:140px}
.flat td .linkish{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.pace span{font-family:var(--head);font-weight:700;color:var(--ink2)}
.pace span{min-width:64px;text-align:right}
.brow{cursor:pointer;min-height:56px}
.brow:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
/* open row: the header line stays white, the detail opens as one blue band underneath */
.brow.open,.brow.open:hover{background:#fff;border-bottom-color:#C9D9F5}
.brow.open .c-store{color:var(--ink)}
.brow.open .chev{color:var(--blue)}
.brow.open>.bexp{margin:0 -14px;padding:14px 26px 16px;background:#EAF1FD;border-top:1px solid #DCE6F7;gap:12px}
.brow.open .bfacts{background:transparent;border:0;box-shadow:none;padding:0;border-radius:0}
.brow.open .bfacts>div{color:var(--ink);font-size:13.5px}
.brow.open .bexp .rl li{border-bottom-color:#D5E1F5}
.brow.open .bexp .alegend{margin-top:-2px}
.brow.open .nlog li{background:#fff;border-left-color:var(--blue);border-radius:0 6px 6px 0;padding:6px 10px}
.c-store{font-weight:700;font-size:13.5px;color:var(--ink)}
.c-issue{font-size:13.5px;color:var(--ink2)}
.brow>.stcell{height:28px;padding:0;margin:0 6px;font-size:11.5px;border-radius:6px;align-self:center}
.ncount{display:inline-flex;align-items:center;gap:3px;color:var(--blue);font-size:11.5px;font-weight:700}
.ncount svg{width:15px;height:15px}
.chev{display:grid;place-items:center;width:26px;height:26px;color:var(--ink3);transition:transform .15s}
.chev svg{width:16px;height:16px}
.brow.open .chev{transform:rotate(180deg)}
.bexp{cursor:default}
.bfacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;padding:10px 12px;background:var(--card);border:1px solid var(--line2);border-radius:8px}
.bfacts>div>span:first-child{display:block;font-family:var(--head);font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-bottom:2px}

/* sub-tabs, chain dropdown, short leads with an info tip, generic boards */
.ftiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.ftiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg{display:inline-flex;gap:4px;background:#E6EAF2;border-radius:10px;padding:4px;margin:2px 0 14px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:7px;font-family:var(--head);font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.seg button span{font-size:11px;color:var(--ink3);font-weight:700}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(13,27,62,.12)}
.seg button[aria-selected="true"] span{color:var(--blue)}
.seg button:focus-visible{outline:2px solid var(--blue)}
.lead1{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px;margin:0 0 10px}
.info{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink3);color:var(--ink3);font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.info:hover,.info[aria-expanded="true"]{border-color:var(--blue);color:var(--blue)}
.info:focus-visible{outline:2px solid var(--blue)}
.infobox{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:10px 14px;font-size:13px;color:var(--ink2);margin:-2px 0 12px;max-width:80ch}
.chainsel{display:flex;align-items:center;gap:8px;font-family:var(--head);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3)}
.chainsel select{font:inherit;font-family:var(--body);font-size:13.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 30px 8px 12px;box-shadow:var(--shadow);cursor:pointer}
.chainsel select:focus-visible{outline:2px solid var(--blue)}
.topbar .grow{flex:1;min-width:0}
.acu{color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap}
.acu:hover{text-decoration:underline}
.acu .ext{font-size:.8em;margin-left:2px;opacity:.75}
.acubtn{text-decoration:none;display:inline-flex;align-items:center}
.ft .tbar{display:block;position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.28);margin:0 0 8px}
.ft .tbar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:#fff}
.ft .tbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#0D1B3E;border-radius:1px}
.ft .x b{color:#fff}
.addchip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;border:1.5px dashed #B8C2D6;color:var(--ink2);border-radius:999px;padding:3px 12px;font-family:var(--head);font-size:11.5px;font-weight:700}
.addchip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-t)}
.addchip:focus-visible{outline:2px solid var(--blue)}
.howto{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.hcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.hcard .hq{font-family:var(--head);font-weight:700;font-size:14px;color:var(--ink)}
.hcard p{margin:0;font-size:13px;color:var(--ink2);flex:1}
.hcard .btn{align-self:flex-start}
.gen .brow>.rsn,.gen .bhead>.rsn{padding-left:32px}
.flat th.ctr,.flat td.ctr{text-align:center}
.flat td.ctr .pace,.flat td.ctr .dbar{justify-content:center}
.flat th.ctr button.sort{justify-content:center}
.dbar{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.dbar .trk{position:relative;height:8px;border-radius:4px;background:var(--line2);flex:1 1 120px;min-width:36px;max-width:120px}
.dbar .trk i{position:absolute;top:0;bottom:0;border-radius:4px}
.dbar .trk i.pos{left:50%;background:#00C875}
.dbar .trk i.neg{right:50%;background:#E2445C}
.dbar .trk b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink3);border-radius:1px}
.dbar span{min-width:46px;text-align:right;font-family:var(--head);font-weight:700}
.cname{font-weight:700;color:var(--ink);font-size:13.5px}
.ctag{display:inline-block;border:1.5px solid var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 8%,#fff);border-radius:6px;padding:3px 10px;font-family:var(--head);font-weight:700;font-size:11.5px;letter-spacing:.3px;min-width:110px;text-align:center}
.gen .bhead,.gen .brow{grid-template-columns:var(--cols)}
.gen .brow{min-height:52px}
.agebar.mini{height:8px;margin:0;border-radius:4px}
.reason.one{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.bfacts.one-col{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.ftiles{grid-template-columns:repeat(3,minmax(0,1fr))}.ftiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flat .hide-sm{display:none}.flat .solid{min-width:0;width:100%;max-width:110px;overflow:hidden;text-overflow:ellipsis}.flat th:first-child{width:34%}}
@media (max-width:860px){

  .brand,.side-foot{display:none}

  .nav .ct{position:absolute;top:2px;right:calc(50% - 20px);margin:0}
  .mtop{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;font-family:var(--head);font-size:14px;max-width:none}
  .mtop img{height:22px}

  .ft .ic{width:30px;height:30px}
  .ft .x{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:10.5px;line-height:1.35;margin-top:6px;padding-top:6px}
  /* week: one compact line per day, words in full */
  .week{padding:14px 14px 12px}
  .days{grid-template-columns:minmax(0,1fr);gap:6px}
  .day{display:flex;align-items:center;gap:10px;padding:9px 12px}
  .day .dw{width:44px;flex:none}
  .day .dn2{width:58px;flex:none;font-size:14px}
  .day .ev{margin:0;flex-direction:row;flex-wrap:wrap;gap:3px 12px;min-width:0}
  .topbar .grow{flex:1 1 100%}
  #tctl{flex:1 1 0;min-width:0}
  .topbar:has(#tctl:empty) .grow{flex:1 1 0}
  #tctl:empty{display:none}
  .gh{flex-wrap:wrap;row-gap:2px}
  .gh h3{white-space:nowrap}
  .gh .gn{flex:1 1 100%;order:3}
  .chainsel{width:100%}.chainsel select{flex:1;min-width:0;width:100%}
  .week h3 span{display:none}
  .bhead{display:none}
  .brow{grid-template-columns:minmax(0,1fr) 92px;grid-template-areas:"s st" "i st";padding:6px 10px}
  .brow>div,.brow>button{padding:2px 4px}
  .c-store{grid-area:s}.c-issue{grid-area:i;font-size:12.5px}.c-who{display:none}.stcell{grid-area:st}.c-age{display:none}.c-act{display:none}
  .bfacts{grid-template-columns:minmax(0,1fr)}
  .brow.open>.bexp{margin:0 -10px;padding:12px 14px 14px}
  .gen .brow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:none}
  .gen .brow>*{grid-area:auto !important}
  .gen .brow>.bexp{grid-column:1/-1 !important}
  .gen .hm,.gen .bhead{display:none}
  .gen .c2{justify-self:end;max-width:46vw}
  /* board rows on phones: name on line 1, the fact on line 2, status button on the right */
  .gen .brow{grid-template-columns:minmax(0,1fr) 92px !important;column-gap:12px;row-gap:2px;padding:10px 14px}
  .gen .brow>.c1{grid-column:1 !important;grid-row:1 !important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gen .brow>.c2{grid-column:1 !important;grid-row:2 !important;justify-self:start;max-width:100%;font-size:12.5px}
  .gen .brow>.stcell{grid-column:2 !important;grid-row:1 / span 2 !important;align-self:center;width:auto;height:32px;margin:0}
  .gen .brow>:not(.c1):not(.c2):not(.stcell):not(.bexp):not(.hm){grid-column:2 !important;grid-row:1 / span 2 !important;justify-self:end;align-self:center}
  .gen .brow>.bexp{grid-row:3 !important}
  .gen .brow>.stcell.c2{grid-column:2 !important;grid-row:1 / span 2 !important;justify-self:stretch;max-width:none;font-size:12px}
  .gen .brow>.m2{display:block !important;grid-column:1 !important;grid-row:2 !important;justify-self:start;text-align:left !important;font-size:12.5px;color:var(--ink3)}

  .topbar{flex-wrap:wrap}
  .ftiles.four,.ftiles.three{grid-template-columns:repeat(2,minmax(0,1fr))}

/* sort picker + card rows: phones only */
.msort,table.flat td.brk,.mlab{display:none}

  .msort{display:flex;align-items:center;gap:8px;margin:0 0 8px}

  .msort select{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:13px;color:var(--ink)}
  .msort .btn{min-width:40px;justify-content:center}
  .tbl.scroll{max-height:72vh}
  table.flat thead{display:none}
  table.flat,table.flat>tbody{display:block;width:100%}
  table.flat>tbody>tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:11px 14px;border-bottom:1px solid var(--line2)}
  table.flat>tbody>tr:last-child{border-bottom:0}
  table.flat>tbody>tr>td,table.flat>tbody>tr>td.hide-sm{display:inline-flex;align-items:center;gap:5px;order:2;padding:0 !important;border:0;width:auto !important;max-width:100%;min-width:0;height:auto;font-size:12px;color:var(--ink2);text-align:left;white-space:nowrap}
  table.flat>tbody>tr>td.n::before{content:attr(data-l);font-family:var(--head);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3)}

  table.flat>tbody>tr:has(> td.n:not(.mk):not(:first-child) ~ td.n:not(.mk):not(:first-child))>td.n:not(.mk):not(:first-child) .note{color:var(--ink2)}
  table.flat>tbody>tr:has(> td.n:not(.mk):not(:first-child) ~ td.n:not(.mk):not(:first-child))>td.brk.brk2{order:2;display:block}
  table.flat>tbody>tr>td.brk.brk2{display:none}

  table.flat td .dbar span{min-width:0;text-align:left}
  table.flat>tbody>tr>td:first-child{order:0;flex:1 1 0;font-size:14px;color:var(--ink);overflow:hidden}
  table.flat>tbody>tr>td:first-child>*{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.flat>tbody>tr>td.mk{order:1;margin-left:auto;font-size:13.5px;color:var(--ink)}
  table.flat>tbody>tr>td.mk::before{display:none}
  table.flat>tbody>tr>td.brk{display:block;order:1;flex:0 0 100%;height:0;overflow:hidden}
  table.flat>tbody>tr>td.nolab,table.flat>tbody>tr>td:has(> .nil){display:none}

/* scrolling tables with a sticky header */
.tbl.scroll{max-height:460px;overflow:auto}
.tbl.scroll th{position:sticky;top:0;z-index:1}
th button.sort{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button.sort:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
th button.sort .ar{color:var(--blue);font-size:11px}

.sec2 .hint{font-size:12px;color:var(--ink3);margin:0 0 6px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin-top:6px}

.ptabs button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9px;font-family:var(--head);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap;position:relative}
.ptabs button svg{width:17px;height:17px;flex:none}
.ptabs button:hover{color:var(--ink)}
.ptabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(13,27,62,.12)}
.ptabs button[aria-selected="true"] svg{color:var(--blue)}
.ptabs button:focus-visible{outline:2px solid var(--blue)}
.ptabs .ct{margin-left:2px;background:var(--red);color:#fff;font-size:10.5px;border-radius:9px;padding:0 6px;line-height:17px}
.asofline{font-size:11.5px;color:var(--ink3);margin:0 0 12px}
/* pop-ups sit above the portal's own top bar and menu (z-index up to 200) */
.scrim{z-index:300}.drawer{z-index:301}
@media (max-width:767px){
  .content.portal{padding-left:14px;padding-right:14px}
  .ptabs button{padding:8px 11px;font-size:12px;gap:6px}
  .ptabs button span:not(.ct){display:inline}
}

<body style="visibility:hidden">
<div class="content portal">
  <div class="topbar"><div class="grow"><h1 id="ptitle">Sales Support Hub</h1><div class="sub" id="psub"></div></div><div id="tctl"></div><button type="button" class="btn" id="hubRefresh">↻ Refresh</button></div>
  <nav id="tabs" class="ptabs" aria-label="Hub sections" role="tablist"></nav>
  <div id="asof" class="asofline"></div>
  <div id="strip" hidden></div>
  <main id="main"><div class="empty">Loading the latest orders, sales and AR…</div></main>
</div>
<div id="drawer"></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<script src="/shared/side-nav.js"></script>
<script>window.DFL_PAGE_TITLE = 'Sales Support Hub';</script>
<script>
window.__hubBoot = function (S, O, P, HUBD) {

'use strict';
// ---------- basics ----------
// 'today' = the day of the latest refresh (sales data may lag a few hours behind orders)
const ASOF = (() => { let b = S.asof; try { if (O.sync && O.sync.built) b = new Date(O.sync.built).toLocaleDateString('en-CA', {timeZone:'America/Jamaica'}); } catch (e) {} return b > S.asof ? b : S.asof; })();
const TODAY = new Date(ASOF + 'T12:00:00');
const MON = ASOF.slice(0,7);                 // current month YYYY-MM
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d8 = s => new Date(s + 'T12:00:00');
const daysBetween = (a, b) => Math.round((d8(b) - d8(a)) / 864e5);
const addDays = (s, n) => { const d = d8(s); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const fd = s => s ? d8(s).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) : '';
const fds = s => s ? d8(s).toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : '';
const J = n => { n = +n || 0; const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + 'J$' + (a/1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e3) return s + 'J$' + Math.round(a/1e3).toLocaleString('en-US') + 'K';
  return s + 'J$' + Math.round(a).toLocaleString('en-US'); };
const Jk = k => J((+k || 0) * 1000);
const JP = n => (n < 0 ? "−" : "") + "J$" + Math.round(Math.abs(+n || 0)).toLocaleString("en-US");
const pct = (a, b) => b ? Math.round((a - b) / Math.abs(b) * 100) : null;
const pctTxt = p => p == null ? '–' : (p > 0 ? '+' : '') + p + '%';
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; };
const short = id => String(id).replace(/^C0+/, '');
const keyOk = k => String(k).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 180);

// ---------- chains and stores ----------
// Key stores are mostly independents: owners with more than one store are grouped (AR, sister-store gaps); everyone else is their own account.
// "chain" stays the internal name for the account group so the shared code is unchanged.
const chainOf = n => { n = n.toUpperCase();
  if (n.startsWith('MASTER MAC')) return 'Master Mac';
  if (n.startsWith('BROOKLYN')) return 'Brooklyn';
  if (n.startsWith('LEES FOOD FAIR')) return "Lee's Food Fair";
  if (n.startsWith('LOSHUSAN')) return 'Loshusan';
  if (n.startsWith('GENERAL FOODS')) return 'General Foods';
  return nice(n); };
const nice = n => n.replace(/\.$/, '').toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bHilo\b/g, 'Hi-Lo').replace(/\bMegamart\b/g, 'MegaMart').replace(/\bUwi\b/g, 'UWI').replace(/\bMobay\b/g, 'MoBay').replace(/\bJr'S\b/g, "JR's").replace(/\bBlvd\b/g, 'Blvd').replace(/\bT\/A\b/g, 't/a').replace(/\bLtd\b/g, 'Ltd').replace(/\s+/g, ' ').trim();
const firstName = n => (n || '').split(/[ ,]/)[0];

// people who have left DFL: never shown as a store's rep or offered in the name lists, even while old invoices still carry their name
// (Ruth Ann Lewis, Scott 6 Nov 2026; her 5 stores show no rep until the salesperson is changed in Acumatica)
const LEFT = new Set(['Ruth Ann Lewis', 'Tashelle Wilson']);
// Sales Support Hub: one support person's reps (Scott's table, 9 Nov 2026). S.support / S.reps come with the data.
const SUPPORT = S.support || 'Alecia', REPS = (S.reps || []).slice().sort();
const current = n => n && !LEFT.has(String(n).trim()) ? n : '';
const STORES = S.stores.map(r => ({id:r[0], raw:r[1], name:nice(r[1]), chain:chainOf(r[1]), area:r[2], parent:r[3], terms:r[4], phone:r[5], merch:String(r[6] || '').split(',').map(x => x.trim()).filter(current).join(', '), sday:r[7] || '', rep:current((S.rep || {})[r[0]])}))
  .sort((a, b) => a.chain.localeCompare(b.chain) || a.name.localeCompare(b.name));
const byId = {}; STORES.forEach(s => byId[s.id] = s);
const CHAINS = [...new Set(STORES.map(s => s.chain))];
// head-office / billing accounts: kept for AR, left out of store lists (Progressive Grocers = Progressive/Shoppers Fair head office, Scott 5 Nov)
const HQ_IDS = new Set(['C000003799']);
const isHQ = s => HQ_IDS.has(s.id) || /HEAD OFFICE|WAREHOUSE/.test(s.raw);

// monthly sales (J$000) and budget
STORES.forEach(s => {
  s.mon = {}; (S.mon[s.id] || []).forEach(([m, r]) => s.mon[m] = r);
  s.bud = {}; ((S.bud || {})[s.id] || []).forEach(([m, b]) => s.bud[m] = b);
  s.days = ((S.days || {})[s.id] || []).filter(d => d <= ASOF);
});
const monAdd = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + String(m).padStart(2, '0'); };
const lyOf = ym => monAdd(ym, -12);

// working-day pace for the current month (Mon-Fri)
const workdays = (y, m, upto) => { let n = 0; const last = new Date(y, m, 0).getDate(); for (let d = 1; d <= (upto || last); d++) { const w = new Date(y, m - 1, d).getDay(); if (w && w < 6) n++; } return n; };
const [CY, CM] = MON.split('-').map(Number);
const WD_ALL = workdays(CY, CM), WD_DONE = Math.max(1, workdays(CY, CM, TODAY.getDate()));
// calendar quarter: Q_ALL = its three months, Q_DONE = the ones already finished
const QN = Math.floor((CM - 1) / 3) + 1, Q_ALL = [0, 1, 2].map(i => CY + '-' + String((QN - 1) * 3 + 1 + i).padStart(2, '0')), Q_DONE = Q_ALL.filter(k => k < MON);
const PACE = WD_DONE / WD_ALL;

// ---------- orders, lines, shipments ----------
const ORD = (O.orders || []).filter(o => o[1] === 'SO').map(o => ({nbr:o[0], status:o[2], date:o[3], sched:o[4], c:o[5], total:+o[6] || 0, qty:+o[7] || 0, by:o[8] || '', via:o[9] || ''}));
const ordBy = {}; ORD.forEach(o => ordBy[o.nbr] = o);
// warehouse 71 is where orders ship from; ASH (Ashenheim) stock has to be transferred first (Alecia, 9 Nov)
const LINES = (O.lines || []).filter(l => ordBy[l[0]]).map(l => ({nbr:l[0], sku:l[1], desc:l[2], oq:+l[3] || 0, open:+l[4] || 0, onhand:+l[5] || 0, price:+l[6] || 0, cls:l[7], status:l[8], cost:+l[9] || 0, oh71:l[10] == null ? null : +l[10], ash:+l[11] || 0}));
// returns: RC orders, last 60 days, with the Acumatica return reason (Althia, 9 Nov: cut returns)
const RC = (O.orders || []).filter(o => o[1] === 'RC').map(o => ({nbr:o[0], status:o[2], date:o[3], c:o[5], total:Math.abs(+o[6] || 0), by:o[8] || '', reason:o[11] || 'No reason given'}));
const rcLines = {}; (O.lines || []).forEach(l => { if (RC.some(r => r.nbr === l[0])) (rcLines[l[0]] = rcLines[l[0]] || []).push({sku:l[1], desc:l[2], q:Math.abs(+l[3] || 0), price:+l[6] || 0}); });
const INACT = O.inact || {};
LINES.forEach(l => { (ordBy[l.nbr].lines = ordBy[l.nbr].lines || []).push(l); });
const SHIPS = (O.ships || []).map(s => ({nbr:s[0], c:s[1], order:s[2], status:s[3], date:s[4], value:+s[5] || 0, via:s[6] || '', created:s[7]}));
const shipsOfOrder = {}; SHIPS.forEach(s => (shipsOfOrder[s.order] = shipsOfOrder[s.order] || []).push(s));
const DEALS = O.deals || {};
const SHIPPED = s => /Confirmed|Completed|Invoiced/.test(s);
// trucker (Acumatica ship via): the shipment's is the reliable one; the order's is often blank. BATCHnn is a placeholder, not a trucker.
const realVia = v => v && !/^BATCH\d+$/i.test(v) ? v : '';
const truckOf = o => { const sh = (shipsOfOrder[o.nbr] || []).map(s => ({...s, via:(typeof LOADS !== 'undefined' && LOADS[s.nbr] && LOADS[s.nbr].via) || s.via})).filter(s => realVia(s.via)).sort((a, b) => (b.date || '').localeCompare(a.date || '')); return sh.length ? realVia(sh[0].via) : realVia(o.via); };
const truckCell = v => v ? `<span class="truck" title="Ship via ${esc(v)}">${icon('orders', 2)}<span>${esc(v)}</span></span>` : '<span class="note nil" style="margin:0">–</span>';

// stage of an open order, in plain words
// order stages in plain words (Scott, 6 Nov: "keyed" and "on truck" confused the KAMs). Uses the warehouse load system:
// which load a shipment is on, its date and truck, and whether picking and checking are done (O.loads).
const LOADS = {}; (O.loads || []).forEach(r => LOADS[r[0]] = {load:r[1], date:r[2], via:r[3] || '', picked:!!r[4], checked:!!r[5], closed:r[6] || ''});
const DONE_SHIP = s => /Completed|Invoiced/.test(s);
const liveShipOf = o => { const sh = (shipsOfOrder[o.nbr] || []).filter(x => !DONE_SHIP(x.status)).map(x => ({...x, ld:LOADS[x.nbr] || null}));
  return sh.find(x => x.status === 'Confirmed') || sh.find(x => x.ld) || sh[0] || null; };
const stageOf = o => {
  if (o.status === 'Credit Hold') return {k:'credit', t:'Credit hold (AR)', s:'Credit hold', c:'red', why:'Held by AR for the account balance. It will not be picked until AR releases it.'};
  if (o.status === 'On Hold') return {k:'hold', t:'On hold in Acumatica', s:'On hold', c:'amber', why:'Keyed in but put on hold in Acumatica (not a credit hold). Ask sales support why.'};
  if (o.status === 'Open') return {k:'open', t:'Order entered, not on a load yet', s:'Entered', c:'blue', why:'In Acumatica, waiting to go on a load for picking.'};
  if (o.status === 'Shipping') { const sh = liveShipOf(o);
    if (!sh) return {k:'ship', t:'Shipment being created', s:'Preparing', c:'blue', why:'Acumatica is creating the shipment.'};
    const ld = sh.ld, lt = ld ? `Load ${ld.load} for ${fd(ld.date)}${ld.via ? ', truck ' + ld.via : ''}` : `Shipment ${sh.nbr}${realVia(sh.via) ? ', truck ' + realVia(sh.via) : ''}`;
    if (sh.status === 'Confirmed') return {k:'left', t:'Left the warehouse', s:'Left', c:'green', why:lt + '. Acumatica shows the shipment confirmed.'};
    if (ld && ld.checked) return {k:'truck', t:'Picked and checked, ready to go', s:'Ready to go', c:'green', why:lt + '. Picked and checked at the warehouse.'};
    if (ld && ld.picked) return {k:'truck', t:'Picked, waiting to be checked', s:'Picked', c:'amber', why:lt + '. Picking is done.'};
    if (ld) return {k:'truck', t:'On a load, being picked', s:'On load', c:'amber', why:lt + '. Not marked picked yet.'};
    return {k:'truck', t:'Shipment made, not on a load yet', s:'Shipment', c:'amber', why:lt + ' (' + sh.status + ').'}; }
  if (o.status === 'Back Order') return {k:'bo', t:'Part delivered, rest owed', s:'Part owed', c:'amber', why:'Some lines delivered; the rest are waiting for stock.'};
  return {k:'other', t:o.status, s:o.status, c:'grey', why:''}; };
ORD.forEach(o => { o.stage = stageOf(o); o.age = daysBetween(o.date, ASOF); });
// what is actually stuck (Scott, 6 Nov): for an order on a truck, the unconfirmed shipment(s); otherwise the lines still open.
// Goods value without GCT; the order total (with GCT, including lines already shipped) is only shown for reference.
ORD.forEach(o => { const sh = (shipsOfOrder[o.nbr] || []).filter(x => !SHIPPED(x.status)), openV = (o.lines || []).reduce((a, l) => a + l.open * l.price, 0);
  o.stuck = o.stage.k === 'truck' && sh.length ? sh.reduce((a, x) => a + x.value, 0) : openV || o.total; });
const openOf = c => ORD.filter(o => o.c === c && o.status !== 'Back Order');
// ---------- deliveries: shipment → load → driver app stop (Sales Support, 9 Nov: "customer hasn't got it" calls) ----------
// "Shipped" only from Acumatica shipment status (Confirmed / Completed / Invoiced); the driver app adds the stop result.
const STOPS = {}; (O.stops || []).forEach(r => { STOPS[r[0]] = {status:String(r[1] || ''), arrived:r[2], done:r[3], recv:r[4] || '', fail:r[5] || '', failNote:r[6] || '', inv:r[7] || ''}; });
const LMX = {}; (O.loads || []).forEach(r => LMX[r[0]] = {lm:r[7] || '', driver:r[8] || '', phone:r[9] || ''});
const dState = (sh, st) => {
  if (st) { const s = st.status.toLowerCase();
    if (/deliver|complete/.test(s) && !/not/.test(s)) return {k:'del', t:'Delivered', c:'green', when:st.done || st.arrived};
    if (/partial/.test(s)) return {k:'part', t:'Part delivered', c:'amber', when:st.done};
    if (/fail|not_|return|refus|skip/.test(s)) return {k:'fail', t:'Not delivered', c:'red', when:st.done || st.arrived};
    if (/arriv|on_the_way|en_route|transit/.test(s)) return {k:'road', t:'On the way', c:'blue', when:st.arrived}; }
  if (SHIPPED(sh.status)) return {k:'left', t:'Left the warehouse', c:'blue', when:null};
  return {k:'not', t:'Not shipped', c:'amber', when:null}; };
const SLINES = {}; (O.slines || []).forEach(r => (SLINES[r[0]] = SLINES[r[0]] || []).push({nbr:r[0], sku:r[1], desc:r[2], exp:+r[3] || 0, got:+r[4] || 0, res:r[5] || '', why:r[6] || r[5] || 'No reason given', note:r[7] || ''}));
const dlvTag = why => /not ordered/i.test(why) ? 'Not ordered' : /short pick|not on the truck/i.test(why) ? 'Short-picked' : /damag/i.test(why) ? 'Damaged' : /refus/i.test(why) ? 'Refused' : /no one|closed/i.test(why) ? 'No one to receive' : why.length > 20 ? why.slice(0, 18) + '…' : why;
const DELIV = SHIPS.map(sh => { const st = STOPS[sh.nbr] || null, lx = LMX[sh.nbr] || {}, ld = LOADS[sh.nbr] || null;
  return {...sh, stop:st, load:ld, driver:lx.driver, phone:lx.phone, via:realVia((ld && ld.via) || sh.via), st:dState(sh, st), wait:daysBetween(sh.created || sh.date, ASOF), short:SLINES[sh.nbr] || []}; })
  .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

// deal levels repeat (Scott, 11 Nov: "buy 100 get 3 free" counts for every 100 bought). Free goods for a quantity:
// the biggest level as many times as it fits, then the next level down on what is left, and so on (500 at buy 100 get 3 = 15).
const tiersOf = sku => { const d = DEALS[sku]; return d && Array.isArray(d[1]) ? d[1].map(t => ({buy:+t.buy, free:+t.free})).filter(t => t.buy && t.free).sort((a, b) => a.buy - b.buy) : []; };
const freeFor = (tiers, q) => { let left = Math.max(0, q), f = 0; [...tiers].reverse().forEach(t => { const n = Math.floor(left / t.buy); f += n * t.free; left -= n * t.buy; }); return f; };
const dealTxt = tiers => tiers.map(t => `buy ${t.buy}, get ${t.free} free`).join(' or ');
// specials: is the order a few cases short of earning more free goods?
const tierHint = l => {
  const tiers = tiersOf(l.sku); if (!tiers.length || l.oq < 3) return null;
  const now = freeFor(tiers, l.oq), lim = Math.max(3, Math.ceil(tiers[0].buy * 0.3));
  for (let add = 1; add <= lim; add++) { const f = freeFor(tiers, l.oq + add); if (f > now) return {add, buy:l.oq + add, free:f - now, cur:now, total:f, deal:dealTxt(tiers)}; }
  return null; };

// order checks on orders that can still change (Open / On Hold)
const CHECKS = [];
ORD.filter(o => o.status === 'Open' || o.status === 'On Hold').forEach(o => (o.lines || []).forEach(l => {
  const h = tierHint(l);
  if (h) CHECKS.push({kind:'deal', o, l, h, key:'deal:' + o.nbr + ':' + l.sku, value:h.add * l.price});
  // stock: short at 71 but Ashenheim has it → transfer; short everywhere → will ship short
  const at71 = l.oh71 == null ? l.onhand : l.oh71, need = l.open - Math.max(0, at71);
  if (l.open > 0 && need > 0 && l.ash >= need) CHECKS.push({kind:'xfer', o, l, need, key:'xfer:' + o.nbr + ':' + l.sku, value:need * l.price});
  else if (l.open > 0 && Math.max(0, at71) + l.ash < l.open) { l.onhand = Math.max(0, at71) + l.ash; CHECKS.push({kind:'stock', o, l, key:'stock:' + o.nbr + ':' + l.sku, value:(l.open - l.onhand) * l.price}); }
  // price checks for sales support (Scott, 11 Nov): below cost, below the deal price, no price. List price above the sheet is fine
  // (small orders don't reach a deal). Low margin above cost is for the KAM / category manager. J$0 lines on a deal item are free goods.
  const sheet = DEALS[l.sku] ? +DEALS[l.sku][0] : 0, hasTier = !!(DEALS[l.sku] && Array.isArray(DEALS[l.sku][1]) && DEALS[l.sku][1].some(t => +t.buy && +t.free));
  // the lowest price the deal allows (Scott, 11 Nov): with free items on the order, the sheet price; without them, the deal may be given as a
  // prorated price instead of free goods: sheet × buy ÷ (buy + free) at the level the quantity reaches. Below that is flagged.
  const floorOf = () => { if (!sheet) return null;
    const same = (o.lines || []).filter(x => x.sku === l.sku), paid = same.filter(x => x.price > 0).reduce((a, x) => a + x.oq, 0), free = same.filter(x => x.price <= 0).reduce((a, x) => a + x.oq, 0);
    const tiers = hasTier ? DEALS[l.sku][1].map(t => ({buy:+t.buy, free:+t.free})).filter(t => t.buy && t.free).sort((a, b) => a.buy - b.buy) : [];
    const t = [...tiers].reverse().find(t => t.buy <= paid);
    if (free > 0 || !t) return {p:sheet, why:free > 0 ? 'free items are on the order, so the price should be the sheet price' : 'the quantity doesn’t reach a deal level'};
    return {p:sheet * t.buy / (t.buy + t.free), why:`buy ${t.buy} get ${t.free} free, taken as a price: ${JP(sheet)} × ${t.buy} ÷ ${t.buy + t.free}`, t}; };
  const fl = l.price > 0 && sheet && l.price < sheet * 0.98 ? floorOf() : null;
  if (l.price > 0 && l.cost > 0 && l.price < l.cost) CHECKS.push({kind:'gp', o, l, gp:Math.round((l.price - l.cost) / l.price * 100), key:'gp:' + o.nbr + ':' + l.sku, value:l.price * l.oq + 3.5e6});
  else if (fl && l.price < fl.p * 0.98) CHECKS.push({kind:'price', o, l, sheet, floor:fl.p, floorWhy:fl.why, key:'price:' + o.nbr + ':' + l.sku, value:(fl.p - l.price) * l.oq + 3e6});
  if (l.price <= 0 && l.oq > 0 && !hasTier) CHECKS.push({kind:'noprice', o, l, key:'noprice:' + o.nbr + ':' + l.sku, value:3.2e6});
  // items we no longer carry (Althia: chain POs keep listing discontinued lines)
  if (INACT[l.sku]) CHECKS.push({kind:'inact', o, l, st:INACT[l.sku], key:'inact:' + o.nbr + ':' + l.sku, value:l.price * l.oq + 1e6});
}));
const CHKTXT = {deal:'Short of a deal', free:'Free goods missing', freeover:'Too many free', stock:'Not enough stock', xfer:'Needs a transfer', price:'Below the deal price', noprice:'No price', gp:'Below cost', inact:'Item not active'};
const PRICEK = ['gp', 'price', 'noprice', 'freeover', 'inact'];
// negative profit = sold below cost (Scott, 9 Nov: "-36%" read as 36%)
const gpTxt = g => g < 0 ? `Below cost (${Math.abs(g)}% loss)` : `${g}% profit`;
const chkProblem = x => x.kind === 'deal' ? `Add ${x.h.add} for ${x.h.free} free` : x.kind === 'free' ? `${x.f.free - x.f.have} free missing` : x.kind === 'xfer' ? `${x.need} from ASH` : x.kind === 'price' ? `${JP(x.l.price)} vs deal ${JP(x.floor)}` : x.kind === 'gp' ? gpTxt(x.gp) : x.kind === 'noprice' ? 'J$0, no deal' : x.kind === 'freeover' ? `${x.f.have} free, deal gives ${x.f.free}` : x.kind === 'inact' ? `${x.st} item` : `${Math.max(0, x.l.onhand)} of ${x.l.open} in stock`;

const RGRPC = {'Order entry':['#E2445C', 'Did not order, not on their system, already received: caught at order entry'], 'Customer':['#E8862A', 'Refused, overstocked, closed, rep asked for it'], 'Warehouse and stock':['#7B4FD0', 'Out of stock, wrong item, damaged, not found'], 'Delivery':['#127F8C', 'Trucker did not deliver, overload, trucker charged'], 'Other':['#8A95B0', 'No reason given']};

    x.ls.push(l); x.open += l.open; x.val += l.open * l.price; });
  return Object.values(m).map(x => { const st = INACT[x.sku] ? 'gone' : x.at71 >= x.open ? null : x.at71 + x.ash >= x.open ? 'xfer' : x.at71 + x.ash <= 0 ? 'out' : 'short';
    return st ? {...x, st, custs:new Set(x.ls.map(l => ordBy[l.nbr].c)), reps:new Set(x.ls.map(l => (byId[ordBy[l.nbr].c] || {}).rep).filter(Boolean)), r:reasonOf(x.sku)} : null; })

  const cur = ms.map(m => list.reduce((a, s) => a + (s.mon[m] || 0), 0) * 1000), ly = ms.map(m => list.reduce((a, s) => a + (s.mon[lyOf(m)] || 0), 0) * 1000);
  const W = 720, H = 210, L = 46, B = 26, T = 10, mx = Math.max(1, ...cur, ...ly);
  const step = Math.pow(10, Math.floor(Math.log10(mx))), nice = Math.ceil(mx / step) * step, ticks = [0, nice / 2, nice];
  const gw = (W - L - 8) / ms.length, bw = Math.min(18, gw * 0.32), y = v => H - B - Math.max(0, v) / nice * (H - B - T);
  return `<section class="chart"><h3>Monthly sales <span><i style="background:#326BD3"></i>${CY}</span><span><i style="background:#C9D3E6"></i>${CY - 1}</span><span class="note" style="margin:0">${MON === ms[ms.length - 1] ? fds(ASOF) + ' is month to date' : ''}</span></h3>

  ${ms.map((m, i) => { const cx = L + gw * i + gw / 2; return `<rect x="${cx - bw - 1}" y="${y(ly[i])}" width="${bw}" height="${H - B - y(ly[i])}" rx="3" fill="#C9D3E6"><title>${d8(m + '-01').toLocaleDateString('en-GB', {month:'short'})} ${CY - 1}: ${J(ly[i])}</title></rect><rect x="${cx + 1}" y="${y(cur[i])}" width="${bw}" height="${H - B - y(cur[i])}" rx="3" fill="#326BD3"><title>${d8(m + '-01').toLocaleDateString('en-GB', {month:'short'})} ${CY}: ${J(cur[i])}</title></rect><text x="${cx}" y="${H - 8}" font-size="10.5" text-anchor="middle" fill="#4A5578" font-family="Open Sans, sans-serif">${d8(m + '-01').toLocaleDateString('en-GB', {month:'short'})}</text>`; }).join('')}

}

<script>
