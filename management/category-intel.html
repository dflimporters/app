<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Category Intelligence — DFL Importers</title>
<style>
:root{
  --blue:#326BD3;--navy:#0D1B3E;--navy2:#152444;--bg:#F5F7FA;--surface:#FFFFFF;--surface-alt:#F9FAFC;
  --border:#E4E9F2;--border-soft:#EEF1F8;--text:#1A2340;--text-mid:#4A5578;--text-soft:#8A95B0;
  --red:#D63B3B;--red-bg:#FEF2F2;--red-bdr:#FECACA;
  --amber:#C47A1A;--amber-bg:#FFFBEB;--amber-bdr:#FDE68A;
  --green:#1A8F4C;--green-bg:#F0FDF4;--green-bdr:#A7F3D0;
  --rejene:#6D28D9;--rejene-bg:#F5F0FF;
  --trebor:#0E7490;--trebor-bg:#E8F7FB;
  --travis:#B45309;--travis-bg:#FEF3C7;
  --richard:#C0392B;--richard-bg:#FEF2F2;
  --radius:10px;--sh:0 1px 4px rgba(26,35,64,.08);--sh-md:0 4px 16px rgba(26,35,64,.12);
  --f:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--f);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}

/* HEADER */
.header{position:sticky;top:0;z-index:200;}
.topbar{background:var(--navy);height:70px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.tb-l{display:flex;align-items:center;gap:16px;}
.tb-logo{width:40px;height:40px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px;flex-shrink:0;}
.tb-div{width:1px;height:28px;background:rgba(255,255,255,.2);}
.tb-titles{display:flex;flex-direction:column;}
.tb-h1{font-weight:800;font-size:20px;color:#fff;letter-spacing:-.02em;}
.tb-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px;}
.tb-r{display:flex;align-items:center;gap:10px;}
.period-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;}
.cache-lbl{font-size:11px;color:rgba(255,255,255,.38);}
.refresh-btn{background:var(--blue);color:#fff;border:none;padding:7px 18px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .2s;}
.refresh-btn:hover{opacity:.82;}
.header-strip{background:#1C3B6E;border-top:1px solid rgba(255,255,255,.15);padding:10px 28px;display:flex;align-items:flex-start;gap:0;}
.hs-stat{display:flex;flex-direction:column;padding:0 24px;border-right:1px solid rgba(255,255,255,.12);align-items:flex-start;justify-content:flex-start;}
.hs-stats-grid{display:contents;}
.hs-val{font-size:18px;font-weight:800;color:#fff;line-height:1.1;}
.hs-stat:first-child{padding-left:0;}
.hs-stat:last-child{border-right:none;}
.hs-val.hv-r{color:#F87171;}.hs-val.hv-a{color:#FCD34D;}.hs-val.hv-g{color:#6EE7B7;}
.hs-lbl{font-size:10px;color:rgba(255,255,255,.45);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}
.hs-date{font-size:12px;color:rgba(255,255,255,.55);margin-left:auto;font-style:italic;}

/* PAGE */
.page{max-width:1380px;margin:0 auto;padding:24px 28px 52px;}
.controls{display:flex;align-items:center;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.ctrl-lbl{font-size:11px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.07em;}
select.ctrl{background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:7px;font-size:13px;font-family:var(--f);color:var(--text);cursor:pointer;outline:none;box-shadow:var(--sh);}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
.fetch-ts{font-size:11px;color:var(--text-soft);margin-left:auto;}

/* SCORECARDS */
.sc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0;overflow:hidden;box-shadow:var(--sh);position:relative;transition:box-shadow .2s;display:flex;flex-direction:column;}
.sc-hdr{height:92px;padding:14px 18px 12px;display:flex;flex-direction:column;justify-content:flex-start;border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;flex-shrink:0;overflow:hidden;}
.sc-body{padding:16px 18px 16px;flex:1;position:relative;}
.sc:hover{box-shadow:var(--sh-md);}
.sc-grid{align-items:stretch;}
.sc-bar{height:3px;position:absolute;top:0;left:0;right:0;}
.sc-mgr{font-weight:800;font-size:16px;margin-bottom:3px;}
.sc-cats{font-size:11px;color:var(--text-soft);margin-bottom:14px;line-height:1.65;}
.sc-nums{display:flex;gap:18px;}
.sc-n{text-align:center;}
.sc-nv{font-weight:800;font-size:26px;line-height:1;}
.sc-nl{font-size:10px;color:var(--text-soft);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.nv-r{color:var(--red);}.nv-a{color:var(--amber);}.nv-g{color:var(--green);}
.snap-btn{position:absolute;top:-78px;right:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;}
.snap-btn:hover{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.5);}

/* SECTION */
.sec-hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.sec-title{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;}
.cnt-badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
.sec-sub{font-size:12px;color:var(--text-soft);}

/* CATEGORY CARDS */
.cat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}
.cat-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh);}
.cat-card.sr{border-left-color:var(--red);}.cat-card.sa{border-left-color:var(--amber);}.cat-card.sg{border-left-color:var(--green);}
.cat-row{display:grid;grid-template-columns:160px 110px 1fr auto 22px;align-items:center;gap:16px;padding:14px 18px;cursor:pointer;}
.cat-row:hover{background:var(--surface-alt);}
.cat-nm{font-weight:700;font-size:15px;color:var(--text);}
.cat-mgr-line{display:flex;align-items:center;gap:6px;margin-top:4px;}
.mgr-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:5px;white-space:nowrap;}
.mt-rejene{background:var(--rejene-bg);color:var(--rejene);}.mt-trebor{background:var(--trebor-bg);color:var(--trebor);}.mt-travis{background:var(--travis-bg);color:var(--travis);}
.mt-richard{background:var(--richard-bg);color:var(--richard);}
.cat-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:5px 12px;border-radius:20px;white-space:nowrap;}
.cb-g{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bdr);}
.cb-a{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bdr);}
.cb-r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bdr);}
.cat-meter{display:flex;flex-direction:column;gap:5px;}
.m-track{position:relative;background:var(--border-soft);border-radius:4px;height:8px;overflow:visible;}
.m-fill{height:8px;border-radius:4px;transition:width .5s ease;}
.mf-r{background:var(--red);}.mf-a{background:#F59E0B;}.mf-g{background:var(--green);}.mf-b{background:#F59E0B;}
.m-tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(13,27,62,.3);border-radius:1px;}
.m-row1{display:flex;justify-content:space-between;align-items:center;}
.m-pct{font-size:13px;font-weight:700;}
.mp-r{color:var(--red);}.mp-a{color:var(--amber);}.mp-g{color:var(--green);}.mp-b{color:#C47A1A;}.mp-a{color:var(--amber);}
.m-elapsed{font-size:11px;color:var(--text-soft);}
.m-pts{font-size:11px;font-weight:600;}
.m-pts.ahead{color:var(--green);}.m-pts.behind{color:var(--red);}
.cat-stats{display:flex;gap:0;align-items:stretch;}
.stat-block{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 18px;border-left:1px solid var(--border);}
.stat-block:first-child{padding-left:6px;border-left:none;}
.stat-val{font-weight:800;font-size:18px;color:var(--text);line-height:1.1;white-space:nowrap;}
.stat-val.sv-g{color:var(--green);}.stat-val.sv-r{color:var(--red);}.stat-val.sv-b{color:var(--blue);}.stat-val.sv-a{color:var(--amber);}
.stat-lbl{font-size:10px;color:var(--text-soft);margin-top:3px;white-space:nowrap;}
/* Expandable stat blocks smaller */
.dp .stat-val{font-weight:600;font-size:15px;}
.dp .stat-block{padding:0 14px;}
.gp-chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;}
.gp-good{background:var(--green-bg);color:var(--green);}.gp-mid{background:var(--amber-bg);color:var(--amber);}.gp-low{background:var(--red-bg);color:var(--red);}
.chev{color:var(--text-soft);font-size:14px;font-weight:700;transition:transform .22s;}
.cat-card.open .chev{transform:rotate(90deg);}

/* DETAIL */
.cat-detail{display:none;border-top:1px solid var(--border);}
.cat-card.open .cat-detail{display:block;}
.dtab-bar{display:flex;padding:0 18px;border-bottom:1px solid var(--border);background:var(--surface);}
.dtab{padding:9px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-soft);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;display:flex;align-items:center;gap:6px;}
.dtab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-cnt{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;}
.tc-r{background:var(--red-bg);color:var(--red);}.tc-a{background:var(--amber-bg);color:var(--amber);}.tc-g{background:var(--green-bg);color:var(--green);}
.dp{display:none;padding:12px 16px 16px;background:#EEF4FF;border-top:1px solid #DBEAFE;}
.dp.active{display:block;}

/* REP ROWS */
.rep-rows{display:flex;flex-direction:column;gap:6px;}
.rep-row{display:grid;grid-template-columns:180px 100px 1fr auto;align-items:center;gap:14px;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px;transition:box-shadow .15s;}
.rep-row:hover{box-shadow:var(--sh-md);}
.rr-r{border-left-color:var(--red);}.rr-a{border-left-color:#F59E0B;}.rr-b{border-left-color:#F59E0B;}.rr-g{border-left-color:var(--green);}
.rr-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rr-area{font-size:11px;color:var(--text-soft);margin-top:1px;}
.rr-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.rr-badge.on-track{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bdr);}
.rr-badge.watch{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bdr);}
.rr-badge.follow-up{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bdr);}
.rr-meter{display:flex;flex-direction:column;gap:4px;}
.rr-track{position:relative;background:var(--border-soft);border-radius:4px;height:7px;overflow:visible;}
.rr-fill{height:7px;border-radius:4px;transition:width .5s;}
.rf-r{background:var(--red);}.rf-a{background:#F59E0B;}.rf-b{background:#F59E0B;}.rf-a{background:var(--amber);}.rf-g{background:var(--green);}
.rr-tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(13,27,62,.3);border-radius:1px;}
.rr-meta{display:flex;justify-content:space-between;}
.rr-pct{font-size:11.5px;font-weight:700;}
.c-r{color:var(--red);}.c-a{color:var(--amber);}.c-b{color:var(--amber);}.c-g{color:var(--green);}
.rr-pts{font-size:11px;font-weight:600;}
.ahead{color:var(--green);}.behind{color:var(--red);}
.pen-row{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:4px;}
.pen-track{width:50px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.pen-fill{height:4px;border-radius:2px;}
.pen-label{font-size:10px;font-weight:700;color:var(--text-soft);}

/* CUSTOMER ROWS */
.cust-rows{display:flex;flex-direction:column;gap:6px;}
.cust-row{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px;overflow:hidden;}
.cr-r{border-left-color:var(--red);}.cr-a{border-left-color:var(--amber);}.cr-g{border-left-color:var(--green);}
.cr-main{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:11px 14px;cursor:pointer;}
.cr-main:hover{background:var(--surface-alt);}
.cr-name{font-weight:600;font-size:12.5px;white-space:normal;line-height:1.3;}
.cr-rep{font-size:11px;color:var(--text-soft);margin-top:1px;}
.cr-tier{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#F0F4FF;color:var(--blue);margin-top:2px;}
.cr-date{font-size:10px;margin-top:2px;}
.cr-date.recent{color:var(--green);}.cr-date.mid{color:var(--amber);}.cr-date.old{color:var(--red);}
.cr-expand{display:none;padding:10px 16px 14px;border-top:1px solid #DBEAFE;background:#EEF4FF;}
.cust-row.open .cr-expand{display:block;}
.cr-chev{color:var(--text-soft);font-size:12px;font-weight:700;transition:transform .2s;}
.cust-row.open .cr-chev{transform:rotate(90deg);}
/* Missing SKU table inside customer expand */
.msku-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);margin-bottom:8px;}
.msku-table{width:100%;border-collapse:collapse;font-size:12px;}
.msku-table th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);padding:4px 8px;border-bottom:1px solid var(--border);}
.msku-table td{padding:6px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
.msku-table tr:last-child td{border-bottom:none;}
.msku-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block;margin-right:6px;flex-shrink:0;}
.msku-last{font-size:10px;color:var(--text-soft);}

/* SKU ROWS */
.sku-rows{display:flex;flex-direction:column;gap:8px;}
.sku-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px;overflow:hidden;}
.sk-r{border-left-color:var(--red);}.sk-a{border-left-color:var(--amber);}.sk-g{border-left-color:var(--green);}
.sku-main-row{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:14px;padding:11px 14px;cursor:pointer;}
.sku-main-row:hover{background:var(--surface-alt);}
.sku-name{font-weight:600;font-size:12.5px;line-height:1.35;}
.sku-chev{color:var(--text-soft);font-size:12px;font-weight:700;transition:transform .2s;}
.sku-card.open .sku-chev{transform:rotate(90deg);}
.sku-expand{display:none;border-top:1px solid #DBEAFE;background:#EEF4FF;padding:12px 16px;}
.sku-card.open .sku-expand{display:block;}
/* SKU expand tabs */
.sku-etab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:12px;}
.sku-etab{padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-soft);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.sku-etab.active{color:var(--blue);border-bottom-color:var(--blue);}
.sku-epane{display:none;}.sku-epane.active{display:block;}
/* SKU expand tables */
.exp-table{width:100%;border-collapse:collapse;font-size:12px;}
.exp-table th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);padding:4px 8px;border-bottom:1px solid var(--border);}
.exp-table td{padding:6px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
.exp-table tr:last-child td{border-bottom:none;}
.exp-table tr:hover td{background:rgba(50,107,211,.04);}
.cum-bar{height:4px;background:var(--blue);border-radius:2px;min-width:2px;}
.area-bar{height:6px;border-radius:3px;}
.area-bar.ab-g{background:var(--green);}.area-bar.ab-a{background:var(--amber);}.area-bar.ab-r{background:var(--red);}

/* CROSS ALERTS */
.cross-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:14px;margin-bottom:40px;}
.cc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--sh);overflow:hidden;transition:box-shadow .2s;}
.cc:hover{box-shadow:var(--sh-md);}
.cc-accent{height:3px;width:100%;}
.cc-body{padding:16px 18px;}
.cc-identity{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cc-rep{font-weight:800;font-size:15px;color:var(--text);}
.cc-area{font-size:11px;color:var(--text-soft);margin-top:2px;}
.cc-gap-stat{text-align:right;}
.cc-gap-val{font-weight:800;font-size:17px;color:var(--red);}
.cc-gap-lbl{font-size:10px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;}
.cc-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.cc-cat-chip{display:flex;flex-direction:column;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:7px 12px;min-width:90px;}
.cc-cat-chip.chip-r{border-top:2px solid var(--red);}.cc-cat-chip.chip-a{border-top:2px solid var(--amber);}.cc-cat-chip.chip-g{border-top:2px solid var(--green);}
.cc-chip-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);}
.cc-chip-pct{font-size:15px;font-weight:800;line-height:1.2;margin-top:1px;}
.cc-chip-pct.cp-r{color:var(--red);}.cc-chip-pct.cp-a{color:var(--amber);}.cc-chip-pct.cp-g{color:var(--green);}
.cc-chip-gap{font-size:10px;color:var(--text-soft);margin-top:1px;}
.cc-divider{height:1px;background:var(--border);margin-bottom:12px;}
.cc-action{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.cc-action-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px;}
.cc-action-icon.joint{background:#EEF4FF;color:var(--blue);}.cc-action-icon.single{background:var(--green-bg);color:var(--green);}
.cc-action-text{font-size:12.5px;color:var(--text-mid);line-height:1.55;}
.cc-action-text strong{color:var(--text);}
.cc-skus{background:#FFFBEB;border-radius:8px;padding:10px 12px;}
.cc-skus-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);margin-bottom:7px;}
.cc-sku-item{display:flex;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px solid rgba(196,122,26,.12);}
.cc-sku-item:last-child{border-bottom:none;}
.cc-sku-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-soft);min-width:72px;flex-shrink:0;}
.cc-sku-name{font-size:12px;color:var(--text-mid);}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);backdrop-filter:blur(3px);z-index:300;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:14px;width:680px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(13,27,62,.22);overflow:hidden;}
.m-head{background:var(--navy);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;}
.m-title{font-weight:800;font-size:16px;color:#fff;}
.m-close{background:none;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;}
.m-body{padding:22px;overflow-y:auto;flex:1;}
.m-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.s-banner{border-radius:8px;padding:14px 18px;margin-bottom:18px;color:#fff;}
.s-banner h2{font-weight:800;font-size:15px;margin-bottom:3px;}
.s-banner p{font-size:11.5px;opacity:.7;}
.s-sec-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-soft);padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.s-cat-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-soft);}
.s-cat-row:last-child{border-bottom:none;}
.s-cat-nm{flex:1;font-weight:600;font-size:13px;}
.s-rep-blk{background:var(--surface-alt);border-radius:7px;padding:10px 13px;margin-bottom:7px;}
.s-rep-nm{font-weight:700;font-size:13px;margin-bottom:3px;}
.s-rep-dt{font-size:12px;color:var(--text-mid);line-height:1.6;}
.s-actions{background:#EEF4FF;border-radius:7px;padding:12px 14px;font-size:12.5px;line-height:1.9;color:var(--text-mid);}
.s-actions strong{color:var(--text);}
.btn{padding:8px 18px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;}
.btn-sec{background:var(--bg);border:1px solid var(--border);color:var(--text);}
.btn-sec:hover{background:var(--border);}
.btn-pri{background:var(--navy);color:#fff;}
.btn-pri:hover{opacity:.85;}
.empty-row{text-align:center;padding:20px;color:var(--text-soft);font-size:13px;}

/* LOADER */
.ldr{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .75s linear infinite;margin-bottom:14px;}
@keyframes sp{to{transform:rotate(360deg);}}
.ldr p{font-size:13px;color:var(--text-soft);font-weight:600;}

/* ── MOBILE RESPONSIVE ─────────────────────────────────────────────────────── */
@media (max-width: 768px) {

  /* TOPBAR — single clean row: logo | title | refresh */
  .topbar{
    height:auto;
    padding:10px 14px;
    flex-direction:row;
    align-items:center;
    gap:10px;
    flex-wrap:nowrap;
  }
  .tb-l{flex:1;min-width:0;gap:8px;}
  .tb-div{display:none;}
  .tb-logo-img{height:30px !important;flex-shrink:0;}
  .tb-titles{min-width:0;}
  .tb-titles .tb-h1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tb-titles .tb-sub{display:none;}
  .tb-r{flex-shrink:0;gap:6px;}
  .period-pill{display:none;} /* moved into strip */
  .refresh-btn{padding:6px 12px;font-size:11px;white-space:nowrap;}
  .cache-lbl{display:none;}

  /* HEADER STRIP — period pill banner + 2 rows of 3 stats */
  .header-strip{
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:0;
  }
  /* Period pill as full-width banner at top of strip */
  .header-strip::before{
    content:attr(data-period);
    display:block;
    padding:6px 14px;
    font-size:11px;
    font-weight:700;
    color:rgba(255,255,255,.8);
    background:rgba(0,0,0,.15);
    border-bottom:1px solid rgba(255,255,255,.1);
    letter-spacing:.03em;
  }
  .hs-stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    padding:10px 0 12px;
  }
  .hs-stat{
    padding:6px 12px;
    border-right:1px solid rgba(255,255,255,.12);
    border-bottom:none;
    flex:none;
  }
  .hs-stat:nth-child(3n){border-right:none;}
  .hs-stat:nth-child(n+4){border-top:1px solid rgba(255,255,255,.1);padding-top:10px;margin-top:2px;}
  .hs-stat:first-child{padding-left:14px;}
  .hs-stat:nth-child(4){padding-left:14px;}
  .hs-val{font-size:15px;font-weight:800;line-height:1.1;}
  .hs-lbl{font-size:9px;margin-top:3px;line-height:1.3;letter-spacing:.04em;}
  .hs-date{display:none;}
  #hsOverallPace{font-size:15px !important;}
  .hs-stat-pace{grid-column:1/-1;border-right:none !important;border-top:1px solid rgba(255,255,255,.1);padding-top:10px !important;}

  /* PAGE PADDING */
  .page{padding:16px 14px 40px;}

  /* CONTROLS */
  .controls{gap:6px;}
  select.ctrl{font-size:12px;padding:5px 8px;}
  .fetch-ts{font-size:10px;width:100%;margin-left:0;}

  /* SCORECARD GRID — single column */
  .sc-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  /* Manager card — give Target stat breathing room from its right divider */
  .sc div[style*="flex:1;text-align:center;border-right"]:first-of-type{padding-right:16px !important;}

  /* SECTION HEADER */
  .sec-hdr{flex-direction:column;gap:4px;align-items:flex-start;}

  /* CATEGORY CARDS — stack layout */
  .cat-row{
    grid-template-columns:1fr auto !important;
    grid-template-rows:auto auto auto;
    gap:10px;
    padding:12px 14px;
  }
  /* Name + badge on first row spanning full width */
  .cat-row > div:first-child{grid-column:1;grid-row:1;}
  .cat-row > div:nth-child(2){grid-column:2;grid-row:1;justify-self:end;}
  /* Meter spans full width on second row */
  .cat-meter{grid-column:1/-2;grid-row:2;}
  /* Stats scroll horizontally on third row */
  .cat-row .cat-stats{
    grid-column:1/-1;grid-row:3;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:10px;
    margin-bottom:2px;
  }
  .cat-row .stat-block{padding:0 12px;flex-shrink:0;}
  .cat-row .stat-val{font-size:14px !important;}
  /* Hide chevron — use tap anywhere */
  .chev{display:none;}

  /* REP ROWS — stack */
  .rep-row{
    grid-template-columns:1fr auto !important;
    grid-template-rows:auto auto auto;
    gap:8px;
    padding:10px 12px;
  }
  .rep-row > div:first-child{grid-column:1;grid-row:1;}
  .rep-row > div:nth-child(2){grid-column:2;grid-row:1;justify-self:end;}
  .rep-row .rr-meter{grid-column:1/-1;grid-row:2;}
  .rep-row .cat-stats{
    grid-column:1/-1;grid-row:3;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:10px;
    margin-bottom:2px;
  }
  .rep-row .stat-block{flex-shrink:0;padding:0 10px;}
  .rep-row .stat-val{font-size:13px !important;}

  /* CUSTOMER ROWS */
  .cr-main{grid-template-columns:1fr !important;gap:8px;padding:10px 12px;}
  .cr-main > div:last-child{justify-content:flex-start !important;}
  .cr-main .cat-stats{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
  .cr-main .stat-block{flex-shrink:0;padding:0 10px;}
  .cr-main .stat-val{font-size:13px !important;}
  .cr-name{font-size:13px;}

  /* SKU CARDS */
  .sku-main-row{
    grid-template-columns:1fr !important;
    grid-template-rows:auto auto;
    gap:8px;
    padding:10px 12px;
  }
  .sku-main-row > div:first-child{grid-column:1;grid-row:1;}
  .sku-main-row .cat-stats{
    grid-column:1/-1;grid-row:2;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:10px;
    margin-bottom:2px;
  }
  .sku-main-row .stat-block{flex-shrink:0;padding:0 10px;}
  .sku-main-row .stat-val{font-size:13px !important;}

  /* EXPANDABLE TABLES — horizontal scroll */
  .exp-table, .msku-table{font-size:11px;}
  .sku-expand, .cr-expand{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* TABS */
  .dtab{padding:8px 10px;font-size:11px;}
  .dtab-bar{overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;-ms-overflow-style:none;scrollbar-width:none;}
  .dtab-bar::-webkit-scrollbar{display:none;}

  /* MODAL */
  .modal{width:100% !important;max-width:100% !important;border-radius:14px 14px 0 0;position:fixed;bottom:0;left:0;right:0;max-height:90vh !important;}
  .overlay.open{align-items:flex-end;}

  /* MANAGER SECTION HEADINGS */
  .page > div[style*="margin-bottom:8px"]{margin-top:14px !important;}

  /* DP (expandable panel) padding */
  .dp{padding:10px 12px 14px;}
}

@media (max-width: 420px) {
  .hs-stat{flex:0 0 50%;}
  .hs-stat:nth-child(2){border-right:none;}
  .hs-stat:nth-child(3){border-right:1px solid rgba(255,255,255,.12);padding-left:0;}
  .sc-nv{font-size:22px;}
  .tb-h1{font-size:13px !important;}
}

async function get(tbl,params){
  const r=await fetch(`${SB}/rest/v1/${tbl}?${new URLSearchParams(params)}`,{headers:H});
  if(!r.ok) throw new Error(`${tbl} ${r.status}: ${await r.text()}`);
  return r.json();
}
async function getAll(tbl,params,ps=1000){
  let off=0,all=[];
  while(true){const rows=await get(tbl,{...params,limit:ps,offset:off});all=all.concat(rows);if(rows.length<ps)break;off+=ps;}
  return all;
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function catPenetration(cat){
  // Sum budgeted_custs and active_custs from rep cache for this category
  const rows=D.rep.filter(r=>r.item_class===cat);
  const budgeted=rows.reduce((s,r)=>s+parseInt(r.budgeted_custs||0),0);
  const active=rows.reduce((s,r)=>s+parseInt(r.active_custs||0),0);
  return{budgeted,active,pct:budgeted>0?Math.round(100*active/budgeted):null};
}
function fmt(n){const v=parseFloat(n)||0;if(Math.abs(v)>=1e6)return`$${(v/1e6).toFixed(1)}M`;if(Math.abs(v)>=1e3)return`$${(v/1e3).toFixed(0)}K`;return`$${v.toFixed(0)}`;}
function fmtN(n){const v=parseFloat(n)||0;return v.toLocaleString();}

function paceInfo(ps){
  if(ps==='follow-up') return{bc:'sr',badge:'cb-r',badgeTxt:'⚠ Follow Up',bar:'mf-r',pc:'mp-r',rr:'rr-r',rf:'rf-r',rb:'follow-up'};
  if(ps==='watch')     return{bc:'sa',badge:'cb-a',badgeTxt:'● Watch',    bar:'mf-a',pc:'mp-a',rr:'rr-a',rf:'rf-a',rb:'watch'};
  return                     {bc:'sg',badge:'cb-g',badgeTxt:'✓ On Pace',  bar:'mf-g',pc:'mp-g',rr:'rr-g',rf:'rf-g',rb:'on-track'};
}
function gpChip(v){
  if(v===null||v===undefined)return'';
  const p=parseFloat(v);
  return`<span class="gp-chip ${p>=35?'gp-good':p>=20?'gp-mid':'gp-low'}">GP ${p.toFixed(1)}%</span>`;
}
function lastPurchaseInfo(d){
  if(!d)return{cls:'old',txt:'No purchase on record'};
  const days=Math.round((new Date()-new Date(d))/(86400000));
  const cls=days<30?'recent':days<60?'mid':'old';
  const txt=days===0?'Last purchase: Today':days===1?'Yesterday':`${days}d ago (${new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'})})`;
  return{cls,txt:`Last: ${txt}`};
}

// ── HEADER STRIP ─────────────────────────────────────────────────────────────
function renderHeaderStrip(){
  const fu=D.sum.filter(r=>r.pace_status==='follow-up').length;
  const wa=D.sum.filter(r=>r.pace_status==='watch').length;
  const ok=D.sum.filter(r=>r.pace_status==='on-pace').length;
  const totalGap=D.sum.reduce((s,r)=>s+parseFloat(r.gap_mtd||0),0);
  const totalRev=D.sum.reduce((s,r)=>s+parseFloat(r.actual_mtd||0),0);
  const totalGP=D.sum.reduce((s,r)=>s+parseFloat(r.gross_profit||0),0);
  const avgGP=totalRev>0?(totalGP/totalRev*100):0;
  const elapsed=D.sum[0]?parseFloat(D.sum[0].pct_month_elapsed||0):0;
  document.getElementById('hsTotalCats').textContent=D.sum.length;
  document.getElementById('hsCombinedRev').textContent=fmt(totalRev);
  document.getElementById('hsFollowUp').textContent=fu;
  document.getElementById('hsWatch').textContent=wa;
  document.getElementById('hsOnPace').textContent=ok;
  document.getElementById('hsTotalGap').textContent=fmt(totalGap);
  document.getElementById('hsAvgGP').textContent=avgGP.toFixed(1)+'%';
  // Overall pace = total MTD revenue / total FULL month budget x 100
  // vs expected pace = working days elapsed / total working days x 100
  const totalBudgetFull=D.sum.reduce((s,r)=>s+parseFloat(r.budget_full||0),0);
  const actualPace=totalBudgetFull>0?Math.round(100*totalRev/totalBudgetFull):0;
  const expectedPace=D.workingDays?parseFloat(D.workingDays.pct_elapsed):parseFloat(D.sum[0]?.pct_month_elapsed||40);
  const paceGap=actualPace-expectedPace;
  const paceEl=document.getElementById('hsOverallPace');
  paceEl.innerHTML=`<span style="font-weight:900">${actualPace}%</span><span style="font-size:13px;font-weight:500;color:rgba(255,255,255,.6);margin-left:6px">vs ${Math.round(expectedPace)}% expected</span>`;
  paceEl.style.color=paceGap>=0?'#6EE7B7':paceGap>=-10?'#FCD34D':'#F87171';
  const revEl=document.getElementById('hsTotalRev');
  if(revEl) revEl.textContent=fmt(totalRev);
  const wdInfo=D.workingDays
    ?`${D.workingDays.working_days_elapsed} of ${D.workingDays.total_working_days} working days · ${D.workingDays.pct_elapsed}% of month`
    :`${elapsed.toFixed(0)}% of month elapsed`;
  const dateStr=`${new Date().toLocaleString('default',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${wdInfo}`;
  document.getElementById('hsDate').textContent=dateStr;
  // Set data-period for mobile ::before banner
  const strip=document.getElementById('headerStrip');
  if(strip) strip.setAttribute('data-period', document.getElementById('periodPill').textContent+' · '+wdInfo);
}

// ── CATEGORY PANELS (grouped by manager) ─────────────────────────────────────
const MGR_ORDER=[
  {mgr:'Rejene',cats:['PAPER','PLASTIC','CLEARPACK']},
  {mgr:'Trebor',cats:['FOODSUP','BEVERAGES','ECOBOX','ECOCUP','ECOSTRAW','ECOBAG']},
  {mgr:'Travis',cats:['GARBAGEBAG','FOIL','PROCESSING','HOUSEHOLD']},
  {mgr:'Richard',cats:['MEZAMENITY','MEZSMALLWA','MEZ','MEZGLASSWA','MEZPORCELA','MEZCUTLERY','MEZLINEN','MEZPOLYCAR','MEZMELAMIN','MEZEQUIPME']}
];

function renderCats(){
  const elapsed=D.sum[0]?parseFloat(D.sum[0].pct_month_elapsed||35):35;
  const catMap={};D.sum.forEach(r=>{catMap[r.item_class]=r;});
  let html='';
  MGR_ORDER.forEach(({mgr,cats})=>{
    const mgrRows=cats.map(cat=>catMap[cat]).filter(Boolean)
      .sort((a,b)=>parseFloat(a.pace_gap_pct||0)-parseFloat(b.pace_gap_pct||0));
    if(!mgrRows.length)return;
    const mgrColor=MC[mgr]||'var(--navy)';
    const fu=mgrRows.filter(r=>r.pace_status==='follow-up').length;
    const wa=mgrRows.filter(r=>r.pace_status==='watch').length;
    html+=`<div style="margin-bottom:8px;margin-top:20px;display:flex;align-items:center;gap:12px;">
      <div style="font-weight:800;font-size:15px;color:${mgrColor};letter-spacing:-.01em">${mgr}</div>
      <div style="height:1px;flex:1;background:var(--border)"></div>
      ${fu>0?`<span style="font-size:11px;font-weight:700;background:var(--red-bg);color:var(--red);padding:2px 8px;border-radius:10px">${fu} follow up</span>`:''}
      ${wa>0?`<span style="font-size:11px;font-weight:700;background:var(--amber-bg);color:var(--amber);padding:2px 8px;border-radius:10px">${wa} watch</span>`:''}
    </div>`;
    html+=mgrRows.map(row=>{
    const p=parseFloat(row.pct_to_budget),pi=paceInfo(row.pace_status);
    const gap=parseFloat(row.pace_gap_pct)||0, ptsAhead=gap>=0;
    const m=MM[row.item_class]||{mgr:'—',mc:'rejene'};
    const tickPos=Math.min(elapsed,100);

    // All reps for this category — sorted worst pace first
    const repRows=D.rep.filter(r=>r.item_class===row.item_class)
      .sort((a,b)=>(parseFloat(a.pct_to_budget)-elapsed)-(parseFloat(b.pct_to_budget)-elapsed));

    // Top 10 Tier 1-3 customers most behind pace
    const custRows=D.cust.filter(r=>r.item_class===row.item_class)
      .sort((a,b)=>parseFloat(a.pace_gap||0)-parseFloat(b.pace_gap||0))
      .slice(0,10);

    const skuRows=D.sku.filter(s=>s.item_class===row.item_class)
      .sort((a,b)=>{
        const ap=parseFloat(a.pace_vs_prev)||999,bp=parseFloat(b.pace_vs_prev)||999;
        const aNo=parseFloat(a.actual_mtd)===0&&parseFloat(a.prev_month_actual)>0;
        const bNo=parseFloat(b.actual_mtd)===0&&parseFloat(b.prev_month_actual)>0;
        if(aNo&&!bNo)return -1;if(!aNo&&bNo)return 1;return ap-bp;
      });

    return`<div class="cat-card ${pi.bc}" id="cc_${row.item_class}">
      <div class="cat-row" onclick="toggle('${row.item_class}')">
        <div><div class="cat-nm">${row.item_class}</div><div class="cat-mgr-line"><span class="mgr-tag mt-${m.mc}">${m.mgr}</span></div></div>
        <div><span class="cat-badge ${pi.badge}">${pi.badgeTxt}</span></div>
        <div class="cat-meter">
          <div class="m-track"><div class="m-fill ${pi.bar}" style="width:${Math.min(p,100)}%"></div><div class="m-tick" style="left:${tickPos}%"></div></div>
          <div class="m-row1"><span class="m-pct ${pi.pc}">${Math.round(p)}% <span style="font-weight:400;color:var(--text-soft);font-size:11px">vs ${elapsed.toFixed(0)}% pace</span></span><span class="m-elapsed">${fmt(row.gap_mtd)} gap</span></div>
          <div class="m-row1"><span class="m-pts ${ptsAhead?'ahead':'behind'}">${ptsAhead?'▲':'▼'} ${Math.abs(gap).toFixed(1)} pts ${ptsAhead?'ahead of':'behind'} pace</span></div>
        </div>
        <div class="cat-stats">
          <div class="stat-block"><div class="stat-val">${fmt(row.actual_mtd)}</div><div class="stat-lbl">actual MTD</div></div>
          <div class="stat-block"><div class="stat-val">${fmt(row.budget_mtd)}</div><div class="stat-lbl">budget MTD</div></div>
          <div class="stat-block"><div class="stat-val">${row.budget_full?fmt(row.budget_full):fmt(parseFloat(row.budget_mtd)/(parseFloat(row.pct_month_elapsed||35)/100))}</div><div class="stat-lbl">full mo budget</div></div>
          <div class="stat-block"><div class="stat-val ${parseFloat(row.gap_mtd)<0?'sv-r':'sv-g'}">${fmt(row.gap_mtd)}</div><div class="stat-lbl">gap vs pace</div></div>
          <div class="stat-block"><div class="stat-val ${row.gp_pct&&parseFloat(row.gp_pct)>=35?'sv-g':row.gp_pct&&parseFloat(row.gp_pct)>=20?'sv-a':'sv-r'}">${row.gp_pct?parseFloat(row.gp_pct).toFixed(1)+'%':'—'}</div><div class="stat-lbl">gross profit %</div></div>
          ${(()=>{const pen=catPenetration(row.item_class);return pen.pct!==null?`<div class="stat-block"><div class="stat-val ${pen.pct>=70?'sv-g':pen.pct>=40?'sv-a':'sv-r'}">${pen.pct}%</div><div class="stat-lbl">${pen.active}/${pen.budgeted} cust penetration</div></div>`:''})()}
        </div>
        <span class="chev">›</span>
      </div>
      <div class="cat-detail">
        <div class="dtab-bar">
          <div class="dtab active" onclick="stab(event,'${row.item_class}','r')">By Rep <span class="tab-cnt ${repRows.filter(r=>(parseFloat(r.pct_to_budget)-elapsed)<0).length?'tc-r':'tc-g'}">${repRows.length} reps</span></div>
          <div class="dtab" onclick="stab(event,'${row.item_class}','c')">By Customer <span class="tab-cnt tc-a">${custRows.length}</span></div>
          <div class="dtab" onclick="stab(event,'${row.item_class}','s')">Key SKUs <span class="tab-cnt tc-a">${skuRows.length}</span></div>
        </div>
        <div class="dp active" id="dp_${row.item_class}_r">${buildRepRows(repRows,elapsed)}</div>
        <div class="dp" id="dp_${row.item_class}_c">${buildCustRows(custRows,elapsed,row.item_class)}</div>
        <div class="dp" id="dp_${row.item_class}_s">${buildSkuRows(skuRows,row.item_class)}</div>
      </div></div>`;
    }).join('');
  });
  document.getElementById('catList').innerHTML=html||'<div class="empty-row">No data loaded.</div>';
}

// ── BY REP (all reps, sorted worst pace first) ───────────────────────────────
function buildRepRows(rows,elapsed){
  if(!rows.length)return'<div class="empty-row">No rep data available for this category</div>';
  return`<div class="rep-rows">${rows.map(r=>{
    const rp=parseFloat(r.pct_to_budget),pg=rp-elapsed;
    const isFu=pg<-10,isW=pg<=-5;
    const pi=isFu?{rr:'rr-r',rf:'rf-r',rb:'follow-up',pc:'c-r'}:isW?{rr:'rr-b',rf:'rf-b',rb:'watch',pc:'c-b'}:{rr:'rr-g',rf:'rf-g',rb:'on-track',pc:'c-g'};
    const ptsAhead=pg>=0;
    const gp=r.gp_pct!=null?parseFloat(r.gp_pct):null;
    const pen=r.penetration_pct!=null?parseFloat(r.penetration_pct):null;
    const penFill=pen!=null?Math.min(pen,100):0;
    const penCls=penFill>=70?'rf-g':penFill>=40?'rf-b':'rf-r';
    return`<div class="rep-row ${pi.rr}">
      <div><div class="rr-name">${r.salesperson}</div><div class="rr-area">${r.area}</div></div>
      <div><span class="rr-badge ${pi.rb}">${isFu?'⚠ Follow Up':isW?'● Watch':'✓ On Track'}</span></div>
      <div class="rr-meter">
        <div class="rr-track"><div class="rr-fill ${pi.rf}" style="width:${Math.min(rp,100)}%"></div><div class="rr-tick" style="left:${Math.min(elapsed,100)}%"></div></div>
        <div class="rr-meta">
          <span class="rr-pct ${pi.pc}">${Math.round(rp)}% vs ${elapsed.toFixed(0)}% pace</span>
          <span class="rr-pts ${ptsAhead?'ahead':'behind'}">${ptsAhead?'▲':'▼'} ${Math.abs(pg).toFixed(1)} pts ${ptsAhead?'ahead':'behind'} pace</span>
        </div>
      </div>
      <div class="cat-stats">
        <div class="stat-block"><div class="stat-val">${fmt(r.actual_mtd)}</div><div class="stat-lbl">actual MTD</div></div>
        <div class="stat-block"><div class="stat-val">${fmt(r.budget_mtd)}</div><div class="stat-lbl">budget MTD</div></div>
        <div class="stat-block"><div class="stat-val">${r.budget_full?fmt(r.budget_full):fmt(parseFloat(r.budget_mtd)/(elapsed/100))}</div><div class="stat-lbl">full mo budget</div></div>
        <div class="stat-block"><div class="stat-val ${pg<0?'sv-r':'sv-g'}">${fmt(r.gap_mtd)}</div><div class="stat-lbl">gap vs pace</div></div>
        <div class="stat-block"><div class="stat-val ${gp!=null?(gp>=35?'sv-g':gp>=20?'sv-a':'sv-r'):''}">${gp!=null?gp.toFixed(1)+'%':'—'}</div><div class="stat-lbl">GP %</div></div>
        ${pen!=null?`<div class="stat-block"><div class="stat-val ${penFill>=70?'sv-g':penFill>=40?'sv-b':'sv-r'}">${pen.toFixed(0)}%</div><div class="stat-lbl">${r.active_custs}/${r.budgeted_custs} cust pen</div></div>`:''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ── BY CUSTOMER (top 10 Tier 1-3, expandable for missing SKUs) ────────────────

  return`<div class="cust-rows">${rows.map((r,i)=>{
    const cp=parseFloat(r.pct_to_budget),pgap=parseFloat(r.pace_gap||cp-elapsed);

    const borderCls=isFu?'cr-r':isW?'cr-a':'cr-g';
    const fillCls=isFu?'rf-r':isW?'rf-a':'rf-g';
    const pctCls=isFu?'c-r':isW?'c-b':'c-g';
    const ptsAhead=pgap>=0;
    const lpInfo=lastPurchaseInfo(r.last_purchase_date);
    const uid=`cust_${cat}_${i}`;
    let missingSkus=[];
    if(r.missing_skus_json){try{missingSkus=JSON.parse(r.missing_skus_json);}catch(e){}}
    const tierLabel=r.tier||'';

    return`<div class="cust-row ${borderCls}" id="${uid}">
      <div class="cr-main" onclick="toggleCust('${uid}')">
        <div>
          <div class="cr-name">${r.customer_name}</div>
          <div class="cr-rep">${r.salesperson} · ${r.area||'—'}</div>
          ${tierLabel?`<span class="cr-tier">${tierLabel}</span>`:''}
          <div class="cr-date ${lpInfo.cls}">${lpInfo.txt}</div>

        <div style="display:flex;align-items:center;gap:0">
          <div style="display:flex;flex-direction:column;gap:6px;margin-right:12px;align-items:flex-end">
            <div class="rr-track" style="height:5px;width:120px"><div class="rr-fill ${fillCls}" style="width:${Math.min(cp,100)}%"></div><div class="rr-tick" style="left:${Math.min(elapsed,100)}%"></div></div>
            <div style="display:flex;gap:6px">
              <span class="rr-pct ${pctCls}" style="font-size:11px">${Math.round(cp)}% vs ${elapsed.toFixed(0)}%</span>
              <span class="rr-pts ${ptsAhead?'ahead':'behind'}" style="font-size:11px">${ptsAhead?'▲':'▼'} ${Math.abs(pgap).toFixed(1)} pts</span>
            </div>
          </div>
          <div class="cat-stats">
            <div class="stat-block"><div class="stat-val">${fmt(r.actual_mtd)}</div><div class="stat-lbl">actual MTD</div></div>
            <div class="stat-block"><div class="stat-val">${fmt(r.budget_mtd)}</div><div class="stat-lbl">budget MTD</div></div>
            <div class="stat-block"><div class="stat-val">${elapsed>0?fmt(parseFloat(r.budget_mtd)/(elapsed/100)):'—'}</div><div class="stat-lbl">full mo budget</div></div>
            <div class="stat-block"><div class="stat-val ${pgap<0?'sv-r':'sv-g'}">${fmt(r.gap_mtd)}</div><div class="stat-lbl">gap vs pace</div></div>
          </div>
          <span class="cr-chev" style="margin-left:12px">›</span>
        </div>
      </div>
      <div class="cr-expand">
        <div class="msku-title">All key SKUs not yet purchased this month</div>
        ${missingSkus.length
          ?`<table class="msku-table">
              <tr><th></th><th>SKU</th><th>Avg Monthly Rev</th><th>Avg Cases/Mo</th><th>Last Purchased</th></tr>
              ${missingSkus.map(s=>{
                const lp=s.last_purchase?lastPurchaseInfo(s.last_purchase):{cls:'old',txt:'Never'};
                return`<tr>
                  <td><span class="msku-dot"></span></td>
                  <td style="font-weight:600">${s.desc}</td>
                  <td>${fmt(s.avg_rev)}</td>
                  <td>${fmtN(s.avg_cases)} cs</td>
                  <td class="msku-last ${lp.cls}">${lp.txt}</td>
                </tr>`;
              }).join('')}
            </table>`
          :`<div style="font-size:12px;color:var(--green);font-style:italic">✓ All key SKUs purchased this month</div>`}
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ── KEY SKU ROWS (expandable) ─────────────────────────────────────────────────
function buildSkuRows(rows,cat){
  if(!rows.length)return'<div class="empty-row">No key SKU data for this category</div>';
  return`<div class="sku-rows">${rows.map((s,i)=>{
    const pvp=parseFloat(s.pace_vs_prev),mtd=parseFloat(s.actual_mtd)||0;
    const prev=parseFloat(s.prev_month_actual)||0;
    const netCases=parseFloat(s.cases_mtd)||0;
    const ytdAvg=parseFloat(s.ytd_avg_monthly_rev)||0;
    const pctPrevFull=s.pct_of_prev_full?parseFloat(s.pct_of_prev_full):null;
    const vsSamePeriod=s.pace_vs_same_period?parseFloat(s.pace_vs_same_period):null;
    const noSales=mtd<=0&&prev>0,noPrev=prev===0;
    // If MTD already at or above YTD monthly average → always On Pace
    const atOrAboveAvg=ytdAvg>0&&mtd>=ytdAvg;
    let borderCls,fillCls,badgeCls,badgeTxt,barW;
    if(noSales){borderCls='sk-r';fillCls='rf-r';badgeCls='follow-up';badgeTxt='⚠ No Sales Yet';barW=0;}
    else if(atOrAboveAvg){borderCls='sk-g';fillCls='rf-g';badgeCls='on-track';badgeTxt='✓ On Pace';barW=Math.min(pvp||100,100);}
    else if(noPrev||isNaN(pvp)||pvp===0){borderCls='sk-g';fillCls='rf-g';badgeCls='on-track';badgeTxt='● New';barW=60;}
    else if(pvp<75){borderCls='sk-r';fillCls='rf-r';badgeCls='follow-up';badgeTxt='⚠ Follow Up';barW=Math.min(pvp,100);}
    else if(pvp<100){borderCls='sk-a';fillCls='rf-a';badgeCls='watch';badgeTxt='● Watch';barW=Math.min(pvp,100);}
    else{borderCls='sk-g';fillCls='rf-g';badgeCls='on-track';badgeTxt='✓ On Pace';barW=Math.min(pvp,100);}
    const pctCls=borderCls==='sk-r'?'c-r':borderCls==='sk-a'?'c-a':'c-g';

    const shortName=s.description.replace(/\s*\([A-Z0-9\-\/\s]{6,}\)\s*$/,'').replace(/\s*-\s*[A-Z0-9]{6,}$/,'').trim();
    const gp=s.gp_pct!=null?parseFloat(s.gp_pct):null;
    const uid=`sku_${cat}_${i}`;



    return`<div class="sku-card ${borderCls}" id="${uid}">
      <div class="sku-main-row" onclick="toggleSku('${uid}')">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div>
            <div class="sku-name">${shortName}</div>
            <div style="margin-top:4px"><span class="rr-badge ${badgeCls}">${badgeTxt}</span>${gp!=null?` ${gpChip(gp)}`:''}</div>
          </div>
          <span class="sku-chev" style="flex-shrink:0;margin-top:2px">›</span>
        </div>

        <div class="cat-stats">
          <div class="stat-block"><div class="stat-val">${fmt(mtd)}</div><div class="stat-lbl">MTD revenue</div></div>
          <div class="stat-block"><div class="stat-val">${fmtN(netCases)} cs</div><div class="stat-lbl">net cases MTD</div></div>
          <div class="stat-block"><div class="stat-val">${ytdAvg>0?fmt(ytdAvg):'—'}</div><div class="stat-lbl">YTD avg monthly rev</div></div>
          <div class="stat-block"><div class="stat-val ${pctPrevFull!=null?(pctPrevFull>=100?'sv-g':pctPrevFull>=70?'sv-g':'sv-r'):''}">${pctPrevFull!=null?Math.round(pctPrevFull)+'%':'—'}</div><div class="stat-lbl">% of last full month</div></div>
          <div class="stat-block"><div class="stat-val ${vsSamePeriod!=null?(vsSamePeriod>=100?'sv-g':vsSamePeriod>=80?'sv-g':'sv-r'):''}">${vsSamePeriod!=null?Math.round(vsSamePeriod)+'%':'—'}</div><div class="stat-lbl">vs same period last mo</div></div>
        </div>
      </div>
      <div class="sku-expand">
        <div class="sku-etab-bar">
          <div class="sku-etab active" onclick="skuTab(event,'${uid}','top')">Top Customers</div>
          <div class="sku-etab" onclick="skuTab(event,'${uid}','area')">By Area</div>
        </div>
        <div class="sku-epane active" id="sep_${uid}_top">${buildSkuCustTable(s.inventory_id)}</div>
        <div class="sku-epane" id="sep_${uid}_area">${buildSkuAreaTable(s.inventory_id)}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function buildSkuCustTable(invId){
  const rows=D.skuCust.filter(r=>r.inventory_id===invId).sort((a,b)=>parseFloat(b.actual_mtd)-parseFloat(a.actual_mtd)).slice(0,15);
  if(!rows.length)return'<div class="empty-row">No customer detail available for this period</div>';
  return`<table class="exp-table">
    <tr><th>Customer</th><th>Area</th><th>Tier</th><th>MTD Revenue</th><th>MTD Cases</th><th>YTD Avg Monthly Rev</th><th>YTD Avg Mo Cases</th><th>% of SKU sales</th><th>Cumulative</th></tr>
    ${rows.map(r=>{
      const cum=parseFloat(r.cumulative_pct)||0;
      const isKey=cum<=80;
      return`<tr style="${isKey?'background:rgba(50,107,211,.03)':''}">
        <td style="font-weight:600">${r.customer_name}</td>
        <td>${r.area||'—'}</td>
        <td>${r.tier||'—'}</td>
        <td>${fmt(r.actual_mtd)}</td>
        <td>${fmtN(r.cases_mtd)} cs</td>
        <td>${parseFloat(r.ytd_avg_monthly_rev)>0?fmt(r.ytd_avg_monthly_rev):'—'}</td>
        <td>${parseFloat(r.ytd_avg_monthly_cases)>0?fmtN(r.ytd_avg_monthly_cases)+' cs':'—'}</td>
        <td><div style="display:flex;align-items:center;gap:6px"><div class="cum-bar" style="width:${Math.min(cum,100)*0.6}px"></div>${cum.toFixed(1)}%</div></td>
        <td style="font-weight:700;color:${cum<=80?'var(--blue)':'var(--text-soft)'}">${cum.toFixed(1)}%</td>
      </tr>`;
    }).join('')}
  </table>
  <div style="font-size:11px;color:var(--blue);margin-top:8px;padding-top:6px;border-top:1px solid var(--border)">Highlighted rows = customers representing 80% of this SKU's sales</div>`;
}

function buildSkuAreaTable(invId){
  const rows=D.skuArea.filter(r=>r.inventory_id===invId).sort((a,b)=>parseFloat(a.pct_of_avg||0)-parseFloat(b.pct_of_avg||0));
  if(!rows.length)return'<div class="empty-row">No area data available for this period</div>';
  const maxRev=Math.max(...rows.map(r=>parseFloat(r.actual_mtd)||0));
  return`<table class="exp-table">
    <tr><th>Area</th><th>MTD Revenue</th><th>MTD Cases</th><th>YTD Avg Monthly Rev</th><th>YTD Avg Mo Cases</th><th>vs Avg Pace</th><th></th></tr>
    ${rows.map(r=>{
      const pct=parseFloat(r.pct_of_avg)||0;
      const barCls=pct>=90?'ab-g':pct>=70?'ab-a':'ab-r';
      const barW=Math.min(pct,150);
      return`<tr>
        <td style="font-weight:600">${r.area}</td>
        <td>${fmt(r.actual_mtd)}</td>
        <td>${fmtN(r.cases_mtd)} cs</td>
        <td>${parseFloat(r.ytd_avg_monthly_rev)>0?fmt(r.ytd_avg_monthly_rev):'—'}</td>
        <td>${parseFloat(r.ytd_avg_monthly_cases)>0?fmtN(r.ytd_avg_monthly_cases)+' cs':'—'}</td>
        <td style="font-weight:700;color:${pct>=90?'var(--green)':pct>=70?'var(--amber)':'var(--red)'}">${pct>0?pct.toFixed(0)+'%':'—'}</td>
        <td><div class="area-bar ${barCls}" style="width:${barW}px"></div></td>
      </tr>`;
    }).join('')}
  </table>`;
}

// ── CROSS ALERTS ──────────────────────────────────────────────────────────────
function renderCross(){
  const elapsed=D.sum[0]?parseFloat(D.sum[0].pct_month_elapsed||35):35;
  const catBudgets={};D.sum.forEach(r=>{catBudgets[r.item_class]=parseFloat(r.budget_mtd)||1;});
  const rm={};
  D.rep.forEach(r=>{
    const rp=parseFloat(r.pct_to_budget),gap=parseFloat(r.gap_mtd)||0;
    const share=Math.abs(gap)/(catBudgets[r.item_class]||1);
    if((rp-elapsed)>=-10||share<0.03)return;
    if(!rm[r.salesperson])rm[r.salesperson]={n:r.salesperson,area:r.area,cats:[],gap:0};
    rm[r.salesperson].cats.push({cat:r.item_class,pct:rp,gap,share:Math.round(share*100)});
    rm[r.salesperson].gap+=gap;
  });
  const multi=Object.values(rm).filter(r=>r.cats.length>=2).sort((a,b)=>a.gap-b.gap).slice(0,10);
  if(!multi.length){document.getElementById('crossList').innerHTML=`<div class="empty-row" style="padding:28px">✓ No reps with significant gaps across multiple categories.</div>`;return;}
  document.getElementById('crossList').innerHTML=multi.map(rep=>{
    const mgrs=[...new Set(rep.cats.map(c=>MM[c.cat]?.mgr).filter(Boolean))];
    const joint=mgrs.length>1;
    const accentColor=joint?'var(--blue)':MC[mgrs[0]]||'var(--blue)';
    const actionTxt=joint
      ?`<strong>Joint action:</strong> ${mgrs.join(' & ')} should coordinate one conversation with <strong>${rep.n}</strong> covering ${rep.cats.map(c=>c.cat).join(', ')}.`
      :`<strong>${mgrs[0]}</strong> to address <strong>${rep.n}</strong> (${rep.area}) on ${rep.cats.map(c=>c.cat).join(' & ')} — all in one conversation.`;
    const catChips=rep.cats.map(c=>{
      const chipCls=c.pct<(elapsed-10)?'chip-r':c.pct<elapsed?'chip-a':'chip-g';
      const pctCls=c.pct<(elapsed-10)?'cp-r':c.pct<elapsed?'cp-a':'cp-g';
      return`<div class="cc-cat-chip ${chipCls}"><div class="cc-chip-cat">${c.cat}</div><div class="cc-chip-pct ${pctCls}">${c.pct.toFixed(0)}%</div><div class="cc-chip-gap">${fmt(c.gap)} gap</div></div>`;
    }).join('');
    const skuItems=rep.cats.map(c=>{
      const lagging=D.sku.filter(s=>s.item_class===c.cat&&parseFloat(s.pace_vs_prev)>0&&parseFloat(s.pace_vs_prev)<85&&parseFloat(s.prev_month_actual)>50000).sort((a,b)=>parseFloat(a.pace_vs_prev)-parseFloat(b.pace_vs_prev)).slice(0,2);
      const noS=D.sku.filter(s=>s.item_class===c.cat&&parseFloat(s.actual_mtd)===0&&parseFloat(s.prev_month_actual)>100000).slice(0,1);
      const items=[...noS,...lagging].slice(0,2);
      if(!items.length)return'';
      const names=items.map(s=>parseFloat(s.actual_mtd)===0?`${s.description.split(' ').slice(0,5).join(' ')}… <em>(no sales yet)</em>`:`${s.description.split(' ').slice(0,5).join(' ')}… <em>(↓${(100-parseFloat(s.pace_vs_prev)).toFixed(0)}% vs last mo)</em>`).join(' · ');
      return`<div class="cc-sku-item"><span class="cc-sku-cat">${c.cat}</span><span class="cc-sku-name">${names}</span></div>`;
    }).filter(Boolean);
    return`<div class="cc">
      <div class="cc-accent" style="background:${accentColor}"></div>
      <div class="cc-body">
        <div class="cc-identity">
          <div><div class="cc-rep">${rep.n}</div><div class="cc-area">${rep.area}</div></div>
          <div style="display:flex;align-items:center;gap:14px">
            <div class="cc-gap-stat"><div class="cc-gap-val">${fmt(rep.gap)}</div><div class="cc-gap-lbl">combined gap</div></div>
            <div style="display:flex;gap:6px">${mgrs.map(mg=>`<span class="mgr-tag mt-${MM[rep.cats.find(c=>MM[c.cat]?.mgr===mg)?.cat]?.mc}">${mg}</span>`).join('')}</div>
          </div>
        </div>
        <div class="cc-cats">${catChips}</div>
        <div class="cc-divider"></div>
        <div class="cc-action"><div class="cc-action-icon ${joint?'joint':'single'}">${joint?'🤝':'→'}</div><div class="cc-action-text">${actionTxt}</div></div>
        ${skuItems.length?`<div class="cc-skus"><div class="cc-skus-title">Key SKU focus areas</div>${skuItems.join('')}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function toggle(cat){
  const el=document.getElementById(`cc_${cat}`);
  const isOpen=el.classList.contains('open');
  // Close all open category cards
  document.querySelectorAll('.cat-card.open').forEach(card=>{
    card.classList.remove('open');
    // Reset tabs back to first tab active
    card.querySelectorAll('.dtab').forEach((t,i)=>{t.classList.toggle('active',i===0);});
    card.querySelectorAll('.dp').forEach((p,i)=>{p.classList.toggle('active',i===0);});
  });
  // If it wasn't open, open it now
  if(!isOpen) el.classList.add('open');
}
function stab(e,cat,t){
  e.stopPropagation();
  const cd=document.getElementById(`cc_${cat}`);
  cd.querySelectorAll('.dtab').forEach(x=>x.classList.remove('active'));
  cd.querySelectorAll('.dp').forEach(x=>x.classList.remove('active'));
  e.target.closest('.dtab').classList.add('active');
  document.getElementById(`dp_${cat}_${t}`).classList.add('active');
}
function toggleCust(uid){
  const el=document.getElementById(uid);
  const isOpen=el.classList.contains('open');
  // Close siblings (customer rows in same parent)
  const parent=el.closest('.cust-rows');
  if(parent) parent.querySelectorAll('.cust-row.open').forEach(r=>r.classList.remove('open'));
  if(!isOpen) el.classList.add('open');
}
function toggleSku(uid){
  const el=document.getElementById(uid);
  const isOpen=el.classList.contains('open');
  const parent=el.closest('.sku-rows');
  if(parent) parent.querySelectorAll('.sku-card.open').forEach(r=>r.classList.remove('open'));
  if(!isOpen) el.classList.add('open');
}
function skuTab(e,uid,t){
  e.stopPropagation();
  const card=document.getElementById(uid);
  card.querySelectorAll('.sku-etab').forEach(x=>x.classList.remove('active'));
  card.querySelectorAll('.sku-epane').forEach(x=>x.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById(`sep_${uid}_${t}`).classList.add('active');
}

// ── SNAPSHOT MODAL ────────────────────────────────────────────────────────────
function openSnap(mgr){
  snapMgr=mgr;
  const elapsed=D.sum[0]?parseFloat(D.sum[0].pct_month_elapsed||35):35;
  const bad=D.sum.filter(r=>MM[r.item_class]?.mgr===mgr&&(r.pace_status==='follow-up'||r.pace_status==='watch'));
  const ra={};
  bad.forEach(row=>{
    D.rep.filter(r=>r.item_class===row.item_class&&(parseFloat(r.pct_to_budget)-elapsed)<-5)
      .sort((a,b)=>parseFloat(a.pct_to_budget)-parseFloat(b.pct_to_budget)).slice(0,5)
      .forEach(r=>{
        if(!ra[r.salesperson])ra[r.salesperson]={n:r.salesperson,area:r.area,cats:[],gap:0};
        ra[r.salesperson].cats.push(`${r.item_class} (${parseFloat(r.pct_to_budget).toFixed(0)}%)`);
        ra[r.salesperson].gap+=parseFloat(r.gap_mtd);
      });
  });
  const tr=Object.values(ra).sort((a,b)=>a.gap-b.gap).slice(0,8);
  const per=document.getElementById('periodPill').textContent;
  document.getElementById('mTitle').textContent=`${mgr} — Performance Brief`;
  document.getElementById('mBody').innerHTML=`
    <div class="s-banner" style="background:${MC[mgr]}"><h2>${mgr} — Category Performance Brief</h2><p>Period: ${per} · ${new Date().toLocaleString()}</p></div>
    <div style="margin-bottom:18px"><div class="s-sec-lbl">Categories Behind Pace</div>
    ${!bad.length?`<div style="font-size:13px;color:var(--green)">✓ All on pace</div>`:
      bad.map(r=>{const pi=paceInfo(r.pace_status);return`<div class="s-cat-row"><span class="s-cat-nm">${r.item_class}</span><span class="rr-badge ${pi.rb}">${pi.badgeTxt} ${parseFloat(r.pace_gap_pct).toFixed(1)}%</span>${gpChip(r.gp_pct)}<span style="font-size:11px;color:var(--red);margin-left:4px">${fmt(r.gap_mtd)}</span></div>`;}).join('')}
    </div>
    <div style="margin-bottom:18px"><div class="s-sec-lbl">Priority Reps</div>
    ${!tr.length?`<div style="font-size:13px;color:var(--text-soft)">None identified.</div>`:
      tr.map(r=>`<div class="s-rep-blk"><div class="s-rep-nm">${r.n} <span style="font-weight:400;color:var(--text-soft);font-size:12px">· ${r.area}</span></div><div class="s-rep-dt">${r.cats.join(' | ')}<br>Gap: <strong style="color:var(--red)">${fmt(r.gap)}</strong></div></div>`).join('')}
    </div>
    <div><div class="s-sec-lbl">Recommended Actions</div>
    <div class="s-actions">${tr.slice(0,6).map((r,i)=>`<strong>${i+1}.</strong> Contact ${r.n} (${r.area}) re: ${r.cats.join(', ')}<br>`).join('')}${!tr.length?'No urgent actions.':''}</div></div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function downloadSnap(){
  const mgr=snapMgr;
  const per=document.getElementById('periodPill').textContent;
  const mBody=document.getElementById('mBody');
  const btn=document.querySelector('.btn-pri');
  const origTxt=btn.textContent;
  btn.textContent='Generating…';
  btn.disabled=true;

  // Temporarily show modal body at full width for clean capture
  const prevOverflow=document.body.style.overflow;
  document.body.style.overflow='hidden';

  // Build a clean render target
  const wrapper=document.createElement('div');
  wrapper.style.cssText=`
    position:fixed;left:-9999px;top:0;
    width:680px;background:#fff;
    font-family:'Segoe UI',system-ui,sans-serif;
    color:#1A2340;padding:0;
  `;

  // Clone modal content with a styled header banner
  const bannerColor={'Rejene':'#6D28D9','Trebor':'#0E7490','Travis':'#B45309'}[mgr]||'#326BD3';
  wrapper.innerHTML=`
    <div style="background:${bannerColor};padding:20px 24px;">
      <div style="font-weight:800;font-size:18px;color:#fff">${mgr} — Category Performance Brief</div>
      <div style="font-size:12px;color:rgba(255,255,255,.75);margin-top:4px">Period: ${per} · Generated ${new Date().toLocaleString()}</div>
    </div>
    <div style="padding:24px">${mBody.innerHTML}</div>
  `;
  document.body.appendChild(wrapper);

  html2canvas(wrapper,{
    scale:2,
    backgroundColor:'#ffffff',
    useCORS:true,
    logging:false,
    width:680
  }).then(canvas=>{
    // Download as JPG
    const link=document.createElement('a');
    link.download=`${mgr}_Category_Brief_${per.replace(/[^a-zA-Z0-9]/g,'_')}.jpg`;
    link.href=canvas.toDataURL('image/jpeg',0.92);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    document.body.removeChild(wrapper);
    document.body.style.overflow=prevOverflow;
    btn.textContent=origTxt;
    btn.disabled=false;
  }).catch(err=>{
    console.error(err);
    document.body.removeChild(wrapper);
    document.body.style.overflow=prevOverflow;
    btn.textContent=origTxt;
    btn.disabled=false;
    alert('Download failed. Try Copy as Text instead.');
  });
}

function copySnap(){
  const elapsed=D.sum[0]?parseFloat(D.sum[0].pct_month_elapsed||35):35;
  const bad=D.sum.filter(r=>MM[r.item_class]?.mgr===snapMgr&&(r.pace_status==='follow-up'||r.pace_status==='watch'));
  let t=`CATEGORY BRIEF — ${snapMgr}\nPeriod: ${document.getElementById('periodPill').textContent}\n${new Date().toLocaleString()}\n\nBEHIND PACE\n${'-'.repeat(32)}\n`;
  bad.forEach(r=>t+=`${r.item_class}: ${r.pace_status.toUpperCase()} (${parseFloat(r.pace_gap_pct).toFixed(1)}% vs pace | GP: ${r.gp_pct?parseFloat(r.gp_pct).toFixed(1)+'%':'N/A'} | gap: ${fmt(r.gap_mtd)})\n`);
  const ra={};
  bad.forEach(row=>{D.rep.filter(r=>r.item_class===row.item_class&&(parseFloat(r.pct_to_budget)-elapsed)<-5).forEach(r=>{if(!ra[r.salesperson])ra[r.salesperson]={n:r.salesperson,area:r.area,cats:[]};ra[r.salesperson].cats.push(`${r.item_class} (${parseFloat(r.pct_to_budget).toFixed(0)}%)`);});});
  t+=`\nPRIORITY REPS\n${'-'.repeat(32)}\n`;
  Object.values(ra).forEach(r=>t+=`${r.n} [${r.area}]: ${r.cats.join(', ')}\n`);
  navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector('.btn-sec');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy as Text',2000);});
}

function setLdr(m){document.getElementById('ldr').style.display='flex';document.getElementById('ldrMsg').textContent=m;}
function hideLdr(){document.getElementById('ldr').style.display='none';}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeModal();});
loadAll();
