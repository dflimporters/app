/* bars shrink to their column; nothing draws outside its own cell */

.dbar,.pace{min-width:0}

.gl>li.cpli{display:block;padding:0}
.cprow{display:grid;grid-template-columns:var(--gc);gap:12px;align-items:center;width:100%;min-height:46px;padding:8px 6px;margin:0 -6px;width:calc(100% + 12px);border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:8px}

.gl>li.cpli.open{margin:6px -6px 12px;border:1px solid #CFD9EC;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(26,46,90,.07)}

.cpx{background:#fff;padding:2px 12px 12px}
.gprod>li{min-height:36px;padding:6px 0}

.gprod>li.more{display:block;border-bottom:0;padding:8px 0 4px}

.gprod>li.tot{border-top:1px solid var(--line);border-bottom:0}
.gprod>li.tot>span:first-child{font-family:var(--head);font-weight:700;font-size:12px;color:var(--ink)}
.dt .tpct{font-size:.62em;font-weight:700;opacity:.85;margin-left:4px;color:#fff}
.flat tr.clickrow{cursor:pointer}

.flat .who{gap:8px}

.pace{display:flex;align-items:center;gap:10px;justify-content:flex-end}

.topbar .grow{flex:1;min-width:0}

.howto{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

/* scrolling tables with a sticky header */
.tbl.scroll{max-height:460px;overflow:auto}

<body style="visibility:hidden">
<div class="content portal">
  <div class="topbar"><div class="grow"><h1 id="ptitle">Chain Store Hub</h1><div class="sub" id="psub"></div></div><div id="tctl"></div><button type="button" class="btn" id="hubRefresh">↻ Refresh</button></div>
  <nav id="tabs" class="ptabs" aria-label="Hub sections" role="tablist"></nav>
  <div id="asof" class="asofline"></div>
  <div id="strip" hidden></div>
  <main id="main"><div class="empty">Loading the latest orders, sales and AR…</div></main>
</div>
<div id="drawer"></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<script src="/shared/side-nav.js"></script>
<script>window.DFL_PAGE_TITLE = 'Chain Store Hub';</script>
<script>
window.__hubBoot = function (S, O, P, HUBD) {

'use strict';
// ---------- basics ----------
// 'today' = the day of the latest refresh (sales data may lag a few hours behind orders)
const ASOF = (() => { let b = S.asof; try { if (O.sync && O.sync.built) b = new Date(O.sync.built).toLocaleDateString('en-CA', {timeZone:'America/Jamaica'}); } catch (e) {} return b > S.asof ? b : S.asof; })();
const TODAY = new Date(ASOF + 'T12:00:00');
const MON = ASOF.slice(0,7);                 // current month YYYY-MM
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d8 = s => new Date(s + 'T12:00:00');
const daysBetween = (a, b) => Math.round((d8(b) - d8(a)) / 864e5);
const addDays = (s, n) => { const d = d8(s); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const fd = s => s ? d8(s).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) : '';
const fds = s => s ? d8(s).toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : '';
const J = n => { n = +n || 0; const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + 'J$' + (a/1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e3) return s + 'J$' + Math.round(a/1e3).toLocaleString('en-US') + 'K';
  return s + 'J$' + Math.round(a).toLocaleString('en-US'); };
const Jk = k => J((+k || 0) * 1000);
const pct = (a, b) => b ? Math.round((a - b) / Math.abs(b) * 100) : null;
const pctTxt = p => p == null ? '–' : (p > 0 ? '+' : '') + p + '%';
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; };
const short = id => String(id).replace(/^C0+/, '');
const keyOk = k => String(k).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 180);

// ---------- chains and stores ----------
const chainOf = n => { n = n.toUpperCase();
  if (n.startsWith('HILO')) return 'Hi-Lo';
  // Progressive and Shoppers Fair are one group (Scott, 5 Nov 2026)
  if (n.includes('SHOPPERS FAIR') || n.startsWith('PROGRESSIVE')) return 'Progressive / Shoppers Fair';
  if (n.startsWith('MEGAMART')) return 'MegaMart';
  if (n.startsWith('SAMPARS') || n.startsWith('SELECT GROCERS')) return 'Sampars / Select';
  if (n.startsWith("JR'S")) return "JR's Bargain World";
  if (n.startsWith('PRICE SMART')) return 'PriceSmart';
  if (n.startsWith('SUPER VALU')) return 'Super Valu';
  if (n.startsWith('D & Y')) return 'D & Y';
  return 'Other'; };
const nice = n => n.replace(/\.$/, '').toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bHilo\b/g, 'Hi-Lo').replace(/\bMegamart\b/g, 'MegaMart').replace(/\bUwi\b/g, 'UWI').replace(/\bMobay\b/g, 'MoBay').replace(/\bJr'S\b/g, "JR's").replace(/\bBlvd\b/g, 'Blvd').replace(/\bT\/A\b/g, 't/a').replace(/\bLtd\b/g, 'Ltd').replace(/\s+/g, ' ').trim();
const firstName = n => (n || '').split(/[ ,]/)[0];

const STORES = S.stores.map(r => ({id:r[0], raw:r[1], name:nice(r[1]), chain:chainOf(r[1]), area:r[2], parent:r[3], terms:r[4], phone:r[5], merch:r[6] || '', sday:r[7] || '', rep:(S.rep || {})[r[0]] || ''}))
  .sort((a, b) => a.chain.localeCompare(b.chain) || a.name.localeCompare(b.name));
const byId = {}; STORES.forEach(s => byId[s.id] = s);
const CHAINS = [...new Set(STORES.map(s => s.chain))];
// head-office / billing accounts: kept for AR, left out of store lists (Progressive Grocers = Progressive/Shoppers Fair head office, Scott 5 Nov)
const HQ_IDS = new Set(['C000003799']);
const isHQ = s => HQ_IDS.has(s.id) || /HEAD OFFICE|WAREHOUSE/.test(s.raw);

// monthly sales (J$000) and budget
STORES.forEach(s => {
  s.mon = {}; (S.mon[s.id] || []).forEach(([m, r]) => s.mon[m] = r);
  s.bud = {}; ((S.bud || {})[s.id] || []).forEach(([m, b]) => s.bud[m] = b);
  s.days = ((S.days || {})[s.id] || []).filter(d => d <= ASOF);
});
const monAdd = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + String(m).padStart(2, '0'); };
const lyOf = ym => monAdd(ym, -12);

// working-day pace for the current month (Mon-Fri)
const workdays = (y, m, upto) => { let n = 0; const last = new Date(y, m, 0).getDate(); for (let d = 1; d <= (upto || last); d++) { const w = new Date(y, m - 1, d).getDay(); if (w && w < 6) n++; } return n; };
const [CY, CM] = MON.split('-').map(Number);
const WD_ALL = workdays(CY, CM), WD_DONE = Math.max(1, workdays(CY, CM, TODAY.getDate()));
// calendar quarter: Q_ALL = its three months, Q_DONE = the ones already finished
const QN = Math.floor((CM - 1) / 3) + 1, Q_ALL = [0, 1, 2].map(i => CY + '-' + String((QN - 1) * 3 + 1 + i).padStart(2, '0')), Q_DONE = Q_ALL.filter(k => k < MON);
const PACE = WD_DONE / WD_ALL;

// ---------- orders, lines, shipments ----------
const ORD = (O.orders || []).filter(o => o[1] === 'SO').map(o => ({nbr:o[0], status:o[2], date:o[3], sched:o[4], c:o[5], total:+o[6] || 0, qty:+o[7] || 0, by:o[8] || '', via:o[9] || ''}));
const ordBy = {}; ORD.forEach(o => ordBy[o.nbr] = o);
const LINES = (O.lines || []).filter(l => ordBy[l[0]]).map(l => ({nbr:l[0], sku:l[1], desc:l[2], oq:+l[3] || 0, open:+l[4] || 0, onhand:+l[5] || 0, price:+l[6] || 0, cls:l[7], status:l[8]}));
LINES.forEach(l => { (ordBy[l.nbr].lines = ordBy[l.nbr].lines || []).push(l); });
const SHIPS = (O.ships || []).map(s => ({nbr:s[0], c:s[1], order:s[2], status:s[3], date:s[4], value:+s[5] || 0, via:s[6] || '', created:s[7]}));
const shipsOfOrder = {}; SHIPS.forEach(s => (shipsOfOrder[s.order] = shipsOfOrder[s.order] || []).push(s));
const DEALS = O.deals || {};
const SHIPPED = s => /Confirmed|Completed|Invoiced/.test(s);
// trucker (Acumatica ship via): the shipment's is the reliable one; the order's is often blank. BATCHnn is a placeholder, not a trucker.
const realVia = v => v && !/^BATCH\d+$/i.test(v) ? v : '';
const truckOf = o => { const sh = (shipsOfOrder[o.nbr] || []).filter(s => realVia(s.via)).sort((a, b) => (b.date || '').localeCompare(a.date || '')); return sh.length ? realVia(sh[0].via) : realVia(o.via); };
const truckCell = v => v ? `<span class="truck" title="Ship via ${esc(v)}">${icon('orders', 2)}<span>${esc(v)}</span></span>` : '<span class="note" style="margin:0">–</span>';

// stage of an open order, in plain words
const stageOf = o => {
  const sh = (shipsOfOrder[o.nbr] || []).filter(s => !SHIPPED(s.status));
  if (o.status === 'Credit Hold') return {k:'credit', t:'Credit hold', c:'red', why:'Held by AR for the account balance'};
  if (o.status === 'On Hold') return {k:'hold', t:'On hold', c:'amber', why:'Keyed in but on hold'};
  if (o.status === 'Open') return {k:'open', t:'Keyed, not on a truck', c:'blue', why:'In Acumatica, not picked yet'};
  if (o.status === 'Shipping') return sh.length ? {k:'truck', t:'On a truck, not shipped', c:'amber', why:'Shipment ' + sh[0].nbr + (sh[0].via ? ' on ' + sh[0].via : '') + ' is ' + sh[0].status} : {k:'ship', t:'Shipping', c:'blue', why:'Being picked or loaded'};
  if (o.status === 'Back Order') return {k:'bo', t:'Part shipped, rest on back order', c:'amber', why:'Some lines waiting for stock'};
  return {k:'other', t:o.status, c:'grey', why:''}; };
ORD.forEach(o => { o.stage = stageOf(o); o.age = daysBetween(o.date, ASOF); });
const openOf = c => ORD.filter(o => o.c === c && o.status !== 'Back Order');

// deal tier check: is the order just short of the next free-goods tier?
const tierHint = l => {
  const d = DEALS[l.sku]; if (!d || !Array.isArray(d[1]) || l.oq < 3) return null;
  const tiers = d[1].map(t => ({buy:+t.buy, free:+t.free})).filter(t => t.buy && t.free).sort((a, b) => a.buy - b.buy);
  const next = tiers.find(t => t.buy > l.oq); if (!next) return null;
  const gap = next.buy - l.oq; if (gap > Math.max(3, next.buy * 0.3)) return null;
  const cur = [...tiers].reverse().find(t => t.buy <= l.oq);
  return {add:gap, buy:next.buy, free:next.free, cur:cur ? cur.free : 0}; };

// order checks on orders that can still change (Open / On Hold)
const CHECKS = [];
ORD.filter(o => o.status === 'Open' || o.status === 'On Hold').forEach(o => (o.lines || []).forEach(l => {
  const h = tierHint(l);
  if (h) CHECKS.push({kind:'deal', o, l, h, key:'deal:' + o.nbr + ':' + l.sku, value:h.add * l.price});
  if (l.open > 0 && l.onhand < l.open) CHECKS.push({kind:'stock', o, l, key:'stock:' + o.nbr + ':' + l.sku, value:(l.open - Math.max(0, l.onhand)) * l.price});
}));

// back-order lines (still open on Back Order orders)
const BO = LINES.filter(l => ordBy[l.nbr].status === 'Back Order' && l.open > 0).map(l => ({...l, c:ordBy[l.nbr].c, date:ordBy[l.nbr].date, age:daysBetween(ordBy[l.nbr].date, ASOF), canShip:l.onhand >= l.open}));

// short-shipped lines, last 90 days: one row per order + item (split shipments added together)
const SHORT = (() => { const m = {};
  (O.short || []).forEach(r => { const k = r[2] + '|' + r[3];
    const x = m[k] = m[k] || {c:r[0], date:r[1], order:r[2], sku:r[3], desc:r[4], oq:+r[5] || 0, sq:0, price:+r[7] || 0};
    x.oq = Math.max(x.oq, +r[5] || 0); x.sq += +r[6] || 0; if (r[1] > x.date) x.date = r[1]; });
  return Object.values(m).filter(x => x.sq < x.oq); })();
const shortBySku = (() => { const m = {};
  SHORT.forEach(x => { const s = m[x.sku] = m[x.sku] || {sku:x.sku, desc:x.desc, n:0, stores:new Set(), qty:0, val:0, last:''};
    s.n++; s.stores.add(x.c); s.qty += x.oq - x.sq; s.val += (x.oq - x.sq) * x.price; if (x.date > s.last) s.last = x.date; });
  return Object.values(m).sort((a, b) => b.n - a.n || b.val - a.val); })();

// ---------- order cadence (from invoice days, last 150 days) ----------
// DFL doesn't deliver at weekends: a due date on Saturday or Sunday moves to the Monday after (Scott, 5 Nov)
const toWorkday = ds => { const w = d8(ds).getDay(); return w === 6 ? addDays(ds, 2) : w === 0 ? addDays(ds, 1) : ds; };
STORES.forEach(s => {
  const d = s.days.filter(x => x >= addDays(ASOF, -120));
  const gaps = []; for (let i = 1; i < d.length; i++) gaps.push(daysBetween(d[i-1], d[i]));
  const med = gaps.length >= 3 ? Math.max(2, Math.round(median(gaps.slice(-12)))) : null;
  const last = s.days[s.days.length - 1] || null;
  const since = last ? daysBetween(last, ASOF) : null;
  const open = openOf(s.id);
  const next = last && med ? toWorkday(addDays(last, med)) : null;
  let state = 'ok', late = 0;
  if (!med || isHQ(s)) state = 'irregular';
  else { late = daysBetween(next, ASOF);   // days past the working-day due date
    if (open.length) state = 'inhand';
    else if (late >= Math.max(4, Math.round(med * 0.6))) state = 'missed';
    else if (late >= 2) state = 'due'; }
  s.cad = {med, last, since, late, state, next, open, n8:s.days.filter(x => x > addDays(ASOF, -56)).length};
});
const CAD = {missed:['red', 'Missed'], due:['amber', 'Due now'], inhand:['blue', 'Order in'], ok:['green', 'On track'], irregular:['grey', 'Irregular']};

// ---------- sales vs budget ----------
const PER = {}; (P.pc || []).forEach(([c, cls, y, yl, m, ml]) => { const s = PER[c] = PER[c] || {ytd:0, ytdly:0, mtd:0, mtdly:0, cats:{}};
  s.ytd += +y || 0; s.ytdly += +yl || 0; s.mtd += +m || 0; s.mtdly += +ml || 0; s.cats[cls] = {y:+y || 0, yl:+yl || 0, m:+m || 0, ml:+ml || 0}; });
const LYTO = P.ly_to;
const CB = {}; (P.cb || []).forEach(([c, cls, b]) => { (CB[c] = CB[c] || {})[cls] = (+b || 0); });
STORES.forEach(s => {
  const m = s.mon;
  s.mtd = (m[MON] || 0) * 1000; s.budM = (s.bud[CM] || 0) * 1000;
  const last3 = [1, 2, 3].map(i => monAdd(MON, -i));
  s.l3 = last3.reduce((a, k) => a + (m[k] || 0), 0) * 1000;
  s.l3ly = last3.reduce((a, k) => a + (m[lyOf(k)] || 0), 0) * 1000;
  s.trend = pct(s.l3, s.l3ly);
  // same-period comparisons (to the same day last year), from the period query
  const p = PER[s.id] || {ytd:0, ytdly:0, mtd:0, mtdly:0, cats:{}};
  s.ytd = p.ytd; s.ytdly = p.ytdly; s.mtd = p.mtd; s.mtdly = p.mtdly; s.cats = p.cats;
  s.ytdD = s.ytd - s.ytdly; s.ytdP = pct(s.ytd, s.ytdly); s.mtdD = s.mtd - s.mtdly; s.mtdP = pct(s.mtd, s.mtdly);
  s.gapPace = s.mtd - s.budM * PACE;
  // quarter to date: finished months of the quarter (monthly sales) + this month to date; last year the same way
  s.qtd = Q_DONE.reduce((a, k) => a + (m[k] || 0), 0) * 1000 + s.mtd;
  s.qtdly = Q_DONE.reduce((a, k) => a + (m[lyOf(k)] || 0), 0) * 1000 + s.mtdly;
  s.qtdD = s.qtd - s.qtdly; s.qtdP = pct(s.qtd, s.qtdly);
  s.qBud = Q_ALL.reduce((a, k) => a + (s.bud[+k.slice(5)] || 0), 0) * 1000;
  s.qGap = s.qtd - (Q_DONE.reduce((a, k) => a + (s.bud[+k.slice(5)] || 0), 0) * 1000 + s.budM * PACE);
});
const TOT = (() => { const t = {mtd:0, mtdly:0, ytd:0, ytdly:0, bud:0, dec:0, l3:0, l3ly:0};
  STORES.forEach(s => { t.mtd += s.mtd; t.mtdly += s.mtdly; t.ytd += s.ytd; t.ytdly += s.ytdly; t.bud += s.budM; t.dec += (s.bud[12] || 0) * 1000; t.l3 += s.l3; t.l3ly += s.l3ly; });
  t.run = t.mtd / PACE; return t; })();

// ---------- category intelligence ----------
const CAT = {}; (S.cat || []).forEach(([c, cls, r, ly]) => { (CAT[c] = CAT[c] || []).push({cls:cls || 'Unclassified', r:(+r || 0) * 1000, ly:(+ly || 0) * 1000}); });
const SKUD = S.skud || {};
const SKU = {}; (S.sku || []).forEach(([c, sku, r, ly, last]) => { (SKU[c] = SKU[c] || []).push({sku, r:(+r || 0) * 1000, ly:(+ly || 0) * 1000, last}); });
const stoppedOf = c => (SKU[c] || []).filter(x => x.ly >= 10000 && x.r <= 0).sort((a, b) => b.ly - a.ly);
// products by store and category, YTD vs the same days last year (period query; MOQ lines left out)
const PS = {}; (P.ps || []).forEach(([c, sku, cls, y, yl]) => { const k = c + '|' + cls; (PS[k] = PS[k] || []).push({sku, y:+y || 0, yl:+yl || 0, d:(+y || 0) - (+yl || 0)}); });
const PSD = P.psd || {}, PS_READY = !!P.ps;
const peerGapOf = s => { const peers = STORES.filter(p => p.chain === s.chain && p.id !== s.id && !isHQ(p)); if (peers.length < 2) return [];
  const have = new Set((SKU[s.id] || []).filter(x => x.r > 0).map(x => x.sku)); const cnt = {}, val = {};
  peers.forEach(p => (SKU[p.id] || []).filter(x => x.r > 3000).forEach(x => { cnt[x.sku] = (cnt[x.sku] || 0) + 1; val[x.sku] = (val[x.sku] || 0) + x.r; }));
  return Object.keys(cnt).filter(k => !have.has(k) && cnt[k] >= Math.max(2, Math.ceil(peers.length * 0.5))).map(k => ({sku:k, n:cnt[k], of:peers.length, avg:val[k] / cnt[k]})).sort((a, b) => b.avg - a.avg).slice(0, 8); };
const chainCat = (() => { const m = {}; Object.values(CAT).flat().forEach(x => { const t = m[x.cls] = m[x.cls] || {cls:x.cls, r:0, ly:0}; t.r += x.r; t.ly += x.ly; });
  return Object.values(m).filter(x => x.r + x.ly > 200000).sort((a, b) => (a.r - a.ly) - (b.r - b.ly)); })();

// ---------- AR ----------
const AR = (O.ar || []).map(r => ({c:r[0], type:r[1], ref:r[2], doc:r[3], due:r[4], bal:+r[5] || 0, aged:+r[6] || 0, credit:!!r[7]}));
const arChain = c => byId[c] ? byId[c].chain : (STORES.find(s => s.parent === c || s.id === c) || {}).chain || 'Other';
const PAYS = (O.pays || []).map(p => ({c:p[0], date:p[1], amt:+p[2] || 0, ref:p[3]}));
const CH = {}; CHAINS.forEach(ch => CH[ch] = {chain:ch, owed:0, notdue:0, b30:0, b60:0, b90:0, old:0, credits:[], inv:[], pays:[], stores:STORES.filter(s => s.chain === ch)});
AR.forEach(r => { const ch = CH[arChain(r.c)]; if (!ch) return;
  if (r.bal < 0) { ch.credits.push(r); return; }
  const late = r.due ? daysBetween(r.due, ASOF) : 0; r.late = late;
  if (late > 365) { ch.old += r.bal; return; }
  ch.owed += r.bal; ch.inv.push(r);
  if (late <= 0) ch.notdue += r.bal; else if (late <= 30) ch.b30 += r.bal; else if (late <= 60) ch.b60 += r.bal; else ch.b90 += r.bal; });
// payment rhythm: account payments of J$50K+ grouped by day
Object.values(CH).forEach(ch => {
  const byDay = {}; PAYS.filter(p => byId[p.c] && byId[p.c].chain === ch.chain).forEach(p => byDay[p.date] = (byDay[p.date] || 0) + p.amt);
  ch.pays = Object.entries(byDay).filter(([, a]) => a >= 50000).map(([date, amt]) => ({date, amt})).sort((a, b) => a.date < b.date ? 1 : -1);
  const ds = ch.pays.map(p => p.date).reverse(); const gaps = []; for (let i = 1; i < ds.length; i++) gaps.push(daysBetween(ds[i-1], ds[i]));
  ch.payGap = gaps.length >= 2 ? Math.round(median(gaps)) : null;
  ch.payDom = ch.pays.length >= 2 ? Math.round(median(ch.pays.map(p => d8(p.date).getDate()))) : null;
  ch.lastPay = ch.pays[0] || null;
  ch.nextPay = ch.lastPay && ch.payGap ? addDays(ch.lastPay.date, ch.payGap) : null;
  ch.past = ch.b30 + ch.b60 + ch.b90;
  ch.credTot = ch.credits.reduce((a, r) => a + r.bal, 0);
});
const AR_CH = Object.values(CH).filter(ch => ch.owed + ch.old + Math.abs(ch.credTot) > 0).sort((a, b) => b.past - a.past || b.owed - a.owed);
const rhythm = ch => !ch.pays.length ? 'No account payments of J$50K+ in the last 6 months' :
  ch.payGap && ch.payGap <= 10 ? `Pays about every ${ch.payGap} days` :
  ch.payDom ? `Usually pays around the ${ord(ch.payDom)} of the month` : 'Paid once in 6 months';
function ord(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

// monthly sales, this year against last year, for the stores in view
function monthChart(list) {
  const ms = []; for (let m = 1; m <= CM; m++) ms.push(CY + '-' + String(m).padStart(2, '0'));
  const cur = ms.map(m => list.reduce((a, s) => a + (s.mon[m] || 0), 0) * 1000), ly = ms.map(m => list.reduce((a, s) => a + (s.mon[lyOf(m)] || 0), 0) * 1000);
  const W = 720, H = 210, L = 46, B = 26, T = 10, mx = Math.max(1, ...cur, ...ly);
  const step = Math.pow(10, Math.floor(Math.log10(mx))), nice = Math.ceil(mx / step) * step, ticks = [0, nice / 2, nice];
  const gw = (W - L - 8) / ms.length, bw = Math.min(18, gw * 0.32), y = v => H - B - Math.max(0, v) / nice * (H - B - T);
  return `<section class="chart"><h3>Monthly sales <span><i style="background:#326BD3"></i>${CY}</span><span><i style="background:#C9D3E6"></i>${CY - 1}</span><span class="note" style="margin:0">${MON === ms[ms.length - 1] ? fds(ASOF) + ' is month to date' : ''}</span></h3>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly sales this year against last year">
  ${ticks.map(t => `<line x1="${L}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}" stroke="#EEF1F6"/><text x="${L - 6}" y="${y(t) + 4}" font-size="10" text-anchor="end" fill="#8A95B0" font-family="Open Sans, sans-serif">${J(t).replace('J$', '')}</text>`).join('')}
  ${ms.map((m, i) => { const cx = L + gw * i + gw / 2; return `<rect x="${cx - bw - 1}" y="${y(ly[i])}" width="${bw}" height="${H - B - y(ly[i])}" rx="3" fill="#C9D3E6"><title>${d8(m + '-01').toLocaleDateString('en-GB', {month:'short'})} ${CY - 1}: ${J(ly[i])}</title></rect><rect x="${cx + 1}" y="${y(cur[i])}" width="${bw}" height="${H - B - y(cur[i])}" rx="3" fill="#326BD3"><title>${d8(m + '-01').toLocaleDateString('en-GB', {month:'short'})} ${CY}: ${J(cur[i])}</title></rect><text x="${cx}" y="${H - 8}" font-size="10.5" text-anchor="middle" fill="#4A5578" font-family="Open Sans, sans-serif">${d8(m + '-01').toLocaleDateString('en-GB', {month:'short'})}</text>`; }).join('')}
  </svg></section>`;
}

<script>
// ---------- Chain Store Hub: live data loader (portal) ----------
// Data comes from public.chain_hub_data(part) — read-only, managers/admins only.
// Notes and ticks live in public.chain_hub_notes / chain_hub_ticks.

async function loadParts(parts) {
  const res = await Promise.all(parts.map(p => sb.rpc('chain_hub_data', { p_part: p })));
