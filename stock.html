<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1B3E">
<title>DFL · Stock & Prices</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body { visibility: hidden; }</style>
<style>
:root{
  --blue:#326BD3; --navy:#0D1B3E; --navy2:#16264d;
  --ink:#0D1B3E; --mut:#6b7794; --line:#e6eaf2; --bg:#f4f6fb;
  --good:#1f9d64; --bad:#d64545; --card:#fff;
  --shadow:0 1px 3px rgba(13,27,62,.08),0 4px 16px rgba(13,27,62,.06);
  --content-max:640px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px;-webkit-font-smoothing:antialiased}
h1,.mont{font-family:'Montserrat',sans-serif}

.hdr{background:var(--navy);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:12px}
.hdr a{color:rgba(255,255,255,.7);text-decoration:none;font-size:20px;line-height:1}
.hdr h1{font-size:16px;font-weight:800;margin:0;flex:1}
.hdr button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}

.wrap{max-width:var(--content-max);margin:0 auto;padding:16px}
</style>
</head>
<body>

<div class="hdr">
  <a href="/index.html" title="Back">‹</a>
  <h1 class="mont">📦 Stock &amp; Prices</h1>
  <button type="button" onclick="STOCK.load(true)">↻ Refresh</button>
</div>

<div class="wrap" id="stock"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<script src="/shared/stock-prices.js"></script>
<script>
// Stock on hand + list price for every active SKU. The list itself is
// /shared/stock-prices.js, the same module behind Stock & Prices in merch.html.
// avg_cost is denied to clients by the DB (column grants; selecting it 401s).
const SB_URL="https://hzagwndglwhcepsirafi.supabase.co";
const SB_KEY="sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h";
const H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY};

const STOCK=DFL_STOCK.mount(document.getElementById('stock'),{
  get: async path=>{ const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:H}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); },
  theme:{ink:'var(--ink)',text:'var(--ink)',muted:'var(--mut)',line:'var(--line)',card:'var(--card)',good:'var(--good)',bad:'var(--bad)',shadow:'var(--shadow)'}
});
document.addEventListener('dfl-auth-ready', () => { STOCK.load(false); });
</script>
</body>
</html>
