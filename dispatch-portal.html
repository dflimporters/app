<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFL Dispatch Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg:#f0f4f8; --white:#ffffff; --navy:#0f2044;
  --accent:#2563eb; --accent-light:#dbeafe;
  --green:#16a34a; --green-light:#dcfce7;
  --amber:#d97706; --amber-light:#fef3c7;
  --red:#dc2626; --red-light:#fee2e2;
  --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --radius:12px;
  --font:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;min-height:100vh}

/* HEADER */
.header{background:var(--navy);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;gap:10px}
.header-left{display:flex;align-items:center;gap:12px;flex-shrink:0}
.dfl-logo{height:34px;width:auto;object-fit:contain;display:block}
.logo-fallback{display:none;flex-direction:column;line-height:1}
.logo-top{font-size:9px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.4)}
.logo-main{font-size:17px;font-weight:800;color:#fff}
.logo-main span{color:#38bdf8}
.divider-v{width:1px;height:26px;background:rgba(255,255,255,0.15);flex-shrink:0}
.page-label{font-size:13px;font-weight:600;color:rgba(255,255,255,0.7);white-space:nowrap}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.header-select{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;color:#fff;font-family:var(--font);font-size:12px;font-weight:600;padding:5px 10px;cursor:pointer;outline:none}
.header-select option{background:#1e293b;color:#fff}
.live-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,0.5)}
.live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
.header-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;display:inline-flex;align-items:center;gap:5px;font-family:var(--font);transition:all .15s}
.header-btn:hover{background:rgba(255,255,255,0.2)}

/* TABS */
.tab-bar{display:flex;gap:3px;background:rgba(255,255,255,0.08);padding:3px;border-radius:7px;border:1px solid rgba(255,255,255,0.12)}
.tab{padding:5px 14px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,0.55);transition:all .15s;font-family:var(--font)}
.tab.active{background:rgba(255,255,255,0.15);color:#fff}

/* SEARCH */
.search-wrap{position:relative}
.search-wrap input{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;color:#fff;font-family:var(--font);font-size:12px;padding:5px 10px 5px 30px;outline:none;width:200px}
.search-wrap input::placeholder{color:rgba(255,255,255,0.4)}
.search-wrap input:focus{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.35)}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.45);font-size:14px;pointer-events:none}
.search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.4);font-size:13px;display:none;padding:0}

/* CONTENT */
#app{padding:16px;display:flex;flex-direction:column;gap:12px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--white);border-radius:var(--radius);padding:14px;border:1px solid var(--border)}
.stat-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px}
.stat-icon.blue{background:var(--accent-light);color:var(--accent)}
.stat-icon.green{background:var(--green-light);color:var(--green)}
.stat-icon.amber{background:var(--amber-light);color:var(--amber)}
.stat-icon.navy{background:#e8edf5;color:var(--navy)}
.stat-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px}
.stat-value{font-size:22px;font-weight:800;line-height:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:3px}

/* ERROR */
.error-bar{background:var(--red-light);color:var(--red);padding:10px 14px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;border:1px solid #fca5a5}

/* DRIVER GROUPS */
.driver-group{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.driver-header{padding:13px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;user-select:none;transition:background .15s}
.driver-header:hover{background:#f8fafc}
.driver-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);flex-shrink:0}
.driver-avatar.unassigned{background:var(--amber-light);color:var(--amber)}
.driver-info{flex:1;min-width:0}
.driver-name{font-weight:700;font-size:14px}
.driver-meta{font-size:12px;color:var(--muted);margin-top:2px}
.driver-preview{font-size:11px;color:#94a3b8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.driver-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chevron{transition:transform .2s;color:var(--muted);font-size:18px}
.chevron.open{transform:rotate(180deg)}

/* BADGES */
.badge{padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.badge-blue{background:var(--accent-light);color:var(--accent)}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-amber{background:var(--amber-light);color:var(--amber)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-neutral{background:#f1f5f9;color:var(--muted);border:1px solid var(--border)}

/* INVOICE TABLE */
.invoice-table{border-top:1px solid var(--border)}
.invoice-row{display:grid;grid-template-columns:32px 1fr 110px 80px 110px 80px 70px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);gap:8px;font-size:13px}
.invoice-row.header-row{background:#f8fafc;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:7px 16px}
.invoice-row.sent-row{opacity:0.5}
.invoice-expand-row{border-bottom:1px solid var(--border);background:#f8fafc}
.select-all-row{padding:8px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;background:#f8fafc}
.cb{width:15px;height:15px;cursor:pointer;accent-color:var(--accent)}
.warn-icon{color:var(--amber);font-size:15px}
.load-tag{font-family:monospace;font-size:11px;background:#f1f5f9;border:1px solid var(--border);padding:2px 6px;border-radius:4px;color:var(--muted)}
.expand-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:15px;padding:3px;border-radius:4px;display:inline-flex;align-items:center}
.expand-btn:hover{background:var(--bg);color:var(--text)}
.dismiss-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:15px;padding:3px;border-radius:4px;display:inline-flex;align-items:center}
.dismiss-btn:hover{color:var(--red);background:var(--red-light)}

/* SEND BAR */
.send-bar{padding:11px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#f8fafc;gap:8px;flex-wrap:wrap}
.send-bar-info{font-size:13px;color:var(--muted)}
.send-bar-info strong{color:var(--text)}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:all .15s;font-family:var(--font)}
.btn:hover{background:var(--bg)}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{color:var(--red);border-color:#fca5a5}
.btn-danger:hover{background:var(--red-light)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,32,68,0.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem}
.modal{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:1.75rem;width:480px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(15,32,68,0.15)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;color:var(--text)}
.modal-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.25rem}
.modal-meta-item{background:var(--bg);border-radius:8px;padding:10px 14px;border:1px solid var(--border)}
.modal-meta-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px}
.modal-meta-value{font-size:15px;font-weight:700}
.modal-invoice-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-bottom:1.25rem}
.modal-invoice-item{padding:9px 14px;font-size:13px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-invoice-item:last-child{border-bottom:none}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem}
.info-box{background:var(--accent-light);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--accent);display:flex;align-items:center;gap:8px;border:1px solid #bfdbfe}
.dismiss-form select,.dismiss-form textarea{width:100%;margin-bottom:10px;font-size:13px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--white);color:var(--text);font-family:var(--font)}
.dismiss-form textarea{resize:vertical;min-height:75px}

/* HISTORY */
.panel{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.panel-head{padding:11px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:0.06em}
.history-table{width:100%;border-collapse:collapse;font-size:13px}
.history-table th{text-align:left;padding:9px 14px;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--border);background:#f8fafc}
.history-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.history-table tr:last-child td{border-bottom:none}
.history-table tr:hover td{background:#f8fafc}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:4rem 1rem;color:var(--muted)}
.empty-state i{font-size:40px;margin-bottom:14px;display:block;opacity:0.3}
.loading{text-align:center;padding:4rem;color:var(--muted);font-size:13px}

/* SUCCESS */
.success-center{text-align:center;padding:1rem 0}
.success-center i{font-size:48px;color:var(--green);margin-bottom:14px;display:block}

/* DATE DISPLAY */
.date-pill{font-size:11px;font-weight:600;color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);padding:3px 10px;border-radius:100px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <img class="dfl-logo"
      src="https://hzagwndglwhcepsirafi.supabase.co/storage/v1/object/public/Assets/DFL%20Logo%20Blue_White.png"
      alt="DFL Importers"
      onerror="this.style.display='none';document.querySelector('.logo-fallback').style.display='flex';">
    <div class="logo-fallback">
      <span class="logo-top">DFL Importers</span>
      <span class="logo-main">DFL <span>Hub</span></span>
    </div>
    <div class="divider-v"></div>
    <span class="page-label">Dispatch Portal</span>
  </div>
  <div class="header-right">
    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('dispatch')">Dispatch</button>
      <button class="tab" onclick="switchTab('history')">Batch History</button>
    </div>
    <div class="search-wrap">
      <i class="ti ti-search search-icon"></i>
      <input type="text" id="search-input" placeholder="Search…" oninput="applySearch()" autocomplete="off">
      <button class="search-clear" id="search-clear" onclick="clearSearch()"><i class="ti ti-x"></i></button>
    </div>
    <select class="header-select" id="date-filter" onchange="applyFilters()">
      <option value="all">Last 3 days</option>
      <option value="today" selected>Today</option>
      <option value="yesterday">Yesterday</option>
      <option value="tomorrow">Tomorrow</option>
    </select>
    <span class="date-pill" id="date-display"></span>
    <select class="header-select" id="driver-filter" onchange="applyFilters()"><option value="all">All drivers</option></select>
    <button class="header-btn" onclick="refresh()"><i class="ti ti-refresh"></i> Refresh</button>
    <div class="live-wrap"><div class="live-dot"></div> Live</div>
  </div>
</div>

<div id="app">
  <div id="error-container"></div>

  <div id="dispatch-tab">
    <div class="stats-row">
      <div class="stat">
        <div class="stat-icon blue"><i class="ti ti-file-invoice"></i></div>
        <div class="stat-label">Invoices</div>
        <div class="stat-value" id="s-invoices">—</div>
      </div>
      <div class="stat">
        <div class="stat-icon navy"><i class="ti ti-truck"></i></div>
        <div class="stat-label">Drivers</div>
        <div class="stat-value" id="s-drivers">—</div>
      </div>
      <div class="stat">
        <div class="stat-icon green"><i class="ti ti-currency-dollar"></i></div>
        <div class="stat-label">Total Value</div>
        <div class="stat-value" id="s-value">—</div>
      </div>
      <div class="stat">
        <div class="stat-icon amber"><i class="ti ti-checks"></i></div>
        <div class="stat-label">Selected</div>
        <div class="stat-value" id="s-selected">0</div>
        <div class="stat-sub">ready to batch</div>
      </div>
    </div>
    <div id="groups-container"><div class="loading"><i class="ti ti-loader-2"></i> Loading invoices…</div></div>
  </div>

  <div id="history-tab" style="display:none">
    <div id="history-container"><div class="loading"><i class="ti ti-loader-2"></i> Loading…</div></div>
  </div>
</div>

<div id="modal-container"></div>
<script>

const SUPA_URL = 'https://hzagwndglwhcepsirafi.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6YWd3bmRnbHdoY2Vwc2lyYWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTA1OTcsImV4cCI6MjA5MTY4NjU5N30.ZtU8gCK4TqDMRyES0sOm8iWDOHjkWPwHQEjepvu7PP4';
const H = {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};

// Jamaica is UTC-5 always (no DST)
const JM_OFFSET = -5;

function nowJM() {
  const now = new Date();
  return new Date(now.getTime() + (JM_OFFSET * 60 + now.getTimezoneOffset()) * 60000);
}

function fmtISO(d) { return d.toISOString().split('T')[0]; }

function getDateRange() {
  const today = nowJM();
  today.setHours(0,0,0,0);
  if (dateFilter === 'today')     return [fmtISO(today), fmtISO(today)];
  if (dateFilter === 'yesterday') { const y=new Date(today); y.setDate(y.getDate()-1); return [fmtISO(y),fmtISO(y)]; }
  if (dateFilter === 'tomorrow')  { const t=new Date(today); t.setDate(t.getDate()+1); return [fmtISO(t),fmtISO(t)]; }
  const fr=new Date(today); fr.setDate(fr.getDate()-2);
  const to=new Date(today); to.setDate(to.getDate()+1);
  return [fmtISO(fr), fmtISO(to)];
}

function updateDateDisplay() {
  const [from, to] = getDateRange();
  const el = document.getElementById('date-display');
  const opts = {month:'short', day:'numeric'};
  const f = d => new Date(d+'T12:00:00').toLocaleDateString('en-JM', opts);
  el.textContent = from === to ? f(from) : f(from) + ' – ' + f(to);
}

async function api(p) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+p, {headers:H});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function post(p, b) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+p, {method:'POST', headers:{...H,'Prefer':'return=representation'}, body:JSON.stringify(b)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function patch(p, b) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+p, {method:'PATCH', headers:H, body:JSON.stringify(b)});
  if (!r.ok) throw new Error(await r.text());
}

let allInvoices=[], allItems={}, selected={}, expandedInvoices=new Set(), openGroups=new Set();
let dateFilter='today', driverFilter='all', dismissTarget=null, searchQuery='';

function fmt(n) { return n==null?'—':'J$'+Math.round(n).toLocaleString(); }
function fmtDate(d) { return d?new Date(d+'T12:00:00').toLocaleDateString('en-JM',{month:'short',day:'numeric'}):'—'; }
function initials(n) {
  if(!n)return'?';
  const p=n.trim().split(/\s+/);
  return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():n.slice(0,2).toUpperCase();
}

function showError(msg) {
  const c=document.getElementById('error-container');
  c.innerHTML='<div class="error-bar"><i class="ti ti-alert-circle"></i>'+msg+'</div>';
  setTimeout(()=>c.innerHTML='',6000);
}

// Quote reference numbers for PostgREST in.(x,y) filter
function refsFilter(refs) {
  return 'in.('+refs.map(r=>'"'+r+'"').join(',')+')'
}

async function loadInvoices() {
  const [from,to] = getDateRange();
  updateDateDisplay();
  document.getElementById('groups-container').innerHTML='<div class="loading"><i class="ti ti-loader-2"></i> Loading invoices…</div>';
  try {
    const invs = await api('so_invoices?select=*&invoice_date=gte.'+from+'&invoice_date=lte.'+to+'&status=eq.Open&dismissed=eq.false&order=invoice_date.desc,customer_name.asc');
    allInvoices = invs;

    if (invs.length===0) { renderGroups([]); updateStats([]); return; }

    const refs = invs.map(i=>i.reference_number);

    // Quoted refs for PostgREST in() filter
    const refsQ = refs.map(r=>'"'+r+'"').join(',');
    const items = await api('invoiced_items?select=reference_number,inventory_id,description,quantity,uom,line_total&tran_type=eq.INV&reference_number=in.('+refsQ+')&limit=5000');
    allItems={};
    items.forEach(it=>{ if(!allItems[it.reference_number])allItems[it.reference_number]=[]; allItems[it.reference_number].push(it); });

    const custIds=[...new Set(invs.map(i=>i.customer_id).filter(Boolean))];
    let custMap={};
    if(custIds.length>0) {
      const custsQ = custIds.map(c=>'"'+c+'"').join(',');
      const custs = await api('customers_detrack?select=customer_id,needs_address,address_notes_flag,clean_address,clean_city,phone,shipping_zone&customer_id=in.('+custsQ+')');
      custs.forEach(c=>custMap[c.customer_id]=c);
    }
    allInvoices.forEach(inv=>inv._cust=custMap[inv.customer_id]||null);

    const sentJobs = await api('delivery_jobs?select=reference_number,load_number&reference_number=in.('+refsQ+')');
    const sentMap={};
    sentJobs.forEach(j=>sentMap[j.reference_number]=j.load_number);
    allInvoices.forEach(inv=>{ if(sentMap[inv.reference_number]){inv._sent=true;inv._loadNumber=sentMap[inv.reference_number];} });

    populateDriverFilter(invs);
    const filtered=filterInvoices(invs);
    renderGroups(filtered);
    updateStats(filtered);
  } catch(e) {
    showError('Failed to load: '+e.message);
    document.getElementById('groups-container').innerHTML='';
  }
}

function filterInvoices(invs) {
  return invs.filter(inv=>{
    const driverMatch = driverFilter==='all'||(inv.ship_via||'UNASSIGNED')===driverFilter;
    if(!driverMatch) return false;
    if(!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return (inv.customer_name||'').toLowerCase().includes(q) ||
           (inv.customer_id||'').toLowerCase().includes(q) ||
           (inv.reference_number||'').toLowerCase().includes(q) ||
           (inv.ship_via_description||'').toLowerCase().includes(q) ||
           (inv.ship_via||'').toLowerCase().includes(q) ||
           (inv._cust?.shipping_zone||'').toLowerCase().includes(q) ||
           (inv._cust?.clean_city||'').toLowerCase().includes(q);
  });
}

function populateDriverFilter(invs) {
  const sel=document.getElementById('driver-filter');
  const cur=sel.value;
  const seen=new Set();
  const opts=['<option value="all">All drivers</option>'];
  invs.forEach(i=>{
    const k=i.ship_via||'UNASSIGNED';
    if(!seen.has(k)){seen.add(k);const lbl=k==='UNASSIGNED'?'Unassigned':(i.ship_via_description||k);opts.push('<option value="'+k+'"'+(k===cur?' selected':'')+'>'+lbl+'</option>');}
  });
  sel.innerHTML=opts.join('');
}

function updateStats(invs) {
  document.getElementById('s-invoices').textContent=invs.length;
  document.getElementById('s-drivers').textContent=new Set(invs.map(i=>i.ship_via||'UNASSIGNED')).size;
  document.getElementById('s-value').textContent=fmt(invs.reduce((s,i)=>s+(i.amount||0),0));
  document.getElementById('s-selected').textContent=Object.values(selected).filter(Boolean).length;
}

function groupByDriver(invs) {
  const g={};
  invs.forEach(inv=>{
    const k=inv.ship_via||'UNASSIGNED';
    if(!g[k])g[k]={ship_via:inv.ship_via,desc:inv.ship_via_description,invoices:[]};
    g[k].invoices.push(inv);
  });
  return Object.entries(g).sort(([a],[b])=>{
    if(a==='UNASSIGNED')return 1; if(b==='UNASSIGNED')return -1; return a.localeCompare(b);
  });
}

function buildPreview(invoices) {
  // Customer names preview (up to 3) + unique zones
  const names = invoices.slice(0,3).map(i=>i.customer_name||'').filter(Boolean);
  const extra = invoices.length > 3 ? ' +' + (invoices.length-3) + ' more' : '';
  const zones = [...new Set(invoices.map(i=>i._cust?.shipping_zone).filter(Boolean))];
  let preview = names.join(', ') + extra;
  if (zones.length > 0) preview += '  ·  ' + zones.join(', ');
  return preview;
}

function renderGroups(invs) {
  const c=document.getElementById('groups-container');
  if(invs.length===0){c.innerHTML='<div class="empty-state"><i class="ti ti-truck-off"></i>No invoices found for this filter</div>';return;}
  c.innerHTML=groupByDriver(invs).map(([k,g])=>renderGroup(k,g)).join('');
  openGroups.forEach(k=>{
    const b=document.getElementById('body-'+k),ch=document.getElementById('chev-'+k);
    if(b){b.style.display='block';if(ch)ch.classList.add('open');}
  });
}

function renderGroup(key,g) {
  const ek=key.replace(/[^a-z0-9]/gi,'_');
  const isU=key==='UNASSIGNED';
  const totalVal=g.invoices.reduce((s,i)=>s+(i.amount||0),0);
  const selCount=g.invoices.filter(i=>selected[i.reference_number]).length;
  const sentCount=g.invoices.filter(i=>i._sent).length;
  const preview=buildPreview(g.invoices);
  return '<div class="driver-group" id="grp-'+ek+'">'+
    '<div class="driver-header" onclick="toggleGroup(\''+ek+'\')">'+
    '<div class="driver-avatar '+(isU?'unassigned':'')+'">'+(isU?'?':initials(g.desc||key))+'</div>'+
    '<div class="driver-info">'+
      '<div class="driver-name">'+(isU?'Unassigned':(g.desc||key))+'</div>'+
      '<div class="driver-meta">'+g.invoices.length+' invoice'+(g.invoices.length!==1?'s':'')+' &middot; '+fmt(totalVal)+'</div>'+
      (preview?'<div class="driver-preview">'+preview+'</div>':'')+
    '</div>'+
    '<div class="driver-actions">'+
    (isU?'<span class="badge badge-amber"><i class="ti ti-alert-triangle"></i> No driver</span>':'')+
    (sentCount>0?'<span class="badge badge-green"><i class="ti ti-check"></i> '+sentCount+' sent</span>':'')+
    (selCount>0?'<span class="badge badge-blue">'+selCount+' selected</span>':'')+
    '<i class="ti ti-chevron-down chevron" id="chev-'+ek+'"></i></div></div>'+
    '<div id="body-'+ek+'" style="display:none">'+renderInvoiceTable(g,key)+'</div></div>';
}

function renderInvoiceTable(g,key) {
  const selCount=g.invoices.filter(i=>selected[i.reference_number]).length;
  const unsentCount=g.invoices.filter(i=>!i._sent).length;
  const allSel=selCount===unsentCount&&unsentCount>0;
  const selVal=g.invoices.filter(i=>selected[i.reference_number]).reduce((s,i)=>s+(i.amount||0),0);
  const driverOpts=allInvoices.filter(i=>i.ship_via).reduce((acc,i)=>{
    if(!acc.find(x=>x.v===i.ship_via))acc.push({v:i.ship_via,l:i.ship_via_description||i.ship_via});return acc;
  },[]);
  return '<div class="invoice-table">'+
    '<div class="invoice-row header-row"><div></div><div>Customer</div><div>Ref #</div><div>Date</div><div style="text-align:right">Amount</div><div>Flags</div><div>Actions</div></div>'+
    '<div class="select-all-row"><input type="checkbox" class="cb" '+(allSel?'checked':'')+' onchange="toggleSelectAll(\''+key+'\',this.checked)"> Select all unsent ('+unsentCount+')</div>'+
    g.invoices.map(inv=>renderInvoiceRow(inv)).join('')+
    '<div class="send-bar">'+
    '<div class="send-bar-info"><strong>'+selCount+'</strong> selected &middot; <strong>'+fmt(selVal)+'</strong></div>'+
    '<div style="display:flex;gap:8px;align-items:center">'+
    (key==='UNASSIGNED'?'<select onchange="assignDriver(this.value)" style="font-size:12px;padding:5px 8px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary)"><option value="">Assign to driver…</option>'+driverOpts.map(d=>'<option value="'+d.v+'">'+d.l+'</option>').join('')+'</select>':'')+

    '<i class="ti ti-send"></i> Send to Detrack</button>'+

}

    '<div style="font-size:11px;color:var(--color-text-tertiary)">'+(inv.customer_id||'')+'</div></div>'+
    '<div style="font-family:var(--font-mono);font-size:12px">'+inv.reference_number+'</div>'+

function toggleGroup(ek) {
  const b=document.getElementById('body-'+ek),ch=document.getElementById('chev-'+ek);
  if(!b)return;
  const isOpen=b.style.display!=='none';
  b.style.display=isOpen?'none':'block';

  if(isOpen)openGroups.delete(ek);else openGroups.add(ek);
}

function toggleExpand(ref) {
  if(expandedInvoices.has(ref))expandedInvoices.delete(ref);else expandedInvoices.add(ref);
  renderGroups(filterInvoices(allInvoices));
}

function toggleSelect(ref,checked) {
  selected[ref]=checked;
  updateStats(filterInvoices(allInvoices));
  renderGroups(filterInvoices(allInvoices));
}

function toggleSelectAll(key,checked) {

  grp[1].invoices.filter(i=>!i._sent).forEach(inv=>selected[inv.reference_number]=checked);

function openBatchModal(key) {

  const [from]=getDateRange();
  const deliveryDate=new Date(from+'T12:00:00').toLocaleDateString('en-JM',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('modal-container').innerHTML=
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'+

    '<div class="modal-meta">'+
    '<div class="modal-meta-item"><div class="modal-meta-label">Driver</div><div class="modal-meta-value">'+driverName+'</div></div>'+
    '<div class="modal-meta-item"><div class="modal-meta-label">Delivery date</div><div class="modal-meta-value">'+deliveryDate+'</div></div>'+

    '<div class="info-box"><i class="ti ti-info-circle"></i> A load number will be auto-assigned on send.</div>'+
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="sendBatch(\''+key+'\')" id="send-btn"><i class="ti ti-send"></i> Confirm &amp; send</button></div>'+
    '</div></div>';
}

async function sendBatch(key) {
  const btn=document.getElementById('send-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Sending…';}
  const grp=groupByDriver(filterInvoices(allInvoices)).find(([k])=>k===key);
  if(!grp)return;
  const selInvs=grp[1].invoices.filter(i=>selected[i.reference_number]);
  let batchId=null;
  try {
    const [deliveryDate]=getDateRange();

    // Step 1: Create batch record (status=pending until Detrack confirms)
    const [batch]=await post('delivery_batches',{
      delivery_date:deliveryDate, ship_via:grp[1].ship_via||null,
      ship_via_description:grp[1].desc||null, status:'pending'
    });
    batchId=batch.id;
    const loadNumber=batch.load_number;

    // Step 2: Create job records
    const jobs=selInvs.map(inv=>({
      batch_id:batch.id, load_number:loadNumber,
      reference_number:inv.reference_number, customer_id:inv.customer_id,
      customer_name:inv.customer_name, invoice_date:inv.invoice_date,
      invoice_amount:inv.amount, ship_via:inv.ship_via,
      ship_via_description:inv.ship_via_description,
      delivery_address:inv._cust?.clean_address||null,
      delivery_city:inv._cust?.clean_city||null,
      delivery_phone:inv._cust?.phone||null,
      delivery_zone:inv._cust?.shipping_zone||null,
      items:allItems[inv.reference_number]||[],
      detrack_do_number:inv.reference_number
    }));
    await post('delivery_jobs',jobs);

    // Step 3: Push to Detrack
    if(btn)btn.innerHTML='<i class="ti ti-loader-2"></i> Pushing to Detrack…';
    const detrackRes=await fetch(
      'https://hzagwndglwhcepsirafi.supabase.co/functions/v1/push-to-detrack',
      {method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
       body:JSON.stringify({batch_id:batch.id})}
    );
    const detrackData=await detrackRes.json();
    if(!detrackRes.ok) throw new Error(detrackData.error||'Detrack push failed');

    const pushed=detrackData.pushed??0;
    const partial=detrackData.status==='partial';

    // Only mark as sent in UI if Detrack confirmed at least some jobs
    if(pushed===0) throw new Error('Detrack accepted the request but no jobs were created. Check logs.');

    selInvs.forEach(inv=>{inv._sent=true;inv._loadNumber=loadNumber;selected[inv.reference_number]=false;});
    closeModal();
    renderGroups(filterInvoices(allInvoices));
    updateStats(filterInvoices(allInvoices));
    document.getElementById('modal-container').innerHTML=
      '<div class="modal-overlay" onclick="closeModal()">'+
      '<div class="modal"><div class="success-center">'+
      '<i class="ti ti-circle-check"></i>'+
      '<h3 style="margin-bottom:8px">'+(partial?'Partially sent':'Batch sent!')+'</h3>'+
      '<p style="color:var(--color-text-secondary);font-size:13px;margin-bottom:4px">Load <strong>'+loadNumber+'</strong> — <strong>'+pushed+'</strong> of '+selInvs.length+' job'+(selInvs.length!==1?'s':'')+' pushed to Detrack</p>'+
      '<p style="color:var(--color-text-secondary);font-size:13px;margin-bottom:1.25rem">Driver: <strong>'+(grp[1].desc||key)+'</strong></p>'+
      (partial?'<p style="color:var(--color-text-warning);font-size:12px;margin-bottom:1rem">Some jobs failed — check Batch History for details.</p>':'')+
      '<button class="btn btn-primary" onclick="closeModal()">Done</button>'+
      '</div></div></div>';
  } catch(e) {
    // Rollback: delete the batch and jobs from Supabase so the invoice can be retried
    if(batchId) {
      try {
        await fetch(SUPA_URL+'/rest/v1/delivery_jobs?batch_id=eq.'+batchId,{method:'DELETE',headers:H});
        await fetch(SUPA_URL+'/rest/v1/delivery_batches?id=eq.'+batchId,{method:'DELETE',headers:H});
      } catch(re){console.error('Rollback failed:',re);}
    }
    closeModal();
    showError('Failed to send batch: '+e.message);
  }
}

// Resend by looking up batch_id from already-sent invoices in this driver group
async function resendBatchByRef(key) {
  const grp=groupByDriver(filterInvoices(allInvoices)).find(([k])=>k===key);
  if(!grp)return;
  const sentInv=grp[1].invoices.find(i=>i._sent&&i._loadNumber);
  if(!sentInv){showError('No sent jobs found for this group');return;}
  try {
    const batches=await api('delivery_batches?load_number=eq.'+sentInv._loadNumber+'&select=id,load_number');
    if(!batches||batches.length===0){showError('Batch not found: '+sentInv._loadNumber);return;}
    await resendBatch(batches[0].id, batches[0].load_number);
  } catch(e){showError('Resend failed: '+e.message);}
}

// Resend an existing batch to Detrack — for testing/recovery, bypasses duplicate check
async function resendBatch(batchId, loadNumber) {
  if(!confirm('Resend batch ' + loadNumber + ' to Detrack?\n\nThis will re-push all jobs. Use for testing or recovery only.')) return;
  try {
    const detrackRes = await fetch(
      'https://hzagwndglwhcepsirafi.supabase.co/functions/v1/push-to-detrack',
      {method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
       body:JSON.stringify({batch_id:batchId, force:true})}
    );
    const d = await detrackRes.json();
    if(!detrackRes.ok) throw new Error(d.error||'Detrack push failed');
    alert('Resent! ' + d.pushed + ' job(s) pushed to Detrack for load ' + loadNumber);
    loadHistory();
  } catch(e){showError('Resend failed: '+e.message);}
}

function openDismiss(ref) {
  dismissTarget=ref;
  const inv=allInvoices.find(i=>i.reference_number===ref);
  document.getElementById('modal-container').innerHTML=
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal" style="max-width:380px">'+
    '<h3><i class="ti ti-x"></i> Dismiss invoice</h3>'+
    '<p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:1rem">'+(inv?.customer_name||'')+' &middot; '+fmt(inv?.amount)+'</p>'+
    '<div class="dismiss-form">'+
    '<select id="dismiss-reason"><option value="">Select reason…</option><option>Already delivered</option><option>Customer pickup</option><option>Third-party carrier</option><option>Cancelled order</option><option>Duplicate invoice</option><option>Other</option></select>'+
    '<textarea id="dismiss-notes" placeholder="Additional notes (optional)…"></textarea>'+
    '</div>'+
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="confirmDismiss()"><i class="ti ti-x"></i> Dismiss</button></div>'+
    '</div></div>';
}

async function confirmDismiss() {
  const reason=document.getElementById('dismiss-reason').value;
  const notes=document.getElementById('dismiss-notes').value;
  if(!reason){alert('Please select a reason');return;}
  try {
    await patch('so_invoices?reference_number=eq.'+dismissTarget,{
      dismissed:true,dismissed_at:new Date().toISOString(),
      dismissed_by:'Batcher',dismiss_reason:reason+(notes?' — '+notes:'')
    });
    allInvoices=allInvoices.filter(i=>i.reference_number!==dismissTarget);
    delete selected[dismissTarget];
    closeModal();
    renderGroups(filterInvoices(allInvoices));
    updateStats(filterInvoices(allInvoices));
  } catch(e){showError('Failed to dismiss: '+e.message);}
}

function closeModal(){document.getElementById('modal-container').innerHTML='';}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='dispatch')||(i===1&&tab==='history')));
  document.getElementById('dispatch-tab').style.display=tab==='dispatch'?'block':'none';
  document.getElementById('history-tab').style.display=tab==='history'?'block':'none';
  if(tab==='history')loadHistory();
}

function applyFilters() {
  dateFilter=document.getElementById('date-filter').value;
  driverFilter=document.getElementById('driver-filter').value;
  selected={};expandedInvoices.clear();
  loadInvoices();
}

function applySearch() {
  searchQuery = document.getElementById('search-input').value.trim();
  const clearBtn = document.getElementById('search-clear');
  if(clearBtn) clearBtn.style.display = searchQuery ? 'block' : 'none';
  const filtered = filterInvoices(allInvoices);
  renderGroups(filtered);
  updateStats(filtered);
  // Auto-expand all groups when searching
  if(searchQuery) {
    groupByDriver(filtered).forEach(([k])=>{
      const ek=k.replace(/[^a-z0-9]/gi,'_');
      openGroups.add(ek);
    });
    renderGroups(filtered);
  }
}

function clearSearch() {
  document.getElementById('search-input').value='';
  searchQuery='';
  const clearBtn=document.getElementById('search-clear');
  if(clearBtn) clearBtn.style.display='none';
  renderGroups(filterInvoices(allInvoices));
  updateStats(filterInvoices(allInvoices));
}

function assignDriver(shipVia) {
  if(!shipVia)return;
  const inv=allInvoices.find(i=>i.ship_via===shipVia);
  allInvoices.filter(i=>!i.ship_via).forEach(i=>{i.ship_via=shipVia;i.ship_via_description=inv?.ship_via_description||shipVia;});
  renderGroups(filterInvoices(allInvoices));
}
