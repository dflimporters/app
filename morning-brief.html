<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Open Sans',sans-serif;background:#eef0f5;min-height:100vh;}
.toolbar{display:flex;gap:10px;justify-content:flex-end;padding:12px 12px 0;max-width:700px;margin:0 auto;}
.btn{border:none;border-radius:8px;padding:8px 18px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn-export{background:#326BD3;color:#fff;}
.btn-export:hover{background:#2558b8;}
.btn-export:disabled{background:#aaa;cursor:not-allowed;}
#dash{max-width:700px;margin:0 auto;padding:12px;}
.hdr{background:#0D1B3E;border-radius:12px;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.hdr-l{display:flex;align-items:center;gap:12px;}
.hdr-title{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;color:#fff;}
.hdr-sub{font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;}
.hdr-r{text-align:right;}
.hdr-date{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;color:#fff;}
.hdr-time{font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;}
.card{background:#fff;border-radius:12px;padding:15px 16px;margin-bottom:10px;}
.ctitle{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:800;color:#0D1B3E;text-transform:uppercase;letter-spacing:1.1px;border-bottom:2px solid #326BD3;padding-bottom:6px;margin-bottom:13px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px;}
.kpi{background:#f5f7fc;border-radius:8px;padding:10px 12px;}
.kpi.bl{border-left:3px solid #326BD3;}
.kpi.am{border-left:3px solid #E0900D;}
.kpi.gr{border-left:3px solid #2A8C4A;}
.kpi.pu{border-left:3px solid #6C5CE7;}
.kpi-lbl{font-size:8px;color:#8a90a4;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:3px;}
.kpi-val{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:800;color:#0D1B3E;line-height:1.1;}
.kpi-hint{font-size:9px;color:#bbb;margin-top:3px;}
.pace-outer{display:flex;align-items:center;gap:8px;}
.pace-lbl{font-size:9px;color:#8a90a4;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;flex-shrink:0;width:66px;}
.pace-track-wrap{flex:1;position:relative;overflow:visible;}
.track{width:100%;height:10px;background:#edf0f8;border-radius:5px;position:relative;overflow:visible;}
.fill{height:100%;border-radius:5px;}
.needle{position:absolute;top:50%;transform:translate(-50%,-50%);width:2px;height:20px;background:#0D1B3E;border-radius:1px;}
.needle-lbl{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:700;color:#0D1B3E;font-family:'Montserrat',sans-serif;white-space:nowrap;}
.pct-val{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;white-space:nowrap;flex-shrink:0;width:32px;text-align:right;}
.gap-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;font-family:'Montserrat',sans-serif;white-space:nowrap;flex-shrink:0;}
.ahead{background:#e7f5ec;color:#1a6633;}
.behind{background:#fdf0e7;color:#a05500;}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.cat-box{background:#f5f7fc;border-radius:8px;padding:10px 11px;border-top:3px solid #326BD3;}
.cat-box.g{border-top-color:#2A8C4A;}
.cat-box.a{border-top-color:#E0900D;}
.cat-box.r{border-top-color:#D03B3B;}
.cat-name{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:3px;color:#0D1B3E;}
.cat-pct{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;line-height:1;color:#0D1B3E;}
.cat-bar-bg{height:3px;background:#e3e7f0;border-radius:2px;margin-top:5px;}
.cat-bar-fg{height:100%;border-radius:2px;}
.rtable{width:100%;border-collapse:collapse;}
.rtable th{font-size:8px;font-weight:700;color:#8a90a4;text-transform:uppercase;letter-spacing:0.7px;padding:0 5px 7px;text-align:left;}
.rtable td{padding:5px 5px;vertical-align:middle;border-bottom:1px solid #f2f4f8;}
.rtable tr:last-child td{border-bottom:none;}
.rname{font-size:11px;color:#2c3451;font-weight:600;}
.rarea{font-size:8px;color:#bbb;margin-top:1px;}
.rbar-wrap{width:100%;height:7px;background:#edf0f8;border-radius:4px;position:relative;}
.rbar{height:100%;border-radius:4px;}
.rneedle{position:absolute;top:-2px;bottom:-2px;width:2px;background:#0D1B3E;opacity:0.3;border-radius:1px;}
.rpct{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;text-align:right;white-space:nowrap;}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:8px;font-weight:700;white-space:nowrap;}
.b-g{background:#e7f5ec;color:#1a6633;}
.b-a{background:#fdf0e7;color:#a05500;}
.b-r{background:#fbeaea;color:#943030;}
.footer{text-align:center;font-size:9px;color:#bbb;margin-top:6px;line-height:1.6;}
.loading{text-align:center;padding:60px;}
.spinner{width:28px;height:28px;border:3px solid #eee;border-top-color:#326BD3;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin-txt{font-family:'Montserrat',sans-serif;font-size:12px;color:#8a90a4;font-weight:600;}
</style>
</head>

      <div class="hdr-time" id="hdrTime"></div>
    </div>
  </div>
  <div id="content"><div class="loading"><div class="spinner"></div><div class="spin-txt">Loading latest data...</div></div></div>
  <div class="footer" id="ftr"></div>
</div>

<script>
window.DFL_PAGE_TITLE = 'Morning Brief';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<script src="/shared/side-nav.js"></script>

<script>
const SB_URL = 'https://hzagwndglwhcepsirafi.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6YWd3bmRnbHdoY2Vwc2lyYWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTA1OTcsImV4cCI6MjA5MTY4NjU5N30.ZtU8gCK4TqDMRyES0sOm8iWDOHjkWPwHQEjepvu7PP4';

const now = new Date();
document.getElementById('hdrDate').textContent = now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).toUpperCase();
document.getElementById('hdrTime').textContent = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) + ' · LIVE';

function fmtM(v) {
  v = parseFloat(v)||0;
  const m = Math.round(v/1e6);
  return 'J$' + m.toLocaleString() + 'M';
}
function pColor(p, pace) {
  if(p >= pace) return '#2A8C4A';
  if(p >= pace-5) return '#E0900D';
  return '#D03B3B';
}
function catCls(p, pace) {
  if(p >= pace) return 'g';
  if(p >= pace-5) return 'a';
  return 'r';
}
function repBadge(p, pace) {
  if(p >= pace) return ['b-g','▲ Ahead'];
  if(p >= pace-5) return ['b-a','Watch'];
  return ['b-r','Behind'];
}

async function loadData() {
  try {
    const res = await fetch(`${SB_URL}/rest/v1/morning_brief_cache?id=eq.1&select=*`, {
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
    });
    if(!res.ok) throw new Error('Failed to fetch: ' + res.status);
    const rows = await res.json();
    if(!rows || rows.length === 0) throw new Error('No data in cache');
    render(rows[0]);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div style="background:#fbeaea;border-radius:8px;padding:16px;color:#943030;font-size:12px;">⚠ ${e.message}</div>`;
  }
}

function render(d) {
  const PACE = parseInt(d.pace_pct);
  const ACH  = parseInt(d.ach_pct);
  const gap  = ACH - PACE;
  const achCol = pColor(ACH, PACE);
  const reps = d.rep_data || [];
  const cats = d.cat_data || [];
  const areas = d.area_data || [];

  // Period label
  const periodDate = new Date(d.data_as_at_date);
  document.getElementById('periodLabel').textContent = periodDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  document.getElementById('content').innerHTML = `
  <div class="card">
    <div class="ctitle">MTD Performance vs Target</div>
    <div class="kpis">
      <div class="kpi gr"><div class="kpi-lbl">Full Target</div><div class="kpi-val">${fmtM(d.full_target)}</div><div class="kpi-hint">monthly budget</div></div>

      <div class="kpi bl"><div class="kpi-lbl">Invoiced Sales</div><div class="kpi-val">${fmtM(d.net_invoiced)}</div><div class="kpi-hint">${parseInt(d.invoice_count).toLocaleString()} invoices MTD</div></div>
      <div class="kpi am"><div class="kpi-lbl">Sales to Go</div><div class="kpi-val">${fmtM(d.sales_to_go)}</div><div class="kpi-hint">to hit target</div></div>
      <div class="kpi" style="border-left:3px solid #E0900D;background:#fdf5ec;"><div class="kpi-lbl" style="color:#a05500;">Back Orders</div><div class="kpi-val" style="color:#a05500;">${fmtM(d.backorder_value)}</div><div class="kpi-hint" style="color:#c47020;">${parseInt(d.backorder_count).toLocaleString()} open orders</div></div>
    </div>

    <div class="pace-outer">
      <div class="pace-lbl">Achieved</div>
      <div class="pace-track-wrap">
        <div class="track">
          <div class="fill" style="width:${Math.min(ACH,100)}%;background:${achCol};"></div>
          <div class="needle" style="left:${PACE}%">
            <div class="needle-lbl">Pace ${PACE}%</div>
          </div>
        </div>
      </div>
      <div class="pct-val" style="color:${achCol}">${ACH}%</div>
      <span class="gap-pill ${gap>=0?'ahead':'behind'}">${gap>=0?'+'+gap:gap}% ${gap>=0?'ahead':'behind'}</span>
    </div>
  </div>

  <div class="card">
    <div class="ctitle">Area Performance vs Target &nbsp;·&nbsp; Dashed line = pace ${PACE}%</div>
    <div style="position:relative;width:100%;height:${areas.length*46+20}px">
      <canvas id="areaChart"></canvas>
    </div>
  </div>

  <div class="card">
    <div class="ctitle">Category Performance vs Target — Top 8 by Revenue</div>
    <div class="cat-grid">
      ${cats.map(c => {
        const col = pColor(c.pct, PACE);
        const cls = catCls(c.pct, PACE);
        return `<div class="cat-box ${cls}">
          <div class="cat-name">${c.n}</div>
          <div class="cat-pct">${c.pct}<span style="font-size:9px;font-weight:600;opacity:0.6">%</span></div>
          <div class="cat-bar-bg"><div class="cat-bar-fg" style="width:${Math.min(c.pct,100)}%;background:${col}"></div></div>
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="card">
    <div class="ctitle">Sales Rep Performance vs Target &nbsp;·&nbsp; Ranked highest to lowest</div>
    <table class="rtable">
      <thead><tr>
        <th style="width:28%">Rep</th>
        <th style="width:12%;text-align:right">Target</th>
        <th style="width:12%;text-align:right">MTD Rev</th>
        <th style="width:20%">Progress</th>
        <th style="width:10%;text-align:right">% Ach</th>
        <th style="width:18%;text-align:right">Status</th>
      </tr></thead>
      <tbody>
        ${reps.map((r,i) => {
          const col = pColor(r.pct, PACE);
          const [bc,bl] = repBadge(r.pct, PACE);
          return `<tr>
            <td><div class="rname">${i+1}. ${r.n}</div><div class="rarea">${r.area}</div></td>
            <td style="text-align:right;font-family:'Montserrat',sans-serif;font-size:10px;font-weight:600;color:#8a90a4;white-space:nowrap">${fmtM(r.target)}</td>
            <td style="text-align:right;font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;color:#0D1B3E;white-space:nowrap">${fmtM(r.actual)}</td>
            <td><div class="rbar-wrap">
              <div class="rbar" style="width:${Math.min(r.pct,100)}%;background:${col};"></div>
              <div class="rneedle" style="left:${PACE}%"></div>
            </div></td>
            <td class="rpct" style="color:${col}">${r.pct}%</td>
            <td style="text-align:right"><span class="badge ${bc}">${bl}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;

  document.getElementById('ftr').textContent =
    `Data to ${new Date(d.data_as_at_date).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'})} · Pace = end of ${new Date(d.pace_date).toLocaleDateString('en-US',{day:'numeric',month:'short'})} (${d.working_days_elapsed} of ${d.total_working_days} working days) · Refreshed at 6:45am daily · DFL Importers`;

  // Build area chart
  setTimeout(() => {
    const maxX = Math.ceil(Math.max(...areas.map(a=>a.pct), PACE) / 5) * 5 + 5;
    new Chart(document.getElementById('areaChart'), {
      type:'bar',
      data:{
        labels: areas.map(a=>a.name),
        datasets:[
          {label:'% to Target',data:areas.map(a=>a.pct),backgroundColor:areas.map(a=>pColor(a.pct,PACE)),borderRadius:5,borderSkipped:false,barThickness:26},
          {label:'Pace',data:areas.map(()=>PACE),type:'line',borderColor:'#0D1B3E',borderWidth:2,borderDash:[5,4],pointRadius:0,fill:false}
        ]
      },
      options:{
        indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.datasetIndex===0?` ${Math.round(ctx.parsed.x)}% to target`:` Pace: ${PACE}%`}}},
        scales:{
          x:{min:0,max:maxX,grid:{color:'#f0f2f7'},ticks:{font:{family:"'Open Sans',sans-serif",size:9},color:'#aaa',stepSize:5,callback:v=>Math.round(v)+'%'},border:{display:false}},
          y:{grid:{display:false},ticks:{font:{family:"'Open Sans',sans-serif",size:11,weight:'600'},color:'#3d4460',padding:6},border:{display:false}}
        },
        layout:{padding:{right:10,top:4}}
      }
    });
  }, 100);
}

async function doExport() {
  const btn = document.getElementById('btnExport');
  btn.disabled=true; btn.textContent='Exporting…';
  try {
    const c = await html2canvas(document.getElementById('dash'), {scale:2,useCORS:true,backgroundColor:'#eef0f5',logging:false});
    const a = document.createElement('a');
    a.download = 'DFL_Morning_Brief_' + new Date().toISOString().slice(0,10) + '.jpg';
    a.href = c.toDataURL('image/jpeg', 0.95);
    a.click();
  } catch(e) { alert('Export failed: ' + e.message); }
  btn.disabled=false; btn.innerHTML='&#8595; Export JPG';
}

loadData();
</script>
</body>
</html>
