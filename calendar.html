<!DOCTYPE html>
<html lang="en">
<head>
<meta name="theme-color" content="#0f2044">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Week — DFL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<style>
  :root { --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0; --navy:#0f2044; --navy2:#1a3260; --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8; --accent:#2563eb; --accent-bg:#eff6ff; --shadow:0 1px 3px rgba(0,0,0,0.07); --green:#16a34a; --green-bg:#f0fdf4; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
  nav { background:var(--navy); min-height:52px; display:flex; align-items:center; gap:12px; padding:10px 20px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .homebtn { background:none; border:none; color:#fff; cursor:pointer; padding:4px; display:flex; }
  .nav-title { font-size:14px; font-weight:600; color:#fff; }
  .nav-sub { font-size:11px; color:rgba(255,255,255,0.65); margin-left:auto; text-align:right; }
  .content { max-width:640px; margin:0 auto; padding:16px 16px 60px; }
  .empty { text-align:center; padding:60px 20px; color:var(--text-muted); font-size:14px; line-height:1.6; }
  .week-label { font-size:12px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:12px; }
  .day-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; box-shadow:var(--shadow); overflow:hidden; }
  .day-card.today { border:1.5px solid var(--accent); }
  .day-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; }
  .day-name { font-size:15px; font-weight:700; }
  .day-card.today .day-name { color:var(--accent); }
  .day-today-pill { font-size:10px; font-weight:700; background:var(--accent-bg); color:var(--accent); padding:2px 8px; border-radius:10px; margin-left:8px; text-transform:uppercase; letter-spacing:.04em; }
  .day-meta { font-size:12px; color:var(--text-dim); }
  .chev { transition:transform .15s; color:var(--text-dim); }
  .day-card.open .chev { transform:rotate(180deg); }
  .day-body { display:none; padding:0 16px 16px; }
  .day-card.open .day-body { display:block; }
  .zone-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .zone-tag { font-size:11px; font-weight:600; background:var(--accent-bg); color:var(--accent); padding:3px 9px; border-radius:8px; }
  .store-list { display:flex; flex-direction:column; gap:6px; }
  .store-item { font-size:13.5px; padding:9px 12px; background:var(--bg); border-radius:9px; }
  footer { text-align:center; padding:20px; font-size:11px; color:var(--text-dim); }
  .spin { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; margin:60px auto; animation:sp 0.8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<nav>
  <button class="homebtn" onclick="window.location.href='/index.html'" aria-label="Back">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="nav-title">📅 My Week</span>
  <span class="nav-sub" id="weekNote"></span>
</nav>

<div class="content" id="content"><div class="spin"></div></div>

<footer>© 2026 DFL Importers · Internal use only</footer>

<script>
const SB_URL = "https://hzagwndglwhcepsirafi.supabase.co";
const SB_KEY = "sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h";
const H = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY };
const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

document.addEventListener('dfl-auth-ready', (e) => { init(e.detail.profile); });

async function init(profile) {
  if (!profile.salesperson_id) {
    renderEmpty("No weekly plan to show for your account.");
    return;
  }
  try {
    const repRes = await fetch(`${SB_URL}/rest/v1/reps?salesperson_id=eq.${encodeURIComponent(profile.salesperson_id)}&select=name`, { headers: H });
    const repRows = await repRes.json();
    const name = Array.isArray(repRows) && repRows[0] ? repRows[0].name : null;
    if (!name) { renderEmpty("No weekly plan to show for your account."); return; }

    const planRes = await fetch(
      `${SB_URL}/rest/v1/weekly_plans?salesperson=eq.${encodeURIComponent(name)}&order=submitted_at.desc&limit=1&select=*`,
      { headers: H }
    );
    const planRows = await planRes.json();
    const plan = Array.isArray(planRows) && planRows[0] ? planRows[0] : null;
    if (!plan || !Array.isArray(plan.days) || plan.days.length === 0) {
      renderEmpty("No weekly plan submitted yet — add one under Weekly Plan.");
      return;
    }
    render(plan);
  } catch (err) {
    console.error(err);
    renderEmpty("Couldn't load your week right now. Try again shortly.");
  }
}

function renderEmpty(msg) {
  document.getElementById('content').innerHTML = `<div class="empty">${escapeHtml(msg)}</div>`;
}

function render(plan) {
  document.getElementById('weekNote').textContent = plan.week_commencing || '';
  const todayName = WEEKDAY_NAMES[new Date().getDay()];

  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="week-label">Week of ${escapeHtml(plan.week_commencing || '')}</div>
    ${plan.days.map((d, i) => {
      const isToday = d.day === todayName;
      const zones = Array.isArray(d.zones) ? d.zones : [];
      const stores = Array.isArray(d.stores) ? d.stores : [];
      return `
        <div class="day-card ${isToday ? 'today open' : ''}" id="day-${i}">
          <div class="day-head" onclick="toggleDay(${i})">
            <div><span class="day-name">${escapeHtml(d.day)}</span>${isToday ? '<span class="day-today-pill">Today</span>' : ''}</div>
            <div style="display:flex;align-items:center;gap:10px">
              <span class="day-meta">${stores.length} stop${stores.length !== 1 ? 's' : ''}</span>
              <svg class="chev" viewBox="0 0 24 24" width="18" height="18"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
          <div class="day-body">
            ${zones.length ? `<div class="zone-tags">${zones.map(z => `<span class="zone-tag">${escapeHtml(z)}</span>`).join('')}</div>` : ''}
            <div class="store-list">
              ${stores.length ? stores.map(s => `<div class="store-item">${escapeHtml(s)}</div>`).join('') : '<div class="store-item">No stops listed</div>'}
            </div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function toggleDay(i) {
  document.getElementById(`day-${i}`).classList.toggle('open');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
</script>
</body>
</html>
