<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Pending — DFL Staff Portal</title>
<style>body { visibility: hidden; }</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0;
    --navy:#0f2044; --navy2:#1a3260;
    --text:#1e293b; --text-muted:#64748b;
    --accent:#2563eb; --accent-bg:#eff6ff;
    --red:#dc2626; --red-bg:#fef2f2;
    --green:#15803d; --green-bg:#f0fdf4;
    --gold:#fbbf24; --gold-bg:#fffbeb;
    --shadow-md:0 4px 6px -1px rgba(0,0,0,0.07);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:40px 36px;
    width:100%; max-width:420px;
    box-shadow:var(--shadow-md);
    text-align:center;
  }
  .logo { height:34px; margin-bottom:24px; }

  .badge {
    display:inline-block; background:var(--gold-bg); color:#92400e;
    border:1px solid var(--gold);
    font-size:11px; font-weight:700; letter-spacing:0.4px;
    text-transform:uppercase; padding:5px 12px; border-radius:20px;
    margin-bottom:16px;
  }
  .title { font-size:19px; font-weight:700; margin-bottom:8px; }
  .sub { font-size:13px; color:var(--text-muted); margin-bottom:26px; line-height:1.6; }

  .message {
    font-size:13px; padding:10px 14px; border-radius:8px;
    margin-bottom:18px; text-align:left; line-height:1.5;
    display:none;
  }
  .message.show { display:block; }
  .message.error { background:var(--red-bg); color:var(--red); }
  .message.info { background:var(--accent-bg); color:var(--accent); }
  .message.success { background:var(--green-bg); color:var(--green); }

  .field { text-align:left; margin-bottom:18px; }
  .field label {
    display:block; font-size:12px; font-weight:600;
    color:var(--text-muted); margin-bottom:6px;
  }
  .field input {
    width:100%; padding:12px 14px;
    border:1px solid var(--border); border-radius:8px;
    /* 16px minimum: iOS Safari zooms the whole page when focusing an
       input smaller than this, which is jarring on a phone. */
    font-size:16px; font-family:'Inter',sans-serif; color:var(--text);
    background:var(--surface);
  }
  .field input:focus { outline:none; border-color:var(--accent); }

  .btn {
    width:100%; padding:12px 16px;
    border:none; border-radius:8px;
    font-size:14px; font-weight:600; font-family:'Inter',sans-serif;
    cursor:pointer; transition:background 0.15s;
  }
  .btn-primary { background:var(--navy); color:#fff; }
  .btn-primary:hover { background:var(--navy2); }
  .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
  .btn-secondary {
    background:var(--surface); color:var(--text-muted);
    border:1px solid var(--border); margin-top:10px;
  }
  .btn-secondary:hover { background:var(--bg); }

  .divider { height:1px; background:var(--border); margin:24px 0 20px; }

  .footer { margin-top:22px; font-size:11px; color:var(--text-muted); }
  .footer a { color:var(--text-muted); }

  @media (max-width: 640px) {
    .card { padding:32px 22px; }
  }
</style>
</head>
<body>

<div class="card">

  <img class="logo"
       src="https://hzagwndglwhcepsirafi.supabase.co/storage/v1/object/public/Assets/DFL%20Logo%20Blue_Black.png"
       alt="DFL">

  <div class="badge">Awaiting approval</div>
  <div class="title">Your account needs approval</div>
  <div class="sub">
    Thanks for signing up. An administrator has to confirm who you are
    before your access is switched on. Add your full name below so they
    know who to approve.
  </div>

  <div class="message" id="msg"></div>

  <div class="field">
    <label for="nameInput">Your full name</label>
    <input type="text" id="nameInput" placeholder="e.g. Abina Clarke"
           autocomplete="name" maxlength="100">
  </div>

  <button class="btn btn-primary" id="saveBtn">Save my name</button>

  <div class="divider"></div>

  <button class="btn btn-secondary" id="checkBtn">Check if I've been approved</button>
  <button class="btn btn-secondary" onclick="logout()">Sign out</button>

  <div class="footer">DFL Importers — Staff Portal</div>

</div>

<!--
  This page is restricted to role `pending` via DFL_PAGE_ROLES in
  /shared/routes.js.

  That used to be unsafe: the guard sent everyone it rejected to a hardcoded
  /index.html?denied=1, so the moment an admin approved a merchandiser, their
  next visit here bounced them to the rep app — which rejected them too, and
  looped. The guard now routes rejected users to their OWN home, so restricting
  this page does exactly the right thing: an approved user who lands here is
  forwarded straight to their app.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<script>
  const nameInput = document.getElementById('nameInput');
  const saveBtn = document.getElementById('saveBtn');
  const checkBtn = document.getElementById('checkBtn');
  const msg = document.getElementById('msg');

  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = 'message ' + kind + ' show';
  }

  document.addEventListener('dfl-auth-ready', (e) => {
    // Anyone who is no longer `pending` never reaches this handler — the guard
    // now forwards them to their own app before firing dfl-auth-ready. The
    // manual bounce that used to live here is gone.
    const profile = e.detail.profile;
    if (profile.full_name) nameInput.value = profile.full_name;
  });

  saveBtn.addEventListener('click', async () => {
    const name = nameInput.value.trim();

    if (!name) {
      showMsg('Please enter your full name.', 'error');
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    // set_pending_name is a SECURITY DEFINER RPC that can only write
    // full_name, only on the caller's own row, only while still pending —
    // profiles has no client UPDATE policy at all.
    const { error } = await sb.rpc('set_pending_name', { p_name: name });

    saveBtn.disabled = false;
    saveBtn.textContent = 'Save my name';

    if (error) {
      showMsg('Could not save your name. Please try again.', 'error');
      return;
    }

    showMsg('Saved. An administrator will review your access shortly.', 'success');
  });

  checkBtn.addEventListener('click', async () => {
    checkBtn.disabled = true;
    checkBtn.textContent = 'Checking…';

    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      window.location.href = '/login.html';
      return;
    }

    const { data: profile, error } = await sb
      .from('profiles')
      .select('role, active')
      .eq('id', session.user.id)
      .single();

    checkBtn.disabled = false;
    checkBtn.textContent = "Check if I've been approved";

    if (error || !profile) {
      showMsg('Could not check your status. Please try again.', 'error');
      return;
    }

    if (profile.role === 'pending') {
      showMsg('Still awaiting approval. Please check back later.', 'info');
      return;
    }

    window.location.href = '/login.html';
  });
</script>

</body>
</html>
