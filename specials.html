<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#0f2044">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specials & Flyers — DFL Staff Portal</title>

<!-- Hide until the guard confirms a signed-in staff member. Must be the FIRST
     style rule so there's no flash of content. auth-guard.js reveals it — and
     reveals immediately when framed, so the rep app's "More" tab still works. -->
<style>body { visibility: hidden; }</style>

<script>
  // Loaded inside the app's iframe? Then let the shell own the navigation.
  if (window.self !== window.top) document.documentElement.classList.add('embedded');
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0f4f8; --surface:#ffffff; --border:#e2e8f0;
    --navy:#0f2044; --navy2:#1a3260;
    --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8;
    --accent:#2563eb; --accent-bg:#eff6ff;
    --green:#16a34a; --green-bg:#f0fdf4;
    --amber:#b45309; --amber-bg:#fffbeb;
    --shadow:0 1px 3px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:0 4px 6px -1px rgba(0,0,0,0.07),0 2px 4px -1px rgba(0,0,0,0.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

  /* When shown inside the app shell (iframe), hide this page's own chrome.
     The nav itself no longer needs hiding — side-nav.js doesn't render at all
     when framed — but the page header and upload button still do. */
.embedded .page-header,
.embedded .btn-upload { display: none !important; }

  /* ── NAV ──
     Rendered and styled by /shared/side-nav.js. */

  .page-header { background:var(--navy2); padding:32px 32px 36px; }
  .page-header-inner { max-width:1060px; margin:0 auto; }
  .breadcrumb { font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:8px; }
  .breadcrumb a { color:rgba(255,255,255,0.45); text-decoration:none; }
  .breadcrumb a:hover { color:rgba(255,255,255,0.7); }
  .page-header h1 { font-size:24px; font-weight:700; color:#fff; letter-spacing:-0.3px; }

  /* ── TOOLBAR ── */
  .toolbar {
    max-width:1060px; margin:0 auto;
    padding:20px 32px 0;
    display:flex; flex-direction:column; gap:10px;
  }
  .toolbar-row {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .cat-row { display:none; } /* shown dynamically once categories load */
  .cat-label {
    font-size:11px; font-weight:600; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:0.05em;
    white-space:nowrap; margin-right:2px;
  }
  .filter-btn {
    padding:6px 16px; border-radius:20px;
    border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted);
    font-size:12px; font-weight:500;
    cursor:pointer; transition:all 0.15s;
    font-family:'Inter',sans-serif;
  }
  .filter-btn:hover { border-color:var(--accent); color:var(--accent); }
  .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .cat-btn {
    padding:5px 14px; border-radius:20px;
    border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted);
    font-size:12px; font-weight:500;
    cursor:pointer; transition:all 0.15s;
    font-family:'Inter',sans-serif;
  }
  .cat-btn:hover { border-color:var(--accent); color:var(--accent); }
  .cat-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .item-count { margin-left:auto; font-size:12px; color:var(--text-dim); }

  .btn-upload {
    padding:6px 16px; border-radius:20px;
    border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted);
    font-size:12px; font-weight:500;
    cursor:pointer; transition:all 0.15s;
    font-family:'Inter',sans-serif;
    text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn-upload:hover { border-color:var(--accent); color:var(--accent); }

  .grid {
    max-width:1060px; margin:0 auto;
    padding:20px 32px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:16px;
  }
  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; overflow:hidden;
    box-shadow:var(--shadow); transition:all 0.18s;
    cursor:pointer;
  }
  .card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:#bfdbfe; }
  .card-img {
    width:100%; height:160px; object-fit:cover;
    background:linear-gradient(135deg, #e0e7ff, #dbeafe);
    display:flex; align-items:center; justify-content:center;
    font-size:40px; color:var(--text-dim);
  }
  .card-img img { width:100%; height:100%; object-fit:cover; }
  .card-body { padding:16px; }
  .card-type {
    display:inline-block;
    font-size:10px; font-weight:600; letter-spacing:0.1em;
    text-transform:uppercase; padding:2px 8px; border-radius:4px;
    margin-bottom:8px;
  }
  .type-special { background:var(--accent-bg); color:var(--accent); }
  .type-flyer { background:#fef3c7; color:#92400e; }
  .card-name { font-size:14px; font-weight:600; margin-bottom:6px; line-height:1.3; }
  .card-desc { font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:12px; }
  .card-footer { display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px solid var(--border); }
  .card-price { font-size:15px; font-weight:700; color:var(--navy); }
  .card-price.notes { font-size:11px; font-weight:400; color:var(--text-muted); }
  .card-expiry { font-size:11px; color:var(--text-dim); }

  /* Expiry badges on cards */
  .badge-expiring {
    display:inline-block; font-size:10px; font-weight:600;
    padding:2px 7px; border-radius:4px;
    background:#fffbeb; color:#b45309;
    border:1px solid #fde68a;
  }
  .badge-expired {
    display:inline-block; font-size:10px; font-weight:600;
    padding:2px 7px; border-radius:4px;
    background:#fef2f2; color:#dc2626;
    border:1px solid #fecaca;
  }

  .empty { text-align:center; padding:80px 20px; color:var(--text-dim); grid-column:1/-1; }
  .empty-icon { font-size:36px; margin-bottom:12px; }
  .empty p { font-size:14px; }

  .spinner { grid-column:1/-1; text-align:center; padding:80px; }
  .spin {
    width:32px; height:32px; border:3px solid var(--border);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin 0.7s linear infinite; margin:0 auto;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  footer { text-align:center; padding:20px; font-size:11px; color:var(--text-dim); border-top:1px solid var(--border); }

  /* ── MODAL ── */
  .modal-backdrop {
    display:none; position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,0.75);
    align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-backdrop.open { display:flex; animation:fadeIn 0.18s ease; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .modal {
    background:var(--surface); border-radius:14px;
    width:100%; max-width:520px; max-height:90vh;
    overflow-y:auto; position:relative;
    animation:slideUp 0.2s ease;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  @keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

  .modal-close {
    position:absolute; top:12px; right:12px; z-index:10;
    width:32px; height:32px; border-radius:50%;
    background:rgba(0,0,0,0.45); color:#fff; border:none;
    font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background 0.15s;
  }
  .modal-close:hover { background:rgba(0,0,0,0.7); }

  .modal-img {
    width:100%; height:280px;
    background:linear-gradient(135deg, #e0e7ff, #dbeafe);
    display:flex; align-items:center; justify-content:center;
    font-size:60px; border-radius:14px 14px 0 0;
  }
  .modal-img img { width:100%; height:100%; object-fit:contain; border-radius:14px 14px 0 0; }

  .modal-body { padding:24px; }
  .modal-type { margin-bottom:10px; }
  .modal-name { font-size:20px; font-weight:700; color:var(--navy); margin-bottom:10px; line-height:1.3; }
  .modal-desc { font-size:14px; color:var(--text-muted); line-height:1.6; margin-bottom:16px; }

  .modal-meta { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
  .modal-meta-row { display:flex; gap:8px; align-items:baseline; font-size:13px; }
  .modal-meta-label { color:var(--text-dim); font-weight:500; min-width:80px; }
  .modal-meta-value { color:var(--text); font-weight:500; }
  .modal-meta-value.price { font-size:18px; font-weight:700; color:var(--navy); }

  /* Two action buttons side by side */
  .modal-actions { display:flex; gap:10px; }
  .modal-btn {
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:12px; border:none; border-radius:8px;
    font-size:14px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif; transition:background 0.15s;
  }
  .modal-btn-share { background:var(--navy); color:#fff; }
  .modal-btn-share:hover { background:var(--navy2); }
  .modal-btn-download { background:var(--accent); color:#fff; }
  .modal-btn-download:hover { background:#1d4ed8; }

  @media (max-width: 640px) {
    .page-header { padding: 24px 16px 28px; }
    .toolbar { padding: 16px 16px 0; }
    .grid { padding: 16px 16px 48px; }
    /* Modal slides up from bottom on mobile like a drawer */
    .modal-backdrop { padding:0; align-items:flex-end; }
    .modal { max-width:100%; max-height:92vh; border-radius:16px 16px 0 0; }
    .modal-img { height:220px; border-radius:16px 16px 0 0; }
    .modal-img img { border-radius:16px 16px 0 0; }
  }
</style>
</head>
<body>

<!-- NAV
     Comes from /shared/side-nav.js. The bar that used to be here linked to
     /dispatch-portal.html, /dashboards.html, /forms.html and /assets.html —
     all four still live in _staging/ and 404. -->

<div class="page-header">
  <div class="page-header-inner">
    <div class="breadcrumb"><a href="/index.html">Home</a> / Specials & Flyers</div>
    <h1>Specials & Flyers</h1>
  </div>
</div>

<div class="toolbar">
  <!-- Row 1: type filters + upload link + count -->
  <div class="toolbar-row">
    <button class="filter-btn active" onclick="filter('all',this)">All</button>
    <button class="filter-btn" onclick="filter('Special',this)">Specials</button>
    <button class="filter-btn" onclick="filter('Flyer',this)">Flyers</button>
    <a class="btn-upload" href="/specials-upload.html">🎯 Upload Specials / Flyers</a>
    <span class="item-count" id="count"></span>
  </div>
  <!-- Row 2: category filters — hidden until data loads, built dynamically -->
  <div class="toolbar-row cat-row" id="catRow"></div>
</div>

<div class="grid" id="grid">
  <div class="spinner"><div class="spin"></div></div>
</div>

<!-- MODAL LIGHTBOX -->
<div class="modal-backdrop" id="modalBackdrop" onclick="handleBackdropClick(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-img" id="modalImg"></div>
    <div class="modal-body">
      <div class="modal-type" id="modalType"></div>
      <div class="modal-name" id="modalName"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-share" id="modalShare" onclick="shareImage()">↑ Share</button>
        <button class="modal-btn modal-btn-download" id="modalDownload" onclick="downloadImage()">⬇ Download</button>
      </div>
    </div>
  </div>
</div>

<footer>© 2026 DFL Importers · Internal use only</footer>

<script>
  window.DFL_PAGE_TITLE = 'Specials';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<script src="/shared/side-nav.js"></script>
<script>
  // These were named SUPABASE_URL / SUPABASE_KEY. They had to be renamed when
  // this page started loading /shared/supabase-client.js, which declares its
  // own `const SUPABASE_URL` — two `const`s of the same name in the shared
  // global scope is a SyntaxError that blanks the entire page with no useful
  // error. Same fix rep-weekly-plan.html needed (its PLAN_SB_* constants).
  //
  // This page keeps its raw-fetch data access rather than switching to the
  // shared client's fluent API — that would be an unrelated change.
  const SPECIALS_SB_URL = 'https://hzagwndglwhcepsirafi.supabase.co';
  const SPECIALS_SB_KEY = 'sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h';

  let all = [];
  let currentType = 'all';
  let currentCategory = 'all';
  let activeImageUrl = '';
  let activeItemName = '';

  // ── Expiry helpers ──────────────────────────────────────────────────────────
  function getExpiryStatus(valid_until) {
    if (!valid_until) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const exp = new Date(valid_until); exp.setHours(0,0,0,0);
    const daysLeft = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
    if (daysLeft < 0) return 'expired';
    if (daysLeft <= 7) return 'expiring';
    return 'ok';
  }

  function expiryBadge(valid_until, type) {
    // Flyers are evergreen — never show an expiry date
    if (type === 'Flyer' || !valid_until) return '';
    const status = getExpiryStatus(valid_until);
    const label = new Date(valid_until).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    if (status === 'expired') return `<span class="badge-expired">Expired</span>`;
    if (status === 'expiring') return `<span class="badge-expiring">Expires ${label}</span>`;
    return `<div class="card-expiry">Until ${label}</div>`;
  }

  // ── Load from Supabase ──────────────────────────────────────────────────────
  async function load() {
    try {
      const res = await fetch(`${SPECIALS_SB_URL}/rest/v1/specials?active=eq.true&order=created_at.desc`, {
        headers: { 'apikey': SPECIALS_SB_KEY, 'Authorization': `Bearer ${SPECIALS_SB_KEY}` }
      });
      const data = await res.json();
      // Hide expired Specials — Flyers always show (no expiry concept)
      all = data.filter(i => {
        if (i.type === 'Flyer') return true;
        if (!i.valid_until) return true;
        return getExpiryStatus(i.valid_until) !== 'expired';
      });
      render(all);
      buildCategoryRow(all);
    } catch(e) {
      document.getElementById('grid').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Could not load data. Please try again.</p></div>';
    }
  }

  // ── Render cards ────────────────────────────────────────────────────────────
  function render(items) {
    const grid = document.getElementById('grid');
    document.getElementById('count').textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;
    if (!items.length) {
      grid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>No items found.</p></div>';
      return;
    }
    grid.innerHTML = items.map(i => `
      <div class="card" data-id="${i.id}">
        <div class="card-img">
          ${i.image_url ? `<img src="${i.image_url}" alt="${i.name}" onerror="this.parentElement.innerHTML='📦'">` : '📦'}
        </div>
        <div class="card-body">
          <span class="card-type type-${i.type.toLowerCase()}">${i.type}</span>
          <div class="card-name">${i.name}</div>
          <div class="card-desc">${i.description || ''}</div>
          <div class="card-footer">
            <div class="${i.price ? 'card-price' : 'card-price notes'}">
              ${i.price ? `$${Number(i.price).toLocaleString()}` : (i.price_notes || 'See description')}
            </div>
            ${expiryBadge(i.valid_until, i.type)}
          </div>
        </div>
      </div>
    `).join('');

    // Safe click listeners via data-id — no inline onclick, no quote issues
    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openModal(card.dataset.id));
    });
  }

  // ── Combined filter logic ───────────────────────────────────────────────────
  function applyFilters() {
    let result = all;
    if (currentType !== 'all')     result = result.filter(i => i.type === currentType);
    if (currentCategory !== 'all') result = result.filter(i => i.category === currentCategory);
    render(result);
  }

  function filter(type, btn) {
    currentType = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function filterCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  // ── Build category pill row from loaded data ────────────────────────────────
  function buildCategoryRow(items) {
    const cats = [...new Set(items.map(i => i.category).filter(Boolean))].sort();
    const row = document.getElementById('catRow');
    if (!cats.length) return; // no categories set yet — row stays hidden
    row.style.display = 'flex';
    row.innerHTML =
      `<span class="cat-label">Category:</span>` +
      `<button class="cat-btn active" data-cat="all" onclick="filterCategory(this.dataset.cat,this)">All</button>` +
      cats.map(c =>
        `<button class="cat-btn" data-cat="${c}" onclick="filterCategory(this.dataset.cat,this)">${c}</button>`
      ).join('');
  }

  // ── Modal ───────────────────────────────────────────────────────────────────
  function openModal(id) {
    const i = all.find(x => x.id == id);
    if (!i) return;

    activeImageUrl = i.image_url || '';
    activeItemName = i.name || 'image';

    // Image
    document.getElementById('modalImg').innerHTML = i.image_url
      ? `<img src="${i.image_url}" alt="${i.name}" onerror="this.parentElement.innerHTML='📦'">`
      : '📦';

    // Type badge
    document.getElementById('modalType').innerHTML =
      `<span class="card-type type-${i.type.toLowerCase()}">${i.type}</span>`;

    // Name & description
    document.getElementById('modalName').textContent = i.name;
    document.getElementById('modalDesc').textContent = i.description || '';

    // Meta rows — Flyers skip Valid Until
    let meta = '';
    if (i.price) {
      meta += `<div class="modal-meta-row"><span class="modal-meta-label">Price</span><span class="modal-meta-value price">$${Number(i.price).toLocaleString()}</span></div>`;
    } else if (i.price_notes) {
      meta += `<div class="modal-meta-row"><span class="modal-meta-label">Price</span><span class="modal-meta-value">${i.price_notes}</span></div>`;
    }
    if (i.type !== 'Flyer' && i.valid_until) {
      const d = new Date(i.valid_until).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
      meta += `<div class="modal-meta-row"><span class="modal-meta-label">Valid Until</span><span class="modal-meta-value">${d}</span></div>`;
    }
    if (i.category) {
      meta += `<div class="modal-meta-row"><span class="modal-meta-label">Category</span><span class="modal-meta-value">${i.category}</span></div>`;
    }
    document.getElementById('modalMeta').innerHTML = meta;

    // Show/hide action buttons based on whether there's an image
    const hasImage = !!i.image_url;
    document.getElementById('modalShare').style.display = hasImage ? 'flex' : 'none';
    document.getElementById('modalDownload').style.display = hasImage ? 'flex' : 'none';

    document.getElementById('modalBackdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleBackdropClick(e) {
    if (e.target === document.getElementById('modalBackdrop')) closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── Share image (native share sheet on mobile, copy URL on desktop) ─────────
  async function shareImage() {
    const btn = document.getElementById('modalShare');
    if (!activeImageUrl) return;
    btn.textContent = '⏳ Preparing...';
    try {
      const res = await fetch(activeImageUrl);
      const blob = await res.blob();
      const ext = blob.type.includes('png') ? 'png' : 'jpg';
      const file = new File([blob], `${activeItemName}.${ext}`, { type: blob.type });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        // Mobile: opens native share sheet with the actual image file
        await navigator.share({ files: [file], title: activeItemName });
      } else {
        // Desktop fallback: copy image URL to clipboard
        await navigator.clipboard.writeText(activeImageUrl);
        btn.textContent = '✓ Link Copied!';
        setTimeout(() => { btn.textContent = '↑ Share'; }, 2000);
        return;
      }
    } catch(e) {
      if (e.name !== 'AbortError') alert('Could not share. Try downloading instead.');
    }
    btn.textContent = '↑ Share';
  }

  // ── Download image (fetches blob and forces save dialog) ────────────────────
  async function downloadImage() {
    const btn = document.getElementById('modalDownload');
    if (!activeImageUrl) return;
    btn.textContent = '⏳ Downloading...';
    try {
      const res = await fetch(activeImageUrl);
      const blob = await res.blob();
      const ext = blob.type.includes('png') ? 'png' : 'jpg';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${activeItemName}.${ext}`;
      a.click();
      URL.revokeObjectURL(a.href);
    } catch(e) {
      alert('Download failed. Try long-pressing the image to save.');
    }
    btn.textContent = '⬇ Download';
  }

  load();
</script>
</body>
</html>
