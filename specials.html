<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specials & Flyers — DFL Staff Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0f4f8; --surface:#ffffff; --border:#e2e8f0;
    --navy:#0f2044; --navy2:#1a3260;
    --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8;
    --accent:#2563eb; --accent-bg:#eff6ff;
    --green:#16a34a; --green-bg:#f0fdf4;
    --amber:#b45309; --amber-bg:#fffbeb;
    --shadow:0 1px 3px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:0 4px 6px -1px rgba(0,0,0,0.07),0 2px 4px -1px rgba(0,0,0,0.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

  nav {
    background:var(--navy); height:56px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 32px; position:sticky; top:0; z-index:100;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .nav-left { display:flex; align-items:center; gap:14px; }
  .nav-logo { height:26px; filter:brightness(0) invert(1); }
  .nav-divider { width:1px; height:22px; background:rgba(255,255,255,0.2); }
  .nav-title { font-size:14px; font-weight:600; color:#fff; }
  .nav-links { display:flex; gap:4px; }
  .nav-links a {
    color:rgba(255,255,255,0.65); text-decoration:none;
    font-size:13px; font-weight:500; padding:6px 14px; border-radius:6px; transition:all 0.15s;
  }
  .nav-links a:hover { color:#fff; background:rgba(255,255,255,0.1); }
  .nav-links a.active { color:#fff; background:rgba(255,255,255,0.15); }

  .page-header {
    background:var(--navy2); padding:32px 32px 36px;
  }
  .page-header-inner { max-width:1060px; margin:0 auto; }
  .breadcrumb { font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:8px; }
  .breadcrumb a { color:rgba(255,255,255,0.45); text-decoration:none; }
  .breadcrumb a:hover { color:rgba(255,255,255,0.7); }
  .page-header h1 { font-size:24px; font-weight:700; color:#fff; letter-spacing:-0.3px; }

  .toolbar {
    max-width:1060px; margin:0 auto;
    padding:20px 32px 0;
    display:flex; align-items:center; gap:10px;
  }
  .filter-btn {
    padding:6px 16px; border-radius:20px;
    border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted);
    font-size:12px; font-weight:500;
    cursor:pointer; transition:all 0.15s;
    font-family:'Inter',sans-serif;
  }
  .filter-btn:hover { border-color:var(--accent); color:var(--accent); }
  .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .item-count { margin-left:auto; font-size:12px; color:var(--text-dim); }

  .grid {
    max-width:1060px; margin:0 auto;
    padding:20px 32px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:16px;
  }
  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; overflow:hidden;
    box-shadow:var(--shadow); transition:all 0.18s;
  }
  .card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:#bfdbfe; }
  .card-img {
    width:100%; height:160px; object-fit:cover;
    background:linear-gradient(135deg, #e0e7ff, #dbeafe);
    display:flex; align-items:center; justify-content:center;
    font-size:40px; color:var(--text-dim);
  }
  .card-img img { width:100%; height:100%; object-fit:cover; }
  .card-body { padding:16px; }
  .card-type {
    display:inline-block;
    font-size:10px; font-weight:600; letter-spacing:0.1em;
    text-transform:uppercase; padding:2px 8px; border-radius:4px;
    margin-bottom:8px;
  }
  .type-special { background:var(--accent-bg); color:var(--accent); }
  .type-flyer { background:#fef3c7; color:#92400e; }
  .card-name { font-size:14px; font-weight:600; margin-bottom:6px; line-height:1.3; }
  .card-desc { font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:12px; }
  .card-footer { display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px solid var(--border); }
  .card-price { font-size:15px; font-weight:700; color:var(--navy); }
  .card-price.notes { font-size:11px; font-weight:400; color:var(--text-muted); }
  .card-expiry { font-size:11px; color:var(--text-dim); }

  .empty { text-align:center; padding:80px 20px; color:var(--text-dim); grid-column:1/-1; }
  .empty-icon { font-size:36px; margin-bottom:12px; }
  .empty p { font-size:14px; }

  .spinner { grid-column:1/-1; text-align:center; padding:80px; }
  .spin {
    width:32px; height:32px; border:3px solid var(--border);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin 0.7s linear infinite; margin:0 auto;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  footer { text-align:center; padding:20px; font-size:11px; color:var(--text-dim); border-top:1px solid var(--border); }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <img class="nav-logo" src="https://hzagwndglwhcepsirafi.supabase.co/storage/v1/object/public/Assets/DFL%20Logo%20Blue_White.png" alt="DFL">
    <div class="nav-divider"></div>
    <span class="nav-title">Staff Portal</span>
  </div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="specials.html" class="active">Specials</a>
    <a href="dashboards.html">Dashboards</a>
    <a href="forms.html">Forms</a>
    <a href="assets.html">Assets</a>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <div class="breadcrumb"><a href="index.html">Home</a> / Specials & Flyers</div>
    <h1>Specials & Flyers</h1>
  </div>
</div>

<div class="toolbar">
  <button class="filter-btn active" onclick="filter('all',this)">All</button>
  <button class="filter-btn" onclick="filter('Special',this)">Specials</button>
  <button class="filter-btn" onclick="filter('Flyer',this)">Flyers</button>
  <span class="item-count" id="count"></span>
</div>

<div class="grid" id="grid">
  <div class="spinner"><div class="spin"></div></div>
</div>

<footer>© 2026 DFL Importers · Internal use only</footer>

<script>
  const SUPABASE_URL = 'https://hzagwndglwhcepsirafi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h';

  let all = [];
  let current = 'all';

  async function load() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/specials?active=eq.true&order=created_at.desc`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      all = await res.json();
      render(all);
    } catch(e) {
      document.getElementById('grid').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Could not load data. Please try again.</p></div>';
    }
  }

  function render(items) {
    const grid = document.getElementById('grid');
    document.getElementById('count').textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;
    if (!items.length) {
      grid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>No items found.</p></div>';
      return;
    }
    grid.innerHTML = items.map(i => `
      <div class="card">
        <div class="card-img">
          ${i.image_url ? `<img src="${i.image_url}" alt="${i.name}" onerror="this.parentElement.innerHTML='📦'">` : '📦'}
        </div>
        <div class="card-body">
          <span class="card-type type-${i.type.toLowerCase()}">${i.type}</span>
          <div class="card-name">${i.name}</div>
          <div class="card-desc">${i.description || ''}</div>
          <div class="card-footer">
            <div class="${i.price ? 'card-price' : 'card-price notes'}">
              ${i.price ? `$${Number(i.price).toLocaleString()}` : (i.price_notes || 'See description')}
            </div>
            ${i.valid_until ? `<div class="card-expiry">Until ${new Date(i.valid_until).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>` : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  function filter(type, btn) {
    current = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(type === 'all' ? all : all.filter(i => i.type === type));
  }

  load();
</script>
</body>
</html>
