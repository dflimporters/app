<!--
  Category Budget 2027 — each Category Manager sets 2027 growth, price, cost and line changes for their
  own categories; Scott (price approver) approves and sees the company views (Summary, Rep targets,
  Monthly targets).

  Standalone page: sign-in guard only, deliberately no side rail or user menu (shared by direct link).
  Data: budget27_* tables (RLS on, no client grants). Everything goes through SECURITY DEFINER RPCs that
  check the caller: budget27_me / _data / _inputs / _company return only the caller's categories (or
  everything for is_price_approver()); budget27_save lets an owner change only their own budget until it
  is submitted; budget27_decide and budget27_set_target are approver-only. Owners are linked to their
  login by profile id in budget27_cm; categories to owners in budget27_cat_owner. The Jan–Sep 2026
  snapshot is rebuilt by budget27_refresh() (approver only) — rebuilding shifts every baseline.
--><style>
/* Layout: navy bar + CM strip, tabbed working views (levers → channels → accounts → lines → output). Light only (DFL house style). */
:root{
  --blue:#326BD3; --blue-bg:#EEF4FF; --navy:#0D1B3E; --navy-mid:#1a2e5a;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-alt:#F9FAFC;
  --border:#E4E9F2; --border-soft:#EEF1F8;
  --text:#1A2340; --text-mid:#4A5578; --text-soft:#8A95B0;
  --red:#D63B3B; --red-bg:#FEF2F2; --amber:#C47A1A; --amber-bg:#FFFBEB; --green:#1A8F4C; --green-bg:#F0FDF4;
  --lever:#FFF6C7; --lever-bd:#E8D27A;
  --key:#6D28D9; --key-bg:#F5F0FF; --hosp:#0E7490; --hosp-bg:#E8F7FB;
  --head:'Montserrat',system-ui,sans-serif; --body:'Open Sans',system-ui,sans-serif;
  --radius:10px; --shadow:0 1px 4px rgba(26,35,64,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:13.5px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.topbar{background:var(--navy);padding-block:14px}
.in{max-width:1500px;margin:0 auto;padding-inline:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.topbar img{height:42px;width:auto}
.topbar h1{font-family:var(--head);font-weight:800;font-size:24px;color:#fff;margin:0;letter-spacing:-.2px}
.topbar p{margin:1px 0 0;font-size:11px;color:rgba(255,255,255,.55)}
.co{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;padding:6px 14px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.05)}
.co .s{display:flex;flex-direction:column;gap:1px}
.co .t{font-family:var(--head);font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#9DB8F0;align-self:center}
.co .sv{font-size:14px}
.save{margin-left:auto;font-family:var(--head);font-size:11px;font-weight:600;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:#8A95B0;display:inline-block}
.save[data-s=saved] i{background:#3FCB7E}.save[data-s=pending] i{background:#F0B429}.save[data-s=err] i,.save[data-s=ro] i{background:#F26B6B}
.strip{background:var(--navy-mid);padding-block:10px}
.strip .in{gap:12px 22px;align-items:flex-end}
.strip .in>.s+.s{border-left:1px solid rgba(255,255,255,.14);padding-left:22px}
.strip .s{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl{font-family:var(--head);font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.sv{font-family:var(--head);font-size:16px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.sv small{font-size:11px;font-weight:600;color:rgba(255,255,255,.55);margin-left:4px}
.up{color:#6FE3A2!important}.dn{color:#FF9A9A!important}
#cmSel{background:#fff;border:0;border-radius:7px;padding:7px 10px;font-family:var(--head);font-weight:700;font-size:14px;color:var(--navy);max-width:260px}
.wrap{padding:14px 16px 40px;max-width:1500px;margin:0 auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tab{font-family:var(--head);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:9px 16px;border:1px solid var(--border);border-bottom:0;border-radius:9px 9px 0 0;background:var(--border-soft);color:var(--text-mid);cursor:pointer}
.tab[aria-selected=true]{background:var(--surface);color:var(--blue);position:relative;top:1px;box-shadow:inset 0 3px 0 var(--blue)}
.panel{background:var(--surface);border:1px solid var(--border);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:14px;box-shadow:var(--shadow)}
.bar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar label,.lbl{font-family:var(--head);font-size:11px;font-weight:600;color:var(--text-mid)}
.fld{display:flex;align-items:center;gap:6px}
input.lv,select.lv,textarea.lv{background:var(--lever);border:1px solid var(--lever-bd);border-radius:6px;padding:5px 7px}
input.lv:disabled,select.lv:disabled,textarea.lv:disabled{background:var(--border-soft);border-color:var(--border);color:var(--text-mid)}
input.lv:focus,select.lv:focus,textarea.lv:focus,input.pl:focus,select.pl:focus{outline:2px solid var(--blue);outline-offset:0;background:#fff}
input.pct{width:58px;text-align:right}
input.amt{width:84px;text-align:right}
select.mo{width:70px}
input.pl,select.pl{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.btn{font-family:var(--head);font-size:11.5px;font-weight:700;border-radius:7px;padding:6px 12px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--blue)}
.btn.ok{background:var(--green);border-color:var(--green)}
.btn.sm{padding:3px 8px;font-size:10.5px}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.pre:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--head);font-size:10.5px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);border-radius:14px;padding:4px 10px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
.tw.tall{overflow:auto;max-height:calc(100vh - 150px)}
table{border-collapse:collapse;width:100%}
th{font-family:var(--head);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--navy-mid);padding:9px 8px;border-bottom:0;text-align:left;position:sticky;top:0;z-index:1;white-space:nowrap}
th.grp{text-align:center;border-left:1px solid rgba(255,255,255,.18);color:#fff}
th.bl{border-left-color:rgba(255,255,255,.18)}
th.h2{background:var(--surface);color:var(--text-soft);font-size:9.5px;padding:6px 8px;border-bottom:1px solid var(--border)}
th.h2.bl{border-left-color:var(--border)}
th.yo,td.yo{text-align:center}
table.lite th{background:var(--blue-bg);color:var(--navy);border-bottom:1px solid #D6E1F5}
table.lite th.bl{border-left-color:#D6E1F5}
td{padding:6px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
td.bl,th.bl{border-left:1px solid var(--border)}
tr.r:hover td{background:#FAFBFE}
tr.lost td{color:var(--text-soft)}
tr.lost td .nm{text-decoration:line-through}
tr.tot td{font-family:var(--head);font-weight:700;background:#DDE7F8;color:var(--navy);border-top:2px solid var(--blue);position:sticky;bottom:0;z-index:1}
tr.tot td .sub,tr.tot td.sub{color:var(--text-mid)}
tr.tot td.pos,tr.tot .pos{color:var(--green)}tr.tot td.neg,tr.tot .neg{color:var(--red)}
tr.tot td.b27{background:#CFDCF4}
tr.grp td{background:var(--blue-bg);color:var(--navy);font-family:var(--head);font-weight:700;border-bottom:1px solid #D6E1F5}
tr.grp td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
tr.grp td.b27{background:#E2EBFB}
.nm{font-weight:600;color:var(--text)}
.sub{font-size:11px;color:var(--text-soft)}
.tg{display:inline-block;font-family:var(--head);font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:3px;letter-spacing:.2px;vertical-align:1px}
.tg.ch{background:var(--blue-bg);color:var(--blue)}.tg.ky{background:var(--key-bg);color:var(--key)}.tg.ho{background:var(--hosp-bg);color:var(--hosp)}
.tg.ti{background:var(--border-soft);color:var(--text-mid)}.tg.rp{background:var(--amber-bg);color:var(--amber)}.tg.dc{background:var(--red-bg);color:var(--red)}
.tg.fo{background:var(--green-bg);color:var(--green)}
.pos{color:var(--green)}.neg{color:var(--red)}
.pres{display:flex;gap:3px}
.pre{font-family:var(--head);font-size:10px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);border-radius:5px;padding:3px 6px;cursor:pointer}
.pre:hover{border-color:var(--blue);color:var(--blue)}
.pre.x:hover{border-color:var(--red);color:var(--red)}
.pre[disabled]{opacity:.45;cursor:default}
td.b27{font-family:var(--head);font-weight:700;background:rgba(50,107,211,.05)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.card{border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-family:var(--head);font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);margin:0;padding-left:9px;border-left:3px solid var(--blue)}
.hint{margin:0;font-size:12px;color:var(--text-soft);max-width:900px}
.tgrp{align-self:flex-end;font-family:var(--head);font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-soft);padding:0 6px 10px 2px}
.tgrp.sep{margin-left:14px;padding-left:14px;border-left:1px solid var(--border)}
table.mtt td.mt1,table.mtt th.mt1{position:sticky;left:0;background:var(--surface);z-index:2;min-width:190px}
table.mtt thead th.mt1{z-index:3;background:var(--navy-mid)}
table.mtt tr.grp td.mt1{background:var(--blue-bg)}
table.mtt tr.tot td.mt1{background:#DDE7F8}
table.mtt td.n{font-size:12.5px}
.guide{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:12.5px;color:var(--text-mid);margin-bottom:10px}
.guide .how summary{cursor:pointer;color:var(--blue);font-family:var(--head);font-weight:600;font-size:11.5px;list-style:none}
.guide .how summary::-webkit-details-marker{display:none}
.guide .how summary::after{content:' ▸'}
.guide .how[open] summary::after{content:' ▾'}
.guide .how ul{margin:6px 0 2px;padding-left:18px;color:var(--text-mid);font-size:12px;line-height:1.55;max-width:820px}
.guide .how[open]{flex-basis:100%}
th[title]{cursor:help;text-decoration:underline dotted rgba(255,255,255,.55);text-underline-offset:3px}
.pill{font-family:var(--head);font-size:10px;font-weight:700;border-radius:10px;padding:2px 8px;display:inline-block}
.pill.ns{background:var(--border-soft);color:var(--text-soft)}.pill.ip{background:var(--amber-bg);color:var(--amber)}.pill.sb{background:var(--blue-bg);color:var(--blue)}.pill.ag{background:var(--green-bg);color:var(--green)}
.signoff{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{background:var(--amber-bg);border:1px solid #F3D9A8;color:#7A4B0E;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12.5px}
.banner.info{background:var(--blue-bg);border-color:#C9D6F2;color:var(--navy)}
.empty{padding:22px;text-align:center;color:var(--text-soft)}
svg text{font-family:var(--head)}
.catbar{height:6px;border-radius:3px;background:var(--blue);display:block}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.strip{gap:12px 18px}.signoff{margin-left:0}}
.cbload{max-width:560px;margin:80px auto;padding:24px;background:#fff;border:1px solid var(--border);border-radius:10px;text-align:center;color:var(--text-mid);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const CHANNELS=['Key','Chain','Hospitality','Supermarkets','Wholesale & distributors','Retail & other trade'];
const JUNK=c=>/^(0|\(none\)|Z-NONSTOCK|SALES)$/i.test(c||'');
const CMS=[
  {key:'rejene',name:'Rejene Henry',test:c=>['PAPER','PLASTIC','CLEARPACK'].includes(c)},
  {key:'travis',name:'Travis Decasseres',test:c=>['GARBAGEBAG','HOUSEHOLD','PROCESSING','FOIL','WIPES'].includes(c)},
  {key:'matthew',name:'Matthew Decasseres',test:c=>/^ECO/.test(c)},

];
// only the owners this login may open (the server decides); categories map to owners from the server too
{const allow=new Set((((window.CB_BOOT||{}).me||{}).cms||[]).map(c=>c.key)); for(let i=CMS.length-1;i>=0;i--) if(!allow.has(CMS[i].key)) CMS.splice(i,1);}
const ownerOf=cat=>{const k=(window.CM_OWNERS||{})[cat]; return k?(CMS.find(m=>m.key===k)||null):null;};
const FOCUS=new Set(['10000683','10000684','10000682','10003356','10003506','10001344','10000325','10003657','10003671','10000260','10001578','10000571','10000611','10001163','10001116','10000090','10000089','10000676']);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';
const $=s=>document.querySelector(s);

/* ---------- model (J$ '000) ---------- */
// every store × category line is its own unit; "top" marks the accounts listed on the Top accounts tab
const STORES={};  // cid -> {id,n,cl,ar,ch,rep,prev,units:[]}
const CAT={};  // cat -> {units:[], base, r25, r25y, r26, g26, b26, gm}
const catOf=c=>CAT[c]||(CAT[c]={cat:c,units:[],base:0,r25:0,r25y:0,r26:0,g26:0,g25:0,b26:0});
for(const r of (window.CM_STORES||[])){
  const [cid,name,cl,ar,ch,rep,prev,cells]=r;
  const s=STORES[cid]={id:cid,n:String(name||cid).trim(),cl:cl||'',ar:ar||'',ch:ch||'Retail & other trade',rep:rep||'No current rep',prev:prev||'',units:[]};
  for(const x of (cells||[])){const [cat,r25,r25y,r26,g26,g25,b26]=x;
    const u={kind:'n',key:cat+'|'+cid,cat,cid,n:s.n,cl:s.cl,ar:s.ar,ch:s.ch,rep:s.rep,prev:s.prev,r25,r25y,r26,g26,g25,b26,base:Math.max(0,r26*ANN)};
    catOf(cat).units.push(u); s.units.push(u);}
}
// KAM portfolios, from the Key Account Management dashboard
const KAMS=[
  {key:'andrea',name:'Andrea Skelton',label:'Chain stores',ids:['C000001907','C000001908','C000001909','C000001912','C000001913','C000001915','C000001916','C000001917','C000001920','C000001921','C000001923','C000002297','C000002298','C000003798','C000003799','C000004156','C000004157','C000004158','C000004160','C000004161','C000004357','C000004358','C000004359','C000004360','C000004362','C000004656','C000004657','C000005455','C000005617','C000005618','C000005619','C000005648','C000005649','C000005651','C000005652','C000005653','C000006029','C000006110','C000007077','C000003041','C000003042','C000003043','C000004658','C000003778']},
  {key:'shallet',name:'Shallet Marsh',label:'Key stores SM',ids:['C000000081','C000009549','C000005934','C000000554','C000000556','C000000757','C000001490','C000001627','C000001656','C000001689','C000005724','C000001703','C000001704','C000001972','C000005725','C000002523','C000002679','C000002680','C000002731','C000002794','C000002795','C000002896','C000005579','C000009557','C000002974','C000002976','C000003331','C000003774','C000003934','C000004462','C000004565','C000004990','C000005049','C000005697','C000005228']},
  {key:'damita',name:'Damita Samuels-Foster',label:'Key stores DF',ids:['C000000446','C000005640','C000007120','C000002706','C000005356','C000002033','C000002034','C000002990','C000002778','C000000456','C000000944','C000003103','C000003696','C000004009','C000004393','C000004635','C000005442','C000005714','C000007491','C000009590','C000004874','C000001575']}
  ,{key:'phobea',name:'Phobea Whorms',label:'Hospitality',ids:['C000007968','C000000692','C000005748','C000000981','C000000982','C000000983','C000000984','C000001925','C000001454','C000001550','C000001766','C000004061','C000005505','C000001817','C000001869','C000004060','C000007742','C000005524','C000002006','C000006839','C000006680','C000002218','C000002561','C000005577','C000003177','C000003234','C000003500','C000003598','C000003930','C000005630','C000003976','C000003977','C000003978','C000003979','C000007407','C000003980','C000003981','C000004068','C000004069','C000009840','C000004165','C000006457','C000004167','C000007967','C000004168','C000008042','C000004238']}
];
// a store on a KAM's dashboard counts toward that KAM's target, whoever invoices it today
KAMS.forEach(k=>{k.set=new Set(k.ids);
  for(const id of k.ids){const s=STORES[id]; if(!s||s.kam) continue; s.kam=k.key;
    if(s.rep!==k.name){s.moved=s.rep; s.prev=s.rep; s.rep=k.name; s.units.forEach(u=>{u.rep=k.name;u.prev=s.prev;});}}});
const okR=v=>v>-0.5&&v<0.95;
for(const C of Object.values(CAT)){
  for(const u of C.units){C.base+=u.base;C.r25+=u.r25;C.r25y+=u.r25y;C.r26+=u.r26;C.g26+=u.g26;C.g25+=u.g25;C.b26+=u.b26;}
  C.gm=C.r26>0&&okR(C.g26/C.r26)?C.g26/C.r26:(C.r25>0&&okR(C.g25/C.r25)?C.g25/C.r25:0.35);
  for(const u of C.units){u.gm=u.r26>0&&okR(u.g26/u.r26)?u.g26/u.r26:(u.r25>0&&okR(u.g25/u.r25)?u.g25/u.r25:C.gm);u.gp=u.r26>0?u.g26/u.r26:null;u.yoy=u.r25y>0?(u.r26-u.r25y)/u.r25y:null;}
  C.units.sort((a,b)=>b.base-a.base);
  C.G0=C.units.reduce((s,u)=>s+u.base*u.gm,0);
  let cum=0; const tot=C.units.reduce((s,u)=>s+u.base,0);
  C.units.forEach((u,i)=>{u.top=i<40&&u.base>=500&&cum<0.8*tot; cum+=u.base;});
  C.owner=ownerOf(C.cat);
}
const CMCATS={}; for(const m of CMS) CMCATS[m.key]=Object.values(CAT).filter(C=>C.owner===m&&(C.base>0||C.r25>0)).sort((a,b)=>b.base-a.base).map(C=>C.cat);
const JUNKBASE=Object.values(CAT).filter(C=>!C.owner).reduce((s,C)=>s+C.r26*ANN,0);
const JUNK25=Object.values(CAT).filter(C=>!C.owner).reduce((s,C)=>s+C.r25,0);
// SKUs by category
const SK={}; for(const r of SKU){const [id,descr,cat,r25,r25y,r26,g26,nc,last]=r;(SK[cat]||(SK[cat]=[])).push({id,d:String(descr||'').trim(),cat,r25,r25y,r26,g26,nc,last:last||'',base:Math.max(0,r26*ANN)});}
for(const cat in SK){const L=SK[cat];const tot=L.reduce((s,x)=>s+Math.max(0,x.r26),0)||1;L.sort((a,b)=>a.r26-b.r26);let cum=0;
  for(const x of L){cum+=Math.max(0,x.r26);x.tail=x.r26>0&&cum/tot<=0.02;x.dead=x.r26<=0&&x.r25>0;x.focus=FOCUS.has(x.id);x.gp=x.r26>0?x.g26/x.r26:null;}

const norm12=a=>{const v=(a||[]).map(x=>Math.max(0,+x||0));while(v.length<12)v.push(0);const s=v.reduce((p,q)=>p+q,0);return s>0?v.map(x=>x/s):null;};
const SEAS_ALL=norm12(D.seasAll)||Array(12).fill(1/12); const SEASC={};
const seas=c=>SEASC[c]||(SEASC[c]=norm12((D.seas||{})[c])||SEAS_ALL);
const fromShare=(c,m)=>seas(c).slice(Math.max(1,+m||1)-1).reduce((p,q)=>p+q,0);
// price steps: % at the start of each quarter, compounding. Older single "p from pm" entries read as one step in that quarter.
function priceQ(L){const q=[0,0,0,0];if(Array.isArray(L.q)){for(let i=0;i<4;i++)q[i]=+L.q[i]||0;}return q;}
const QM_DEF=[1,4,7,10];
function priceQM(L){return [0,1,2,3].map(i=>{const v=Array.isArray(L.qm)?+L.qm[i]:0;return v>=1&&v<=12?v:QM_DEF[i];});}
// price: one % plus when — a month (1–12) for a single increase, or 'Q' for the same % at the start of every quarter
function priceIdx(L){
  if(L.p!=null&&!Array.isArray(L.q)){const p=(+L.p||0)/100,out=[];let m=1;
    for(let i=1;i<=12;i++){if(L.pm==='Q'?(i-1)%3===0:i===(+L.pm||1))m*=1+p;out.push(m);}return out;}
  return priceIdxSteps(L);
}
function priceIdxSteps(L){const q=priceQ(L),qm=priceQM(L),out=[];for(let i=1;i<=12;i++){let m=1;for(let k=0;k<4;k++)if(q[k]&&qm[k]<=i)m*=1+q[k]/100;out.push(m);}return out;}
const pEffOf=(c,L)=>{const w=seas(c),ix=priceIdx(L);let s=0;for(let i=0;i<12;i++)s+=w[i]*ix[i];return s-1;};
const REPS=[...new Set(Object.values(CAT).flatMap(C=>C.units.map(u=>u.rep)))].sort((a,b)=>a==='No current rep'?1:b==='No current rep'?-1:a.localeCompare(b));

/* ---------- compute ---------- */
function computeCM(cmKey,st){
  const out={cat:{},unit:{},rep:{},chn:{},mon:Array(12).fill(0),catMon:{},t:{base:0,r25:0,b26:0,r26:0,g26:0,gp26w:0,rev:0,gp:0}};
  for(const cat of CMCATS[cmKey]||[]){
    const C=CAT[cat], L=st.cat[cat]||{}, vC=L.v??st.def??0, w=seas(cat);
    const cmo=L.cm||1, ix=priceIdx(L);
    const pEff=pEffOf(cat,L), cEff=(+L.c||0)/100*fromShare(cat,cmo);
    const one=Math.min(Math.max(0,+L.one||0),C.base), f=C.base>0?1-one/C.base:1;
    let R=0,G=0,V0=0; const mon=Array(12).fill(0);
    for(const u of C.units){
      const a=u.kind==='n'?st.acc[u.key]:null;
      const g=a&&a.g!=null?a.g:(st.ch[cat+'|'+u.ch]??vC);
      const pe=a&&a.p!=null?a.p/100:pEff; // account price % = its own 2027 price change, from January
      let V=a&&a.lost?0:u.base*f*(1+g/100), r=V*(1+pe);
      if(a&&a.amt!=null&&!a.lost){r=a.amt;V=r/(1+pe);}
      const gp=r-V*(1-u.gm)*(1+cEff);
      out.unit[u.key]={V,r,gp,g};
      R+=r;G+=gp;V0+=V;
      for(let i=0;i<12;i++) mon[i]+=V*w[i]*(a&&a.p!=null?1+a.p/100:ix[i]);
    }
    if(C.base>0) G+=(C.gm*C.base-C.G0)*V0/C.base; // keeps 2027 GP% equal to 2026 GP% when nothing changes
    // line changes
    let ex=0, push=0, del=0; const gm27=R>0?G/R:C.gm;
    for(const x of (SK[cat]||[])){const s=st.sku[x.id]; if(!s) continue;
      if(s.act==='push'){const v=x.base*f*(+s.pct||0)/100*(1+pEff); ex+=v; push+=v;}
      if(s.act==='delist'){const v=x.base*f*(1+vC/100)*(1-(+s.ret||0)/100)*(1+pEff); ex-=v; del-=v;}}
    for(let i=0;i<12;i++) mon[i]+=ex*w[i];
    let nl=0,nlg=0;
    for(const n of st.newl){ if(n.cat!==cat||!(+n.amt)) continue; const a=+n.amt; nl+=a; nlg+=a*((n.gp!=null&&n.gp!=='')?(+n.gp)/100:C.gm);
      const m0=Math.max(1,+n.m||1)-1, ww=w.map((v,i)=>i>=m0?v:0), s=ww.reduce((p,q)=>p+q,0)||1; for(let i=0;i<12;i++) mon[i]+=a*ww[i]/s; }
    const rev=R+ex+nl, gp=G+ex*gm27+nlg;
    const k=R>0?rev/R:1;
    out.cat[cat]={base:C.base,r25:C.r25,r25y:C.r25y,r26:C.r26,g26:C.g26,b26:C.b26,rev,gp,ex,push,del,nl,one,k,vC,pEff,cEff,units:R};
    out.catMon[cat]=mon; mon.forEach((v,i)=>out.mon[i]+=v);
    for(const u of C.units){const o=out.unit[u.key];
      const rp=out.rep[u.rep]||(out.rep[u.rep]={base:0,rev:0,gp:0}); rp.base+=u.base; rp.rev+=o.r*k; rp.gp+=G?o.gp*gp/G:o.gp;
      const ch=out.chn[cat+'|'+u.ch]||(out.chn[cat+'|'+u.ch]={base:0,rev:0}); ch.base+=u.base; ch.rev+=o.r;
      const cht=out.chn['*|'+u.ch]||(out.chn['*|'+u.ch]={base:0,rev:0}); cht.base+=u.base; cht.rev+=o.r;}
    const T=out.t;T.base+=C.base;T.r25+=C.r25;T.b26+=C.b26;T.r26+=C.r26;T.g26+=C.g26;T.gp26w+=C.gm*C.base;T.rev+=rev;T.gp+=gp;
  }
  return out;
}

/* ---------- formatting ---------- */
const fm=k=>{if(k==null||isNaN(k))return '–';const a=Math.abs(k);if(a>=1000000)return (k/1000000).toFixed(2)+'B';if(a>=100000)return (k/1000).toFixed(0)+'M';if(a>=1000)return (k/1000).toFixed(1)+'M';if(a>=0.5)return Math.round(k)+'K';return '0';};

const fg=v=>v==null||!isFinite(v)?'–':(v*100).toFixed(1)+'%';
const cls=v=>v==null?'':v>0.0005?'pos':v<-0.0005?'neg':'';

function parseAmt(s){s=String(s).trim().toLowerCase().replace(/[j$,\s]/g,'');if(s==='')return null;const m=s.match(/^(-?[\d.]+)([kmb]?)$/);if(!m)return null;const v=parseFloat(m[1]);if(!isFinite(v))return null;
  if(m[2]==='b')return v*1000000;if(m[2]==='m')return v*1000;if(m[2]==='k')return v;return Math.abs(v)<1000?v*1000:v/1000;}

async function flush(){

     <span class="lbl">${eq}</span>${IS_OWNER?'':' <span class="sub">Set by Scott</span>'}</div>
    <span class="lbl">Built so far: <b>${fj(T.rev)}</b>${gap==null?'':` · <span class="${gap>=0?'pos':'neg'}">${gap>=0?'ahead of':'short of'} target by ${fj(Math.abs(gap))}</span>`}</span>
    <div class="signoff">${IS_OWNER?`<button class="btn sm ${clearArm==='*'?'':'ghost'}" style="${clearArm==='*'?'background:var(--red);border-color:var(--red)':'color:var(--red);border-color:var(--red)'}" data-act="clearall">${clearArm==='*'?"Click again to clear every CM's inputs":"Clear every CM's inputs"}</button>`:''}<button class="btn ghost sm" data-act="export" data-scope="all">Export all CSV</button></div></div>
   <div class="tw"><table><thead><tr><th>Owner</th><th class="n">2025</th><th class="n">2026 RR</th><th class="n">2026 bud</th><th class="n">2027</th><th class="n">Growth</th><th class="n">GP% 26</th><th class="n">GP% 27</th><th class="n">GP J$ 27</th><th>Status</th></tr></thead>
   <tbody>${rows}<tr><td class="sub">Uncoded credits &amp; adjustments (held flat)</td><td class="n sub">${fm(JUNK25)}</td><td class="n sub">${fm(JUNKBASE)}</td><td></td><td class="n sub">${fm(JUNKBASE)}</td><td></td><td></td><td></td><td></td><td></td></tr></tbody>
   <tfoot><tr class="tot"><td>Company</td><td class="n">${fm(T.r25)}</td><td class="n">${fm(T.base)}</td><td class="n">${fm(T.b26)}</td><td class="n">${fm(T.rev)}</td><td class="n">${fp(T.base>0?T.rev/T.base-1:null)}</td><td class="n">${fg(T.base>0?T.gp26w/T.base:null)}</td><td class="n">${fg(T.rev>0?T.gp/T.rev:null)}</td><td class="n">${fm(T.gp)}</td><td></td></tr></tfoot></table></div>
   <p class="sub" style="margin-top:8px">Owners not started count at their 2026 run-rate (flat). Click an owner to open their budget. Rep figures are on the Rep targets and Monthly targets tabs.</p>`;
}

function outVal(key){
  const p=key.split(':'), t=p[0];
  if(t==='t'){const T=COMP.t;switch(p[1]){case 'r25':return fm(T.r25);case 'base':return fm(T.base);case 'b26':return fm(T.b26);case 'rev':return fm(T.rev);case 'g':return fp(T.base>0?T.rev/T.base-1:null);case 'gp':return fg(T.rev>0?T.gp/T.rev:null);case 'gp26':return fg(T.base>0?T.gp26w/T.base:null);case 'yoy':{let a=0,b=0;for(const c of catsOf()){a+=CAT[c].r26;b+=CAT[c].r25y;}return fp(b>0?a/b-1:null,0);}}}
  if(t==='cat'){const c=p.slice(1,-1).join(':'),o=COMP.cat[c];if(!o)return '–';switch(p[p.length-1]){case 'rev':return fm(o.rev);case 'pe':return o.pEff?fp(o.pEff):'–';case 'units':return fm(o.units);case 'base':return fm(o.base);
      case 'push':return o.push?'+'+fm(o.push):'–';case 'del':return o.del?'−'+fm(-o.del):'–';case 'nl':return o.nl?'+'+fm(o.nl):'–';case 'g':return fp(o.base>0?o.rev/o.base-1:null);case 'gp':return fg(o.rev>0?o.gp/o.rev:null);}}
  if(t==='u'){const k=p.slice(1,-1).join(':'),o=COMP.unit[k];if(!o)return '–';return p[p.length-1]==='r'?fm(o.r):fg(o.r>0?o.gp/o.r:null);}
  if(t==='st'||t==='kam'){const cs=new Set(catsOf()), ids=t==='st'?[p[1]]:((KAMS.find(k=>k.key===p[1])||{}).ids||[]); let r=0;
    for(const id of ids){const s=STORES[id]; if(!s) continue; for(const u of s.units){ if(!cs.has(u.cat)||(selCat!=='*'&&kamSel&&u.cat!==selCat)) continue; const o=COMP.unit[u.key]; if(o) r+=o.r; }} return fm(r);}
  if(t==='ch'){const o=COMP.chn['*|'+p[1]];return o?fp(o.base>0?o.rev/o.base-1:null):'–';}
  if(t==='s'){const id=p[1], st=S(), s=st.sku[id]; if(!s||!s.act) return ''; const x=(SK[selCat]||[]).find(z=>z.id===id); if(!x) return ''; const o=COMP.cat[x.cat]||{}; const C=CAT[x.cat], L=st.cat[x.cat]||{}, f=C.base>0?1-(o.one||0)/C.base:1;
    const v=s.act==='push'?x.base*f*(+s.pct||0)/100*(1+(o.pEff||0)):-x.base*f*(1+(o.vC||0)/100)*(1-(+s.ret||0)/100)*(1+(o.pEff||0)); return (v>=0?'+':'')+fm(v);}
  return '';
}
function companyTotals(){
  // category managers only receive company totals from the server; swap in their own live figure
  if(!IS_OWNER&&COMPANY){const mb=COMPANY.mine||{base:0,rev:0}, live=(COMP||{t:{rev:0}}).t;
    return {base:+COMPANY.base||0, rev:(+COMPANY.rev||0)-(+mb.rev||0)+(live.rev||0), gp:0, started:+COMPANY.started||0};}
  const T={base:JUNKBASE,rev:JUNKBASE,gp:0,started:0};
  if(!COMPALL[cur.key]) COMPALL=computeAll();
  for(const m of CMS){const st=STATES[m.key]||blank(m.key);const t=(COMPALL[m.key]||computeCM(m.key,st)).t;T.base+=t.base;T.rev+=t.rev;T.gp+=t.gp;if(inputList(st).length)T.started++;}
  return T;
}
function renderCo(){
  const T=companyTotals(), g=T.base>0?T.rev/T.base-1:null, tgt=tgtOf(T.base), gap=tgt!=null?T.rev-tgt:null;
  $('#co').innerHTML=`<span class="t">Company 2027</span>
   <div class="s"><span class="sv">${fj(T.rev)} <span class="${g>0.0005?'up':g<-0.0005?'dn':''}" style="font-size:13px;margin-left:2px">${fp(g)}</span></span>
    ${gap==null?'':`<span class="sl" style="text-transform:none;letter-spacing:0;font-size:11px">${fj(Math.abs(gap))} ${gap>=0?'ahead of':'short of'} the ${tgtLabel(T.base)}</span>`}</div>`;
}
function update(){
  const st=S(); COMP=computeCM(cur.key,st); COMPALL=computeAll(); strip(); renderCo();
  const nIn=inputList(st).length; document.querySelectorAll('button[data-act=inputs]').forEach(b=>b.textContent=`Inputs (${nIn})`);
  if(showInputs&&tab!=='team'&&tab!=='rep'&&tab!=='mt') renderBanner();
  document.querySelectorAll('[data-o]').forEach(el=>{const k=el.dataset.o;
    if(k.endsWith(':bar')){const c=k.slice(4,-4),o=COMP.cat[c];el.style.width=(o?Math.min(100,o.rev/(+el.dataset.max||1)*100):0).toFixed(1)+'%';return;}
    el.textContent=outVal(k);
    if(/:g$/.test(k)||k.startsWith('s:')){const v=el.textContent;el.classList.remove('pos','neg');if(v.startsWith('+')&&v!=='+0.0%')el.classList.add('pos');else if(v.startsWith('-'))el.classList.add('neg');}
  });
  // placeholders show the growth that will apply
  document.querySelectorAll('input[data-act=cat][data-f=v]').forEach(el=>el.placeholder=pctIn(st.def??0)||'0');
  document.querySelectorAll('input[data-act=ch]').forEach(el=>{const c=el.dataset.k.split('|')[0];el.placeholder=pctIn((st.cat[c]||{}).v??st.def??0)||'0';});
  document.querySelectorAll('input[data-act=acc][data-f=g]').forEach(el=>{const u=COMP.unit[el.dataset.k];el.placeholder=u&&!(st.acc[el.dataset.k]||{}).g?pctIn(u.g)||'0':el.placeholder;});
  document.querySelectorAll('input[data-act=acc][data-f=p]').forEach(el=>{const c=el.dataset.k.split('|')[0];el.placeholder=(pEffOf(c,st.cat[c]||{})*100).toFixed(1).replace(/\.0$/,'');});
  if(tab==='mon') renderMon(); if(tab==='rep') renderRep(); if(tab==='team') renderTeam(); if(tab==='mt') renderMT();
}
function render(){
  // Company view tabs (Summary, Rep targets, Monthly targets) are for the page owner only
  document.querySelectorAll('[data-owner]').forEach(e=>e.hidden=!IS_OWNER);
  if(!IS_OWNER&&['team','rep','mt'].includes(tab)) tab='cat';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));

  ({cat:renderCat,chn:renderChn,acc:renderAcc,sku:renderSku,mon:()=>{renderMon();update();},rep:()=>{renderRep();update();},team:()=>{renderTeam();update();},mt:()=>{update();}})[tab]();

function renderBanner(){
  const ap=APPROVALS[cur.key], b=[];
  if(!DB&&dbChecked) b.push('<div class="banner">Shared saving is not available in this view. Changes are kept on this device only and won\'t reach the roll-up.</div>');

  if(tab!=='team'&&tab!=='rep'&&tab!=='mt') b.push(inputsPanel());

}

/* ---------- events ---------- */
function keepFocus(fn){const a=document.activeElement,id=a&&a.id,s=a&&a.selectionStart;fn();if(id){const e=document.getElementById(id);if(e){e.focus();try{if(s!=null)e.setSelectionRange(s,s);}catch(x){}}}}
const setOr=(obj,k,v)=>{if(v==null||v==='') delete obj[k]; else obj[k]=v;};
document.addEventListener('change',e=>{
  const el=e.target, act=el.dataset.act; if(!act) return;
  if(act==='mtrep'){mtRep=el.value;renderMT();return;}
  if(act==='kam'){kamSel=el.value;selCat=kamSel?'*':null;accQ='';renderAcc();return;}
  if(act==='repsel'){repSel=el.value;repOpen.clear();repQ='';try{localStorage.setItem('cb.rep',repSel);}catch(x){}renderRep();return;}
  if(act==='tgtmode'){if(!IS_OWNER)return;SETTINGS.mode=el.value==='amt'?'amt':'pct';saveSettings();renderCo();renderTeam();return;}
  if(act==='tgt'){if(!IS_OWNER)return;
    if(SETTINGS.mode==='amt'){const v=parseAmt(el.value);SETTINGS.amt=v!=null&&v>0?v:null;}else{SETTINGS.target=parsePct(el.value);}
    saveSettings();renderCo();keepFocus(renderTeam);return;}
  if(locked()) return;
  const st=S();
  switch(act){
    case 'def': st.def=parsePct(el.value); el.value=pctIn(st.def); break;
    case 'cat': {const c=el.dataset.k,f=el.dataset.f,L=st.cat[c]||(st.cat[c]={});
      if(f==='note') setOr(L,'note',el.value.trim()); else if(f==='one'){const v=parseAmt(el.value);setOr(L,'one',v!=null&&v>0?v:null);el.value=amtIn(L.one);}
      else {const v=parsePct(el.value);setOr(L,f,v);el.value=pctIn(L[f]);if(f==='p'){delete L.q;delete L.qm;}} break;}
    case 'catpm': {const c=el.dataset.k,L=st.cat[c]||(st.cat[c]={});L.pm=el.value==='Q'?'Q':+el.value;delete L.q;delete L.qm;break;}
    case 'catq': {const c=el.dataset.k,L=st.cat[c]||(st.cat[c]={});const q=priceQ(L);q[+el.dataset.q]=parsePct(el.value)||0;L.q=q;delete L.p;delete L.pm;
      if(!q.some(v=>v))delete L.q; el.value=q[+el.dataset.q]?pctIn(q[+el.dataset.q]):''; break;}
    case 'catqm': {const c=el.dataset.k,L=st.cat[c]||(st.cat[c]={});const qm=priceQM(L);qm[+el.dataset.q]=+el.value;L.qm=qm;if(!L.q&&L.p){L.q=priceQ(L);delete L.p;delete L.pm;}break;}
    case 'catm': {const [c,f]=el.dataset.k.split('|');const L=st.cat[c]||(st.cat[c]={});L[f]=+el.value;break;}
    case 'ch': {const v=parsePct(el.value);setOr(st.ch,el.dataset.k,v);el.value=pctIn(v);break;}
    case 'acc': {const k=el.dataset.k,f=el.dataset.f,a=st.acc[k]||(st.acc[k]={});
      if(f==='amt'){const v=parseAmt(el.value);setOr(a,'amt',v);el.value=amtIn(a.amt);} else {const v=parsePct(el.value);setOr(a,f,v);el.value=pctIn(a[f]);}
      if(!Object.keys(a).length) delete st.acc[k]; break;}
    case 'sku': {const k=el.dataset.k,f=el.dataset.f,s=st.sku[k]||(st.sku[k]={});
      if(f==='act'){ if(!el.value){delete st.sku[k];} else {s.act=el.value; if(s.act==='push'&&s.pct==null)s.pct=10;} touch(); keepFocus(renderSku); return; }
      const v=parsePct(el.value); setOr(s,f,v); el.value=pctIn(s[f]); break;}
    case 'nlamt': {const n=st.newl[+el.dataset.i]; if(!n) return; const v=parseAmt(el.value); if(v!=null&&v>0) n.amt=v; el.value=amtIn(n.amt); break;}
    default: return;
  }
  touch();
});
document.addEventListener('input',e=>{const a=e.target.dataset.act;
  if(a==='accq'){accQ=e.target.value.trim().toLowerCase();keepFocus(renderAcc);}
  if(a==='skuq'){skuQ=e.target.value.trim().toLowerCase();keepFocus(renderSku);}
  if(a==='repq'){repQ=e.target.value.trim().toLowerCase();keepFocus(renderRep);}
  if(a==='chq'){chQ=e.target.value.trim().toLowerCase();renderChList();} });
document.addEventListener('keydown',e=>{const el=e.target;if(e.key==='Enter'&&el.matches('input.lv')){el.blur();const sel=`input[data-act="${el.dataset.act}"]${el.dataset.f?`[data-f="${el.dataset.f}"]`:''}:not([disabled])`;const ins=[...document.querySelectorAll(sel)];const i=ins.indexOf(el);if(i>=0&&ins[i+1])ins[i+1].focus();}});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||['INPUT','SELECT','TEXTAREA'].includes(el.tagName)) return;
  const act=el.dataset.act, st=S();
  switch(act){
    case 'selcat': selCat=el.dataset.v; tab==='acc'?renderAcc():renderSku(); return;
    case 'repopen': {const c=el.dataset.c; repOpen.has(c)?repOpen.delete(c):repOpen.add(c); renderRep(); return;}
    case 'skuf': skuFilt=el.dataset.v; renderSku(); return;
    case 'gocm': setCm(el.dataset.k); tab='cat'; saveUi(); render(); return;
    case 'export': doExport(el.dataset.scope,el); return;
    case 'mtview': mtView=el.dataset.v; renderMT(); return;
    case 'repmode': repMode=el.dataset.v; renderRep(); return;
    case 'mtexport': mtExport(el); return;
    case 'inputs': showInputs=!showInputs; clearArm=''; render(); return;
    case 'clearcm': if(!IS_OWNER) return; if(clearArm!==cur.key){clearArm=cur.key;render();setTimeout(()=>{if(clearArm===cur.key){clearArm='';render();}},5000);return;}
      clearArm=''; resetCM(cur.key); setSave('pending','Saving…'); clearTimeout(tm); tm=setTimeout(flush,200); render(); return;
    case 'clearall': if(!IS_OWNER) return; if(clearArm!=='*'){clearArm='*';renderTeam();setTimeout(()=>{if(clearArm==='*'){clearArm='';if(tab==='team')renderTeam();}},5000);return;}
      clearArm=''; CMS.forEach(m=>{ if(STATES[m.key]&&STATES[m.key].updatedAt) resetCM(m.key); }); setSave('pending','Saving…'); clearTimeout(tm); tm=setTimeout(flush,200); render(); return;
    case 'approve': if(!IS_OWNER) return; decide(cur.key,'approved'); return;
    case 'reopen': if(!IS_OWNER) return; decide(cur.key,'draft'); return;
  }
  if(locked()) return;
  switch(act){
    case 'apre': {const k=el.dataset.k,v=el.dataset.v,a=st.acc[k]||(st.acc[k]={});
      if(v==='lost'){ if(a.lost) delete a.lost; else a.lost=true; } else { delete a.lost; a.g=+v; }
      if(!Object.keys(a).length) delete st.acc[k]; touch(); keepFocus(renderAcc); return;}
    case 'addnew': {const name=$('#nn').value.trim(), amt=parseAmt($('#namt').value), gp=parsePct($('#ngp').value);
      if(!name){$('#nn').focus();return;} if(amt==null||amt<=0){const f=$('#namt');f.value='';f.placeholder='Enter an amount';f.focus();return;}
      st.newl.push({id:'n'+Date.now().toString(36),name,cat:$('#ncat').value,amt,m:+$('#nm').value,gp}); touch(); renderSku(); return;}
    case 'rmnew': st.newl.splice(+el.dataset.i,1); touch(); renderSku(); return;
    case 'rmin': {const x=inputList(st)[+el.dataset.j]; if(x){removeInput(st,x); touch(); render();} return;}
    case 'submit': st.status='submitted'; st.submittedAt=new Date().toISOString(); touch(); render(); return;
  }
});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;saveUi();render();}));
$('#cmSel').addEventListener('change',e=>{setCm(e.target.value);selCat=null;render();});
function setCm(k){cur=CMS.find(m=>m.key===k)||cur;cmOptions();saveUi();}
function saveUi(){try{localStorage.setItem('cb.tab',tab);localStorage.setItem('cb.cm',cur.key);}catch(e){}}

/* ---------- export (budget_2026 layout) ---------- */
function csvRows(m){
  const st=STATES[m.key]||blank(m.key), o=computeCM(m.key,st), rows=[];
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const [,status]=statusOf(m.key);
  for(const cat of CMCATS[m.key]||[]){
    const C=CAT[cat], oc=o.cat[cat], w=seas(cat), L=st.cat[cat]||{}, ix=priceIdx(L), gpk=oc.gp/(oc.rev||1);
    for(const u of C.units){const x=o.unit[u.key]; if(!x||!x.r) continue; const r=x.r*oc.k;
      const ww=w.map((v,i)=>v*ix[i]), s=ww.reduce((p,q)=>p+q,0)||1;
      const id=u.kind==='n'?u.cid:`GROUP-${slug(u.ch)}-${slug(u.rep)}`, nm=u.kind==='n'?u.n:`Other ${u.ch} accounts (${u.cnt})`;
      for(let i=0;i<12;i++){const b=r*ww[i]/s*1000; if(Math.abs(b)<0.5) continue;
        rows.push([id,nm,u.cl||'',cat,u.rep,u.ar||'',u.ch,MONTHS_L[i],i+1,b.toFixed(2),(b*gpk).toFixed(2),m.name,status].map(q).join(','));}}
  }
  return rows;
}
async function doExport(scope,btn){
  if(!DL){btn.textContent='Export not available here';btn.disabled=true;return;}
  const head='customer_id,customer_name,customer_class,item_class,salesperson,area,channel,month,month_number,budget,gp_budget,category_manager,status';
  const lines=[head]; let name;
  if(scope==='rep'){
    COMPALL=computeAll(); const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
    for(const s of Object.values(STORES)){ if(s.rep!==repSel) continue;
      for(const u of s.units){ const x=unitRes(u); if(!x.r) continue; const ow=CAT[u.cat].owner;
        const L=ow?((STATES[ow.key]||blank(ow.key)).cat[u.cat]||{}):{}, ix=priceIdx(L), w=seas(u.cat), ww=w.map((v,i)=>v*ix[i]), sw=ww.reduce((p,qq)=>p+qq,0)||1, gpk=x.r?x.gp/x.r:0;
        for(let i=0;i<12;i++){const b=x.r*ww[i]/sw*1000; if(Math.abs(b)<0.5) continue;
          lines.push([s.id,s.n,s.cl,u.cat,s.rep,s.ar,s.ch,MONTHS_L[i],i+1,b.toFixed(2),(b*gpk).toFixed(2),ow?ow.name:'Held flat',ow?statusOf(ow.key)[1]:''].map(q).join(','));}}}
    name=`DFL_Rep_Targets_2027_${slug(repSel)}.csv`;
  } else { (scope==='all'?CMS:[cur]).forEach(m=>lines.push(...csvRows(m))); name=scope==='all'?'DFL_Category_Budget_2027_all.csv':`DFL_Category_Budget_2027_${cur.key}.csv`; }
  try{await DL.save({filename:name,data:lines.join('\n')});}catch(e){if(e&&e.code!=='declined')btn.textContent='Export failed, try again';}
}

/* ---------- loader: fetch only what this login may see, then start ---------- */
let CB_STARTED=false;
async function cbInit(){
  if(CB_STARTED) return; CB_STARTED=true;
  const box=document.getElementById('cbLoading');
  try{
    const call=f=>sb.rpc(f).then(r=>{ if(r.error) throw r.error; return r.data; });
    const [me,data,inputs,company]=await Promise.all([call('budget27_me'),call('budget27_data'),call('budget27_inputs'),call('budget27_company')]);
    if(!me||!(me.cms||[]).length||!data){
      box.innerHTML='<b>This page is for the category managers.</b><br>If you should have access, ask Scott.'; return; }
    window.CM_STORES=data.stores||[]; window.CM_SEAS={seas:data.seas||{},seasAll:data.seasAll||[]};
    window.CM_SKU=data.sku||[]; window.CM_OWNERS=data.owners||{};
    window.CB_BOOT={me,inputs,company};
    box.remove(); document.getElementById('cbApp').hidden=false;
    startApp();
  }catch(e){ box.textContent='Could not load the budget: '+((e&&e.message)||e)+'. Refresh to try again.'; CB_STARTED=false; }
}
document.addEventListener('dfl-auth-ready',()=>cbInit());
if(window.DFL_PROFILE) cbInit();
// framed (the guard no-ops in an iframe): start once the shared client has a session
if(window.self!==window.top) sb.auth.getSession().then(()=>cbInit());
