<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFL Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:      #0f2044;
    --navy2:     #1a3260;
    --accent:    #2563eb;
    --accent-bg: #eff6ff;
    --bg:        #f0f4f8;
    --gold:      #fbbf24;
    --surface:   #ffffff;
    --text:      #1e293b;
    --muted:     #64748b;
    --border:    #e2e8f0;
    --green:     #16a34a;
    --green-bg:  #dcfce7;
    --red:       #dc2626;
    --red-bg:    #fee2e2;
    --radius:    14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; min-height: 100vh; }
  .page-wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* NAME SCREEN */
  #screen-name {
    min-height: 100vh; background: var(--navy);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .name-card {
    background: var(--surface); border-radius: 20px; padding: 36px 30px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .name-card .logo { height: 30px; margin-bottom: 18px; }
  .name-card h1 { font-size: 24px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
  .name-card p { color: var(--muted); font-size: 13px; margin-bottom: 22px; line-height: 1.6; }
  .name-input-wrap { position: relative; margin-bottom: 12px; text-align: left; }
  .name-input {
    width: 100%; padding: 13px 14px; font-size: 16px; font-family: 'Inter', sans-serif;
    border: 2px solid var(--border); border-radius: 10px; outline: none; transition: border-color .15s;
  }
  .name-input:focus { border-color: var(--accent); }
  .suggest-list {
    margin-top: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 4px 12px rgba(0,0,0,.08); overflow: hidden; display: none;
  }
  .suggest-item { padding: 10px 14px; font-size: 13px; text-align: left; cursor: pointer; }
  .suggest-item:hover { background: var(--accent-bg); }
  .suggest-item + .suggest-item { border-top: 1px solid var(--border); }

  .confirm-box {
    display: none; text-align: left; background: var(--accent-bg); border: 1px solid #bfdbfe;
    border-radius: 10px; padding: 14px; margin-bottom: 14px; font-size: 13px;
  }
  .confirm-box p { color: var(--text); margin-bottom: 10px; line-height: 1.5; }
  .confirm-actions { display: flex; gap: 8px; }
  .btn-sm {
    flex: 1; padding: 9px; border-radius: 8px; border: 1.5px solid var(--border);
    background: var(--surface); font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--text);
  }
  .btn-sm.primary { background: var(--navy); border-color: var(--navy); color: #fff; }

  .btn-primary {
    width: 100%; padding: 14px; background: var(--navy); color: #fff; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 700; letter-spacing: .02em;
    cursor: pointer; transition: background .15s;
  }
  .btn-primary:hover { background: var(--navy2); }
  .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }

  /* HEADER */
  .header {
    background: var(--navy); padding: 12px 18px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 20;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .dfl-logo { height: 26px; }
  .header-title { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: .01em; }
  .player-pill {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 20px;
    padding: 5px 12px 5px 8px; display: flex; align-items: center; gap: 7px; cursor: pointer;
    transition: background .15s; max-width: 150px;
  }
  .player-pill:hover { background: rgba(255,255,255,.2); }
  .player-avatar {
    width: 22px; height: 22px; border-radius: 50%; background: var(--gold);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: 12px; color: var(--navy); flex-shrink: 0;
  }
  .player-name-pill { font-size: 12.5px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* TABS */
  .tabs { display: flex; background: var(--surface); border-bottom: 2px solid var(--border); }
  .tab {
    flex: 1; padding: 13px 8px; text-align: center; font-size: 13px; font-weight: 700;
    letter-spacing: .02em; text-transform: uppercase; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px; background: none; border-top: none;
    border-left: none; border-right: none; font-family: 'Inter', sans-serif;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .round-indicator {
    text-align: center; padding: 7px 12px; background: var(--accent-bg);
    border-bottom: 1px solid var(--border); font-size: 11.5px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; color: var(--accent);
  }

  .main { flex: 1; padding: 20px 16px 60px; }

  .state-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 36px 22px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .state-icon { font-size: 40px; margin-bottom: 14px; }
  .state-title { font-size: 18px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
  .state-sub { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* QUESTION CARD */
  .progress-label {
    font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px; text-align: center;
  }
  .progress-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }

  .q-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .q-text { font-size: 17px; font-weight: 700; color: var(--navy); line-height: 1.4; margin-bottom: 20px; }
  .opt-set { display: flex; flex-direction: column; gap: 9px; margin-bottom: 20px; }
  .opt-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface);
    font-size: 14px; font-weight: 500; color: var(--text); cursor: pointer; transition: all .12s;
    font-family: 'Inter', sans-serif;
  }
  .opt-btn:hover { border-color: var(--accent); background: var(--accent-bg); }
  .opt-letter {
    width: 24px; height: 24px; border-radius: 6px; background: var(--bg); color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0;
  }
  .opt-btn.selected { border-color: var(--navy); background: var(--navy); color: #fff; }
  .opt-btn.selected .opt-letter { background: var(--gold); color: var(--navy); }

  /* RESULTS */
  .score-banner {
    background: var(--navy); color: #fff; border-radius: var(--radius); padding: 24px;
    text-align: center; margin-bottom: 18px;
  }
  .score-banner .big { font-size: 36px; font-weight: 800; line-height: 1; }
  .score-banner .lbl { font-size: 12px; color: rgba(255,255,255,.7); margin-top: 6px; letter-spacing: .05em; text-transform: uppercase; }
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .result-q { font-size: 13.5px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
  .result-opt {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
    font-size: 13px; margin-bottom: 4px; color: var(--text);
  }
  .result-opt.correct { background: var(--green-bg); color: #166534; font-weight: 600; }
  .result-opt.wrong-pick { background: var(--red-bg); color: #991b1b; font-weight: 600; }
  .result-tag { margin-left: auto; font-size: 11px; font-weight: 700; }

  /* LEADERBOARD */
  .lb-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .lb-head {
    display: grid; grid-template-columns: 40px 1fr 56px 70px; padding: 10px 14px; background: var(--navy);
    color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; gap: 6px;
  }
  .lb-row {
    display: grid; grid-template-columns: 40px 1fr 56px 70px; padding: 12px 14px; gap: 6px;
    border-bottom: 1px solid var(--border); align-items: center; font-size: 13.5px;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row.podium { background: #fffbeb; }
  .lb-row.is-me { background: var(--accent-bg); }
  .lb-rank { font-weight: 700; color: var(--muted); font-size: 13px; }
  .lb-name { font-weight: 600; }
  .lb-name.me { color: var(--accent); }
  .lb-num { text-align: center; color: var(--muted); font-size: 13px; }
  .lb-pts { text-align: center; font-size: 17px; font-weight: 800; color: var(--navy); }
  .lb-updated { text-align: center; font-size: 11px; color: var(--muted); padding: 10px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--text); color: #fff; padding: 10px 18px; border-radius: 24px; font-size: 13px;
    font-weight: 500; z-index: 999; transition: transform .25s ease; pointer-events: none; white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .header { padding: 10px 14px; }
    .main { padding: 16px 12px 50px; }
    .q-text { font-size: 15.5px; }
  }
</style>
</head>
<body>

<!-- NAME SCREEN -->
<div id="screen-name">
  <div class="name-card">
    <img class="logo" src="https://hzagwndglwhcepsirafi.supabase.co/storage/v1/object/public/Assets/DFL%20Logo%20Blue_Black.png" alt="DFL">
    <h1>DFL Trivia</h1>
    <p>Enter your name to play. Questions are one at a time — no going back, and no right/wrong shown until the round closes.</p>
    <div class="name-input-wrap">
      <input class="name-input" id="name-input" type="text" placeholder="Your full name" maxlength="60" autocomplete="off">
      <div class="suggest-list" id="suggest-list"></div>
    </div>
    <div class="confirm-box" id="confirm-box">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button class="btn-sm primary" id="confirm-yes"></button>
        <button class="btn-sm" id="confirm-no"></button>
      </div>
    </div>
    <button class="btn-primary" id="name-submit">Let's play</button>
  </div>
</div>

<!-- APP -->
<div class="page-wrap" id="screen-app" style="display:none">
  <div class="header">
    <div class="header-left">
      <img class="dfl-logo" src="https://hzagwndglwhcepsirafi.supabase.co/storage/v1/object/public/Assets/DFL%20Logo%20Blue_White.png" alt="DFL">
      <div class="header-title">Trivia</div>
    </div>
    <div class="player-pill" onclick="changeName()">
      <div class="player-avatar" id="player-avatar">?</div>
      <div class="player-name-pill" id="player-name-display">—</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-play" onclick="showTab('play')">Play</button>
    <button class="tab" id="tab-leaderboard" onclick="showTab('leaderboard')">Leaderboard</button>
  </div>

  <div class="round-indicator" id="round-indicator" style="display:none"></div>

  <div class="main">
    <div id="view-play"></div>
    <div id="view-leaderboard" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://hzagwndglwhcepsirafi.supabase.co';
const SUPABASE_ANON = 'sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h';
const NAME_KEY = 'dfl_trivia_player_name';

let currentPlayer = null;
let currentRound = null;   // the auto-detected round row
let roundState = null;     // 'before' | 'active' | 'closed' | 'none'
let activeTab = 'play';
let selectedOption = null;
let pendingName = null;

// ── low-level API ──
async function rest(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json', ...opts.headers },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return res.status === 204 ? null : res.json();
}
async function rpc(fn, params = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json' },
    method: 'POST', body: JSON.stringify(params)
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return res.status === 204 ? null : res.json();
}

// ── toast ──
let toastTimer;
function toast(msg, duration = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

// ── Jamaica time (UTC-5, no DST) ──
function toJamaica(utcStr) { return new Date(new Date(utcStr).getTime() - 5 * 60 * 60 * 1000); }
function formatWhen(utcStr) {
  const jm = toJamaica(utcStr);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const h = jm.getUTCHours(), m = jm.getUTCMinutes();
  const h12 = h % 12 || 12;
  const time = h12 + (m ? ':' + String(m).padStart(2,'0') : '') + (h >= 12 ? 'pm' : 'am');
  return `${days[jm.getUTCDay()]}, ${months[jm.getUTCMonth()]} ${jm.getUTCDate()} at ${time}`;
}

// ── Name entry ──
function init() {
  const saved = localStorage.getItem(NAME_KEY);
  if (saved) { currentPlayer = saved; showApp(); }
  else { document.getElementById('screen-name').style.display = 'flex'; }

  const input = document.getElementById('name-input');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') handleNameSubmit(); });
  input.addEventListener('input', debounce(onNameInput, 300));
  document.getElementById('name-submit').addEventListener('click', handleNameSubmit);
}

let lastSuggestions = [];
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

async function onNameInput() {
  const val = document.getElementById('name-input').value.trim();
  const list = document.getElementById('suggest-list');
  if (val.length < 2) { list.style.display = 'none'; return; }
  try {
    lastSuggestions = await rpc('search_trivia_players', { p_name: val });
  } catch (e) { lastSuggestions = []; }
  if (!lastSuggestions.length) { list.style.display = 'none'; return; }
  list.innerHTML = lastSuggestions.map(s => `<div class="suggest-item" data-name="${escapeHtml(s.player_name)}">${escapeHtml(s.player_name)}</div>`).join('');
  list.style.display = 'block';
  list.querySelectorAll('.suggest-item').forEach(el => {
    el.addEventListener('click', () => {
      document.getElementById('name-input').value = el.dataset.name;
      list.style.display = 'none';
    });
  });
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function handleNameSubmit() {
  const val = document.getElementById('name-input').value.trim();
  if (!val) return;
  document.getElementById('suggest-list').style.display = 'none';

  let suggestions = lastSuggestions;
  try { suggestions = await rpc('search_trivia_players', { p_name: val }); } catch (e) { suggestions = []; }
  const top = suggestions[0];

  if (top && top.player_name.toLowerCase() !== val.toLowerCase() && top.sim > 0.5) {
    pendingName = val;
    showConfirm(val, top.player_name);
    return;
  }
  finishNameEntry(val);
}

function showConfirm(typed, match) {
  const box = document.getElementById('confirm-box');
  document.getElementById('confirm-text').textContent = `Did you mean "${match}"? You've played trivia before under that name.`;
  const yes = document.getElementById('confirm-yes');
  const no = document.getElementById('confirm-no');
  yes.textContent = `Yes, that's me`;
  no.textContent = `No, use "${typed}"`;
  yes.onclick = () => { box.style.display = 'none'; finishNameEntry(match); };
  no.onclick = () => { box.style.display = 'none'; finishNameEntry(typed); };
  box.style.display = 'block';
}

function finishNameEntry(name) {
  currentPlayer = name;
  localStorage.setItem(NAME_KEY, name);
  document.getElementById('screen-name').style.display = 'none';
  showApp();
}

function changeName() {
  if (!confirm('Play as a different name? Your existing answers stay linked to your current name.')) return;
  localStorage.removeItem(NAME_KEY);
  currentPlayer = null;
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('name-input').value = '';
  document.getElementById('confirm-box').style.display = 'none';
  document.getElementById('screen-name').style.display = 'flex';
}

function showApp() {
  document.getElementById('screen-app').style.display = 'flex';
  document.getElementById('player-name-display').textContent = currentPlayer;
  document.getElementById('player-avatar').textContent = currentPlayer.charAt(0).toUpperCase();
  loadRound();
}

// ── Tabs ──
function showTab(name) {
  activeTab = name;
  document.getElementById('tab-play').classList.toggle('active', name === 'play');
  document.getElementById('tab-leaderboard').classList.toggle('active', name === 'leaderboard');
  document.getElementById('view-play').style.display = name === 'play' ? 'block' : 'none';
  document.getElementById('view-leaderboard').style.display = name === 'leaderboard' ? 'block' : 'none';
  if (name === 'leaderboard') loadLeaderboard();
}

// ── Round auto-detect ──
async function loadRound() {
  let rounds;
  try {
    rounds = await rest('trivia_rounds?select=*&order=round_number.desc');
  } catch (e) {
    renderState('play', '⚠️', 'Could not load trivia', 'Check your connection and try again.');
    return;
  }
  if (!rounds.length) {
    currentRound = null; roundState = 'none';
    renderRoundIndicator();
    renderState('play', '🧠', 'No trivia yet', 'Nothing has been set up yet — check back soon.');
    return;
  }
  const now = Date.now();
  const active = rounds.find(r => now >= new Date(r.opens_at).getTime() && now <= new Date(r.closes_at).getTime());
  if (active) { currentRound = active; roundState = 'active'; }
  else {
    const closed = rounds.filter(r => now > new Date(r.closes_at).getTime()).sort((a,b) => new Date(b.closes_at) - new Date(a.closes_at));
    if (closed.length) { currentRound = closed[0]; roundState = 'closed'; }
    else {
      const upcoming = rounds.filter(r => now < new Date(r.opens_at).getTime()).sort((a,b) => new Date(a.opens_at) - new Date(b.opens_at));
      currentRound = upcoming[0] || null; roundState = upcoming.length ? 'before' : 'none';
    }
  }
  renderRoundIndicator();
  renderPlayView();
}

function renderRoundIndicator() {
  const el = document.getElementById('round-indicator');
  if (!currentRound) { el.style.display = 'none'; return; }
  const label = currentRound.round_number === 0 ? 'Test Round' : `Round ${currentRound.round_number}`;
  el.textContent = label;
  el.style.display = 'block';
}

function renderState(target, icon, title, sub) {
  document.getElementById('view-' + target).innerHTML = `
    <div class="state-card">
      <div class="state-icon">${icon}</div>
      <div class="state-title">${title}</div>
      <div class="state-sub">${sub}</div>
    </div>`;
}

// ── Play view ──
async function renderPlayView() {
  if (!currentRound) { renderState('play', '🧠', 'No trivia yet', 'Nothing has been set up yet — check back soon.'); return; }

  if (roundState === 'before') {
    renderState('play', '⏰', `${currentRound.title} opens soon`,
      `Opens ${formatWhen(currentRound.opens_at)} (Jamaica time). Come back then!`);
    return;
  }

  if (roundState === 'closed') {
    await renderResults();
    return;
  }

  // active
  document.getElementById('view-play').innerHTML = `<div class="state-card"><div class="spinner"></div>Loading question...</div>`;
  let q;
  try {
    const rows = await rpc('get_next_question', { p_round_id: currentRound.id, p_player_name: currentPlayer });
    q = rows && rows[0];
  } catch (e) {
    renderState('play', '⚠️', 'Something went wrong', 'Could not load your next question. Pull to refresh in a moment.');
    return;
  }

  if (!q) {
    renderState('play', '✅', `You're in!`,
      `Leaderboard updates live — full results after ${formatWhen(currentRound.closes_at)}.`);
    return;
  }

  selectedOption = null;
  const total = q.total_questions, answered = q.questions_answered;
  document.getElementById('view-play').innerHTML = `
    <div class="progress-label">Question ${answered + 1} of ${total}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(answered / total) * 100}%"></div></div>
    <div class="q-card">
      <div class="q-text">${escapeHtml(q.question_text)}</div>
      <div class="opt-set" id="opt-set">
        ${['a','b','c','d'].map(l => `
          <button class="opt-btn" data-opt="${l}" onclick="selectOption('${l}', this)">
            <span class="opt-letter">${l.toUpperCase()}</span>
            <span>${escapeHtml(q['option_' + l])}</span>
          </button>`).join('')}
      </div>
      <button class="btn-primary" id="submit-answer-btn" disabled onclick="submitAnswer(${q.question_id})">Submit</button>
    </div>`;
}

function selectOption(letter, btn) {
  selectedOption = letter;
  document.querySelectorAll('#opt-set .opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('submit-answer-btn').disabled = false;
}

async function submitAnswer(questionId) {
  if (!selectedOption) return;
  const btn = document.getElementById('submit-answer-btn');
  btn.disabled = true; btn.textContent = 'Submitting...';
  try {
    await rpc('submit_answer', {
      p_round_id: currentRound.id, p_question_id: questionId,
      p_player_name: currentPlayer, p_selected_option: selectedOption
    });
    toast('Answer submitted');
    renderPlayView();
  } catch (e) {
    toast('Could not submit — try again');
    btn.disabled = false; btn.textContent = 'Submit';
  }
}

// ── Results (after close) ──
async function renderResults() {
  document.getElementById('view-play').innerHTML = `<div class="state-card"><div class="spinner"></div>Loading results...</div>`;
  let rows;
  try {
    rows = await rpc('get_round_results', { p_round_id: currentRound.id, p_player_name: currentPlayer });
  } catch (e) {
    renderState('play', '⚠️', 'Could not load results', 'Try again in a moment.');
    return;
  }
  if (!rows.length) {
    renderState('play', '🔒', 'Results not ready', 'Check back shortly.');
    return;
  }
  const answered = rows.filter(r => r.player_selected !== null);
  const correct = rows.filter(r => r.player_correct === true).length;

  let html = `
    <div class="score-banner">
      <div class="big">${correct} / ${rows.length}</div>
      <div class="lbl">${currentRound.title} — Final Score</div>
    </div>`;

  rows.forEach(r => {
    html += `<div class="result-card"><div class="result-q">${r.order_index}. ${escapeHtml(r.question_text)}</div>`;
    ['a','b','c','d'].forEach(l => {
      const isCorrect = r.correct_option === l;
      const isMine = r.player_selected === l;
      let cls = '';
      if (isCorrect) cls = 'correct';
      else if (isMine) cls = 'wrong-pick';
      let tag = '';
      if (isCorrect) tag = '<span class="result-tag">✓ Correct</span>';
      else if (isMine) tag = '<span class="result-tag">Your pick</span>';
      html += `<div class="result-opt ${cls}"><span>${l.toUpperCase()}. ${escapeHtml(r['option_' + l])}</span>${tag}</div>`;
    });
    if (r.player_selected === null) html += `<div class="result-opt">No answer submitted</div>`;
    html += `</div>`;
  });

  document.getElementById('view-play').innerHTML = html;
}

// ── Leaderboard ──
async function loadLeaderboard() {
  if (!currentRound) return;
  const container = document.getElementById('view-leaderboard');
  if (!container.dataset.loaded) container.innerHTML = `<div class="state-card"><div class="spinner"></div>Loading leaderboard...</div>`;
  let rows;
  try {
    rows = await rpc('get_leaderboard', { p_round_id: currentRound.id });
  } catch (e) {
    renderState('leaderboard', '⚠️', 'Could not load leaderboard', 'Try again in a moment.');
    return;
  }
  container.dataset.loaded = '1';
  if (!rows.length) {
    renderState('leaderboard', '🏆', 'No answers yet', 'Be the first to play!');
    return;
  }
  const medals = ['🥇','🥈','🥉'];
  let html = `<div class="lb-wrap"><div class="lb-head"><div>#</div><div>Player</div><div style="text-align:center">✓</div><div style="text-align:center">Score</div></div>`;
  rows.forEach(r => {
    const isMe = r.player_name.toLowerCase() === currentPlayer.toLowerCase();
    const podium = r.rnk <= 3;
    html += `<div class="lb-row ${podium ? 'podium' : ''} ${isMe ? 'is-me' : ''}">
      <div class="lb-rank">${podium ? medals[r.rnk - 1] : r.rnk}</div>
      <div class="lb-name ${isMe ? 'me' : ''}">${escapeHtml(r.player_name)}${isMe ? ' ◀' : ''}</div>
      <div class="lb-num">${r.questions_answered}</div>
      <div class="lb-pts">${r.correct_count}</div>
    </div>`;
  });
  html += `</div><div class="lb-updated">Updated ${new Date().toLocaleTimeString('en-JM', {hour:'2-digit', minute:'2-digit'})}</div>`;
  container.innerHTML = html;
}

// ── Auto-refresh: catch state transitions (opens/closes) and keep leaderboard live ──
setInterval(() => {
  if (!currentPlayer) return;
  if (activeTab === 'play') loadRound();
  else loadLeaderboard();
}, 20000);

init();
</script>
</body>
</html>
