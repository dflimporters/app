<!DOCTYPE html>
<html><body>
<iframe id="f" src="/hub.html" style="width:100%;height:900px;border:1px solid #ccc"></iframe>
<script>
window.onload = () => {
  const f = document.getElementById('f');
  f.onload = () => {
    const profile = { id:'test-mgr', full_name:'Test Manager', role:'manager', salesperson_id:null, rep_id:null, active:true };
    f.contentDocument.dispatchEvent(new CustomEvent('dfl-auth-ready', { detail: { profile } }));
  };
};
</script>
</body></html>
