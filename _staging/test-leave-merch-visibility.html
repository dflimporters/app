<!DOCTYPE html>
<html><body>
<iframe id="f" src="/leave-request.html" style="width:100%;height:900px;border:1px solid #ccc"></iframe>
<script>
async function waitForFn(win, name){
  for(let i=0;i<100;i++){
    try{ if(typeof win[name]==='function') return; }catch(e){}
    await new Promise(r=>setTimeout(r,50));
  }
  throw new Error('timed out waiting for '+name);
}
window.onload = async () => {
  const f = document.getElementById('f');
  await waitForFn(f.contentWindow, 'init');
  const profile = { id:'test-clerett', full_name:'Clerett Holness', role:'rep', salesperson_id:'CLH', rep_id:null, active:true };
  f.contentDocument.dispatchEvent(new CustomEvent('dfl-auth-ready', { detail: { profile } }));
};
</script>
</body></html>
