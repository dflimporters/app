<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merchandiser Evaluation — DFL Importers</title>
<!-- Hidden until the auth guard approves (it reveals immediately when this page
     is framed by merch.html, which has already passed it). -->
<style>body { visibility: hidden; }</style>
<!-- Shared client: requests carry the signed-in user's token. This tool used to
     be a base64 data: iframe inside merch.html, whose opaque origin could not
     read the session and so wrote evaluations with a hardcoded anon key. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<style>
  :root{
    --navy:#0E2A4E;
    --navy-deep:#081B33;
    --blue:#1C66C9;
    --blue-light:#EAF2FD;
    --ink:#16202C;
    --paper:#F7F8FA;
    --line:#DEE3EA;
    --good:#1F8A57;
    --warn:#C9821B;
    --bad:#C13B3B;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    padding-bottom:90px;
  }
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    padding:22px 18px 26px;
    border-bottom:4px solid var(--blue);
  }
  .brand-logo{line-height:0;}
  .brand-logo img{height:34px;display:block;}
  h1{
    margin:10px 0 4px;
    font-size:22px;
    line-height:1.25;
    font-weight:800;
  }
  .sub{font-size:13px;opacity:.75;margin:0;}
  main{max-width:680px;margin:0 auto;padding:16px;}
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--blue);
    margin:0 0 14px;
    font-weight:800;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:#4A5568;
    margin-bottom:6px;
  }
  input[type=text],input[type=date],textarea,select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:15px;
    margin-bottom:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus,textarea:focus,select:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px var(--blue-light);
  }
  .crit{
    border-top:1px solid var(--line);
    padding:16px 0;
  }
  .crit:first-of-type{border-top:none;padding-top:0;}
  .crit-name{
    font-size:14.5px;
    font-weight:700;
    margin-bottom:10px;
    line-height:1.35;
  }
  .crit-num{color:var(--blue);font-weight:800;margin-right:4px;}
  .scale{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    margin-bottom:8px;
  }
  .scale button{
    appearance:none;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:10px;
    padding:10px 0;
    font-size:15px;
    font-weight:700;
    color:#8a94a3;
    cursor:pointer;
    transition:all .12s;
  }
  .scale button:active{transform:scale(.96);}
  .scale button.sel{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
  }
  .scale-labels{
    display:flex;
    justify-content:space-between;
    font-size:10.5px;
    color:#9AA5B1;
    margin-bottom:10px;
    padding:0 2px;
  }
  .crit textarea{margin-bottom:0;font-size:13.5px;}
  .crit textarea::placeholder{color:#B7BFC9;}
  .comment-toggle{
    font-size:12px;
    color:var(--blue);
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    font-weight:600;
    margin-bottom:8px;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .score-box{
    text-align:center;
    background:var(--blue-light);
    border-radius:12px;
    padding:14px;
    flex:1;
  }
  .score-box .num{font-size:30px;font-weight:800;color:var(--navy);line-height:1;}
  .score-box .lbl{font-size:11px;color:#6B7686;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;}
  .rating-pill{
    display:inline-block;
    margin-top:10px;
    padding:6px 14px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .rating-pill.unsat{background:#FBE6E6;color:var(--bad);}
  .rating-pill.sat{background:#FFF3DF;color:var(--warn);}
  .rating-pill.exc{background:#E4F4EB;color:var(--good);}
  .rating-pill.none{background:#EDEFF2;color:#8a94a3;}
  .sign-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .sign-row:first-of-type{border-top:none;}
  .sign-row input[type=checkbox]{
    width:20px;height:20px;flex:none;margin:0;accent-color:var(--blue);
  }
  .sign-row .who{font-size:14px;font-weight:600;flex:1;}
  .sign-row .when{font-size:12px;color:#8a94a3;}
  .footer-bar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    gap:10px;
    z-index:10;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
  }
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:disabled{background:#AFC6E6;cursor:not-allowed;}
  .btn-secondary{background:var(--blue-light);color:var(--blue);flex:none;width:50px;}
  .toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:10px;
    font-size:13.5px;font-weight:600;z-index:50;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25);
    max-width:90%;text-align:center;
  }
  .progress{
    height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px;
  }
  .progress-fill{height:100%;background:var(--blue);width:0%;transition:width .2s;}
  .hint{font-size:12px;color:#8a94a3;margin:-6px 0 14px;}
  .role-option{
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .role-option:active{transform:scale(.99);}
  .role-option:hover{border-color:var(--blue);background:var(--blue-light);}
  .role-title{font-size:15.5px;font-weight:800;color:var(--navy);margin-bottom:4px;}
  .role-desc{font-size:13px;color:#6B7686;line-height:1.4;}
  .back-link{
    background:none;border:none;color:var(--blue);font-size:13px;font-weight:600;
    padding:4px 0;cursor:pointer;
  }
  .pending-note{
    font-size:12.5px;color:#8a94a3;font-style:italic;
  }
  .role-tag{
    display:inline-block;background:var(--blue-light);color:var(--blue);
    font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
    padding:4px 10px;border-radius:999px;margin-bottom:14px;
  }
  .success-screen{
    max-width:680px;margin:60px auto;padding:0 16px;text-align:center;
  }
  .success-screen .check{
    width:64px;height:64px;border-radius:50%;background:var(--good);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px;
  }
  .success-screen h2{font-size:20px;margin-bottom:8px;}
  .success-screen p{color:#6B7686;font-size:14px;margin-bottom:24px;}
</style>
</head>

  <h1>Merchandiser Performance Evaluation</h1>
  <p class="sub">Fill out on your phone or tablet — scores save automatically to head office.</p>
</header>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script>
const CRITERIA = [
  {key:"stock_monitoring", label:"Monitoring stock (providing stock report to reps)"},
  {key:"attendance", label:"Attendance and punctuality"},
  {key:"collaboration", label:"Collaborates with sales reps and team members to effectively complete tasks"},
  {key:"rotation_of_goods", label:"Rotation of goods"},
  {key:"creative_thinking", label:"Creative and innovative thinking"},
  {key:"data_analysis", label:"Ability to analyze data and draw relevant conclusions"},
  {key:"time_management", label:"Time management — planning and prioritizing workloads"},
  {key:"industry_knowledge", label:"In-depth knowledge of industry-specific trends and issues"},
  {key:"shelf_display", label:"Displaying of goods on shelves"},
  {key:"proactive_communication", label:"Proactive communication (calls, texts, emails answered on time)"},
  {key:"shelf_maintenance", label:"Shelf maintenance (dusting / wiping goods)"},
  {key:"customer_attentiveness", label:"Attentive to customer needs, makes product recommendations"},
];

const state = {
  filled_by_role:null,      // 'employee' or 'supervisor_manager'
  completed_by:null,        // 'supervisor' or 'manager' (only when filled_by_role is supervisor_manager)
  employee_name:"", position:"", review_period:"", reviewed_by:"",
  scores:{}, comments:{}, employee_feedback:"",
  employee_signed:false, supervisor_signed:false, manager_signed:false,
};

function renderRolePicker(){
  const app = document.getElementById("app");
  document.getElementById("footerbar")?.remove();
  app.innerHTML = `
    <div class="card">
      <h2>Who's filling this out?</h2>
      <div class="role-option" id="role_employee">
        <div class="role-title">I'm the employee — self-evaluation</div>
        <div class="role-desc">Score yourself. It will be sent to your supervisor and/or manager to review and sign off.</div>
      </div>
      <div class="role-option" id="role_sm">
        <div class="role-title">I'm a Supervisor or Manager — evaluating someone</div>
        <div class="role-desc">Score the employee. It will be sent to them to review and sign off.</div>
      </div>
    </div>
  `;
  document.getElementById("role_employee").onclick = ()=>{ state.filled_by_role="employee"; state.employee_signed=true; render(); };
  document.getElementById("role_sm").onclick = ()=>{ state.filled_by_role="supervisor_manager"; render(); };
}

function renderCompletedByPicker(){
  const app = document.getElementById("app");
  document.getElementById("footerbar")?.remove();
  app.innerHTML = `
    <div class="card">
      <h2>Completing this as...</h2>
      <div class="role-option" id="cb_supervisor">
        <div class="role-title">Supervisor</div>
      </div>
      <div class="role-option" id="cb_manager">
        <div class="role-title">Manager</div>
      </div>
      <button class="back-link" id="backToRole">← Back</button>
    </div>
  `;
  document.getElementById("cb_supervisor").onclick = ()=>{ state.completed_by="supervisor"; state.supervisor_signed=true; render(); };
  document.getElementById("cb_manager").onclick = ()=>{ state.completed_by="manager"; state.manager_signed=true; render(); };
  document.getElementById("backToRole").onclick = ()=>{ state.filled_by_role=null; render(); };
}

function ratingFor(total){
  if(total===0) return {cls:"none", text:"Not yet scored"};
  if(total>=60) return {cls:"exc", text:"Exceptional"};
  if(total>=45) return {cls:"sat", text:"Satisfactory"};
  return {cls:"unsat", text:"Unsatisfactory"};
}

function totalScore(){
  return CRITERIA.reduce((s,c)=> s + (state.scores[c.key]||0), 0);
}
function scoredCount(){
  return CRITERIA.filter(c=>state.scores[c.key]).length;
}

function render(){
  if(!state.filled_by_role){ renderRolePicker(); return; }
  if(state.filled_by_role==="supervisor_manager" && !state.completed_by){ renderCompletedByPicker(); return; }

  const total = totalScore();
  const rating = ratingFor(total);
  const pct = Math.round((scoredCount()/CRITERIA.length)*100);
  const isEmployee = state.filled_by_role==="employee";

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <span class="role-tag">${isEmployee ? "Self-evaluation" : `Completing as ${state.completed_by==="manager"?"Manager":"Supervisor"}`}</span>
      <button class="back-link" id="changeRole" style="float:right;">Change</button>
      <h2>${isEmployee ? "Your details" : "Employee details"}</h2>
      <label>${isEmployee ? "Your name" : "Employee name"}</label>
      <input type="text" id="f_name" placeholder="e.g. Damita Samuels-Foster" value="${esc(state.employee_name)}">
      <label>Position</label>
      <input type="text" id="f_position" placeholder="e.g. Merchandiser" value="${esc(state.position)}">
      <label>Review period</label>
      <input type="text" id="f_period" placeholder="e.g. June 2026" value="${esc(state.review_period)}">
      <label>${isEmployee ? "Supervisor / Manager who will sign off" : "Your name"}</label>
      <input type="text" id="f_reviewer" placeholder="${isEmployee ? "e.g. Team Leader name" : "Your name"}" value="${esc(state.reviewed_by)}">
    </div>

    <div class="card">
      <h2>Review criteria <span style="float:right;color:#8a94a3;font-weight:600;">${scoredCount()}/12</span></h2>
      <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div style="height:14px;"></div>
      ${CRITERIA.map((c,i)=>critRow(c,i)).join("")}
    </div>

    <div class="card">
      <h2>Score summary</h2>
      <div class="summary-row">
        <div class="score-box">
          <div class="num">${total}</div>
          <div class="lbl">Total points</div>
        </div>
      </div>
      <div style="text-align:center;"><span class="rating-pill ${rating.cls}">${rating.text}</span></div>
      <div class="hint" style="text-align:center;margin-top:10px;">12–44 Unsatisfactory · 45–59 Satisfactory · 60 Exceptional</div>
    </div>

    <div class="card">
      <h2>${isEmployee ? "Your feedback" : "Employee feedback"}</h2>
      <textarea id="f_feedback" placeholder="${isEmployee ? "Your comments on this evaluation..." : "Space for the employee's comments — they can add this when they sign off."}">${esc(state.employee_feedback)}</textarea>
    </div>

    <div class="card">
      <h2>Sign-off</h2>
      ${signOffRows(isEmployee)}
      <div class="hint" style="margin-top:10px;">${isEmployee
        ? "Submitting this records your sign-off automatically. Your supervisor and/or manager will sign off afterward from the dashboard."
        : "Submitting this records your sign-off automatically. The employee will sign off afterward from the dashboard."}</div>
    </div>

    <div style="height:10px;"></div>
  `;

  document.getElementById("changeRole").onclick = ()=>{
    state.filled_by_role=null; state.completed_by=null;
    state.employee_signed=false; state.supervisor_signed=false; state.manager_signed=false;
    render();
  };
  document.getElementById("f_name").oninput = e=>state.employee_name=e.target.value;
  document.getElementById("f_position").oninput = e=>state.position=e.target.value;
  document.getElementById("f_period").oninput = e=>state.review_period=e.target.value;
  document.getElementById("f_reviewer").oninput = e=>state.reviewed_by=e.target.value;
  document.getElementById("f_feedback").oninput = e=>state.employee_feedback=e.target.value;

  CRITERIA.forEach(c=>{
    document.querySelectorAll(`[data-crit="${c.key}"] .scale button`).forEach(btn=>{
      btn.onclick = ()=>{
        state.scores[c.key] = parseInt(btn.dataset.v);
        render();
      };
    });
    const ta = document.getElementById(`cm_${c.key}`);
    if(ta) ta.oninput = e=>state.comments[c.key]=e.target.value;
  });

  renderFooter();
}

function signOffRows(isEmployee){
  // Each row: a checked/locked badge for whoever is submitting now, and a "pending" note for the other party.
  const empRow = `
    <div class="sign-row">
      <input type="checkbox" disabled ${ (isEmployee || state.employee_signed) ? "checked" : ""}>
      <div class="who">Employee
        ${ isEmployee ? "" : `<div class="pending-note">Pending — employee will sign off after submission</div>`}
      </div>
    </div>`;
  const supRow = `
    <div class="sign-row">
      <input type="checkbox" disabled ${state.supervisor_signed?"checked":""}>
      <div class="who">Supervisor
        ${ state.supervisor_signed ? "" : `<div class="pending-note">${isEmployee ? "Pending — to be completed by supervisor" : "Not completing as supervisor"}</div>`}
      </div>
    </div>`;
  const mgrRow = `
    <div class="sign-row">
      <input type="checkbox" disabled ${state.manager_signed?"checked":""}>
      <div class="who">Manager
        ${ state.manager_signed ? "" : `<div class="pending-note">${isEmployee ? "Pending — to be completed by manager" : "Not completing as manager"}</div>`}
      </div>
    </div>`;
  return empRow + supRow + mgrRow;
}

function critRow(c,i){
  const v = state.scores[c.key]||0;
  return `
  <div class="crit" data-crit="${c.key}">
    <div class="crit-name"><span class="crit-num">${i+1}.</span>${c.label}</div>
    <div class="scale">
      ${[1,2,3,4,5].map(n=>`<button type="button" data-v="${n}" class="${v===n?'sel':''}">${n}</button>`).join("")}
    </div>
    <div class="scale-labels"><span>Poor</span><span>Excellent</span></div>
    <textarea id="cm_${c.key}" placeholder="Optional comment...">${esc(state.comments[c.key]||"")}</textarea>
  </div>`;
}

function renderFooter(){
  let bar = document.getElementById("footerbar");
  if(!bar){
    bar = document.createElement("div");
    bar.id = "footerbar";
    bar.className = "footer-bar";
    document.body.appendChild(bar);
  }
  const ready = state.employee_name.trim() && scoredCount()===CRITERIA.length;
  bar.innerHTML = `
    <button class="btn btn-primary" id="submitBtn" ${ready?"":"disabled"}>
      ${ready ? "Submit evaluation" : `Score all 12 criteria (${scoredCount()}/12)`}
    </button>
  `;
  document.getElementById("submitBtn").onclick = submitForm;
}

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function showToast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = isErr ? "#C13B3B" : "#0E2A4E";
  t.style.display = "block";
  setTimeout(()=>t.style.display="none", 3200);
}

async function submitForm(){
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Submitting...";

  const total = totalScore();
  const rating = ratingFor(total);

  const payload = {
    source: "digital",
    filled_by_role: state.filled_by_role,
    employee_name: state.employee_name.trim(),
    position: state.position.trim(),
    review_period: state.review_period.trim(),
    reviewed_by: state.reviewed_by.trim(),
    employee_feedback: state.employee_feedback.trim(),
    total_score: total,
    rating: rating.text,
    employee_signed: state.employee_signed,
    supervisor_signed: state.supervisor_signed,
    manager_signed: state.manager_signed,
  };
  CRITERIA.forEach(c=>{
    payload[`score_${c.key}`] = state.scores[c.key]||null;
    payload[`comments_${c.key}`] = state.comments[c.key]||null;
  });

  const {error} = await sb.from("merchandiser_evaluations").insert(payload);

  if(error){
    showToast("Couldn't submit — check connection and try again.", true);
    btn.disabled = false;
    btn.textContent = "Submit evaluation";
    console.error(error);
    return;
  }

  const isEmployee = state.filled_by_role==="employee";
  const waitingOn = isEmployee ? "your supervisor and/or manager" : "the employee";

  document.getElementById("app").innerHTML = `
    <div class="success-screen">
      <div class="check">✓</div>
      <h2>Evaluation submitted</h2>
      <p>${esc(state.employee_name)}'s evaluation (${total} pts — ${rating.text}) has been saved to the dashboard, awaiting sign-off from ${waitingOn}.</p>
      <button class="btn btn-primary" style="max-width:240px;" onclick="location.reload()">Submit another</button>
    </div>
  `;
  document.getElementById("footerbar")?.remove();
}

render();
</script>
</body>
</html>
