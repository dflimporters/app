<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/app/manifest.json">
<link rel="icon" href="/app/favicon.ico">
<meta name="theme-color" content="#0f2044">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboards — DFL Staff Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0; --navy:#0f2044; --navy2:#1a3260; --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8; --accent:#2563eb; --shadow:0 1px 3px rgba(0,0,0,0.07); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

  nav { background:var(--navy); height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 32px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .nav-left { display:flex; align-items:center; gap:14px; }
  .nav-logo { height:26px; filter:brightness(0) invert(1); }
  .nav-divider { width:1px; height:22px; background:rgba(255,255,255,0.2); }
  .nav-title { font-size:14px; font-weight:600; color:#fff; }
  .nav-links { display:flex; gap:4px; }
  .nav-links a { color:rgba(255,255,255,0.65); text-decoration:none; font-size:13px; font-weight:500; padding:6px 14px; border-radius:6px; transition:all 0.15s; }
  .nav-links a:hover { color:#fff; background:rgba(255,255,255,0.1); }
  .nav-links a.active { color:#fff; background:rgba(255,255,255,0.15); }
  .nav-links a.mgmt { color:#fbbf24; }
  .nav-links a.mgmt:hover { color:#fef3c7; background:rgba(251,191,36,0.15); }
  .nav-links a.mgmt.active { color:#fef3c7; background:rgba(251,191,36,0.15); }

  /* HAMBURGER + MOBILE NAV */
  .nav-hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    flex-shrink: 0;
  }
  .nav-hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: rgba(255,255,255,0.8);
    border-radius: 2px;
    transition: transform 0.25s, opacity 0.25s;
  }
  .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-hamburger.open span:nth-child(2) { opacity: 0; }
  .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .nav-mobile-menu {
    display: none;
    position: fixed;
    top: 56px;
    left: 0; right: 0;
    background: rgba(12,26,58,0.98);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 0.75rem 1.25rem 1.25rem;
    z-index: 99;
    flex-direction: column;
    gap: 2px;
  }
  .nav-mobile-menu.open { display: flex; }
  .nav-mobile-menu a {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 8px;
    transition: color 0.15s, background 0.15s;
  }
  .nav-mobile-menu a:hover { color: #fff; background: rgba(255,255,255,0.07); }
  .nav-mobile-menu a.active { color: #fff; background: rgba(255,255,255,0.1); }
  .nav-mobile-menu a.mgmt { color: #fbbf24; }
  .nav-mobile-menu a.mgmt:hover { background: rgba(251,191,36,0.12); }
  .mob-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 0; }

  .page-header { background:var(--navy2); padding:32px 32px 36px; }
  .page-header-inner { max-width:1060px; margin:0 auto; }
  .breadcrumb { font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:8px; }
  .breadcrumb a { color:rgba(255,255,255,0.45); text-decoration:none; }
  .page-header h1 { font-size:24px; font-weight:700; color:#fff; letter-spacing:-0.3px; }
  .tabs-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:0 32px; display:flex; gap:0; max-width:none; }
  .tab-btn { padding:14px 20px; font-size:13px; font-weight:500; color:var(--text-muted); border:none; background:none; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all 0.15s; font-family:'Inter',sans-serif; }
  .tab-btn:hover { color:var(--text); }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
  .tab-content { display:none; height:calc(100vh - 180px); }
  .tab-content.active { display:block; }
  .tab-content iframe { width:100%; height:100%; border:none; display:block; }
  footer { text-align:center; padding:20px; font-size:11px; color:var(--text-dim); border-top:1px solid var(--border); }

  @media (max-width: 640px) {
    nav { padding: 0 16px; }
    .nav-links { display: none; }
    .nav-hamburger { display: flex; }
    .nav-title { font-size: 13px; }
    .page-header { padding: 24px 16px 28px; }
    .tabs-bar { padding: 0 16px; overflow-x: auto; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <img class="nav-logo" src="https://hzagwndglwhcepsirafi.supabase.co/storage/v1/object/public/Assets/DFL%20Logo%20Blue_White.png" alt="DFL">
    <div class="nav-divider"></div>
    <span class="nav-title">Staff Portal</span>
  </div>
  <div class="nav-links">
    <a href="/app/admin/" class="mgmt">Admin</a>
    <a href="/app/management/" class="mgmt">Management</a>
    <a href="index.html">Home</a>
    <a href="specials.html">Specials</a>
    <a href="dashboards.html" class="active">Dashboards</a>
    <a href="forms.html">Forms</a>
    <a href="assets.html">Assets</a>
  </div>
  <button class="nav-hamburger" id="hamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="nav-mobile-menu" id="mobileMenu">
  <a href="/app/admin/" class="mgmt">Admin</a>
  <a href="/app/management/" class="mgmt">Management</a>
  <div class="mob-divider"></div>
  <a href="index.html">Home</a>
  <a href="specials.html">Specials</a>
  <a href="dashboards.html" class="active">Dashboards</a>
  <a href="forms.html">Forms</a>
  <a href="assets.html">Assets</a>
</div>

<div class="page-header">
  <div class="page-header-inner">
    <div class="breadcrumb"><a href="index.html">Home</a> / Dashboards</div>
    <h1>Dashboards</h1>
  </div>
</div>

<div class="tabs-bar">
  <button class="tab-btn active" onclick="showTab('sales',this)">📊 Sales Dashboard</button>
  <button class="tab-btn" onclick="showTab('worldcup',this)">🏆 World Cup Competition</button>
</div>
<div class="tab-content active" id="tab-sales">
  <iframe src="https://double-amber-ufjm5wojd8.edgeone.app/" title="Sales Dashboard"></iframe>
</div>
<div class="tab-content" id="tab-worldcup">
  <iframe src="https://conservative-gold-psbzdnucuv.edgeone.app/" title="World Cup Competition"></iframe>
</div>

<script>
  function showTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // Hamburger menu
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
  });
  mobileMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
    });
  });
</script>
</body>
</html>
