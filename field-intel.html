<!DOCTYPE html>
<html lang="en">
<head>
<meta name="theme-color" content="#0f2044">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Intel — DFL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Standalone, no login — own client instance, no dependency on the rest of the repo.
  const sb = window.supabase.createClient(
    'https://hzagwndglwhcepsirafi.supabase.co',
    'sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h'
  );
</script>
<style>
  :root { --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0; --navy:#0f2044; --navy2:#1a3260; --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8; --accent:#2563eb; --accent-bg:#eff6ff; --shadow:0 1px 3px rgba(0,0,0,0.07); --green:#16a34a; --green-bg:#f0fdf4; --amber:#d97706; --amber-bg:#fffbeb; --red:#dc2626; --red-bg:#fef2f2; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
  nav { background:var(--navy); height:52px; display:flex; align-items:center; gap:12px; padding:0 20px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .nav-title { font-size:14px; font-weight:600; color:#fff; }
  .sync-pill { margin-left:auto; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); border-radius:20px; padding:6px 12px; font-size:12px; color:#fff; cursor:pointer; white-space:nowrap; }
  .sync-pill .dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
  .sync-pill.pending .dot { background:var(--amber); }
  .content { max-width:600px; margin:0 auto; padding:16px 16px 60px; }
  .banner { display:none; padding:12px 16px; border-radius:10px; font-size:13px; font-weight:500; margin-bottom:14px; align-items:center; gap:8px; }
  .banner.show { display:flex; }
  .banner.success { background:var(--green-bg); color:var(--green); }
  .banner.queued { background:var(--amber-bg); color:var(--amber); }
  .banner.error { background:var(--red-bg); color:var(--red); }
  .banner.editing { background:var(--accent-bg); color:var(--accent); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  .card h2 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:12px; }
  .field { margin-bottom:12px; }
  .field:last-child { margin-bottom:0; }
  .field label { display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }
  .field input[type=text], .field input[type=date], .field textarea {
    width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:15px; font-family:inherit; background:var(--surface); color:var(--text); outline:none;
  }
  .field input:focus, .field textarea:focus { border-color:var(--accent); }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  .photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .photo-thumb { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--bg); }
  .photo-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb .rm { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,0.6); color:#fff; border:none; font-size:13px; line-height:1; cursor:pointer; }
  .add-photo-btn { width:100%; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .photo-count { font-size:12px; color:var(--text-dim); margin-top:8px; text-align:center; }

  .note-input-row { display:flex; gap:8px; margin-bottom:12px; }
  .note-input-row textarea { flex:1; min-height:44px; max-height:120px; }
  .note-add-btn { background:var(--navy); color:#fff; border:none; border-radius:10px; padding:0 18px; font-size:14px; font-weight:600; cursor:pointer; }
  .note-list { display:flex; flex-direction:column; gap:8px; }
  .note-item { background:var(--accent-bg); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.5; display:flex; justify-content:space-between; gap:10px; }
  .note-item .n-text { flex:1; white-space:pre-wrap; }
  .note-item .n-time { font-size:10px; color:var(--text-dim); white-space:nowrap; }
  .note-item .n-rm { background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; padding:0 2px; }
  .empty-hint { font-size:12px; color:var(--text-dim); text-align:center; padding:8px 0; }

  .submit-btn { width:100%; padding:16px; background:var(--navy); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; }
  .submit-btn:active { background:var(--navy2); }
  .submit-btn:disabled { opacity:0.5; }
  .cancel-edit-btn { width:100%; padding:12px; background:none; color:var(--text-muted); border:none; font-size:13px; font-weight:600; cursor:pointer; margin-top:8px; }

  .recent-list { margin-top:20px; }
  .recent-list h3, .queue-list h3 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-bottom:10px; }
  .recent-item, .queue-item { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .recent-item .ri-thumbs { display:flex; flex-shrink:0; }
  .recent-item .ri-thumbs img { width:32px; height:32px; border-radius:6px; object-fit:cover; margin-left:-8px; border:2px solid var(--surface); }
  .recent-item .ri-thumbs img:first-child { margin-left:0; }
  .recent-item .ri-info { flex:1; min-width:0; }
  .recent-item .ri-store { font-weight:600; }
  .recent-item .ri-meta { color:var(--text-dim); font-size:11px; }
  .recent-item .ri-edit { background:var(--accent-bg); color:var(--accent); border:none; border-radius:8px; padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .queue-item .qi-dot { width:8px; height:8px; border-radius:50%; background:var(--amber); flex-shrink:0; }
  .queue-item .qi-info { flex:1; }
  .queue-item .qi-store { font-weight:600; }
  .queue-item .qi-meta { color:var(--text-dim); font-size:11px; }
  footer { text-align:center; padding:20px; font-size:11px; color:var(--text-dim); }
</style>
</head>
<body>
<nav>
  <span class="nav-title">📋 Field Intel</span>
  <div class="sync-pill" id="syncPill" onclick="flushQueue(true)">
    <span class="dot"></span>
    <span id="syncPillText">All synced</span>
  </div>
</nav>

<div class="content">

  <div class="banner" id="banner"></div>

  <form id="intelForm" onsubmit="return handleSubmit(event)">

    <div class="card">
      <h2>Visit details</h2>
      <div class="field">
        <label>Your name *</label>
        <input type="text" id="yourName" placeholder="e.g. Sarah Campbell" required>
      </div>
      <div class="row3">
        <div class="field" style="grid-column:span 2">
          <label>Store name *</label>
          <input type="text" id="storeName" placeholder="e.g. MegaMart Constant Spring" required>
        </div>
        <div class="field">
          <label>Date *</label>
          <input type="date" id="visitDate" required>
        </div>
      </div>
      <div class="field">
        <label>Area</label>
        <input type="text" id="area" placeholder="e.g. South Central">
      </div>
    </div>

    <div class="card">
      <h2>Photos</h2>
      <div class="photo-grid" id="photoGrid"></div>
      <button type="button" class="add-photo-btn" onclick="document.getElementById('photoInput').click()">📷 Add Photo</button>
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoAdd(event)">
      <div class="photo-count" id="photoCount">No photos yet — take as many as you need</div>
    </div>

    <div class="card">
      <h2>Notes</h2>
      <div class="note-input-row">
        <textarea id="noteInput" placeholder="Type an observation, then tap Add — you can add as many as you like"></textarea>
        <button type="button" class="note-add-btn" onclick="addNote()">Add</button>
      </div>
      <div class="note-list" id="noteList"></div>
      <div class="empty-hint" id="noteEmptyHint">No notes yet</div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Save Store Visit</button>
    <button type="button" class="cancel-edit-btn" id="cancelEditBtn" style="display:none" onclick="cancelEdit()">Cancel editing</button>
  </form>

  <div class="recent-list" id="recentList" style="display:none">
    <h3>Recent submissions — tap to edit</h3>
    <div id="recentItems"></div>
  </div>

  <div class="queue-list" id="queueList" style="display:none">
    <h3>Pending sync</h3>
    <div id="queueItems"></div>
  </div>

</div>

<footer>© 2026 DFL Importers · Internal use only</footer>

<script>
const RECENT_KEY = 'field_intel_recent_v1';
const QUEUE_KEY = 'field_intel_pending_v2';
const BUCKET = 'field-intel';
const MAX_RECENT = 10;

let photos = []; // { blob (new, unsaved), path (already uploaded), url (preview) }
let notes = [];  // { text, at }
let editingId = null; // set when editing an existing recent submission

document.getElementById('visitDate').value = new Date().toISOString().slice(0,10);

// ─── PHOTOS ──────────────────────────────────────────────────────
function handlePhotoAdd(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = function(ev) {
    img.onload = function() {
      const maxW = 1280;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function(blob) {
        photos.push({ blob, url: URL.createObjectURL(blob) });
        renderPhotos();
      }, 'image/jpeg', 0.72);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// small thumbnail for local caching (so "recent submissions" survives a page reload)
function makeThumb(blob) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (ev) => {
      img.onload = () => {
        const w = 120;
        const scale = w / img.width;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(blob);
  });
}

function removePhoto(idx) {
  photos.splice(idx, 1);
  renderPhotos();
}

function renderPhotos() {
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = photos.map((p, i) => `
    <div class="photo-thumb">
      <img src="${p.url}">
      <button type="button" class="rm" onclick="removePhoto(${i})">✕</button>
    </div>`).join('');
  document.getElementById('photoCount').textContent =
    photos.length === 0 ? 'No photos yet — take as many as you need' : `${photos.length} photo${photos.length > 1 ? 's' : ''} added`;
}

// ─── NOTES ───────────────────────────────────────────────────────
function addNote() {
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if (!text) return;
  notes.push({ text, at: Date.now() });
  input.value = '';
  renderNotes();
}

function removeNote(idx) {
  notes.splice(idx, 1);
  renderNotes();
}

function renderNotes() {
  const list = document.getElementById('noteList');
  const hint = document.getElementById('noteEmptyHint');
  hint.style.display = notes.length === 0 ? 'block' : 'none';
  list.innerHTML = notes.map((n, i) => `
    <div class="note-item">
      <div class="n-text">${escapeHtml(n.text)}</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="n-time">${new Date(n.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
        <button type="button" class="n-rm" onclick="removeNote(${i})">✕</button>
      </div>
    </div>`).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ─── BLOB <-> BASE64 ─────────────────────────────────────────────
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
function base64ToBlob(base64) {
  return fetch(base64).then(r => r.blob());
}

// ─── RECENT SUBMISSIONS (local cache — powers editing, no server read needed) ──
function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveRecent(list) {
  localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, MAX_RECENT)));
  renderRecent();
}
function upsertRecent(entry) {
  const list = getRecent();
  const idx = list.findIndex(r => r.id === entry.id);
  if (idx >= 0) list[idx] = entry; else list.unshift(entry);
  saveRecent(list);
}
function renderRecent() {
  const list = getRecent();
  const wrap = document.getElementById('recentList');
  const items = document.getElementById('recentItems');
  if (list.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  items.innerHTML = list.map(r => `
    <div class="recent-item">
      <div class="ri-thumbs">${(r.photo_thumbs||[]).slice(0,3).map(t => `<img src="${t}">`).join('')}</div>
      <div class="ri-info">
        <div class="ri-store">${escapeHtml(r.store_name)}</div>
        <div class="ri-meta">${r.visit_date} · ${r.notes.length} note${r.notes.length!==1?'s':''}, ${(r.photo_thumbs||[]).length} photo${(r.photo_thumbs||[]).length!==1?'s':''}</div>
      </div>
      <button type="button" class="ri-edit" onclick="editRecent('${r.id}')">Edit</button>
    </div>`).join('');
}

function editRecent(id) {
  const entry = getRecent().find(r => r.id === id);
  if (!entry) return;
  editingId = id;
  document.getElementById('yourName').value = entry.your_name || '';
  document.getElementById('storeName').value = entry.store_name || '';
  document.getElementById('area').value = entry.area || '';
  document.getElementById('visitDate').value = entry.visit_date || new Date().toISOString().slice(0,10);
  notes = JSON.parse(JSON.stringify(entry.notes || []));
  renderNotes();
  // existing photos are represented by their already-uploaded path + cached thumb (no blob = nothing new to upload for these)
  photos = (entry.photos || []).map((path, i) => ({ path, url: (entry.photo_thumbs||[])[i] || '' }));
  renderPhotos();

  document.getElementById('submitBtn').textContent = 'Update Store Visit';
  document.getElementById('cancelEditBtn').style.display = 'block';
  const b = document.getElementById('banner');
  b.textContent = `Editing your ${entry.visit_date} visit to ${entry.store_name}`;
  b.className = 'banner show editing';
  window.scrollTo({top:0, behavior:'smooth'});
}

function cancelEdit() {
  editingId = null;
  resetForm();
  document.getElementById('submitBtn').textContent = 'Save Store Visit';
  document.getElementById('cancelEditBtn').style.display = 'none';
  document.getElementById('banner').classList.remove('show');
}

// ─── QUEUE (offline) ─────────────────────────────────────────────
function getQueue() {
  try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveQueue(q) {
  localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
  renderQueue();
}
function renderQueue() {
  const q = getQueue();
  const pill = document.getElementById('syncPill');
  const pillText = document.getElementById('syncPillText');
  const list = document.getElementById('queueList');
  const items = document.getElementById('queueItems');

  if (q.length === 0) {
    pill.classList.remove('pending');
    pillText.textContent = 'All synced';
    list.style.display = 'none';
    return;
  }
  pill.classList.add('pending');
  pillText.textContent = `${q.length} pending — tap to sync`;
  list.style.display = 'block';
  items.innerHTML = q.map(item => `
    <div class="queue-item">
      <div class="qi-dot"></div>
      <div class="qi-info">
        <div class="qi-store">${escapeHtml(item.store_name)}</div>
        <div class="qi-meta">${item.new_photos_base64.length} new photos, ${item.notes.length} notes · ${item.visit_date}</div>
      </div>
    </div>`).join('');
}

// ─── SUBMIT (handles both new visits and edits via upsert) ──────
async function handleSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = editingId ? 'Updating...' : 'Saving...';

  const id = editingId || crypto.randomUUID();
  const yourName = document.getElementById('yourName').value.trim();
  const storeName = document.getElementById('storeName').value.trim();
  const area = document.getElementById('area').value.trim() || null;
  const visitDate = document.getElementById('visitDate').value;
  const currentNotes = notes.slice();
  const currentPhotos = photos.slice(); // mix of {blob,url} (new) and {path,url} (already uploaded)

  try {
    const finalPaths = [];
    const finalThumbs = [];
    for (const p of currentPhotos) {
      if (p.path) {
        // already uploaded (kept from a previous save while editing)
        finalPaths.push(p.path);
        finalThumbs.push(p.url);
      } else {
        const path = `unassigned/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
        const { error: upErr } = await sb.storage.from(BUCKET).upload(path, p.blob, { contentType: 'image/jpeg' });
        if (upErr) throw upErr;
        finalPaths.push(path);
        finalThumbs.push(await makeThumb(p.blob));
      }
    }

    const { error: insErr } = await sb.from('field_intel').upsert({
      id,
      created_by_name: yourName,
      store_name: storeName,
      area,
      visit_date: visitDate,
      notes: currentNotes,
      photos: finalPaths
    });
    if (insErr) throw insErr;

    upsertRecent({
      id, your_name: yourName, store_name: storeName, area, visit_date: visitDate,
      notes: currentNotes, photos: finalPaths, photo_thumbs: finalThumbs, saved_at: Date.now()
    });

    showBanner(editingId ? 'Updated ✓' : 'Saved ✓', 'success');
    editingId = null;
    document.getElementById('cancelEditBtn').style.display = 'none';
    resetForm();
    flushQueue();

  } catch (err) {
    console.warn('Save failed, queuing locally:', err);
    const q = getQueue();
    const new_photos_base64 = [];
    const keptPaths = [];
    for (const p of currentPhotos) {
      if (p.path) keptPaths.push(p.path);
      else new_photos_base64.push(await blobToBase64(p.blob));
    }
    q.push({
      id, your_name: yourName, store_name: storeName, area, visit_date: visitDate,
      notes: currentNotes, kept_photo_paths: keptPaths, new_photos_base64, queued_at: Date.now()
    });
    saveQueue(q);
    showBanner('No connection — saved on this phone, will sync automatically.', 'queued');
    editingId = null;
    document.getElementById('cancelEditBtn').style.display = 'none';
    resetForm();
  }

  btn.disabled = false;
  btn.textContent = 'Save Store Visit';
  return false;
}

function resetForm() {
  const keepName = document.getElementById('yourName').value;
  document.getElementById('intelForm').reset();
  document.getElementById('yourName').value = keepName;
  document.getElementById('visitDate').value = new Date().toISOString().slice(0,10);
  photos = [];
  notes = [];
  renderPhotos();
  renderNotes();
}

function showBanner(msg, kind) {
  const b = document.getElementById('banner');
  b.textContent = msg;
  b.className = `banner show ${kind}`;
  setTimeout(() => { b.classList.remove('show'); }, 4000);
}

// ─── FLUSH QUEUE ─────────────────────────────────────────────────
async function flushQueue(manualTrigger) {
  let q = getQueue();
  if (q.length === 0) {
    if (manualTrigger) showBanner('Nothing pending.', 'success');
    return;
  }

  const remaining = [];
  let successCount = 0;

  for (const item of q) {
    try {
      const finalPaths = item.kept_photo_paths.slice();
      const newThumbs = [];
      for (const b64 of item.new_photos_base64) {
        const blob = await base64ToBlob(b64);
        const path = `unassigned/${item.queued_at}_${Math.random().toString(36).slice(2,8)}.jpg`;
        const { error: upErr } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
        if (upErr) throw upErr;
        finalPaths.push(path);
        newThumbs.push(await makeThumb(blob));
      }
      const { error: insErr } = await sb.from('field_intel').upsert({
        id: item.id,
        created_by_name: item.your_name,
        store_name: item.store_name,
        area: item.area,
        visit_date: item.visit_date,
        notes: item.notes,
        photos: finalPaths
      });
      if (insErr) throw insErr;

      upsertRecent({
        id: item.id, your_name: item.your_name, store_name: item.store_name, area: item.area,
        visit_date: item.visit_date, notes: item.notes, photos: finalPaths, photo_thumbs: newThumbs, saved_at: Date.now()
      });
      successCount++;
    } catch (err) {
      console.warn('Still cannot sync item, keeping in queue:', err);
      remaining.push(item);
    }
  }

  saveQueue(remaining);
  if (successCount > 0) showBanner(`Synced ${successCount} pending visit${successCount > 1 ? 's' : ''} ✓`, 'success');
  else if (manualTrigger) showBanner('Still no connection — will keep trying.', 'queued');
}

// ─── INIT ────────────────────────────────────────────────────────
renderPhotos();
renderNotes();
renderQueue();
renderRecent();
window.addEventListener('online', () => flushQueue());
document.addEventListener('DOMContentLoaded', () => setTimeout(() => flushQueue(), 1000));
</script>
</body>
</html>
