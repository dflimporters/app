<style>
:root {
  --bg:#f0f4f8; --surface:#fff; --surface2:#f8fafc;
  --border:#e2e8f0; --border2:#edf2f7;
  --navy:#0f2044; --navy2:#1a3260;
  --text:#1e293b; --muted:#64748b; --dim:#94a3b8;
  --accent:#2563eb;
  --green:#16a34a; --green-bg:#f0fdf4; --green-bd:#86efac;
  --amber:#b45309; --amber-bg:#fffbeb; --amber-bd:#fde68a;
  --red:#dc2626;   --red-bg:#fef2f2;   --red-bd:#fecaca;
  --grey-bg:#f1f5f9; --grey-bd:#e2e8f0;
  --on-bg:#dcfce7; --on-bd:#16a34a; --on-tx:#15803d;
  --off-bg:#f8fafc; --off-bd:#e2e8f0; --off-tx:#cbd5e1;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;line-height:1.5}

/* HEADER */
.hdr{background:var(--navy);height:56px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hl{display:flex;align-items:center;gap:14px}
.logo{height:26px;filter:brightness(0) invert(1)}
.hdiv{width:1px;height:22px;background:rgba(255,255,255,.2)}
.htitle{font-size:15px;font-weight:600;color:#fff;letter-spacing:-.2px}
.hbadge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:.4px}
.hr{display:flex;align-items:center;gap:12px}
.hts{font-size:11px;color:rgba(255,255,255,.4)}
.rbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);padding:5px 12px;border-radius:6px;font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;font-weight:500}
.rbtn:hover{background:rgba(255,255,255,.2)}

/* PAGE TOGGLE — Rentals ↔ Analysis */
.ptog{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:2px;gap:2px}
.ptog a,.ptog span{display:inline-flex;align-items:center;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;text-decoration:none;font-family:'Inter',sans-serif;white-space:nowrap}
.ptog a{color:rgba(255,255,255,.55)}
.ptog a:hover{color:#fff}
.ptog span{background:var(--accent);color:#fff}

/* KPI */
.kbar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 28px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.kpi{padding:14px 32px 14px 0;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--border2);margin-right:32px}
.kpi:last-child{border-right:none;margin-right:0}
.klbl{font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
.kval{font-size:21px;font-weight:700;color:var(--navy);letter-spacing:-.5px;line-height:1.1}
.kval.g{color:var(--green)}.kval.b{color:var(--accent)}.kval.a{color:var(--amber)}
.ksub{font-size:10px;color:var(--dim)}

/* CONTROLS */
.ctrl{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sw{position:relative;min-width:220px}
.sw svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.si{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px 6px 30px;border-radius:6px;font-size:12px;font-family:'Inter',sans-serif;outline:none}
.si:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.si::placeholder{color:var(--dim)}
.cd{width:1px;height:22px;background:var(--border);flex-shrink:0}
.fg{display:flex;gap:4px;flex-wrap:wrap}
.fb{background:var(--bg);border:1px solid var(--border);color:var(--muted);padding:5px 11px;border-radius:6px;font-size:11px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;white-space:nowrap}
.fb:hover{border-color:var(--navy2);color:var(--navy)}
.fb.fa{background:#eff6ff;border-color:#2563eb;color:#1d4ed8}
.fb.fk{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.fb.fr{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.fb.fp{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.leg{margin-left:auto;display:flex;align-items:center;gap:14px}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);font-weight:500}
.ls{width:14px;height:14px;border-radius:3px}
.cnt{font-size:11px;color:var(--dim);font-weight:500;white-space:nowrap}

/* MAIN */
.main{padding:20px 28px 60px}

/* REGION */
.rs{margin-bottom:24px}
.rh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rp{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.p1{background:#2563eb}.p2{background:#16a34a}.p3{background:#b45309}.p4{background:#7c3aed}.p5{background:#dc2626}
.rn{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.6px}
.rpill{background:var(--grey-bg);border:1px solid var(--grey-bd);color:var(--dim);font-size:10px;font-weight:600;padding:1px 8px;border-radius:10px}
.rv{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted)}

/* TABLE CARD */
.tc{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:960px}
thead th{background:var(--surface2);padding:8px 10px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);border-bottom:1px solid var(--border);white-space:nowrap}
thead th.thm{text-align:center;padding:8px 0;font-size:9px;width:30px;min-width:30px}
thead th.thr{text-align:right}
tbody tr{border-bottom:1px solid var(--border2)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fafbff}
tbody tr.rh{display:none}
td{padding:8px 10px;vertical-align:middle}

/* STORE CELL */
.sn{font-weight:600;color:var(--navy);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.sid{font-size:10px;color:var(--dim);margin-top:1px}
.tar{color:var(--muted);font-size:11px;white-space:nowrap}
.tty{color:var(--muted);font-size:11px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.trt{font-size:12px;font-weight:600;color:var(--text);text-align:right;white-space:nowrap}
.tan{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}

/* BADGES */
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap;border:1px solid}
.bk{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.brm{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.bp{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}
.bar,.bn{background:var(--grey-bg);color:var(--dim);border-color:var(--grey-bd)}
.tbr{font-size:10px;color:var(--dim);font-style:italic;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* MONTH CELL */
td.tm{padding:7px 1px;text-align:center}
.mc{width:26px;height:26px;border-radius:4px;border:1px solid var(--off-bd);background:var(--off-bg);color:var(--off-tx);display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;position:relative;cursor:default}
.mc.on{background:var(--on-bg);border-color:var(--on-bd);color:var(--on-tx);font-size:11px;font-weight:700}
.mc[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:9px;padding:3px 7px;border-radius:4px;white-space:nowrap;z-index:99;pointer-events:none}

/* COLLECTED */
td.tco{text-align:right;white-space:nowrap}
.ca{font-size:12px;font-weight:700;color:var(--green)}
.cs{font-size:10px;color:var(--dim);margin-top:1px}
.cn{color:var(--dim);font-size:11px}

/* LOADING */
.lst{padding:60px;text-align:center;color:var(--dim)}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* DEBUG BAR */
.dbg{background:#fef9c3;border-bottom:1px solid #fde047;padding:6px 28px;font-size:11px;color:#713f12;display:none}
.dbg.show{display:block}

/* SCROLL TOP */
.stb{position:fixed;bottom:22px;right:22px;width:38px;height:38px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 6px -1px rgba(0,0,0,.15);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;z-index:100}
.stb.show{opacity:1;transform:translateY(0)}
.stb:hover{background:var(--navy2)}
</style>
</head>

// ─── HELPERS ───────────────────────────────────────────────
function jmd(n){ return n==null?'—':'J$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }

function dbg(msg){
  const el=document.getElementById('dbg');
  el.textContent=msg; el.classList.add('show');
}

// Which 2026 month indices does this invoice cover?
function inv2026Months(inv){
  const out = new Set();
  const si = MF.indexOf(inv.period_start_month);
  const ei = MF.indexOf(inv.period_end_month);
  if(si < 0 || ei < 0) return out;             // unrecognised month name
  const sy = Number(inv.period_start_year);
  const ey = Number(inv.period_end_year);

  // Iterate year by year through the invoice span
  for(let y = sy; y <= ey; y++){
    if(y !== 2026) continue;
    const from = (y === sy) ? si : 0;
    const to   = (y === ey) ? ei : 11;
    for(let m = from; m <= to; m++) out.add(m);
  }
  return out;
}

// Build Map: custId -> { months:Set, count, total, nums[] }
function buildLookup(list){
  const map = new Map();
  list.forEach(inv => {
    const cid = inv.customer_id;
    if(!map.has(cid)) map.set(cid, {months:new Set(), count:0, total:0, nums:[]});
    const entry = map.get(cid);
    inv2026Months(inv).forEach(m => entry.months.add(m));
    entry.count++;
    entry.total += parseFloat(inv.amount) || 0;
    if(inv.invoice_number) entry.nums.push(inv.invoice_number);
  });
  return map;
}

// ─── FETCH ─────────────────────────────────────────────────
async function loadData(){
  document.getElementById('ts').textContent = 'Loading…';

  // Always render seed data immediately so green cells show
  INV = [...SEED_INV];
  render();

  try{
    const res = await fetch(
      SB_URL + '/rest/v1/gondola_invoices?select=*&order=invoice_date.desc',
      { headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY } }
    );
    if(!res.ok) throw new Error('HTTP '+res.status);
    INV = await res.json();
    const matched = INV.filter(i => G.some(g => g.c === i.customer_id));
    dbg('✓ Live data: '+INV.length+' invoices loaded ('+matched.length+' matched to gondola rows)');
    render();
    document.getElementById('ts').textContent = 'Updated '+new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  } catch(e){
    dbg('⚠ Live fetch blocked (file:// restriction) — showing last known data. Host on Netlify for live updates.');
    document.getElementById('ts').textContent = 'Cached data';
  }
}

// ─── RENDER ────────────────────────────────────────────────
function render(){
  const lkp = buildLookup(INV);

  // KPIs
  const keep = G.filter(g=>g.st==='Keep');
  document.getElementById('kT').textContent = G.length;
  document.getElementById('kK').textContent = keep.length;
  document.getElementById('kA').textContent = jmd(keep.reduce((s,g)=>s+g.m*12,0));
  document.getElementById('kI').textContent = INV.length;
  document.getElementById('kC').textContent = jmd(INV.reduce((s,i)=>s+(parseFloat(i.amount)||0),0));

  const main = document.getElementById('main');
  main.innerHTML = '';

  REGIONS.forEach(reg => {
    const rows = G.filter(g => g.r === reg.k);
    const keepAnnual = rows.filter(g=>g.st==='Keep').reduce((s,g)=>s+g.m*12,0);

    const sec = document.createElement('div');
    sec.className = 'rs';
    sec.dataset.region = reg.k;

    // Build the section skeleton WITHOUT tbody rows
    sec.innerHTML =
      '<div class="rh">' +
        '<div class="rp '+reg.p+'"></div>' +
        '<div class="rn">'+reg.k+'</div>' +
        '<div class="rpill">'+rows.length+'</div>' +
        '<div class="rv">'+jmd(keepAnnual)+' / yr (active)</div>' +
      '</div>' +
      '<div class="tc"><table>' +
        '<thead><tr>' +
          '<th style="min-width:190px">Store</th>' +
          '<th>Area</th>' +
          '<th>Type</th>' +
          '<th class="thr">Monthly</th>' +
          '<th class="thr">Annual</th>' +
          '<th>Status</th>' +
          '<th>Brand</th>' +
          MS.map(function(m){ return '<th class="thm">'+m+'</th>'; }).join('') +
          '<th class="thr">Collected</th>' +
        '</tr></thead>' +
        '<tbody></tbody>' +
      '</table></div>';

    main.appendChild(sec);

    // Find the tbody we just created (only 1 tbody per section)
    const tbody = sec.querySelector('tbody');

    rows.forEach(function(g){
      const entry = lkp.get(g.c);          // Map.get — no key mismatch possible
      const mset  = entry ? entry.months : new Set();
      const tip   = entry && entry.nums.length ? 'Inv: '+entry.nums.join(', ') : '';

      const badgeClass = {
        'Keep':           'bk',
        'Remove':         'brm',
        'Pending':        'bp',
        'Already Removed':'bar',
        '':               'bn',
      }[g.st] || 'bn';

      // Build month cells
      let mhtml = '';
      for(let i=0;i<12;i++){
        const on = mset.has(i);
        mhtml += '<td class="tm"><div class="mc'+(on?' on':'')+'"'+(on&&tip?' data-tip="'+tip+'"':'')+'>'+( on?'✓':MS[i] )+'</div></td>';
      }

      const chtml = entry
        ? '<div class="ca">'+jmd(entry.total)+'</div><div class="cs">'+entry.count+' inv.</div>'
        : '<span class="cn">—</span>';

      const tr = document.createElement('tr');
      tr.dataset.store  = g.s.toLowerCase();
      tr.dataset.area   = g.a.toLowerCase();
      tr.dataset.status = g.st;
      tr.dataset.region = g.r;

      tr.innerHTML =
        '<td><span class="sn" title="'+g.s+'">'+g.s+'</span><span class="sid">'+g.c+'</span></td>'+
        '<td class="tar">'+g.a+'</td>'+
        '<td class="tty" title="'+(g.t||'')+'">'+( g.t||'—' )+'</td>'+
        '<td class="trt">'+jmd(g.m)+'</td>'+
        '<td class="tan">'+jmd(g.m*12)+'</td>'+
        '<td><span class="bdg '+badgeClass+'">'+( g.st||'—' )+'</span></td>'+
        '<td class="tbr" title="'+(g.b||'')+'">'+( g.b||'—' )+'</td>'+
        mhtml+
        '<td class="tco">'+chtml+'</td>';

      tbody.appendChild(tr);
    });
  });

  applyF();
}

// ─── FILTERS ───────────────────────────────────────────────
function setR(r, btn){
  AR = r;
  document.querySelectorAll('#rfg .fb').forEach(function(b){ b.className='fb'; });
  btn.classList.add('fa');
  applyF();
}

function setS(s, btn){
  AS = s;
  document.querySelectorAll('#sfg .fb').forEach(function(b){ b.className='fb'; });
  var cls = {all:'fa',Keep:'fk',Remove:'fr',Pending:'fp'}[s]||'fa';
  btn.classList.add(cls);
  applyF();
}

function applyF(){
  var q = document.getElementById('si').value.toLowerCase().trim();
  var vis = 0;
  document.querySelectorAll('.rs').forEach(function(sec){
    sec.style.display = (AR==='all'||sec.dataset.region===AR) ? '' : 'none';
  });
  document.querySelectorAll('tbody tr').forEach(function(tr){
    var ok = (AS==='all'||tr.dataset.status===AS) && (!q||tr.dataset.store.includes(q)||tr.dataset.area.includes(q));
    tr.classList.toggle('rh',!ok);
    if(ok) vis++;
  });
  document.getElementById('cnt').textContent = vis+' of '+G.length+' gondolas';
}

window.addEventListener('scroll',function(){
  document.getElementById('stb').classList.toggle('show',window.scrollY>280);
});

// ─── INIT ──────────────────────────────────────────────────
