<!DOCTYPE html>
<html lang="en">
<head>
<meta name="theme-color" content="#0f2044">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Debrief — DFL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/supabase-client.js"></script>
<script src="/shared/routes.js"></script>
<script src="/shared/auth-guard.js"></script>
<style>
  :root { --bg:#f0f4f8; --surface:#fff; --border:#e2e8f0; --navy:#0f2044; --navy2:#1a3260; --text:#1e293b; --text-muted:#64748b; --text-dim:#94a3b8; --accent:#2563eb; --accent-bg:#eff6ff; --shadow:0 1px 3px rgba(0,0,0,0.07); --green:#16a34a; --green-bg:#f0fdf4; --red:#dc2626; --red-bg:#fef2f2; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
  nav { background:var(--navy); min-height:52px; display:flex; align-items:center; gap:12px; padding:10px 20px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .homebtn { background:none; border:none; color:#fff; cursor:pointer; padding:4px; display:flex; }
  .nav-title { font-size:14px; font-weight:600; color:#fff; }
  .content { max-width:600px; margin:0 auto; padding:16px 16px 60px; }
  .intro { font-size:13px; color:var(--text-muted); line-height:1.6; margin-bottom:16px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  textarea { width:100%; min-height:160px; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:15px; font-family:inherit; background:var(--surface); color:var(--text); outline:none; resize:vertical; }
  textarea:focus { border-color:var(--accent); }
  .voice-row { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .voice-btn { width:44px; height:44px; border-radius:50%; border:none; background:var(--accent-bg); color:var(--accent); font-size:18px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .voice-btn.recording { background:var(--red-bg); color:var(--red); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  .voice-status { font-size:12px; color:var(--text-dim); }
  .submit-btn { width:100%; padding:16px; background:var(--navy); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; }
  .submit-btn:active { background:var(--navy2); }
  .submit-btn:disabled { opacity:0.5; }
  .banner { display:none; padding:12px 16px; border-radius:10px; font-size:13px; font-weight:500; margin-bottom:14px; align-items:center; gap:8px; }
  .banner.show { display:flex; }
  .banner.success { background:var(--green-bg); color:var(--green); }
  .banner.error { background:var(--red-bg); color:var(--red); }
  .today-log h3 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:10px; }
  .log-item { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; line-height:1.5; }
  .log-item .l-time { font-size:11px; color:var(--text-dim); margin-bottom:4px; }
  .log-item .l-text { color:var(--text); white-space:pre-wrap; }
  footer { text-align:center; padding:20px; font-size:11px; color:var(--text-dim); }
  .spin { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; margin:60px auto; animation:sp 0.8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<nav>
  <button class="homebtn" onclick="window.location.href='/index.html'" aria-label="Back">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="nav-title">📝 Store Debrief</span>
</nav>

<div class="content" id="content"><div class="spin"></div></div>

<footer>© 2026 DFL Importers · Internal use only</footer>

<script>
const SB_URL = "https://hzagwndglwhcepsirafi.supabase.co";
const SB_KEY = "sb_publishable_5rAinfDT1K9kwEQnqYwlOA_-C5tk_6h";
const H = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY };
const ANALYZE_FN_URL = `${SB_URL}/functions/v1/analyze-debrief`;

let REP_ID = null;
let usedVoice = false;
let recognition = null;
let isRecording = false;
let todaysLog = [];

document.addEventListener('dfl-auth-ready', (e) => { init(e.detail.profile); });

async function init(profile) {
  if (!profile.rep_id) {
    document.getElementById('content').innerHTML = `<div class="empty" style="text-align:center;padding:60px 20px;color:var(--text-muted)">No rep record linked to your account — ask an admin.</div>`;
    return;
  }
  REP_ID = profile.rep_id;

  try {
    const today = new Date().toISOString().slice(0, 10);
    const res = await fetch(
      `${SB_URL}/rest/v1/rep_debriefs?rep_id=eq.${encodeURIComponent(REP_ID)}&debrief_date=eq.${today}&select=submitted_at,raw_text&order=submitted_at.desc`,
      { headers: H }
    );
    const rows = await res.json();
    todaysLog = Array.isArray(rows) ? rows : [];
  } catch (err) {
    console.warn('Could not load earlier debriefs today, showing an empty log:', err);
  }
  renderForm();
}

function renderForm() {
  document.getElementById('content').innerHTML = `
    <div class="intro">How did that store visit go? A few sentences about the customer — what came up, anything they need, anything they said no to. Type it or tap the mic and talk. Log one of these per store — as many times a day as you visit.</div>
    <div class="banner" id="banner"></div>
    <form id="debriefForm" onsubmit="return handleSubmit(event)">
      <div class="card">
        <textarea id="debriefText" placeholder="e.g. Stopped by Tastee Mannings Hill, spoke with the manager Junior — they're low on the foil trays, said they'd reorder next week..."></textarea>
        <div class="voice-row">
          <button type="button" class="voice-btn" id="voiceBtn" onclick="toggleVoice()">🎙️</button>
          <span class="voice-status" id="voiceStatus">Tap the mic to dictate instead of typing</span>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Submit Debrief</button>
    </form>
    <div class="today-log" id="todayLog"></div>`;
  renderTodayLog();
}

function renderTodayLog() {
  const wrap = document.getElementById('todayLog');
  if (!wrap) return;
  if (todaysLog.length === 0) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <h3>Today's debriefs (${todaysLog.length})</h3>
    ${todaysLog.map(d => `
      <div class="log-item">
        <div class="l-time">${new Date(d.submitted_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
        <div class="l-text">${escapeHtml(d.raw_text)}</div>
      </div>`).join('')}`;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setVoiceStatus('Voice notes not supported on this browser — please type instead.'); return; }
  if (isRecording) { stopVoice(); return; }

  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-JM';
  isRecording = true;
  usedVoice = true;
  document.getElementById('voiceBtn').classList.add('recording');
  document.getElementById('voiceBtn').textContent = '⏹';
  setVoiceStatus('Listening…');

  const textarea = document.getElementById('debriefText');
  const baseText = textarea.value ? textarea.value + ' ' : '';

  recognition.onresult = (e) => {
    let finalText = '';
    for (let i = 0; i < e.results.length; i++) finalText += e.results[i][0].transcript;
    textarea.value = baseText + finalText;
  };
  recognition.onerror = (e) => { console.warn('speech recognition error', e.error); };
  recognition.onend = () => {
    if (isRecording) { try { recognition.start(); } catch (e) {} }
  };
  recognition.start();
}

function stopVoice() {
  isRecording = false;
  if (recognition) recognition.stop();
  document.getElementById('voiceBtn').classList.remove('recording');
  document.getElementById('voiceBtn').textContent = '🎙️';
  setVoiceStatus('Tap the mic to dictate instead of typing');
}

function setVoiceStatus(msg) {
  const el = document.getElementById('voiceStatus');
  if (el) el.textContent = msg;
}

async function handleSubmit(e) {
  e.preventDefault();
  if (isRecording) stopVoice();

  const text = document.getElementById('debriefText').value.trim();
  if (!text) { showBanner('Add a few words about your day first.', 'error'); return false; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  try {
    const insRes = await fetch(`${SB_URL}/rest/v1/rep_debriefs`, {
      method: 'POST',
      headers: { ...H, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify({
        rep_id: REP_ID,
        input_type: usedVoice ? 'speech' : 'typed',
        raw_text: text
      })
    });
    if (!insRes.ok) throw new Error('insert failed: ' + (await insRes.text()));
    const [row] = await insRes.json();

    // Fire-and-forget: analysis happens server-side, the rep doesn't wait on it.
    fetch(ANALYZE_FN_URL, {
      method: 'POST',
      headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ debrief_id: row.id })
    }).catch(err => console.warn('analyze-debrief call failed (will remain pending):', err));

    todaysLog.unshift({ submitted_at: row.submitted_at, raw_text: row.raw_text });
    document.getElementById('debriefText').value = '';
    usedVoice = false;
    renderTodayLog();
    showBanner('Debrief logged ✓ — add another whenever you finish your next stop.', 'success');
    btn.disabled = false;
    btn.textContent = 'Submit Debrief';
  } catch (err) {
    console.error(err);
    showBanner("Couldn't submit — check your connection and try again.", 'error');
    btn.disabled = false;
    btn.textContent = 'Submit Debrief';
  }
  return false;
}

function showBanner(msg, kind) {
  const b = document.getElementById('banner');
  if (!b) return;
  b.textContent = msg;
  b.className = `banner show ${kind}`;
  if (kind === 'success') setTimeout(() => { b.classList.remove('show'); }, 4000);
}
</script>
</body>
</html>
